l_english:
 situation_ps_general_strike:0 "The Great Strike"
 situation_ps_general_strike_type:0 "The Great Strike"
 situation_ps_general_strike_desc:0 "Unions bribed by a foreign syndicate bring out one industry after another. Factories stand idle, ports are empty, and the strike committees demand more and more."
 situation_ps_general_strike_monthly_change_tooltip:0 "The crisis grows by itself, faster with unstable planets and active agents. Approaches slow it down."
 situation_ps_general_strike_complete_tooltip:0 "The victim's economy is paralysed for 3 years (§R-25%§! output, §R-10§! stability), and §RUnrest§! breaks out on all its planets except the capital."
 ps_general_strike_stage_1:0 "Ferment"
 ps_general_strike_stage_2:0 "Unrest"
 ps_general_strike_stage_3:0 "Crisis"
 ps_general_strike_stage_4:0 "On the Brink"
 ps_general_strike_concessions:0 "Concessions to the Unions"
 ps_general_strike_concessions_desc:0 "Raise wages and buy goods. Crisis progress §G-3§! per month."
 ps_general_strike_crackdown:0 "Break the Pickets"
 ps_general_strike_crackdown_desc:0 "Police and strikebreakers. Crisis progress §G-2§! per month."
 operation_ps_crisis_general_strike:0 "Crisis: The Great Strike"
 operation_ps_crisis_general_strike_desc:0 "Trigger the «The Great Strike» crisis in the target. Unions bribed by a foreign syndicate bring out one industry after another. Factories stand idle, ports are empty, and the strike committees demand more and more.\n\n§YIf the target fails to cope:§! The victim's economy is paralysed for 3 years (§R-25%§! output, §R-10§! stability), and §RUnrest§! breaks out on all its planets except the capital."
 ps_crisis.11.desc:0 "Everything is ready. The Syndicate network in §Y[target.GetName]§! has received the signal, and the «The Great Strike» crisis has begun."
 ps_crisis.151.desc:0 "Unions bribed by a foreign syndicate bring out one industry after another. Factories stand idle, ports are empty, and the strike committees demand more and more.\n\nWe failed to cope. The victim's economy is paralysed for 3 years (§R-25%§! output, §R-10§! stability), and §RUnrest§! breaks out on all its planets except the capital."
 ps_crisis_strike_aftermath:0 "Aftermath of the Great Strike"
 ps_crisis_strike_aftermath_desc:0 "The economy has not yet recovered from the strike."
 situation_ps_insurgency:0 "Insurgency in the Rear"
 situation_ps_insurgency_type:0 "Insurgency in the Rear"
 situation_ps_insurgency_desc:0 "Armed bands operate in the empire's forests, mines and slums. Patrols vanish, depots burn, and the population helps the partisans."
 situation_ps_insurgency_monthly_change_tooltip:0 "The crisis grows by itself, faster with unstable planets and active agents. Approaches slow it down."
 situation_ps_insurgency_complete_tooltip:0 "An §Rarmed uprising§! breaks out on the victim's three least stable planets (except the capital): partisan detachments appear and ground combat begins."
