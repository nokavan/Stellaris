 ps_crisis_ignore:0 "Wait It Out"
 ps_crisis_ignore_desc:0 "Do nothing and hope it passes."
 ps_crisis_ignore_tt:0 "No costs or bonuses: the crisis runs its course."
 ps_crisis_progress_unrest:0 "Unstable planets"
 ps_crisis_progress_agents:0 "Foreign agents"
 ps_crisis_fail_tooltip:0 "Crisis overcome: §G+5§! stability and §G+5%§! unity for 5 years."
 ps_crisis_overcome:0 "Crisis Overcome"
 ps_crisis_overcome_desc:0 "We endured, and it brought us together."
 operation_ps_crisis_already:0 "A Syndicate crisis is already under way in the target empire."
 operation_ps_crisis_cooldown:0 "The target recently went through a Syndicate crisis (once per 10 years)."
 ps_crisis.1.name:0 "Preparing the Crisis"
 ps_crisis.1.desc:0 "Syndicate agents lay the groundwork for a crisis in §Y[target.GetName]§!."
 ps_crisis.1.a:0 "Proceed."
 ps_crisis.launch.a:0 "Begin."
 ps_crisis.launch.tooltip:0 "A §Rcrisis§! begins in the target. For the first 3 years our agents accelerate it (§R+1§! per month). If the target fails to cope, we gain §G500§! unity and §G50§! influence. The next crisis for this target is possible in 10 years at the earliest."
 ps_crisis.victim.a:0 "Cursed partisans!"
 ps_crisis.200.name:0 "The Crisis Erupts"
 ps_crisis.200.desc:0 "The crisis our agents started in a foreign empire has peaked. The target failed to cope."
 ps_crisis.200.a:0 "The network does its work."
