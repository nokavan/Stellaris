 ps_vm.1.name:0 "Subject Management"
 ps_vm.1.desc:0 "Selected cell: §Y[ps_cell.GetName]§!.\n\nSystem transfers, subject overview, the selected subject's card, its budget and treaty recommendations."
 ps_vm.1.systems:0 "System transfers"
 ps_vm.1.overview:0 "Subject overview"
 ps_vm.1.card:0 "Subject card"
 ps_vm.1.budget:0 "Budget and recommendations"
 ps_vm.1.next:0 "Next subject"
 ps_vm.1.panel:0 "Syndicate cell panel"
 ps_vm.back:0 "Back"
 ps_vm.close:0 "Close"
 ps_vm.10.name:0 "System Transfers"
 ps_vm.10.desc:0 "Selected system: §Y[ps_sys.GetName]§!, owner §Y[ps_sys_owner.GetName]§!, owner's colonies: [Root.ps_sys_colonies].\nReceiver on transfer: cell §Y[ps_cell.GetName]§!.\nCost: §Y[Root.ps_sys_cost]§! influence (25 + 50 per colony).\n\nTransfer systems to subjects, take their territory or redistribute systems between them. No shared border required.\n\n§HRules:§! taking from a subject — §R−10§! loyalty; giving your own system — no penalty. The same system can be transferred again after 5 years. Requires peace and control of the outpost and colonies. Capital and the owner's last system are protected. Colonization in progress, ground combat and foreign regular planets block the transfer. Foreign objects (e.g. nomad stations) keep their owner."
 ps_vm.10.desc_none:0 "No system selected. Pick one with the buttons below.\n\nReceiver on transfer: cell §Y[ps_cell.GetName]§!."
 ps_vm.10.next_own:0 "Next system of ours"
 ps_vm.10.next_cell:0 "Next system of the selected cell"
 ps_vm.10.next_vassal:0 "Next system of any subject"
 ps_vm.10.switch_cell:0 "Change receiver (next cell)"
 ps_vm.10.give:0 "Give the system to §Y[ps_cell.GetName]§!"
 ps_vm.10.give.tooltip:0 "The owner's colonies and outpost pass to the cell. If another subject owns the system, it is a seizure: §R−10§! loyalty for it."
 ps_vm.10.take:0 "Take the system"
 ps_vm.10.take.tooltip:0 "The subject's colonies and outpost pass to us. Subject loyalty §R−10§!."
 ps_vm.11.name:0 "New Lands"
 ps_vm.11.desc:0 "Our overlord has granted us the §Y[ps_sys.GetName]§! system."
 ps_vm.11.a:0 "Accept"
 ps_vm_no_influence:0 "Not enough influence (25 + 50 per colony)."
 ps_vm_fail_peace:0 "Requires peace: neither we, the owner nor the receiver may be at war."
 ps_vm_fail_same:0 "The system already belongs to the receiver."
 ps_vm_fail_outpost:0 "The owner must control the system's outpost."
 ps_vm_fail_colonies:0 "The owner must control all its colonies in the system."
 ps_vm_fail_capital:0 "A capital system cannot be transferred."
 ps_vm_fail_last:0 "This is the owner's last system."
 ps_vm_fail_combat:0 "Ground combat is under way in the system."
 ps_vm_fail_colonizing:0 "A colony is being founded in the system."
 ps_vm_fail_foreign:0 "The system contains regular planets of third parties."
 ps_vm_fail_cooldown:0 "This system was already transferred in the last 5 years."
 ps_vm.20.name:0 "Subject Overview"
 ps_vm.20.desc:0 "Leaders and laggards among subjects, value in brackets; our own value at the end of each line.\n\n§HFleet power:§! leader §G[ps_vm_lead_fp.GetName]§! ([ps_vm_lead_fp.ps_fp]), lagging §R[ps_vm_lag_fp.GetName]§! ([ps_vm_lag_fp.ps_fp]); [Root.GetName]: [Root.ps_fp]\n§HScience (techs researched):§! leader §G[ps_vm_lead_tech.GetName]§! ([ps_vm_lead_tech.ps_tech]), lagging §R[ps_vm_lag_tech.GetName]§! ([ps_vm_lag_tech.ps_tech]); [Root.GetName]: [Root.ps_tech]\n§HFleet (naval capacity used):§! leader §G[ps_vm_lead_nav.GetName]§! ([ps_vm_lead_nav.ps_nav]), lagging §R[ps_vm_lag_nav.GetName]§! ([ps_vm_lag_nav.ps_nav]); [Root.GetName]: [Root.ps_nav]\n§HEconomy (basic balance):§! leader §G[ps_vm_lead_inc_basic.GetName]§! ([ps_vm_lead_inc_basic.ps_inc_basic]), lagging §R[ps_vm_lag_inc_basic.GetName]§! ([ps_vm_lag_inc_basic.ps_inc_basic]); [Root.GetName]: [Root.ps_inc_basic]\n"
 ps_vm.30.name:0 "Subject Card"
 ps_vm.30.desc:0 "§H[ps_cell.GetName]§!\nSpecialization: §Y[ps_cell.PsVmSpec]§!\nAuthority: §Y[ps_cell.PsVmAuth]§!\nEthics: [ps_cell.PsVmEthMil], [ps_cell.PsVmEthXen], [ps_cell.PsVmEthEga], [ps_cell.PsVmEthMat]\nLoyalty: see the subject's diplomacy window.\n\n§HComparison (subject / overlord)§!\nFleet power: [ps_cell.ps_fp] / [Root.ps_fp]\nFleet: [ps_cell.ps_nav] of [ps_cell.ps_navmax] / [Root.ps_nav] of [Root.ps_navmax]\nTechs: [ps_cell.ps_tech] / [Root.ps_tech]\nSystems: [ps_cell.ps_sysn] / [Root.ps_sysn]\nColonies: [ps_cell.ps_pops] / [Root.ps_pops]\nDiplomatic weight: [ps_cell.ps_dw] / [Root.ps_dw]\nBasic resource balance: [ps_cell.ps_inc_basic] / [Root.ps_inc_basic]\n\n§HSupport:§! economic — +10% energy, minerals and food and +5% alloys for 10 years; administrative — +5 stability, −10% empire size, +10% unity for 10 years and §G+10§! loyalty. Each once per 5 years."
 ps_vm.30.econ:0 "Economic support: §Y1000§! energy and §Y250§! alloys"
 ps_vm.30.admin:0 "Administrative support: §Y100§! influence and §Y500§! unity"
 ps_vm_support_cd:0 "This cell already received this support in the last 5 years."
 ps_vm_econ_support:0 "Overlord Economic Support"
 ps_vm_econ_support_desc:0 "The overlord invests in our economy."
 ps_vm_admin_support:0 "Overlord Administrative Support"
 ps_vm_admin_support_desc:0 "The overlord's advisers help us govern our worlds."
 ps_vm.31.name:0 "Budget and Recommendations: [ps_cell.GetName]"
 ps_vm.31.desc:0 "§HMonthly income (≈ lower bound)§!\n£energy£ [ps_cell.ps_inc_energy]  £minerals£ [ps_cell.ps_inc_minerals]  £food£ [ps_cell.ps_inc_food]  £alloys£ [ps_cell.ps_inc_alloys]  £consumer_goods£ [ps_cell.ps_inc_consumer_goods]  £unity£ [ps_cell.ps_inc_unity]  £influence£ [ps_cell.ps_inc_influence]\n§HResearch:§! £physics£ [ps_cell.ps_inc_physics_research]  £society£ [ps_cell.ps_inc_society_research]  £engineering£ [ps_cell.ps_inc_engineering_research]\n§HStrategic:§! £rare_crystals£ [ps_cell.ps_inc_rare_crystals]  £exotic_gases£ [ps_cell.ps_inc_exotic_gases]  £volatile_motes£ [ps_cell.ps_inc_volatile_motes]\n§HTotal expenses:§! [ps_cell.ps_exp]\n\n§HStockpiles (≈ at least)§!\n£energy£ [ps_cell.ps_stock_energy]  £minerals£ [ps_cell.ps_stock_minerals]  £food£ [ps_cell.ps_stock_food]  £alloys£ [ps_cell.ps_stock_alloys]  £consumer_goods£ [ps_cell.ps_stock_consumer_goods]  £influence£ [ps_cell.ps_stock_influence]  £unity£ [ps_cell.ps_stock_unity]\n£rare_crystals£ [ps_cell.ps_stock_rare_crystals]  £exotic_gases£ [ps_cell.ps_stock_exotic_gases]  £volatile_motes£ [ps_cell.ps_stock_volatile_motes]\n\n§HTreaty recommendations§! (group balance → payments):\nBasic (energy, minerals, food): [ps_cell.ps_inc_basic]/mo → [ps_cell.PsVmRec_basic] §Y[ps_cell.ps_rec_basic]%§!\nAdvanced (alloys, goods): [ps_cell.ps_inc_adv]/mo → [ps_cell.PsVmRec_adv] §Y[ps_cell.ps_rec_adv]%§!\nResearch: [ps_cell.ps_inc_res]/mo → [ps_cell.PsVmRec_res] §Y[ps_cell.ps_rec_res]%§!\nStrategic: [ps_cell.ps_inc_str]/mo → [ps_cell.PsVmRec_str] §Y[ps_cell.ps_rec_str]%§!\n\n§HSuggested specialization:§! [ps_cell.PsVmRecSpec]\n§gEstimate only: the game does not expose exact income to script, so values are rounded down on a scale.§!"
