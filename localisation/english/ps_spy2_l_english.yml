l_english:
 ps_spy2.1.name:0 "Agents in Place"
 ps_spy2.1.desc:0 "Our people in §Y[target.GetName]§! have access, papers and a cover story. All that remains is the job."
 ps_spy2.1.a:0 "Proceed."
 operation_ps_target_no_subjects:0 "The target has no subjects."
 ps_spy_bribed_governor:0 "Bribed Governor"
 operation_ps_bribe_governors:0 "Bribe Governors"
 operation_ps_bribe_governors_desc:0 "A governor of one of the target's colonies starts working for us."
 ps_spy2.10.name:0 "Bribe Governors: Success"
 ps_spy2.10.desc:0 "The governor took the money. The colony loses order (§R−10§! stability, §R+20§! crime for 5 years) and we gain §G75§! influence."
 ps_spy2.10.a:0 "Excellent work."
 operation_ps_steal_blueprints:0 "Steal Blueprints"
 operation_ps_steal_blueprints_desc:0 "Agents infiltrate the target's design bureaus and copy the blueprints."
 ps_spy2.11.name:0 "Steal Blueprints: Success"
 ps_spy2.11.desc:0 "The blueprints are ours: we gain §Y6§! months of engineering and §Y3§! months of physics research."
 ps_spy2.11.a:0 "Excellent work."
 ps_spy_counterfeit:0 "Counterfeit Credits"
 operation_ps_counterfeit_credits:0 "Counterfeit Credits"
 operation_ps_counterfeit_credits_desc:0 "The Syndicate floods the target's market with fake currency."
 ps_spy2.12.name:0 "Counterfeit Credits: Success"
 ps_spy2.12.desc:0 "The target's market is flooded with fakes: its energy §R−10%§! for 5 years, we gain §G500§! energy."
 ps_spy2.12.a:0 "Excellent work."
 operation_ps_turn_vassals:0 "Turn Their Subjects"
 operation_ps_turn_vassals_desc:0 "Agents convince the target's subjects that their true friend is the Syndicate."
 ps_spy2.13.name:0 "Turn Their Subjects: Success"
 ps_spy2.13.desc:0 "The target's subjects waver: loyalty to their overlord §R−40§!, and their councils are ready to switch to us («Puppet Council» for 10 years)."
 ps_spy2.13.a:0 "Excellent work."
 ps_spy_blackmailed:0 "Blackmailed Ruler"
 ps_spy_blackmail_income:0 "Hush Money"
 operation_ps_blackmail_ruler:0 "Blackmail the Ruler"
 operation_ps_blackmail_ruler_desc:0 "The Syndicate finds leverage on the target's ruler."
 ps_spy2.14.name:0 "Blackmail the Ruler: Success"
 ps_spy2.14.desc:0 "The ruler pays for silence: §R−1§! influence per month for the target and §G+1§! for us for 5 years."
 ps_spy2.14.a:0 "Excellent work."
 ps_spy_market_crash:0 "Market Crash"
 operation_ps_market_crash:0 "Market Crash"
 operation_ps_market_crash_desc:0 "Rumours, panic and short selling bring the target's exchange down."
 ps_spy2.15.name:0 "Market Crash: Success"
 ps_spy2.15.desc:0 "The exchange collapsed: the target suffers §R−15%§! goods and §R−5§! stability for 3 years; we bought the assets — §G300§! energy and minerals."
 ps_spy2.15.a:0 "Excellent work."
 ps_spy_brain_drain:0 "Brain Drain"
 ps_spy_defectors:0 "Defector Scientists"
 operation_ps_brain_drain:0 "Recruit Defectors"
 operation_ps_brain_drain_desc:0 "The target's best scientists are lured to Syndicate labs."
 ps_spy2.16.name:0 "Recruit Defectors: Success"
 ps_spy2.16.desc:0 "The scientists defected to us: the target suffers §R−10%§! research, we gain §G+5%§! for 5 years."
 ps_spy2.16.a:0 "Excellent work."
 ps_spy_alloy_theft:0 "Warehouse Theft"
 operation_ps_smuggle_alloys:0 "Smuggle Alloys"
 operation_ps_smuggle_alloys_desc:0 "Trainloads of alloys «go missing» from the target's warehouses."
 ps_spy2.17.name:0 "Smuggle Alloys: Success"
 ps_spy2.17.desc:0 "The trains went astray: the target suffers §R−10%§! alloys for 3 years, we gain §G+250§! alloys."
 ps_spy2.17.a:0 "Excellent work."
