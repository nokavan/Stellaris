 ps_arkv.1.name:0 "Ark Cells"
 ps_arkv.1.desc:0 "A nomadic Syndicate cell lives aboard an ark. Hand over one of our arks (nomads only, not the capital) or build a new ark at the capital. Each cell gets a specialisation that can be raised to level 3. The overlord gains the bonus of the best subject of each specialisation."
 ps_arkv.1.split:0 "Detach one of our arks"
 ps_arkv.1.split.tt:0 "One of our non-capital arks and its people become a nomadic subject. Cost: §Y100§! influence. 2-year cooldown."
 ps_arkv.1.build:0 "Build a new ark cell"
 ps_arkv.1.build.tt:0 "An ark is built at the capital for a new nomadic subject. Cost: §Y1500§! alloys, §Y500§! food, §Y200§! influence. 2-year cooldown. Refunded if the game fails to create the ark."
 ps_arkv.1.up2:0 "Upgrade an ark subject to level 2"
 ps_arkv.1.up2.tt:0 "Cost: §Y1000§! alloys, §Y150§! influence. +25 loyalty."
 ps_arkv.1.up3:0 "Upgrade an ark subject to level 3"
 ps_arkv.1.up3.tt:0 "Cost: §Y2500§! alloys, §Y300§! influence, §Y1000§! unity. +25 loyalty."
 ps_arkv.1.cells:0 "To planet cells"
 ps_arkv.1.cancel:0 "Close"
 ps_arkv.2.name:0 "Ark Specialisation"
 ps_arkv.2.desc:0 "What will the new Syndicate ark do?"
 ps_arkv.2.back:0 "Back"
 ps_arkv.6.name:0 "Ark Not Built"
 ps_arkv.6.desc:0 "The ark for the new cell never left the dock. Costs refunded."
 decision_ps_ark_vassals:0 "Ark Cells"
 decision_ps_ark_vassals_desc:0 "Create a nomadic ark subject with a unique specialisation, or upgrade an existing one."
