 ps_mega.1.client:0 "Client Regime (regular cell)"
 ps_mega.1.off:0 "Disable settlement"
 ps_mega.1.close:0 "Leave as is"
 ps_mega.7.name:0 "A Cell in the Megastructure"
 ps_mega.7.desc:0 "As soon as the welding beams went quiet, Syndicate transports landed settlers on §Y[ps_mega_world.GetName]§!. Thus was born §Y[ps_new_cell.GetName]§!, our new subject."
 ps_mega.7.a:0 "Steel and loyalty."
 decision_ps_shadow_logistics_on:0 "Shadow Logistics"
 decision_ps_shadow_logistics_on_desc:0 "Construction ships, engineering vessels and logistics ships cloak themselves whenever they can."
 decision_ps_shadow_logistics_on_tooltip:0 "§G+1§! ship cloaking strength, §R-5%§! ship speed.\nEvery month our construction and logistics ships with cloaking strength above 0 §Yactivate their cloak§!."
 decision_ps_shadow_logistics_off:0 "Disable Shadow Logistics"
 decision_ps_shadow_logistics_off_desc:0 "Return construction and logistics ships to open operation."
 decision_ps_shadow_logistics_off_tooltip:0 "Removes the modifier and decloaks construction and logistics ships."
 ps_shadow_logistics:0 "Shadow Logistics"
 ps_shadow_logistics_desc:0 "Syndicate builders and suppliers travel cloaked."
 ps_shadow_gate:0 "Shadow Gate"
 ps_shadow_gate_DESC:0 "A gateway rewired by smugglers: a hidden passage into the underside of space. Ships of the Syndicate and its subjects jump instantly between any Shadow Gates."
 ps_shadow_gate_MEGASTRUCTURE_DETAILS:0 "Permanent passage to every other Shadow Gate. Usable by partisan empires, their subjects and allies; enemies are shut out. Built outside the gravity well."
 NAME_ps_shadow_gate:0 "Shadow Gate"
 ps_shadow_gate_already_here:0 "$TRIGGER_FAIL$This system already has a Shadow Gate."
 PS_SHADOW_GATE:0 "Shadow Gate"
 PS_SHADOW_GATE_GALACTIC:0 "Shadow Gate"
 PS_SHADOW_GATE_GALACTIC_DESC:0 "Leads to any other Syndicate Shadow Gate."
 PS_SHADOW_GATE_CANT_USE:0 "Only partisans, their subjects and allies (federation or defensive pact) may use the Syndicate's hidden passages. Enemies are shut out."
 tradition_ps_imperious:0 "Imperious"
 tradition_ps_imperious_desc:0 "Our dominion is the axis upon which the galaxy turns; all routes lead to [Root.Capital.GetName]."
 tr_ps_imperious_adopt:0 "Imperious Traditions"
 tr_ps_imperious_adopt_desc:0 "Subjects are not allies but provinces. Unlocks the Vassal Legates council agenda; +200 influence."
 tr_ps_imperious_finish:0 "Imperious Traditions Finished"
 tr_ps_imperious_finish_desc:0 "The empire is built."
 tr_ps_imperious_tributary_networks:0 "Tributary Networks"
 tr_ps_imperious_tributary_networks_delayed:0 "Tribute flows to the capital through a hundred channels, each one audited."
 tr_ps_imperious_imperial_administration:0 "Imperial Administration"
 tr_ps_imperious_imperial_administration_delayed:0 "The overlord's officials sit in every ministry of every subject."
 tr_ps_imperious_imperial_administration_effects:0 "Unlocks the §YOverlord Stance§! policy."
 tr_ps_imperious_imperial_decree:0 "Imperial Decree"
 tr_ps_imperious_imperial_decree_delayed:0 "The overlord's word is law for every subject."
 tr_ps_imperious_imperial_decree_effects:0 "Unlocks §YImperial Decrees§! for subjects: §YTribute§!, §YMobilization§!, §YDevelopment§!."
 tr_ps_imperious_diplomatic_supremacy:0 "Diplomatic Supremacy"
 tr_ps_imperious_diplomatic_supremacy_delayed:0 "When the overlord speaks, the galaxy listens."
