l_english:
 # ===== Common =====
 civic_tooltip_ps_requires_megacorp:0 "Requires §YCorporate§! authority (Megacorporation)"
 civic_tooltip_ps_requires_criminal_heritage:0 "Requires the §YCriminal Heritage§! civic"

 # ===== Origin =====
 origin_ps_partisan_legacy:0 "Legacy of the Resistance"
 origin_ps_partisan_legacy_desc:0 "Long ago, occupiers came to our homeworld. Armies surrendered and governments fled, but partisans rose in the forests and mountains. They derailed trains, burned depots and held on where holding on was impossible.\n\nThe war ended long ago, yet the network never disbanded. Couriers became smugglers, detachment commanders became shadow directors, and the old partisan Code became the Syndicate's charter. Now the network reaches for the stars."
 origin_tooltip_ps_partisan_legacy_effects:0 "£unity£ Starts the §YLegacy of the Resistance§! story chain (choose a Code at game start).\n- Encryption: §G+1§!\n- Army Damage: §G+10%§!\n- Envoys: §G+1§!\n- Leaders §Gdo not die of old age§! (§G+1000§! years of lifespan)\n- Unlocks §YSpecialized Subjects§!, §YPartisan Warfare§!, §YAgent Operations§! and partisan branch office buildings."

 # ===== Civics =====
 civic_ps_partisan_network:0 "Partisan Network"
 civic_ps_partisan_network_desc:0 "Every branch office is also a safehouse. Every courier is a contact. The corporation remembers how to fight without an army."
 civic_tooltip_ps_partisan_network_effects:0 "- Decryption: §G+1§!\n- Envoys: §G+1§!\n- Army Damage: §G+15%§!\n- Ship Cloaking: §G+1§!, military ship alloy cost: §G-5%§!, military ship energy upkeep: §R+5%§! (as Void Reavers)\n- Leaders §Gdo not die of old age§! (§G+1000§! years of lifespan)\n- Unlocks pirate waystation modules: §YPrivateer Den§!, §YConcealment Field§!, §YPrivateer Citadel§!\n- Unlocks the §YPartisan Cell§! and §YUnderground Press§! branch office buildings\n- Unlocks §YAgent Operations§! and §YPartisan Warfare§!"

 civic_ps_shadow_overlord:0 "Shadow Overlord"
 civic_ps_shadow_overlord_desc:0 "The Syndicate's subjects are not mere tributaries. Each gets a role in the network: some listen, some hold the line, some trade, some invent."
 civic_tooltip_ps_shadow_overlord_effects:0 "- Envoys: §G+1§!\n- Encryption: §G+1§!\n- Acceptance of becoming our subject: §G+50§!\n- Unity: §G+5%§! per subject (up to 40)\n- Unlocks §Y7 subject specializations§! that level up to III: §YStrike Legion§!, §YAssault Corps§!, §YPrivateer Flotilla§!, §YSpy Residency§!, §YShadow Exchange§!, §YResource Trust§!, §YOrder of Devotees§!.\n- Unlocks the §YSyndicate Oath§! edict and the §YSilent Coup§! operation.\n- Unlocks the §YPartisan Franchise§! agreement."


 # ===== Edicts =====
 edict_ps_sleeper_cells:0 "Sleeper Cells"
 edict_ps_sleeper_cells_desc:0 "Caches and dormant squads are prepared across the empire in case of invasion."
 edict_ps_shadow_fleet:0 "Shadow Fleet"
 edict_ps_shadow_fleet_desc:0 "Ships run dark along smuggler routes."

 # ===== Technology =====
 tech_ps_guerrilla_doctrine:0 "Guerrilla Doctrine"
 tech_ps_guerrilla_doctrine_desc:0 "Codifying the Resistance's experience: small groups, hit and run, reliance on the local population."
 tech_ps_ghost_networks:0 "Ghost Networks"
 tech_ps_ghost_networks_desc:0 "Quantum one-time pads and agents who never see each other's faces."

 # ===== Modifiers =====
 ps_code_honor:0 "Code of Honor"
 ps_code_honor_desc:0 "The Syndicate remembers what the partisans fought for."
 ps_code_profit:0 "Code of Profit"
 ps_code_profit_desc:0 "The network must feed itself."
 ps_code_silence:0 "Code of Silence"
 ps_code_silence_desc:0 "The network lives as long as it stays unseen."
 ps_legacy_liberator:0 "Liberator Syndicate"
 ps_legacy_liberator_desc:0 "We are heirs of the partisans, not of their occupiers."
 ps_legacy_master:0 "Master Syndicate"
 ps_legacy_master_desc:0 "The Resistance won. The network is ours now."
 ps_partisan_harassment:0 "Partisan Warfare"
 ps_partisan_harassment_desc:0 "Partisans operate in occupied territory: ambushes, sabotage, vanishing patrols."
 ps_sabotaged_shipyards:0 "Shipyard Sabotage"
 ps_sabotaged_shipyards_desc:0 "Someone swapped the slipway calibration data."
 ps_incited_unrest:0 "Underground Agitation"
 ps_incited_unrest_desc:0 "Syndicate agents are stoking discontent."
 ps_stolen_ledgers:0 "Stolen Ledgers"
 ps_stolen_ledgers_desc:0 "Accounting still can't balance the books."

 opinion_ps_caught_spying:0 "Caught Spying"

 # ===== Events: story =====
 ps.1.name:0 "Archive of the Resistance"
 ps.1.desc:0 "In the basement of the old headquarters lies what the Syndicate shows no one: worn forest maps, detachment rosters, rusted radios and the first partisan Code, copied by hand.\n\nThe board of directors has gathered to decide what the Syndicate's Code will be now that the network is leaving its homeworld."
 ps.1.a:0 "The Code of Honor. We remember what we fought for."
 ps.1.b:0 "The Code of Profit. The network must feed itself."
 ps.1.c:0 "The Code of Silence. We must not be seen."

 ps.2.name:0 "The Commander's Notebook"
 ps.2.desc:0 "Demolishing an old building, workers found a walled-up cache. Inside was the notebook of the network's founder, a partisan commander. Ciphered notes, cache coordinates, names of contacts, and a final entry: 'When the war ends, do not disband the network. Occupiers always come back, under other flags.'"
 ps.2.a:0 "Publish it. Let everyone know where we came from."
 ps.2.b:0 "Open the old caches."
 ps.2.c:0 "Classify it. Board eyes only."

 ps.3.name:0 "The Last Order"
 ps.3.desc:0 "The cryptographers have finished the final pages of the commander's notebook. It was an order, not to the detachments, but to their descendants: to decide what the network becomes once it holds the power of entire star systems.\n\nThe board understands that today's decision will define what the Syndicate is to the galaxy: a shield for the oppressed, or a new master."
 ps.3.a:0 "We are liberators. Like our ancestors."
 ps.3.b:0 "We won. Now we write the rules."


 # ===== Events: agents =====
 ps.20.name:0 "Agent Report"
 ps.20.desc:0 "Our spy network in §Y[ps_op_target.GetName]§! has taken deep root. The resident agent reports a weakness and awaits orders.\n\nAny operation will cost us part of the network."
 ps.20.a:0 "Steal their blueprints."
 ps.20.b:0 "Sabotage their shipyards."
 ps.20.c:0 "Raise the underground."
 ps.20.d:0 "Empty their treasury."
 ps.20.e:0 "Lie low."
 ps.21.name:0 "Agent Exposed"
 ps.21.desc:0 "Our agent was captured by counterintelligence. The operation has failed and relations with the victim have soured."
 ps.21.a:0 "They won't talk."
 ps.22.name:0 "Foreign Agent"
 ps.22.desc:0 "Our counterintelligence has detained an agent working for a foreign syndicate. The trail leads to §Y[From.GetName]§!."
 ps.22.a:0 "We will not forget this."

 # ===== Events: partisan warfare =====
 ps.31.name:0 "The Forests Burn Again"
 ps.31.desc:0 "The enemy has occupied §Y[ps_occupied_planet.GetName]§!, but has not taken it. The old caches are open, the contacts are back on the air, and on the very first night an occupier patrol vanished.\n\nJust as centuries ago, the network does what it was built for."
 ps.31.a:0 "Not one step back."
 ps.20.cost_10:0 "Spy Network level: §R-10§!"
 ps.20.cost_15:0 "Spy Network level: §R-15§!"
 ps.20.cost_20:0 "Spy Network level: §R-20§!"
 ps.20.e.tooltip:0 "Spy Network level: §G+5§!"

 # ===== Subject agreement =====
 preset_ps_partisan_franchise:0 "Partisan Franchise"
 preset_ps_partisan_franchise_desc:0 "The subject becomes a full cell of the network: it joins all of the overlord's wars, shares sensors and pays moderate tribute."

 # ===== Subjects: progression and raids =====
 edict_ps_oath:0 "Syndicate Oath"
 edict_ps_oath_desc:0 "Subjects swear a yearly oath to the network. Their loyalty grows by §G+1§! per month, so their specialization levels up faster."
 ps_oath_loyalty:0 "Syndicate Oath"
 ps_oath_loyalty_desc:0 "This subject has sworn an oath to the Syndicate network."
 ps_privateer_raids:0 "Privateer Raids"
 ps_privateer_raids_desc:0 "Syndicate privateers are raiding our trade lanes and convoys."
 ps.15.name:0 "The Privateers Go Hunting"
 ps.15.desc:0 "Our privateer flotillas have their orders. While the war lasts, every enemy convoy is fair game, and a share of the prizes goes to the Syndicate treasury."
 ps.15.a:0 "Good hunting."

 # ===== Operation: Silent Coup =====
 operation_ps_puppet_coup:0 "Silent Coup"
 operation_ps_puppet_coup_desc:0 "Bribe and intimidate the target's council until it becomes a Syndicate puppet. On success, the target becomes §Gvery friendly§! to us for 10 years and readily accepts any Syndicate subject type."
 operation_ps_puppet_coup_not_subject:0 "The target must not be anyone's subject."
 operation_ps_puppet_coup_too_big:0 "The target must have fewer than §Y10§! planets."
 operation_ps_puppet_coup_already:0 "The target's council is already ours."
 opinion_ps_puppet_council:0 "Puppet Council"
 ps_operation.1.name:0 "Contacts in the Council"
 ps_operation.1.desc:0 "Our agents have found a way to several councillors of §Y[target.GetName]§!. Some love money, some fear their past. The network gets to work."
 ps_operation.1.a:0 "Proceed."
 ps_operation.2.name:0 "Kompromat"
 ps_operation.2.desc:0 "The dossiers are ready. Half the council is bought, the other half knows that we know. All that remains is choosing the moment."
 ps_operation.2.a:0 "Await the signal."
 ps_operation.3.name:0 "Night of the Long Knives"
 ps_operation.3.desc:0 "In a single night the council of §Y[target.GetName]§! changed its members. The new faces in government remember who they owe their seats to."
 ps_operation.3.a:0 "Offer them our protection."
 ps_operation.3.a.tooltip:0 "§Y[target.GetName]§! gains a §YPuppet Council§! for 10 years: §G+150§! opinion of us and §G+150§! willingness to accept any Syndicate specialist subject agreement."

 ps_branch_network_slots:0 "Syndicate Network"
 ps_branch_network_slots_desc:0 "A partisan network branch: extra branch office building slots."

 # ===== Origin: Ark of the Resistance =====
 origin_ps_partisan_ark:0 "Ark of the Resistance"
 origin_ps_partisan_ark_desc:0 "When the occupiers came to our homeworld, the partisans did not wait in the forests. They seized an unfinished ark at the orbital shipyard and left for the stars with their families, their archive and their weapons.\n\nThe Syndicate has had no home since. Its headquarters is the ark, its land is any system where it makes camp, and its network grows in every port it passes."
 origin_tooltip_ps_partisan_ark_effects:0 "£unity£ A nomadic partisan megacorporation (requires the §YNomads§! DLC).\n- Arkship action speed: §G+15%§!\n- Military arkship hull: §G+10%§!\n- Encryption: §G+1§!, Envoys: §G+1§!\n- Leaders §Gdo not die of old age§! (§G+1000§! years of lifespan)\n- Prologue §YArk of the Resistance§!: choose an ark doctrine, then the shared story chain.\n- §YResistance Camp§!: while the ark is encamped, allied colonies in the system receive aid and the rest get contraband and agitators. You gain energy, unity and influence every month.\n- Unlocks specialist subjects, agent operations, partisan warfare and 100 branch office buildings."
 ps_ark_fortress:0 "Fortress Ark"
 ps_ark_fortress_desc:0 "The ark has become a flying citadel of the Resistance."
 ps_ark_market:0 "Market Ark"
 ps_ark_market_desc:0 "Wherever the ark goes, a bazaar springs up around it."
 ps_ark_ghost:0 "Ghost Ark"
 ps_ark_ghost_desc:0 "The ark arrives without lights and leaves without a trace."
 ps_ark_contraband:0 "Syndicate Camp"
 ps_ark_contraband_desc:0 "A Syndicate ark is camped nearby: contraband on the streets, agitators in the alleys."
 ps_ark_aid:0 "Ark Aid"
 ps_ark_aid_desc:0 "An allied Syndicate ark shares supplies, doctors and instructors."
 ps.5.name:0 "Ark of the Resistance"
 ps.5.desc:0 "The ark's holds still keep partisan maps, radios and the first Code, copied by hand. We have no homeworld any more, only the ship, the network and a long road.\n\nThe board of directors has gathered on the bridge to decide what the Syndicate's ark will become."
 ps.5.a:0 "A fortress. Let the enemy break upon our hull."
 ps.5.b:0 "A market. Where the ark goes, money follows."
 ps.5.c:0 "A ghost. We must not be seen."
 ps.71.name:0 "Resistance Camp"
 ps.71.desc:0 "The ark has made camp near §Y[ps_ark_planet.GetName]§!. Within a week our people appeared in the local ports: some hand out supplies to friends, others trade in what is forbidden.\n\nWhile the ark stays, every foreign colony in the system works for the Syndicate."
 ps.71.a:0 "Make camp."

 # ===== Uprisings =====
 operation_ps_sow_dissent:0 "Sow Dissent"
 operation_ps_sow_dissent_desc:0 "Syndicate agitators stir up one of the target's planets. The planet gets §R-15§! stability for 5 years, making a revolt far more likely."
 operation_ps_arm_rebels:0 "Arm the Rebels"
 operation_ps_arm_rebels_desc:0 "Covertly arm an ongoing revolt in the target empire: §G+20§! revolt progress, outside support (§G+2§! per month) and a weakened garrison. If it wins, the planet may join us."
 operation_ps_spark_uprising:0 "Spark an Uprising"
 operation_ps_spark_uprising_desc:0 "Turn discontent on an unstable planet of the target into an open revolt under our patronage."
 operation_ps_supply_rebels:0 "Supply the Free World"
 operation_ps_supply_rebels_desc:0 "Send weapons, alloys and instructors to a state born from a revolt we supported."
 operation_ps_no_planets:0 "The target has no planets besides its capital."
 operation_ps_no_revolt:0 "There is no revolt in the target empire right now."
 operation_ps_no_unstable_planet:0 "The target has no unstable planets (stability below §Y40§!, not the capital)."
 operation_ps_already_supplied:0 "This free world is already receiving our supplies."

 ps_revolt.1.name:0 "Agitators in Place"
 ps_revolt.1.desc:0 "Our people have settled into the ports and dormitories of §Y[target.GetName]§!. They listen to what the workers grumble about and remember the angriest names."
 ps_revolt.1.a:0 "Let them grumble louder."
 ps_revolt.2.name:0 "Unrest"
 ps_revolt.2.desc:0 "Spontaneous rallies have begun on §Y[ps_revolt_planet.GetName]§!. Syndicate leaflets in every stairwell, and the police don't know whom to arrest."
 ps_revolt.2.a:0 "Excellent work."
 ps_revolt.2.a.tooltip:0 "§Y[ps_revolt_planet.GetName]§! gains §RUnrest§! for 5 years. If the planet revolts, the Syndicate counts as its patron."
 ps_revolt.3.name:0 "Contact with the Rebels"
 ps_revolt.3.desc:0 "Our couriers have reached the revolt's headquarters in §Y[target.GetName]§!. The rebels distrust outsiders, but they need weapons more than pride."
 ps_revolt.3.a:0 "Proceed."
 ps_revolt.4.name:0 "Secret Convoys"
 ps_revolt.4.desc:0 "Containers of «farm machinery» pass through three shell companies. Customs noticed nothing."
 ps_revolt.4.a:0 "Speed up the deliveries."
 ps_revolt.5.name:0 "Weapons Delivered"
 ps_revolt.5.desc:0 "The rebels on §Y[ps_revolt_planet.GetName]§! have received Syndicate weapons. They are no longer a mob but an army."
 ps_revolt.5.a:0 "Freedom or death."
 ps_revolt.5.a.tooltip:0 "Revolt on §Y[ps_revolt_planet.GetName]§!: §G+20§! progress, we become its §Youtside support§! (§G+2§! per month), the garrison is weakened for 3 years. If it wins, the planet may join us, or become independent with a generous buff."
 ps_revolt.6.name:0 "Cells on the Planet"
 ps_revolt.6.desc:0 "We are looking for the most restless planet of §Y[target.GetName]§! and for people ready to lead the rest."
 ps_revolt.6.a:0 "Keep looking."
 ps_revolt.7.name:0 "Preparations"
 ps_revolt.7.desc:0 "Arms caches, safehouses, escape routes, a signal to rise. Just as the ancestors taught."
 ps_revolt.7.a:0 "Await the signal."
 ps_revolt.8.name:0 "Uprising!"
 ps_revolt.8.desc:0 "Government buildings are burning on §Y[ps_revolt_planet.GetName]§!. Partisans have seized the communication hubs and proclaimed a people's council."
 ps_revolt.8.a:0 "The forests burn again, in their lands now."
 ps_revolt.8.a.tooltip:0 "A §Rrevolt§! begins on §Y[ps_revolt_planet.GetName]§! (the vanilla Planetary Revolt situation) under our patronage: §G+20§! progress, outside support, §RUnrest§! and §RArmed Underground§!."
 ps_revolt.10.name:0 "Convoy to the Free World"
 ps_revolt.10.desc:0 "Syndicate transports carry alloys, weapons and instructors to §Y[target.GetName]§!."
 ps_revolt.10.a:0 "Full speed."
 ps_revolt.11.name:0 "Supplies Delivered"
 ps_revolt.11.desc:0 "The young state of §Y[target.GetName]§! has everything it needs to defend its freedom."
 ps_revolt.11.a:0 "Hold on, comrades."
 ps_revolt.41.name:0 "A Free World"
 ps_revolt.41.desc:0 "The revolt we supported has won. The flag of the new state of §Y[ps_rebel_state.GetName]§! flies over §Y[ps_revolt_planet.GetName]§!, and its leaders know who they owe their freedom to."
 ps_revolt.41.a:0 "Welcome to the network."
 ps_revolt.41.a.tooltip:0 "§Y[ps_rebel_state.GetName]§! gains §GLiberated World§! for 20 years and resources, has §G+200§! opinion of us and for 10 years §Greadily accepts Syndicate subject agreements§!."

 ps_sown_dissent:0 "Unrest"
 ps_sown_dissent_desc:0 "Syndicate agitators are stirring up this planet."
 ps_armed_underground:0 "Armed Underground"
 ps_armed_underground_desc:0 "The underground has weapons, and the garrison is not sure it can win."
 ps_liberated_state:0 "Liberated World"
 ps_liberated_state_desc:0 "A young state born from a revolt supported by the Syndicate."
 ps_rebel_supplies:0 "Syndicate Supplies"
 ps_rebel_supplies_desc:0 "Weapons, alloys and instructors from the Syndicate of the Resistance."
 opinion_ps_liberators:0 "Liberators"
 edict_ps_liberation_fund:0 "Liberation Fund"
 edict_ps_liberation_fund_desc:0 "Each year supports §Yevery§! revolt in empires we have contact with (except allies and subjects): §G+10§! progress and outside support (§G+2§! per month). Costs §Y150§! energy per year for each revolt."

 ps_cell_holding_slots:0 "Syndicate Cell"
 ps_cell_holding_slots_desc:0 "Subject of a partisan overlord: extra slots for the overlord's holdings on its planets."

 # ===== Sabotage (ideas from Skullduggery) =====
 operation_ps_liquidation:0 "Liquidation"
 operation_ps_liquidation_desc:0 "A partisan tribunal has sentenced one of the target's leaders. The executioners are on their way."
 operation_ps_armed_uprising:0 "Armed Uprising"
 operation_ps_armed_uprising_desc:0 "Arm the discontented on an unstable planet of the target. Rebel detachments engage the garrison in §Rground combat§! and the planet gains Armed Underground."
 operation_ps_general_strike:0 "General Strike"
 operation_ps_general_strike_desc:0 "Unions bribed by the Syndicate bring a target planet to a halt: §R-50%§! output for a year."
 operation_ps_radio_liberty:0 "Radio Liberty"
 operation_ps_radio_liberty_desc:0 "A pirate station broadcasts to a target planet: people grow disillusioned with their government and change their views faster."
 operation_ps_infrastructure_sabotage:0 "Infrastructure Sabotage"
 operation_ps_infrastructure_sabotage_desc:0 "Blow up substations, bridges and transport hubs on a target planet."
 operation_ps_hijack_squadron:0 "Hijack a Squadron"
 operation_ps_hijack_squadron_desc:0 "Recruited crews take part of the target's fleet over to the Syndicate (about §Y5%§! of its naval capacity)."
 operation_ps_no_restless_planet:0 "The target has no restless planets (stability below §Y50§!, not the capital)."
 operation_ps_hijack_cooldown:0 "This empire recently had a squadron hijacked."
 NAME_ps_partisan_insurgents:0 "Insurgents"
 NAME_ps_partisan_detachment:0 "Partisan Detachment"
 ps_partisan_insurgent:0 "Partisan Detachment"
 ps_partisan_insurgent_plural:0 "Partisan Detachments"
 ps_partisan_insurgent_desc:0 "Rebels armed by the Syndicate."

 ps_sabotage.5.name:0 "Surveillance"
 ps_sabotage.5.desc:0 "Agents study the target: schedules, guards, weak points."
 ps_sabotage.5.a:0 "Proceed."
 ps_sabotage.1.name:0 "The Sentence"
 ps_sabotage.1.desc:0 "The partisan tribunal has heard the case. All that remains is the right moment."
 ps_sabotage.1.a:0 "Wait for the moment."
 ps_sabotage.2.name:0 "Sentence Carried Out"
 ps_sabotage.2.desc:0 "§Y[target.GetName]§! has lost one of its leaders. The official story is an accident."
 ps_sabotage.2.a:0 "So it will be for all of them."
 ps_sabotage.2.a.tooltip:0 "§Y[ps_liquidation_target.GetName]§! dies."
 ps_sabotage.3.name:0 "Weapons for the Discontented"
 ps_sabotage.3.desc:0 "Arms caches are laid, detachment commanders chosen. All that remains is the signal."
 ps_sabotage.3.a:0 "Get ready."
 ps_sabotage.4.name:0 "Uprising!"
 ps_sabotage.4.desc:0 "Armed detachments are attacking the garrison on §Y[ps_revolt_planet.GetName]§!."
 ps_sabotage.4.a:0 "Forward, comrades!"
 ps_sabotage.4.a.tooltip:0 "§R3–6 partisan detachments§! appear on §Y[ps_revolt_planet.GetName]§! and ground combat begins. The planet gains Armed Underground, and the Syndicate becomes the patron of any future revolt."
 ps_sabotage.6.name:0 "The Planet Stands Still"
 ps_sabotage.6.desc:0 "Factories, mines and ports have stopped on §Y[ps_strike_planet.GetName]§!. The strike committee demands the impossible."
 ps_sabotage.6.a:0 "Let them stand."
 ps_sabotage.7.name:0 "On Air: Radio Liberty"
 ps_sabotage.7.desc:0 "A pirate station broadcasts to §Y[ps_radio_planet.GetName]§!: news the local TV won't show and songs that are banned."
 ps_sabotage.7.a:0 "Louder."
 ps_sabotage.8.name:0 "Explosions"
 ps_sabotage.8.desc:0 "A substation, a bridge and a transport hub on §Y[ps_blast_planet.GetName]§! went up at once."
 ps_sabotage.8.a:0 "Clean work."
 ps_sabotage.9.name:0 "Recruiting Crews"
 ps_sabotage.9.desc:0 "We have found fleet officers of §Y[target.GetName]§! who are not paid on time."
 ps_sabotage.9.a:0 "Offer them more."
 ps_sabotage.10.name:0 "The Squadron Is Ours"
 ps_sabotage.10.desc:0 "Overnight, several ships of §Y[target.GetName]§! left their dock and came over to us. Their captains now serve the Syndicate."
 ps_sabotage.10.a:0 "Welcome aboard."
 ps_sabotage.10.a.tooltip:0 "We gain a squadron of about §Y5%§! of §Y[target.GetName]§!'s naval capacity. The target loses alloys."
 ps_sabotage.20.name:0 "Armed Uprising"
 ps_sabotage.20.desc:0 "Armed rebels are attacking our garrison on §Y[Root.GetName]§!. Where they got their weapons is unknown."
 ps_sabotage.20.a:0 "Crush them!"
 ps_sabotage.21.name:0 "Hijacked Squadron"
 ps_sabotage.21.desc:0 "Several of our ships left their dock without orders and vanished. The crews were apparently bribed."
 ps_sabotage.21.a:0 "Traitors!"

 ps_general_strike:0 "General Strike"
 ps_general_strike_desc:0 "Factories, mines and ports have stopped."
 ps_radio_liberty:0 "Radio Liberty"
 ps_radio_liberty_desc:0 "The population is listening to a banned station."
 ps_infrastructure_damage:0 "Damaged Infrastructure"
 ps_infrastructure_damage_desc:0 "Substations, bridges and transport hubs are being rebuilt."

 building_ps_resistance_hq:0 "Resistance Headquarters"
 building_ps_resistance_hq_desc:0 "The heart of the partisan network. The more rivals the Syndicate has, the more people rally to its banner: §G+10§! unity and §G+0.5§! influence per rival."
 building_ps_intelligence_ministry:0 "Ministry of Intelligence"
 building_ps_intelligence_ministry_desc:0 "Gathers information on every known empire: intel grows with the number of contacts."
 building_ps_liberation_committee:0 "Liberation Committee"
 building_ps_liberation_committee_desc:0 "Coordinates support for uprisings across the galaxy."
 building_ps_partisan_academy:0 "Partisan Academy"
 building_ps_partisan_academy_desc:0 "Trains commanders and fighters according to the Resistance's manuals."

 # ===== Covert operations (ideas from Chris' Covert Operations / Criminal Underworld) =====
 operation_ps_shifting_allegiance:0 "Shifting Allegiance"
 operation_ps_shifting_allegiance_desc:0 "Work on the ruling elite of another empire's subject. Its loyalty to its overlord drops (§R-3§! per month for 5 years), and for 10 years it becomes §Greceptive§! to Syndicate agreements."
 operation_ps_infiltrate_fleet_command:0 "Infiltrate Fleet Command"
 operation_ps_infiltrate_fleet_command_desc:0 "Our people in the target's fleet command scramble orders and leak plans: §R-15%§! fire rate and §R-10%§! ship speed for the target for a year."
 operation_ps_decapitation:0 "Decapitation"
 operation_ps_decapitation_desc:0 "Eliminate the target's ruler. The empire falls into a §Rsuccession crisis§! for 2 years."
 operation_ps_seed_criminal_networks:0 "Criminal Networks"
 operation_ps_seed_criminal_networks_desc:0 "Fund gangs and corrupt officials through our branch offices: every target planet with our branch office gets §R+25§! crime for 10 years."
 operation_ps_shield_protocol:0 "Shield Protocol"
 operation_ps_shield_protocol_desc:0 "§YAid to an ally.§! Set up secure channels with an ally: §G+2§! encryption for 5 years and §G+75§! opinion of us."
 operation_ps_suppress_insurgency:0 "Suppress Insurgency"
 operation_ps_suppress_insurgency_desc:0 "§YAid to an ally.§! Crush a foreign underground in an allied empire: §G-30§! revolt progress and §G+10§! stability on the planet."
 operation_ps_covert_fleet_support:0 "Covert Fleet Support"
 operation_ps_covert_fleet_support_desc:0 "§YAid to an ally.§! Covertly send alloys, crews and ships to an empire at war: §G+10%§! fire rate and §G+20§! naval capacity for 2 years, §G300§! alloys (from our treasury)."
 operation_ps_target_not_foreign_subject:0 "The target must be a subject of another empire."
 operation_ps_target_no_ruler:0 "The target has no ruler."
 operation_ps_decapitation_cooldown:0 "This empire recently lost its ruler."
 operation_ps_no_branch_offices:0 "The target has no planets with our branch offices."
 operation_ps_target_not_ally:0 "The target must be our ally: a federation member, defensive pact partner, friendly empire or our subject."
 operation_ps_target_not_at_war:0 "The target must be at war, but not with us, and not be our rival."

 ps_covert.1.name:0 "Preparations"
 ps_covert.1.desc:0 "Syndicate agents are taking positions in §Y[target.GetName]§!."
 ps_covert.1.a:0 "Proceed."
 ps_covert.2.name:0 "A New Oath"
 ps_covert.2.desc:0 "The councillors of §Y[target.GetName]§! increasingly say their overlord has given them nothing, while the Syndicate..."
 ps_covert.2.a:0 "Let them think about it."
 ps_covert.3.name:0 "Chaos at Headquarters"
 ps_covert.3.desc:0 "Orders to the fleet of §Y[target.GetName]§! arrive late, scrambled, or not at all."
 ps_covert.3.a:0 "Excellent."
 ps_covert.4.name:0 "The Ruler Is Dead"
 ps_covert.4.desc:0 "The ruler of §Y[target.GetName]§! is dead. The heirs are already fighting over power."
 ps_covert.4.a:0 "Let them fight."
 ps_covert.5.name:0 "Criminal Networks"
 ps_covert.5.desc:0 "Through our branch offices, the gangs and corrupt officials of §Y[target.GetName]§! have received money and connections."
 ps_covert.5.a:0 "Business is business."
 ps_covert.6.name:0 "Shield Protocol"
 ps_covert.6.desc:0 "We have set up secure channels with §Y[target.GetName]§!. Foreign spies have nothing left to catch there."
 ps_covert.6.a:0 "Friends should help each other."
 ps_covert.7.name:0 "Unrest Suppressed"
 ps_covert.7.desc:0 "Our agents have identified the instigators of unrest in §Y[target.GetName]§!. Order is restored."
 ps_covert.7.a:0 "Don't mention it."
 ps_covert.8.name:0 "Secret Convoy"
 ps_covert.8.desc:0 "Unmarked transports have delivered alloys, crews and spare parts to §Y[target.GetName]§!."
 ps_covert.8.a:0 "Hold on."

 ps_shifting_allegiance:0 "Shifting Allegiance"
 ps_shifting_allegiance_desc:0 "The ruling elite doubts its overlord."
 ps_fleet_command_infiltrated:0 "Spies in Fleet Command"
 ps_fleet_command_infiltrated_desc:0 "Orders get scrambled, plans leak."
 ps_succession_crisis:0 "Succession Crisis"
 ps_succession_crisis_desc:0 "After the ruler's death, the heirs are fighting over power."
 ps_criminal_network:0 "Criminal Networks"
 ps_criminal_network_desc:0 "Gangs and corrupt officials funded through Syndicate branch offices."
 ps_shield_protocol:0 "Shield Protocol"
 ps_shield_protocol_desc:0 "Secure communication channels from the Syndicate."
 ps_restored_order:0 "Order Restored"
 ps_restored_order_desc:0 "Syndicate agents have crushed the underground."
 ps_covert_fleet_support:0 "Covert Fleet Support"
 ps_covert_fleet_support_desc:0 "Alloys, crews and ships from the Syndicate."
 opinion_ps_covert_aid:0 "Covert Aid"

 preset_ps_client_regime:0 "Client Regime"
 preset_ps_client_regime_desc:0 "A state whose institutions have been captured by the Syndicate. Pays no tribute, joins defensive wars and holds up to 3 of the overlord's holdings per planet by its terms (up to 20 with Syndicate Cell).\n\nAvailable to countries with a Puppet Council (Silent Coup and Shifting Allegiance operations) and to states born from Syndicate-backed revolts."
 preset_ps_client_regime_flavor_desc:0 "$preset_ps_client_regime_desc$"

 # ===== Cell panel =====
 decision_ps_cell_panel:0 "Cell Panel"
 decision_ps_cell_panel_desc:0 "Open the Syndicate subject management panel: select a cell, subsidies, supplies, mobilization, tribute."
 decision_ps_transfer_planet:0 "Transfer Planet to Cell"
 decision_ps_transfer_planet_desc:0 "Transfer this planet to the subject selected in the Cell Panel. If it is our only colony in the system, the starbase is transferred too."
 decision_ps_transfer_planet_tooltip:0 "The planet goes to the selected cell. The cell gains §G+3§! monthly loyalty for 5 years."
 decision_ps_no_cells:0 "We have no subjects."
 decision_ps_no_selected_cell:0 "First select a cell in the Cell Panel (a decision on the capital)."
 decision_ps_planet_occupied:0 "The planet must be under our control."
 ps_panel.1.name:0 "Cell Panel"
 ps_panel.1.desc:0 "Selected cell: §Y[ps_cell.GetName]§!.\n\nHere the board of directors manages the Syndicate's subjects: supporting them with money and weapons, rewarding the loyal, demanding a share and raising cells for war.\n\nTo give a cell a planet, use the §YTransfer Planet to Cell§! decision on that planet."
 ps_panel.1.next:0 "Next cell"
 ps_panel.1.subsidy:0 "Subsidy: §Y500§! energy (loyalty §G+2§!/month for a year)"
 ps_panel.1.alloys:0 "Arms shipment: §Y200§! alloys (armies and hulls for 2 years)"
 ps_panel.1.tech:0 "Share knowledge: §Y50§! influence (once per 5 years)"
 ps_panel.1.honor:0 "Honor the cell: §Y50§! influence (loyalty §G+3§!/month for 2 years)"
 ps_panel.1.mobilize:0 "Mobilize the cell (fleet and armies for a year, once per 5 years)"
 ps_panel.1.tribute:0 "Demand tribute: §Y300§! energy and minerals (loyalty §R-2§!/month)"
 ps_panel.1.territory:0 "Subject management: systems, overview, budget"
 ps_panel.1.territory.tooltip:0 "System transfers, subject overview, card, budget and recommendations. A single planet can still be given with the §YGive planet to cell§! decision."
 ps_panel.1.close:0 "Close"
 ps_panel.51.name:0 "The Overlord's Gift"
 ps_panel.51.desc:0 "Our overlord has given us the planet §Y[ps_transferred_planet.GetName]§!. The Syndicate network is generous to the loyal."
 ps_panel.51.a:0 "We will live up to this trust."
 ps_cell_subsidized:0 "Overlord's Subsidy"
 ps_cell_subsidized_desc:0 "Our overlord supported us with money."
 ps_cell_armed:0 "Overlord's Weapons"
 ps_cell_armed_desc:0 "Our overlord supplied us with weapons."
 ps_cell_honored:0 "Syndicate Honors"
 ps_cell_honored_desc:0 "Our overlord publicly honored our cell."
 ps_cell_mobilized:0 "Cell Mobilization"
 ps_cell_mobilized_desc:0 "Our overlord raised our cell for war."
 ps_cell_tribute_demanded:0 "Tribute Demanded"
 ps_cell_tribute_demanded_desc:0 "Our overlord took part of our stockpiles."
 ps_cell_land_grant:0 "Land Grant"
 ps_cell_land_grant_desc:0 "Our overlord gave us a planet."

 # ===== Ark: seed a cell =====
 decision_ps_ark_seed_cell:0 "Seed a Cell"
 decision_ps_ark_seed_cell_desc:0 "Part of the ark's crew stays on a free planet in the system where the ark is encamped and founds a new state, a subject of the Syndicate."
 decision_ps_ark_seed_cell_tooltip:0 "A §Ynew state§! of our species appears on a free habitable planet in the encamped ark's system. It becomes our subject (§YClient Regime§!), gets starting resources, §GLiberated World§! for 20 years and §G+200§! opinion of us.\nCan be repeated after 5 years."
 decision_ps_ark_seed_cooldown:0 "The ark recently seeded a cell (once per 5 years)."
 decision_ps_ark_no_camp_world:0 "The ark must be encamped in an unowned or our own system with a §Yfree habitable planet§!."
 ps_ark.11.name:0 "A New Cell"
 ps_ark.11.desc:0 "The ark's airlocks opened above §Y[ps_cell_world.GetName]§!. Volunteers, families, instructors and supplies for the first years. A new state was born here, §Y[ps_new_cell.GetName]§!, and its first council swore loyalty to the Syndicate.\n\nThe ark moves on. The cell remains."
 ps_ark.11.a:0 "The network grows."
 ps_ark_cell_founding:0 "Ark Cell"
 ps_ark_cell_founding_desc:0 "A young colony founded by the crew of a Syndicate ark."

 # ===== Endgame crisis: Red Storm =====
 situation_ps_red_storm:0 "Red Storm"
 situation_ps_red_storm_type:0 "Red Storm"
 situation_ps_red_storm_desc:0 "We are the uprising that did not stop. Having overthrown our masters, we carry the revolution to our neighbours, one empire after another. With every victory the Storm grows stronger."
 situation_ps_red_storm_monthly_change_tooltip:0 "The Storm grows over time, faster during war and when we have more than 10 planets. Every war won gives §G+20§!."
 ps_storm_level_1:0 "Uprising"
 ps_storm_level_1_desc:0 "The rebels hold on and strike their masters."
 ps_storm_level_2:0 "Revolution"
 ps_storm_level_2_desc:0 "The Storm has grown strong and eyes its neighbours."
 ps_storm_level_3:0 "Storm"
 ps_storm_level_3_desc:0 "The Storm's armies have swept through several empires."
 ps_storm_level_4:0 "Red Dawn"
 ps_storm_level_4_desc:0 "The Storm is one of the galaxy's mightiest powers."
 ps_storm_level_5:0 "End of the Old World"
 ps_storm_level_5_desc:0 "The Storm is at the peak of its power. No empire can stand alone."
 ps_storm_approach_world_revolution:0 "World Revolution"
 ps_storm_approach_world_revolution_desc:0 "There is no turning back."
 ps_storm_progress_war:0 "War"
 ps_storm_progress_size:0 "Great power (more than 10 planets)"

 operation_ps_red_storm:0 "Red Storm"
 operation_ps_red_storm_desc:0 "§REndgame crisis.§! Raise an uprising in the target empire that will not stop. The rebels get several restless planets, a quarter of their master's fleet and armies, then declare war on their master. Once it falls, the §RRed Storm§! will declare war on its neighbours one by one — on everyone except player partisan empires and their subjects.\n\nCan be launched any number of times: each Storm wages its own wars."
 operation_ps_red_storm_too_early:0 "Only possible after year §Y50§!."
 operation_ps_red_storm_tech:0 "Requires the §YGhost Networks§! technology."
 operation_ps_red_storm_small:0 "The target must have more than §Y4§! planets."
 operation_ps_red_storm_partisan:0 "The Storm cannot be raised against a player partisan empire or its subject."
 NAME_ps_red_storm:0 "Red Storm"
 opinion_ps_red_storm:0 "Red Storm"
 cb_ps_red_storm:0 "Red Storm"
 cb_ps_red_storm_desc:0 "The Storm carries the revolution to its neighbours."
 wg_ps_red_storm:0 "World Revolution"
 wg_ps_red_storm_desc:0 "The Red Storm carries the revolution to this empire."
 wg_ps_red_storm_accept:0 "All planets occupied by the Storm pass to it. The Storm grows stronger."

 ps_storm_liberated_world:0 "Liberated by the Storm"
 ps_storm_liberated_world_desc:0 "This world has raised the red flag."
 ps_storm_survivors:0 "Storm Survivors"
 ps_storm_survivors_desc:0 "The Red Storm has died down, and the galaxy begins to rebuild."

 ps_storm.1.name:0 "Red Storm"
 ps_storm.1.desc:0 "Everything is ready. Our people are in every city of §Y[target.GetName]§!, the weapons are in the caches, the fleet crews await the signal."
 ps_storm.1.a:0 "Raise the Storm."
 ps_storm.1.a.tooltip:0 "An uprising breaks out on §Y[ps_storm_cradle.GetName]§!: the §RRed Storm§! is born. It takes up to 5 planets and a quarter of §Y[target.GetName]§!'s fleet and declares war on its master. Once the master falls, the Storm will turn on its neighbours, but §Gwill not touch us or our subjects§!."
 ps_storm.2.name:0 "Birth of the Red Storm"
 ps_storm.2.desc:0 "An uprising unlike anything the galaxy has seen has broken out in §Y[ps_storm_host.GetName]§!. The rebels have seized several worlds, part of the fleet has defected to them, and they have proclaimed the §RRed Storm§!. Analysts warn: once it overthrows its masters, the Storm will go further."
 ps_storm.2.desc.host:0 "Our worlds have risen! The rebels have seized several planets, a quarter of our fleet has defected, and they have proclaimed the §RRed Storm§!. They have already declared war on us."
 ps_storm.2.a:0 "It must be stopped."
 ps_storm.4.name:0 "The Red Storm Grows"
 ps_storm.4.desc:0 "§Y[ps_storm.GetName]§! has grown stronger: its armies and fleets grow with every victory."
 ps_storm.4.a:0 "Alarming."
 ps_storm.6.name:0 "The Storm Is Coming for Us"
 ps_storm.6.desc:0 "§Y[ps_storm.GetName]§! has declared war on us. Its agitators are already in our streets, and its fleets are at our borders."
 ps_storm.6.a:0 "To arms!"
 ps_storm.7.name:0 "The Storm Chooses a New Target"
 ps_storm.7.desc:0 "§Y[ps_storm.GetName]§! has declared war on §Y[ps_storm_next.GetName]§!."
 ps_storm.7.a:0 "Who is next?"
 ps_storm.8.name:0 "The Storm Is Victorious"
 ps_storm.8.desc:0 "§Y[ps_storm.GetName]§! has defeated §Y[ps_storm_loser.GetName]§! and taken every occupied world. The Storm has grown even stronger."
 ps_storm.8.a:0 "It must be stopped."
 ps_storm.51.name:0 "The Storm Has Passed"
 ps_storm.51.desc:0 "The Red Storm has been destroyed. Its flags are torn down, its armies broken. The galaxy has endured, and the survivors begin to rebuild."
 ps_storm.51.a:0 "We survived."

 # ===== Pirate waystation modules (idea: Corporate Pirates) =====
 sm_waystation_ps_pirate_hideout:0 "Privateer Den"
 sm_waystation_ps_pirate_hideout_plural:0 "Privateer Dens"
 sm_waystation_ps_pirate_hideout_desc:0 "Syndicate partisan privateers 'collect tribute' from foreign colonies in the system. Works like the vanilla Pirate Hideout.\n\n§YAvailable to partisan empires.§!"
 sm_waystation_ps_concealment_field:0 "Syndicate Concealment Field"
 sm_waystation_ps_concealment_field_plural:0 "Syndicate Concealment Fields"
 sm_waystation_ps_concealment_field_desc:0 "Hides the waystation from foreign sensors.\n\n§YAvailable to partisan empires.§!"
 sm_waystation_ps_reaver_stronghold:0 "Privateer Citadel"
 sm_waystation_ps_reaver_stronghold_plural:0 "Privateer Citadels"
 sm_waystation_ps_reaver_stronghold_desc:0 "The main fortress of the Syndicate's privateer network. One per empire; doubles the loot of every Privateer Den.\n\n§YAvailable to partisan empires.§!"
 decision_ps_mega_doctrine:0 "Megastructure Settlement Doctrine"
 decision_ps_mega_doctrine_desc:0 "Each of our megastructures with habitable worlds (ring worlds, habitats, and with Gigastructures: Frameworld sections, arcologies, Alderson disks, Birch worlds, etc.) can immediately become home to a new cell."
 decision_ps_mega_doctrine_tooltip:0 "Choose which §Yspecialist subject§! automatically settles the new worlds of our megastructures."
 ps_mega.1.name:0 "Megastructure Settlement Doctrine"
 ps_mega.1.desc:0 "When one of our megastructures is completed and §Yfree habitable worlds§! appear in its system, a new state of our species will settle them at once and become our subject with the chosen specialization.\n\nEach world receives 3 settler groups; the subject gets starting resources, §GLiberated World§! for 20 years and §G+200§! opinion of us."
 ps_mega.1.strike:0 "$specialist_ps_strike$"
 ps_mega.1.assault:0 "$specialist_ps_assault$"
 ps_mega.1.raiders:0 "$specialist_ps_raiders$"
