 ps_overlord_stance_acculturation:0 "Acculturation"
 ps_overlord_stance_acculturation_desc:0 "Subjects gradually adopt our culture and laws."
 ps_overlord_stance_cruel:0 "Iron Hand"
 ps_overlord_stance_cruel_desc:0 "Subjects exist to serve. Their discontent is not our concern."
