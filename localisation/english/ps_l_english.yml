 agenda_ps_vassal_legates_desc:0 "The council sends legates to every subject state."
 council_agenda_agenda_ps_vassal_legates_name:0 "Vassal Legates"
 council_agenda_agenda_ps_vassal_legates_desc:0 "On launch all subjects gain §G+5§! stability for 10 years."
