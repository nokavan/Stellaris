 tech_ps_shadow_veil_1:0 "Shadow Veil I"
 tech_ps_shadow_veil_1_desc:0 "Partisan tweaks to cloaking generators: a denser field and a quieter exhaust. Unlocks the §YArkship Stealth Module§!."
 tech_ps_shadow_veil_2:0 "Shadow Veil II"
 tech_ps_shadow_veil_2_desc:0 "False signatures and scattered emissions confuse enemy sensors."
 tech_ps_shadow_veil_3:0 "Shadow Veil III"
 tech_ps_shadow_veil_3_desc:0 "The Syndicate fleet dissolves into the galaxy's background noise."
 sm_arkship_ps_stealth_field:0 "Arkship Stealth Module"
 sm_arkship_ps_stealth_field_plural:0 "Arkship Stealth Modules"
 sm_arkship_ps_stealth_field_desc:0 "A cloaking field generator built for an arkship hull. The ark disappears from view with its whole population."
 sm_arkship_ps_stealth_field_tt:0 "The arkship gains a §Ycloaking generator§! (strength grows with cloaking technologies), §G+1§! cloaking strength and §G+10§! evasion. Cloaking turns on when built and returns after combat; it can be switched off with a capital decision.\n\n§YAvailable to partisan empires.§!"
 PS_ARK_CLOAKING_1:0 "Arkship Cloaking I"
 PS_ARK_CLOAKING_2:0 "Arkship Cloaking II"
 PS_ARK_CLOAKING_3:0 "Arkship Cloaking III"
 PS_ARK_CLOAKING_DARK_MATTER:0 "Dark Matter Arkship Cloaking"
 PS_ARK_CLOAKING_PSI:0 "Psionic Arkship Cloaking"
 decision_ps_ark_cloak_off:0 "Drop Arkship Cloak"
 decision_ps_ark_cloak_off_desc:0 "Switch off the stealth module: the ark becomes visible but loses the cloaking penalties."
 decision_ps_ark_cloak_off_tooltip:0 "Arkships with a stealth module §Rswitch off§! cloaking and do not re-enable it."
 decision_ps_ark_cloak_on:0 "Cloak the Arkship"
 decision_ps_ark_cloak_on_desc:0 "Hide the ark under its cloaking field again."
 decision_ps_ark_cloak_on_tooltip:0 "Arkships with a stealth module §Genable§! cloaking and restore it after combat."
 origin_ps_partisan_worldark:0 "World Ark of the Resistance"
 origin_ps_partisan_worldark_desc:0 "The partisans did not steal a mere ark, but a whole world with engines. Generations of the Syndicate are born, live and die on its decks, and it is their headquarters, fortress and homeland in one hull.\n\nWherever the World Ark stops, a new cell will grow."
 origin_tooltip_ps_partisan_worldark_effects:0 "£unity£ Nomadic partisan megacorporation (requires the §YNomads§! DLC).\n- With the §YXHK World Ark§! mod: start on the §GWorld Ark§! — a massive expandable arkship with unique districts, modules and systems. With the §Yxhk_worldark_patch§! the ark tiers and the specializations of §Yall three vanilla arks§! at level 3 are unlocked. As with XHK: cannot gain another arkship or settle normally, −50% planetary ascension effect, +100% ascension cost, +50% logistics ship capacity.\n- Without XHK World Ark — start on a regular arkship.\n- Arkship action speed: §G+15%§!, military arkship hull: §G+10%§!\n- Encryption: §G+1§!, envoys: §G+1§!\n- Leaders §Gdo not die of old age§! (§G+1000§! years)\n- The §YArk of the Resistance§! prologue, §YResistance Camps§!, cell seeding, specialist subjects, operations, partisan war and branch buildings — all as with the «Ark of the Resistance»."
