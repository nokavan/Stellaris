 tech_ps_shadow_veil_1:0 "Теневой покров I"
 tech_ps_shadow_veil_1_desc:0 "Партизанские доработки генераторов маскировки: поле плотнее, выхлоп тише. Открывает §Yстелс-модуль ковчега§!."
 tech_ps_shadow_veil_2:0 "Теневой покров II"
 tech_ps_shadow_veil_2_desc:0 "Ложные сигнатуры и рассеивание излучения сбивают вражеские сенсоры."
 tech_ps_shadow_veil_3:0 "Теневой покров III"
 tech_ps_shadow_veil_3_desc:0 "Флот Синдиката растворяется в фоновом шуме галактики."
 sm_arkship_ps_stealth_field:0 "Стелс-модуль ковчега"
 sm_arkship_ps_stealth_field_plural:0 "Стелс-модули ковчега"
 sm_arkship_ps_stealth_field_desc:0 "Генератор маскировочного поля, рассчитанный на корпус ковчега. Ковчег уходит из виду вместе со всем населением."
 sm_arkship_ps_stealth_field_tt:0 "Ковчег получает §Yгенератор маскировки§! (сила растёт с технологиями маскировки), §G+1§! к силе маскировки и §G+10§! к уклонению. Маскировка включается после постройки и возвращается после боя; выключить можно решением на столице.\n\n§YДоступно партизанским империям.§!"
 PS_ARK_CLOAKING_1:0 "Маскировка ковчега I"
 PS_ARK_CLOAKING_2:0 "Маскировка ковчега II"
 PS_ARK_CLOAKING_3:0 "Маскировка ковчега III"
 PS_ARK_CLOAKING_DARK_MATTER:0 "Маскировка ковчега на тёмной материи"
 PS_ARK_CLOAKING_PSI:0 "Пси-маскировка ковчега"
 decision_ps_ark_cloak_off:0 "Снять маскировку ковчега"
 decision_ps_ark_cloak_off_desc:0 "Отключить стелс-модуль: ковчег станет виден, но избавится от штрафов маскировки."
 decision_ps_ark_cloak_off_tooltip:0 "Ковчеги со стелс-модулем §Rвыключают§! маскировку и не включают её сами."
 decision_ps_ark_cloak_on:0 "Включить маскировку ковчега"
 decision_ps_ark_cloak_on_desc:0 "Снова укрыть ковчег маскировочным полем."
 decision_ps_ark_cloak_on_tooltip:0 "Ковчеги со стелс-модулем §Gвключают§! маскировку и возвращают её после боя."
 origin_ps_partisan_worldark:0 "Мировой ковчег Сопротивления"
 origin_ps_partisan_worldark_desc:0 "Партизаны угнали не просто ковчег, а целый мир на двигателях. Поколения Синдиката рождаются, живут и умирают на его палубах, а сам он — штаб, крепость и родина в одном корпусе.\n\nГде встанет Мировой ковчег, там вырастет новая ячейка."
 origin_tooltip_ps_partisan_worldark_effects:0 "£unity£ Кочевая партизанская мегакорпорация (требуется DLC §YNomads§!).\n- С модом §YXHK World Ark§!: старт на §GМировом ковчеге§! — огромном расширяемом ковчеге с уникальными районами, модулями и системами. С патчем §Yxhk_worldark_patch§! открыты тиры ковчега и специализации §Yвсех трёх ванильных ковчегов§! на 3-м уровне. Как у XHK: нельзя получить второй ковчег и основывать колонии обычным путём, −50% к эффекту возвышения планет, +100% к его стоимости, +50% к вместимости логистических кораблей.\n- Без XHK World Ark — старт на обычном ковчеге.\n- Скорость действий ковчега: §G+15%§!, прочность военных ковчегов: §G+10%§!\n- Шифрование: §G+1§!, посланники: §G+1§!\n- Лидеры §Gне умирают от старости§! (§G+1000§! лет жизни)\n- Пролог §YКовчег Сопротивления§!, §YСтоянки Сопротивления§!, высадка ячеек, специализированные вассалы, агентурные операции, партизанская война и здания филиалов — всё как у «Ковчега Сопротивления»."
 casus_belli_cb_ps_red_storm:0 "Красная Буря"
 casus_belli_cb_ps_red_storm_acquire_hint:0 "Красная Буря получает этот повод к войне против соседа, которого выбрала следующей целью."
 ps_storm_approach_world_revolution_tt:0 "Буря несёт революцию соседям: одна война за другой, пока не падёт последний трон."
