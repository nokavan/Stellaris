l_russian:
 # ===== Общее =====
 civic_tooltip_ps_requires_megacorp:0 "Требуется §YКорпоративная§! власть (мегакорпорация)"
 civic_tooltip_ps_requires_criminal_heritage:0 "Требуется цивик §YКриминальное наследие§!"

 # ===== Происхождение =====
 origin_ps_partisan_legacy:0 "Наследие Сопротивления"
 origin_ps_partisan_legacy_desc:0 "Когда-то на наш родной мир пришли оккупанты. Армии сдались, правительства бежали, но в лесах и горах поднялись партизаны. Они пускали под откос эшелоны, жгли склады и держались там, где держаться было невозможно.\n\nВойна давно закончилась, а сеть так и не распалась. Связные стали контрабандистами, командиры отрядов — теневыми директорами, а старый партизанский Кодекс — уставом Синдиката. Теперь эта сеть уходит к звёздам."
 origin_tooltip_ps_partisan_legacy_effects:0 "£unity£ Начинает сюжетную цепочку §YНаследие Сопротивления§! (выбор Кодекса на старте).\n- Шифрование: §G+1§!\n- Урон армий: §G+10%§!\n- Посланники: §G+1§!\n- Открывает §YСпециализированных вассалов§!, §YПартизанскую войну§!, §YАгентурные операции§! и партизанские здания филиалов."

 # ===== Цивики =====
 civic_ps_partisan_network:0 "Партизанская сеть"
 civic_ps_partisan_network_desc:0 "Каждый филиал корпорации — это ещё и явка. Каждый курьер — связной. Корпорация помнит, как воевать без армии."
 civic_tooltip_ps_partisan_network_effects:0 "- Дешифровка: §G+1§!\n- Посланники: §G+1§!\n- Урон армий: §G+15%§!\n- Открывает здания филиалов §YПартизанская ячейка§! и §YПодпольная типография§!\n- Открывает §YАгентурные операции§! и §YПартизанскую войну§!"

 civic_ps_shadow_overlord:0 "Теневой сюзерен"
 civic_ps_shadow_overlord_desc:0 "Вассалы Синдиката — не просто данники. Каждый получает свою роль в общей сети: кто-то слушает, кто-то держит оборону, кто-то торгует, а кто-то изобретает."
 civic_tooltip_ps_shadow_overlord_effects:0 "- Посланники: §G+1§!\n- Шифрование: §G+1§!\n- Открывает §Y6 специализаций вассалов§! с прокачкой до III уровня: §YУдарный легион§!, §YШтурмовой корпус§!, §YКаперская флотилия§!, §YШпионская резидентура§!, §YТеневая биржа§!, §YРесурсный трест§!.\n- Открывает эдикт §YПрисяга Синдиката§! и операцию §YТайный переворот§!.\n- Открывает соглашение §YПартизанская франшиза§!."


 # ===== Эдикты =====
 edict_ps_sleeper_cells:0 "Спящие ячейки"
 edict_ps_sleeper_cells_desc:0 "По всей империи готовятся тайники и законсервированные отряды на случай вторжения."
 edict_ps_shadow_fleet:0 "Теневой флот"
 edict_ps_shadow_fleet_desc:0 "Корабли ходят без опознавательных огней по маршрутам контрабандистов."

 # ===== Технологии =====
 tech_ps_guerrilla_doctrine:0 "Партизанская доктрина"
 tech_ps_guerrilla_doctrine_desc:0 "Систематизация опыта Сопротивления: малые группы, удар и отход, опора на местное население."
 tech_ps_ghost_networks:0 "Призрачные сети"
 tech_ps_ghost_networks_desc:0 "Квантовые одноразовые шифры и агентура, которая не знает друг друга в лицо."

 # ===== Модификаторы =====
 ps_code_honor:0 "Кодекс чести"
 ps_code_honor_desc:0 "Синдикат помнит, за что воевали партизаны."
 ps_code_profit:0 "Кодекс прибыли"
 ps_code_profit_desc:0 "Сеть должна кормить себя сама."
 ps_code_silence:0 "Кодекс молчания"
 ps_code_silence_desc:0 "Сеть жива, пока её не видно."
 ps_legacy_liberator:0 "Синдикат-Освободитель"
 ps_legacy_liberator_desc:0 "Мы — наследники партизан, а не их оккупантов."
 ps_legacy_master:0 "Синдикат-Хозяин"
 ps_legacy_master_desc:0 "Сопротивление победило. Теперь сеть принадлежит нам."
 ps_partisan_harassment:0 "Партизанская война"
 ps_partisan_harassment_desc:0 "На оккупированных территориях действуют партизаны: засады, диверсии, исчезающие патрули."
 ps_sabotaged_shipyards:0 "Саботаж на верфях"
 ps_sabotaged_shipyards_desc:0 "Кто-то подменил калибровочные данные стапелей."
 ps_incited_unrest:0 "Подполье"
 ps_incited_unrest_desc:0 "Агенты Синдиката подогревают недовольство."
 ps_stolen_ledgers:0 "Украденные реестры"
 ps_stolen_ledgers_desc:0 "Бухгалтерия до сих пор не может свести баланс."

 opinion_ps_caught_spying:0 "Пойманный шпион"

 # ===== События: сюжет =====
 ps.1.name:0 "Архив Сопротивления"
 ps.1.desc:0 "В подвале старой штаб-квартиры хранится то, что Синдикат никому не показывает: потёртые карты лесов, списки отрядов, ржавые рации и первый вариант партизанского Кодекса, переписанный от руки.\n\nСовет директоров собрался, чтобы решить, каким будет Кодекс Синдиката теперь, когда сеть выходит за пределы родного мира."
 ps.1.a:0 "Кодекс чести. Мы помним, за что воевали."
 ps.1.b:0 "Кодекс прибыли. Сеть должна кормить себя."
 ps.1.c:0 "Кодекс молчания. Нас не должно быть видно."

 ps.2.name:0 "Тетрадь командира"
 ps.2.desc:0 "При сносе старого здания рабочие нашли замурованный тайник. В нём — тетрадь основателя сети, командира партизанского отряда. Шифрованные записи, координаты схронов, имена связных и последняя запись: «Когда война кончится, сеть не распускать. Оккупанты всегда возвращаются — под другими флагами»."
 ps.2.a:0 "Опубликовать. Пусть все знают, откуда мы."
 ps.2.b:0 "Вскрыть старые схроны."
 ps.2.c:0 "Засекретить. Только для совета."

 ps.3.name:0 "Последний приказ"
 ps.3.desc:0 "Расшифровщики закончили работу над последними страницами тетради командира. Это был приказ — не отрядам, а потомкам: решить, кем станет сеть, когда у неё будет сила целых звёздных систем.\n\nСовет понимает: сегодняшнее решение определит, чем Синдикат будет для галактики — щитом угнетённых или новым хозяином."
 ps.3.a:0 "Мы — освободители. Как наши предки."
 ps.3.b:0 "Мы победили. Теперь правила пишем мы."


 # ===== События: агентура =====
 ps.20.name:0 "Агентурный отчёт"
 ps.20.desc:0 "Наша шпионская сеть в §Y[ps_op_target.GetName]§! укоренилась достаточно глубоко. Резидент докладывает об уязвимости и ждёт приказа.\n\nЛюбая операция потребует пожертвовать частью агентуры."
 ps.20.a:0 "Украсть чертежи."
 ps.20.b:0 "Устроить диверсию на верфях."
 ps.20.c:0 "Поднять подполье."
 ps.20.d:0 "Обчистить их казну."
 ps.20.e:0 "Залечь на дно."
 ps.21.name:0 "Агент раскрыт"
 ps.21.desc:0 "Наш агент был схвачен контрразведкой. Операция провалена, а наши отношения с пострадавшими испорчены."
 ps.21.a:0 "Он ничего не скажет."
 ps.22.name:0 "Вражеский агент"
 ps.22.desc:0 "Наша контрразведка задержала агента, работавшего на иностранный синдикат. Следы ведут к §Y[From.GetName]§!."
 ps.22.a:0 "Мы этого не забудем."

 # ===== События: партизанская война =====
 ps.31.name:0 "Леса снова горят"
 ps.31.desc:0 "Враг занял §Y[ps_occupied_planet.GetName]§!, но не взял её. Старые схроны вскрыты, связные вышли на связь, и в первую же ночь у оккупантов исчез патруль.\n\nКак и века назад, сеть делает то, ради чего была создана."
 ps.31.a:0 "Ни шагу назад."
 ps.20.cost_10:0 "Уровень шпионской сети: §R-10§!"
 ps.20.cost_15:0 "Уровень шпионской сети: §R-15§!"
 ps.20.cost_20:0 "Уровень шпионской сети: §R-20§!"
 ps.20.e.tooltip:0 "Уровень шпионской сети: §G+5§!"

 # ===== Соглашение с вассалом =====
 preset_ps_partisan_franchise:0 "Партизанская франшиза"
 preset_ps_partisan_franchise_desc:0 "Вассал становится полноправной ячейкой сети: вступает во все войны сюзерена, делится сенсорами и платит умеренную дань."

 # ===== Вассалы: прокачка и рейды =====
 edict_ps_oath:0 "Присяга Синдиката"
 edict_ps_oath_desc:0 "Вассалы ежегодно приносят присягу сети. Их лояльность растёт на §G+1§! в месяц, поэтому специализация прокачивается быстрее."
 ps_oath_loyalty:0 "Присяга Синдиката"
 ps_oath_loyalty_desc:0 "Вассал присягнул сети Синдиката."
 ps_privateer_raids:0 "Каперские рейды"
 ps_privateer_raids_desc:0 "Каперы Синдиката грабят наши торговые пути и конвои."
 ps.15.name:0 "Каперы вышли на охоту"
 ps.15.desc:0 "Наши каперские флотилии получили приказ. Пока идёт война, каждый вражеский конвой — законная добыча, а доля в трофеях уходит в казну Синдиката."
 ps.15.a:0 "Доброй охоты."

 # ===== Операция: Тайный переворот =====
 operation_ps_puppet_coup:0 "Тайный переворот"
 operation_ps_puppet_coup_desc:0 "Подкупить и запугать совет цели, чтобы он стал марионеткой Синдиката. После успеха цель на 10 лет становится §Gочень расположенной§! к нам и охотно принимает вассалитет любого типа Синдиката."
 operation_ps_puppet_coup_not_subject:0 "Цель не должна быть чьим-либо вассалом."
 operation_ps_puppet_coup_too_big:0 "У цели должно быть меньше §Y10§! планет."
 operation_ps_puppet_coup_already:0 "Совет цели уже под нашим контролем."
 opinion_ps_puppet_council:0 "Марионеточный совет"
 ps_operation.1.name:0 "Связные в совете"
 ps_operation.1.desc:0 "Наши агенты нашли подход к нескольким советникам §Y[target.GetName]§!. Кто-то любит деньги, кто-то боится прошлого. Сеть начинает работу."
 ps_operation.1.a:0 "Продолжайте."
 ps_operation.2.name:0 "Компромат"
 ps_operation.2.desc:0 "Досье собраны. Половина совета подкуплена, вторая половина знает, что мы знаем. Осталось выбрать момент."
 ps_operation.2.a:0 "Ждём сигнала."
 ps_operation.3.name:0 "Ночь длинных ножей"
 ps_operation.3.desc:0 "За одну ночь совет §Y[target.GetName]§! сменил состав. Новые лица в правительстве помнят, кому обязаны своими креслами."
 ps_operation.3.a:0 "Предложите им покровительство."
 ps_operation.3.a.tooltip:0 "§Y[target.GetName]§! на 10 лет получает §YМарионеточный совет§!: §G+150§! к отношению к нам и §G+150§! к готовности принять вассалитет по любой специализации Синдиката."

 ps_branch_network_slots:0 "Сеть Синдиката"
 ps_branch_network_slots_desc:0 "Филиал партизанской сети: дополнительные слоты для зданий филиала."

 # ===== Происхождение: Ковчег Сопротивления =====
 origin_ps_partisan_ark:0 "Ковчег Сопротивления"
 origin_ps_partisan_ark_desc:0 "Когда оккупанты пришли на наш родной мир, партизаны не стали ждать в лесах. Они захватили недостроенный ковчег на орбитальной верфи и ушли к звёздам вместе с семьями, архивом и оружием.\n\nС тех пор Синдикат не имеет дома. Его штаб — ковчег, его земля — любая система, где он встанет лагерем, а его сеть растёт в каждом порту, мимо которого он прошёл."
 origin_tooltip_ps_partisan_ark_effects:0 "£unity£ Кочевая партизанская мегакорпорация (требуется DLC §YNomads§!).\n- Скорость действий ковчега: §G+15%§!\n- Прочность военных ковчегов: §G+10%§!\n- Шифрование: §G+1§!, посланники: §G+1§!\n- Пролог §YКовчег Сопротивления§!: выбор доктрины ковчега, затем общая сюжетная цепочка.\n- §YСтоянка Сопротивления§!: пока ковчег стоит лагерем, союзные колонии в системе получают помощь, а остальные — контрабанду и подполье. Вам — энергия, единство и влияние каждый месяц.\n- Открывает специализированных вассалов, агентурные операции, партизанскую войну и 100 зданий филиалов."
 ps_ark_fortress:0 "Ковчег-крепость"
 ps_ark_fortress_desc:0 "Ковчег стал летающей цитаделью Сопротивления."
 ps_ark_market:0 "Ковчег-рынок"
 ps_ark_market_desc:0 "Куда бы ни пришёл ковчег, вокруг него вырастает базар."
 ps_ark_ghost:0 "Ковчег-призрак"
 ps_ark_ghost_desc:0 "Ковчег приходит без огней и уходит без следа."
 ps_ark_contraband:0 "Стоянка Синдиката"
 ps_ark_contraband_desc:0 "Рядом встал лагерем ковчег Синдиката: на улицах контрабанда, в подворотнях — агитаторы."
 ps_ark_aid:0 "Помощь ковчега"
 ps_ark_aid_desc:0 "Союзный ковчег Синдиката делится припасами, врачами и инструкторами."
 ps.5.name:0 "Ковчег Сопротивления"
 ps.5.desc:0 "В трюмах ковчега до сих пор хранятся партизанские карты, рации и первый Кодекс, переписанный от руки. Родного мира у нас больше нет, есть только корабль, сеть и долгий путь.\n\nСовет директоров собрался на мостике, чтобы решить, каким станет ковчег Синдиката."
 ps.5.a:0 "Крепостью. Пусть враг разобьётся о наши борта."
 ps.5.b:0 "Рынком. Где ковчег, там и деньги."
 ps.5.c:0 "Призраком. Нас не должно быть видно."
 ps.71.name:0 "Стоянка Сопротивления"
 ps.71.desc:0 "Ковчег встал лагерем у §Y[ps_ark_planet.GetName]§!. Не прошло и недели, как в местных портах появились наши люди: одни раздают припасы друзьям, другие торгуют тем, что запрещено.\n\nПока ковчег стоит, каждая чужая колония в системе работает на Синдикат."
 ps.71.a:0 "Разбить лагерь."

 # ===== Восстания =====
 operation_ps_sow_dissent:0 "Посеять смуту"
 operation_ps_sow_dissent_desc:0 "Агитаторы Синдиката раскачивают одну из планет цели. Планета получает §R-15§! стабильности на 5 лет, и там легче вспыхивает восстание."
 operation_ps_arm_rebels:0 "Вооружить повстанцев"
 operation_ps_arm_rebels_desc:0 "Тайно передать оружие уже идущему восстанию в империи цели: §G+20§! к прогрессу восстания, внешняя поддержка (§G+2§! в месяц) и ослабленный гарнизон. При победе планета может перейти к нам."
 operation_ps_spark_uprising:0 "Поднять восстание"
 operation_ps_spark_uprising_desc:0 "Превратить недовольство на нестабильной планете цели в открытое восстание под нашим покровительством."
 operation_ps_supply_rebels:0 "Снабдить свободный мир"
 operation_ps_supply_rebels_desc:0 "Отправить оружие, сплавы и инструкторов государству, которое возникло после восстания при нашей поддержке."
 operation_ps_no_planets:0 "У цели нет планет, кроме столицы."
 operation_ps_no_revolt:0 "В империи цели сейчас нет восстания."
 operation_ps_no_unstable_planet:0 "У цели нет нестабильных планет (стабильность ниже §Y40§!, не столица)."
 operation_ps_already_supplied:0 "Этот свободный мир уже получает наше снабжение."

 ps_revolt.1.name:0 "Агитаторы на месте"
 ps_revolt.1.desc:0 "Наши люди обосновались в портах и общежитиях §Y[target.GetName]§!. Они слушают, о чём ворчат рабочие, и запоминают имена самых злых."
 ps_revolt.1.a:0 "Пусть ворчат громче."
 ps_revolt.2.name:0 "Смута"
 ps_revolt.2.desc:0 "На §Y[ps_revolt_planet.GetName]§! начались стихийные митинги. Листовки Синдиката в каждом подъезде, а полиция не знает, кого арестовывать."
 ps_revolt.2.a:0 "Отличная работа."
 ps_revolt.2.a.tooltip:0 "§Y[ps_revolt_planet.GetName]§! получает §RСмуту§! на 5 лет. Если планета восстанет, Синдикат будет считаться её покровителем."
 ps_revolt.3.name:0 "Связь с повстанцами"
 ps_revolt.3.desc:0 "Наши связные вышли на штаб восстания в империи §Y[target.GetName]§!. Повстанцы не доверяют чужакам, но оружие им нужнее гордости."
 ps_revolt.3.a:0 "Продолжайте."
 ps_revolt.4.name:0 "Тайные конвои"
 ps_revolt.4.desc:0 "Контейнеры с «сельхозтехникой» идут через три подставные компании. Таможня ничего не заметила."
 ps_revolt.4.a:0 "Ускорить поставки."
 ps_revolt.5.name:0 "Оружие доставлено"
 ps_revolt.5.desc:0 "Повстанцы на §Y[ps_revolt_planet.GetName]§! получили оружие Синдиката. Теперь это не толпа, а армия."
 ps_revolt.5.a:0 "Свобода или смерть."
 ps_revolt.5.a.tooltip:0 "Восстание на §Y[ps_revolt_planet.GetName]§!: §G+20§! к прогрессу, мы становимся его §Yвнешней поддержкой§! (§G+2§! в месяц), гарнизон ослаблен на 3 года. При победе планета может перейти к нам, а если станет независимой — получит щедрый бафф."
 ps_revolt.6.name:0 "Ячейки на планете"
 ps_revolt.6.desc:0 "Мы ищем самую неспокойную планету империи §Y[target.GetName]§! и людей, готовых повести за собой остальных."
 ps_revolt.6.a:0 "Ищите дальше."
 ps_revolt.7.name:0 "Подготовка"
 ps_revolt.7.desc:0 "Склады оружия, явки, маршруты отхода, сигнал к выступлению. Всё как учили предки."
 ps_revolt.7.a:0 "Ждём сигнала."
 ps_revolt.8.name:0 "Восстание!"
 ps_revolt.8.desc:0 "На §Y[ps_revolt_planet.GetName]§! горят правительственные здания. Партизаны захватили узлы связи и объявили о создании народного совета."
 ps_revolt.8.a:0 "Леса снова горят, теперь у них."
 ps_revolt.8.a.tooltip:0 "На §Y[ps_revolt_planet.GetName]§! начинается §Rвосстание§! (vanilla-ситуация «Восстание на планете») под нашим покровительством: §G+20§! к прогрессу, внешняя поддержка, §RСмута§! и §RВооружённое подполье§!."
 ps_revolt.10.name:0 "Конвой в свободный мир"
 ps_revolt.10.desc:0 "Транспорты Синдиката везут сплавы, оружие и инструкторов в §Y[target.GetName]§!."
 ps_revolt.10.a:0 "Полный ход."
 ps_revolt.11.name:0 "Снабжение доставлено"
 ps_revolt.11.desc:0 "Молодое государство §Y[target.GetName]§! получило всё необходимое, чтобы отстоять свободу."
 ps_revolt.11.a:0 "Держитесь, товарищи."
 ps_revolt.41.name:0 "Свободный мир"
 ps_revolt.41.desc:0 "Восстание, которое мы поддерживали, победило. Над §Y[ps_revolt_planet.GetName]§! поднят флаг нового государства §Y[ps_rebel_state.GetName]§!, и его лидеры знают, кому обязаны свободой."
 ps_revolt.41.a:0 "Добро пожаловать в сеть."
 ps_revolt.41.a.tooltip:0 "§Y[ps_rebel_state.GetName]§! получает §GОсвобождённый мир§! на 20 лет и ресурсы, относится к нам на §G+200§! лучше и на 10 лет §Gохотно примет вассалитет Синдиката§!."

 ps_sown_dissent:0 "Смута"
 ps_sown_dissent_desc:0 "Агитаторы Синдиката раскачивают планету."
 ps_armed_underground:0 "Вооружённое подполье"
 ps_armed_underground_desc:0 "У подполья есть оружие, а гарнизон не уверен в своей победе."
 ps_liberated_state:0 "Освобождённый мир"
 ps_liberated_state_desc:0 "Молодое государство, рождённое восстанием при поддержке Синдиката."
 ps_rebel_supplies:0 "Снабжение Синдиката"
 ps_rebel_supplies_desc:0 "Оружие, сплавы и инструкторы от Синдиката Сопротивления."
 opinion_ps_liberators:0 "Освободители"
 edict_ps_liberation_fund:0 "Фонд освобождения"
 edict_ps_liberation_fund_desc:0 "Ежегодно поддерживает §Yкаждое§! восстание в империях, с которыми у нас есть контакт (кроме союзников и вассалов): §G+10§! к прогрессу и внешняя поддержка (§G+2§! в месяц). Стоит §Y150§! энергии в год за каждое восстание."

 ps_cell_holding_slots:0 "Ячейка Синдиката"
 ps_cell_holding_slots_desc:0 "Вассал партизанского сюзерена: дополнительные слоты для владений сюзерена на планетах."

 # ===== Диверсии (идеи Skullduggery) =====
 operation_ps_liquidation:0 "Ликвидация"
 operation_ps_liquidation_desc:0 "Партизанский суд вынес приговор одному из лидеров цели. Исполнители уже в пути."
 operation_ps_armed_uprising:0 "Вооружённый бунт"
 operation_ps_armed_uprising_desc:0 "Раздать оружие недовольным на нестабильной планете цели. Отряды повстанцев вступают в §Rназемный бой§! с гарнизоном, а планета получает «Вооружённое подполье»."
 operation_ps_general_strike:0 "Всеобщая забастовка"
 operation_ps_general_strike_desc:0 "Профсоюзы, подкупленные Синдикатом, останавливают планету цели: §R-50%§! производства на год."
 operation_ps_radio_liberty:0 "Радио «Свобода»"
 operation_ps_radio_liberty_desc:0 "Пиратская станция вещает на планету цели: население разочаровывается в правительстве и быстрее меняет взгляды."
 operation_ps_infrastructure_sabotage:0 "Подрыв инфраструктуры"
 operation_ps_infrastructure_sabotage_desc:0 "Взорвать подстанции, мосты и транспортные узлы на планете цели."
 operation_ps_hijack_squadron:0 "Угон эскадры"
 operation_ps_hijack_squadron_desc:0 "Завербованные экипажи уводят часть флота цели под флаг Синдиката (около §Y5%§! её вместимости флота)."
 operation_ps_no_restless_planet:0 "У цели нет неспокойных планет (стабильность ниже §Y50§!, не столица)."
 operation_ps_hijack_cooldown:0 "У этой империи недавно уже угнали эскадру."
 NAME_ps_partisan_insurgents:0 "Повстанцы"
 NAME_ps_partisan_detachment:0 "Партизанский отряд"
 ps_partisan_insurgent:0 "Партизанский отряд"
 ps_partisan_insurgent_plural:0 "Партизанские отряды"
 ps_partisan_insurgent_desc:0 "Вооружённые Синдикатом повстанцы."

 ps_sabotage.5.name:0 "Наблюдение"
 ps_sabotage.5.desc:0 "Агенты изучают цель: расписания, охрану, слабые места."
 ps_sabotage.5.a:0 "Продолжайте."
 ps_sabotage.1.name:0 "Приговор"
 ps_sabotage.1.desc:0 "Партизанский суд рассмотрел дело. Осталось найти подходящий момент."
 ps_sabotage.1.a:0 "Ждите момента."
 ps_sabotage.2.name:0 "Приговор приведён в исполнение"
 ps_sabotage.2.desc:0 "Империя §Y[target.GetName]§! лишилась одного из своих лидеров. Официальная версия — несчастный случай."
 ps_sabotage.2.a:0 "Так будет с каждым."
 ps_sabotage.2.a.tooltip:0 "Погибает §Y[ps_liquidation_target.GetName]§!."
 ps_sabotage.3.name:0 "Оружие для недовольных"
 ps_sabotage.3.desc:0 "Склады оружия заложены, командиры отрядов выбраны. Осталось дать сигнал."
 ps_sabotage.3.a:0 "Готовьтесь."
 ps_sabotage.4.name:0 "Бунт!"
 ps_sabotage.4.desc:0 "На §Y[ps_revolt_planet.GetName]§! вооружённые отряды атакуют гарнизон."
 ps_sabotage.4.a:0 "Вперёд, товарищи!"
 ps_sabotage.4.a.tooltip:0 "На §Y[ps_revolt_planet.GetName]§! появляются §R3–6 партизанских отрядов§! и начинается наземный бой. Планета получает «Вооружённое подполье», а Синдикат становится покровителем будущего восстания."
 ps_sabotage.6.name:0 "Планета встала"
 ps_sabotage.6.desc:0 "На §Y[ps_strike_planet.GetName]§! остановились заводы, шахты и порты. Забастовочный комитет требует невозможного."
 ps_sabotage.6.a:0 "Пусть стоят."
 ps_sabotage.7.name:0 "В эфире — радио «Свобода»"
 ps_sabotage.7.desc:0 "Пиратская станция вещает на §Y[ps_radio_planet.GetName]§!: новости, которые не покажет местное ТВ, и песни, которые запрещены."
 ps_sabotage.7.a:0 "Громче."
 ps_sabotage.8.name:0 "Взрывы"
 ps_sabotage.8.desc:0 "На §Y[ps_blast_planet.GetName]§! одновременно взлетели на воздух подстанция, мост и транспортный узел."
 ps_sabotage.8.a:0 "Чисто сработано."
 ps_sabotage.9.name:0 "Вербовка экипажей"
 ps_sabotage.9.desc:0 "Мы нашли офицеров флота §Y[target.GetName]§!, которым не платят вовремя."
 ps_sabotage.9.a:0 "Предложите им больше."
 ps_sabotage.10.name:0 "Эскадра наша"
 ps_sabotage.10.desc:0 "Ночью несколько кораблей §Y[target.GetName]§! покинули док и ушли к нам. Их капитаны теперь служат Синдикату."
 ps_sabotage.10.a:0 "Добро пожаловать на борт."
 ps_sabotage.10.a.tooltip:0 "Мы получаем эскадру около §Y5%§! вместимости флота §Y[target.GetName]§!. Цель теряет сплавы."
 ps_sabotage.20.name:0 "Вооружённый бунт"
 ps_sabotage.20.desc:0 "На §Y[Root.GetName]§! вооружённые повстанцы атакуют наш гарнизон. Откуда у них оружие — неизвестно."
 ps_sabotage.20.a:0 "Подавить!"
 ps_sabotage.21.name:0 "Угнанная эскадра"
 ps_sabotage.21.desc:0 "Несколько наших кораблей покинули док без приказа и исчезли. Экипажи, по всей видимости, были подкуплены."
 ps_sabotage.21.a:0 "Предатели!"

 ps_general_strike:0 "Всеобщая забастовка"
 ps_general_strike_desc:0 "Заводы, шахты и порты стоят."
 ps_radio_liberty:0 "Радио «Свобода»"
 ps_radio_liberty_desc:0 "Население слушает запрещённую станцию."
 ps_infrastructure_damage:0 "Разрушенная инфраструктура"
 ps_infrastructure_damage_desc:0 "Подстанции, мосты и транспортные узлы восстанавливаются."

 building_ps_resistance_hq:0 "Штаб Сопротивления"
 building_ps_resistance_hq_desc:0 "Сердце партизанской сети. Чем больше у Синдиката соперников, тем больше людей приходит под его знамёна: §G+10§! единства и §G+0.5§! влияния за каждого соперника."
 building_ps_intelligence_ministry:0 "Министерство разведки"
 building_ps_intelligence_ministry_desc:0 "Собирает сведения обо всех известных империях: разведданные растут с числом контактов."
 building_ps_liberation_committee:0 "Комитет освобождения"
 building_ps_liberation_committee_desc:0 "Координирует поддержку восстаний по всей галактике."
 building_ps_partisan_academy:0 "Академия партизан"
 building_ps_partisan_academy_desc:0 "Готовит командиров и бойцов по наставлениям Сопротивления."
