 decision_ps_found_planet_cell:0 "Основать ячейку на планете"
 decision_ps_found_planet_cell_desc:0 "Синдикат отправляет поселенцев на свободную пригодную планету в наших границах. Там возникает новое государство — наш вассал."
 decision_ps_found_planet_cell_tooltip:0 "На свободной пригодной планете в наших границах появляется §Yновое государство§! нашего вида с §Y3§! группами поселенцев. Оно становится нашим вассалом со специализацией из §YДоктрины заселения§! (без доктрины — §YРежим-клиент§!), получает стартовые ресурсы, §GОсвобождённый мир§! и §G+200§! к отношению к нам.\nПовторить можно через 3 года."
 decision_ps_release_planet_cell:0 "Выделить планету в ячейку"
 decision_ps_release_planet_cell_desc:0 "Эта колония становится отдельным государством — нашим вассалом, вместе со всем населением и постройками."
 decision_ps_release_planet_cell_tooltip:0 "Планета со всем населением переходит §Yновому государству§!. Оно становится нашим вассалом со специализацией из §YДоктрины заселения§! (без доктрины — §YРежим-клиент§!), получает стартовые ресурсы и §G+200§! к отношению к нам.\nПовторить можно через 3 года."
 decision_ps_planet_cell_cooldown:0 "Ячейку на планете недавно уже основывали (раз в 3 года)."
 decision_ps_no_free_planet:0 "В наших границах нет §Yсвободной пригодной планеты§!."
 ps_mega.8.name:0 "Новая ячейка"
 ps_mega.8.desc:0 "На §Y[ps_seed_world.GetName]§! поднят флаг нового государства — §Y[ps_new_cell.GetName]§!. Его совет присягнул Синдикату."
 ps_mega.8.a:0 "Сеть растёт."
