 # ===== Ковчег: высадка ячейки =====
 decision_ps_ark_seed_cell:0 "Высадить ячейку"
 decision_ps_ark_seed_cell_desc:0 "Часть экипажа ковчега остаётся на свободной планете в системе, где стоит лагерем ковчег, и основывает новое государство — вассала Синдиката."
 decision_ps_ark_seed_cell_tooltip:0 "На свободной пригодной планете в системе стоящего ковчега появляется §Yновое государство§! с нашим видом. Оно становится нашим вассалом (§YРежим-клиент§!), получает стартовые ресурсы, §GОсвобождённый мир§! на 20 лет и §G+200§! к отношению к нам.\nПовторить можно через 5 лет."
 decision_ps_ark_seed_cooldown:0 "Ковчег недавно уже высаживал ячейку (раз в 5 лет)."
 decision_ps_ark_no_camp_world:0 "Ковчег должен стоять лагерем в ничейной или нашей системе со §Yсвободной пригодной планетой§!."
 ps_ark.11.name:0 "Новая ячейка"
 ps_ark.11.desc:0 "Шлюзы ковчега открылись над §Y[ps_cell_world.GetName]§!. Добровольцы, семьи, инструкторы и запасы на первые годы. Здесь родилось новое государство — §Y[ps_new_cell.GetName]§!, и его первый совет поклялся в верности Синдикату.\n\nКовчег уходит дальше. Ячейка остаётся."
 ps_ark.11.a:0 "Сеть растёт."
 ps_ark_cell_founding:0 "Ячейка ковчега"
 ps_ark_cell_founding_desc:0 "Молодая колония, основанная экипажем ковчега Синдиката."

 # ===== Кризис конца игры: Красная Буря =====
 situation_ps_red_storm:0 "Красная Буря"
 situation_ps_red_storm_type:0 "Красная Буря"
 situation_ps_red_storm_desc:0 "Мы — восстание, которое не остановилось. Свергнув своих хозяев, мы несём революцию соседям: одну империю за другой. С каждой победой Буря становится сильнее."
 situation_ps_red_storm_monthly_change_tooltip:0 "Буря растёт со временем, быстрее во время войны и когда у нас больше 10 планет. Каждая выигранная война даёт §G+20§!."
 ps_storm_level_1:0 "Восстание"
 ps_storm_level_1_desc:0 "Восставшие держатся и бьют своих хозяев."
 ps_storm_level_2:0 "Революция"
 ps_storm_level_2_desc:0 "Буря укрепилась и смотрит на соседей."
 ps_storm_level_3:0 "Буря"
 ps_storm_level_3_desc:0 "Армии Бури прошли через несколько империй."
 ps_storm_level_4:0 "Красный рассвет"
 ps_storm_level_4_desc:0 "Буря — одна из сильнейших держав галактики."
 ps_storm_level_5:0 "Конец старого мира"
 ps_storm_level_5_desc:0 "Буря на пике силы. Ни одна империя не устоит в одиночку."
 ps_storm_approach_world_revolution:0 "Мировая революция"
 ps_storm_approach_world_revolution_desc:0 "Назад дороги нет."
 ps_storm_progress_war:0 "Война"
 ps_storm_progress_size:0 "Большая держава (более 10 планет)"

 operation_ps_red_storm:0 "Красная Буря"
 operation_ps_red_storm_desc:0 "§RКризис конца игры.§! Поднять в империи цели восстание, которое не остановится. Восставшие получат несколько неспокойных планет, четверть флота хозяина и армии, а затем объявят хозяину войну. Свергнув его, §RКрасная Буря§! начнёт по одному объявлять войну соседям — всем, кроме партизанских империй игроков и их вассалов.\n\nМожно запускать сколько угодно раз: каждая Буря ведёт свои войны."
 operation_ps_red_storm_too_early:0 "Возможно только после §Y50-го§! года."
 operation_ps_red_storm_tech:0 "Нужна технология §YПризрачные сети§!."
 operation_ps_red_storm_small:0 "У цели должно быть больше §Y4§! планет."
 operation_ps_red_storm_partisan:0 "Нельзя поднять Бурю против партизанской империи игрока или её вассала."
 NAME_ps_red_storm:0 "Красная Буря"
 opinion_ps_red_storm:0 "Красная Буря"
 cb_ps_red_storm:0 "Красная Буря"
 cb_ps_red_storm_desc:0 "Буря несёт революцию соседям."
 wg_ps_red_storm:0 "Мировая революция"
 wg_ps_red_storm_desc:0 "Красная Буря несёт революцию этой империи."
 wg_ps_red_storm_accept:0 "Все планеты, занятые Бурей, переходят к ней. Буря становится сильнее."

 ps_storm_liberated_world:0 "Освобождённый Бурей"
 ps_storm_liberated_world_desc:0 "Этот мир поднял красный флаг."
 ps_storm_survivors:0 "Пережившие Бурю"
 ps_storm_survivors_desc:0 "Красная Буря утихла, и галактика начинает отстраиваться."

 ps_storm.1.name:0 "Красная Буря"
 ps_storm.1.desc:0 "Всё готово. Наши люди во всех городах §Y[target.GetName]§!, оружие на складах, флотские экипажи ждут сигнала."
 ps_storm.1.a:0 "Поднимайте Бурю."
 ps_storm.1.a.tooltip:0 "На §Y[ps_storm_cradle.GetName]§! вспыхивает восстание: рождается §RКрасная Буря§!. Она забирает до 5 планет и четверть флота §Y[target.GetName]§! и объявляет хозяину войну. После его падения Буря пойдёт на соседей, но §Gнас и наших вассалов не тронет§!."
 ps_storm.2.name:0 "Рождение Красной Бури"
 ps_storm.2.desc:0 "В империи §Y[ps_storm_host.GetName]§! вспыхнуло восстание, которого галактика ещё не видела. Мятежники захватили несколько миров, на их сторону перешла часть флота, и они провозгласили §RКрасную Бурю§!. Аналитики предупреждают: свергнув хозяев, Буря пойдёт дальше."
 ps_storm.2.desc.host:0 "Наши миры восстали! Мятежники захватили несколько планет, четверть флота перешла на их сторону, и они провозгласили §RКрасную Бурю§!. Они уже объявили нам войну."
 ps_storm.2.a:0 "Её нужно остановить."
 ps_storm.4.name:0 "Красная Буря крепнет"
 ps_storm.4.desc:0 "§Y[ps_storm.GetName]§! стала сильнее: её армии и флоты растут с каждой победой."
 ps_storm.4.a:0 "Тревожно."
 ps_storm.6.name:0 "Буря идёт к нам"
 ps_storm.6.desc:0 "§Y[ps_storm.GetName]§! объявила нам войну. Её агитаторы уже на наших улицах, а флоты — у наших границ."
 ps_storm.6.a:0 "К оружию!"
 ps_storm.7.name:0 "Буря выбрала новую цель"
 ps_storm.7.desc:0 "§Y[ps_storm.GetName]§! объявила войну империи §Y[ps_storm_next.GetName]§!."
 ps_storm.7.a:0 "Кто следующий?"
 ps_storm.8.name:0 "Буря победила"
 ps_storm.8.desc:0 "§Y[ps_storm.GetName]§! одержала победу над §Y[ps_storm_loser.GetName]§! и забрала все занятые миры. Буря стала ещё сильнее."
 ps_storm.8.a:0 "Её нужно остановить."
 ps_storm.51.name:0 "Буря утихла"
 ps_storm.51.desc:0 "Красная Буря уничтожена. Её флаги сорваны, её армии разбиты. Галактика выстояла, и выжившие начинают отстраиваться."
 ps_storm.51.a:0 "Мы выжили."

 # ===== Пиратские модули стоянок (идея Corporate Pirates) =====
 sm_waystation_ps_pirate_hideout:0 "Логово каперов"
 sm_waystation_ps_pirate_hideout_plural:0 "Логова каперов"
 sm_waystation_ps_pirate_hideout_desc:0 "Партизаны-каперы Синдиката «собирают дань» с чужих колоний в системе. Работает как ванильное пиратское логово.\n\n§YДоступно партизанским империям.§!"
 sm_waystation_ps_concealment_field:0 "Поле маскировки Синдиката"
 sm_waystation_ps_concealment_field_plural:0 "Поля маскировки Синдиката"
 sm_waystation_ps_concealment_field_desc:0 "Прячет стоянку от чужих сенсоров.\n\n§YДоступно партизанским империям.§!"
 sm_waystation_ps_reaver_stronghold:0 "Цитадель каперов"
 sm_waystation_ps_reaver_stronghold_plural:0 "Цитадели каперов"
 sm_waystation_ps_reaver_stronghold_desc:0 "Главная крепость каперской сети Синдиката. Одна на империю; удваивает добычу всех Логов каперов.\n\n§YДоступно партизанским империям.§!"
 decision_ps_mega_doctrine:0 "Доктрина заселения"
 decision_ps_mega_doctrine_desc:0 "Какой вассал будет основан на новых мирах: на мегаструктурах (кольцевые миры, хабитаты, а с Gigastructures — секции Frameworld, аркологии, диски Альдерсона и др.) и на планетах (решения §YОсновать ячейку на планете§! и §YВыделить планету в ячейку§!)."
 decision_ps_mega_doctrine_tooltip:0 "Выбрать, какой §Yспециализированный вассал§! автоматически заселит новые миры мегаструктур."
 ps_mega.1.name:0 "Доктрина заселения"
 ps_mega.1.desc:0 "Выберите специализацию будущих вассалов.\n\n§YМегаструктуры:§! когда наша мегаструктура достроена и в её системе появились свободные пригодные миры, их сразу занимает новое государство нашего вида — наш вассал.\n§YПланеты:§! решение на столице §YОсновать ячейку на планете§! заселяет свободную пригодную планету в наших границах, а решение §YВыделить планету в ячейку§! превращает нашу колонию в вассала.\n\nНовые ячейки получают стартовые ресурсы, §GОсвобождённый мир§! и §G+200§! к отношению к нам. Без доктрины — §YРежим-клиент§!."
