 ps_mega.1.trust:0 "$specialist_ps_trust$"
 ps_mega.1.devotee:0 "$specialist_ps_devotee$"
 ps_mega.1.client:0 "Режим-клиент (обычная ячейка)"
 ps_mega.1.off:0 "Отключить заселение"
 ps_mega.1.close:0 "Оставить как есть"
 ps_mega.7.name:0 "Ячейка в мегаструктуре"
 ps_mega.7.desc:0 "Едва затихли сварочные лучи, транспорты Синдиката высадили поселенцев на §Y[ps_mega_world.GetName]§!. Так родилось государство §Y[ps_new_cell.GetName]§! — наш новый вассал."
 ps_mega.7.a:0 "Сталь и верность."
 decision_ps_shadow_logistics_on:0 "Теневая логистика"
 decision_ps_shadow_logistics_on_desc:0 "Строители, инженерные суда и корабли снабжения сами включают маскировку, как только могут."
 decision_ps_shadow_logistics_on_tooltip:0 "§G+1§! к силе маскировки кораблей, §R-5%§! к скорости.\nКаждый месяц наши строители и корабли снабжения с силой маскировки больше 0 §Yвключают маскировку§!."
 decision_ps_shadow_logistics_off:0 "Отключить теневую логистику"
 decision_ps_shadow_logistics_off_desc:0 "Вернуть строителей и корабли снабжения к открытому режиму."
 decision_ps_shadow_logistics_off_tooltip:0 "Снимает модификатор и отключает маскировку у строителей и кораблей снабжения."
 ps_shadow_logistics:0 "Теневая логистика"
 ps_shadow_logistics_desc:0 "Строители и снабженцы Синдиката ходят под маскировкой."
 ps_shadow_gate:0 "Теневые врата"
 ps_shadow_gate_DESC:0 "Перешитые контрабандистами врата: тайный проход в изнанку пространства. Корабли Синдиката и его вассалов мгновенно переходят между любыми Теневыми вратами."
 ps_shadow_gate_MEGASTRUCTURE_DETAILS:0 "Постоянный проход ко всем другим Теневым вратам. Пользоваться могут партизанские империи, их вассалы и союзники; врагам вход закрыт. Строится вне гравитационного колодца."
 NAME_ps_shadow_gate:0 "Теневые врата"
 ps_shadow_gate_already_here:0 "$TRIGGER_FAIL$В этой системе уже есть Теневые врата."
 PS_SHADOW_GATE:0 "Теневые врата"
 PS_SHADOW_GATE_GALACTIC:0 "Теневые врата"
 PS_SHADOW_GATE_GALACTIC_DESC:0 "Ведут к любым другим Теневым вратам Синдиката."
 PS_SHADOW_GATE_CANT_USE:0 "Тайными проходами Синдиката пользуются только партизаны, их вассалы и союзники (федерация или оборонительный пакт). Врагам вход закрыт."
 tradition_ps_imperious:0 "Имперская"
 tradition_ps_imperious_desc:0 "Наша власть — ось, вокруг которой вращается галактика. Все пути ведут в [Root.Capital.GetName]."
 tr_ps_imperious_adopt:0 "Имперская традиция"
 tr_ps_imperious_adopt_desc:0 "Вассалы — не союзники, а провинции. Открывает повестку совета «Наместники в вассалах»; +200 влияния."
 tr_ps_imperious_finish:0 "Имперская традиция: завершение"
 tr_ps_imperious_finish_desc:0 "Империя построена."
 tr_ps_imperious_tributary_networks:0 "Сеть данников"
 tr_ps_imperious_tributary_networks_delayed:0 "Дань течёт в столицу по сотне каналов — и каждый из них ведёт отчётность."
 tr_ps_imperious_imperial_administration:0 "Имперская администрация"
 tr_ps_imperious_imperial_administration_delayed:0 "Чиновники сюзерена сидят в каждом министерстве вассала."
 tr_ps_imperious_imperial_administration_effects:0 "Открывает политику §YКурс сюзерена§!."
 tr_ps_imperious_imperial_decree:0 "Имперский указ"
 tr_ps_imperious_imperial_decree_delayed:0 "Слово сюзерена — закон для каждого вассала."
 tr_ps_imperious_imperial_decree_effects:0 "Открывает §YИмперские указы§! вассалам: §YДань§!, §YМобилизация§!, §YРазвитие§!."
 tr_ps_imperious_diplomatic_supremacy:0 "Дипломатическое превосходство"
 tr_ps_imperious_diplomatic_supremacy_delayed:0 "Когда говорит сюзерен, галактика слушает."
 tr_ps_imperious_supreme_authority:0 "Верховная власть"
 tr_ps_imperious_supreme_authority_delayed:0 "Флоты вассалов — это наши флоты."
 policy_ps_overlord_stance:0 "Курс сюзерена"
 policy_ps_overlord_stance_desc:0 "Как мы обращаемся со своими вассалами."
 ps_overlord_stance:0 "Курс сюзерена"
 ps_overlord_stance_desc:0 "Как мы обращаемся со своими вассалами."
 ps_overlord_stance_equitable:0 "Равноправие"
 ps_overlord_stance_equitable_desc:0 "Вассалы — младшие партнёры. Никаких особых требований и привилегий."
 ps_overlord_stance_benevolence:0 "Покровительство"
 ps_overlord_stance_benevolence_desc:0 "Мы делимся с вассалами знаниями и ресурсами в обмен на преданность."
 ps_overlord_stance_acculturation:0 "Ассимиляция"
 ps_overlord_stance_acculturation_desc:0 "Вассалы постепенно перенимают нашу культуру и законы."
 ps_overlord_stance_cruel:0 "Жёсткая рука"
 ps_overlord_stance_cruel_desc:0 "Вассалы существуют, чтобы служить. Их недовольство — не наша забота."
 agenda_ps_vassal_legates:0 "Наместники в вассалах"
 agenda_ps_vassal_legates_desc:0 "Совет отправляет наместников во все вассальные государства."
 council_agenda_agenda_ps_vassal_legates_name:0 "Наместники в вассалах"
 council_agenda_agenda_ps_vassal_legates_desc:0 "При запуске все вассалы получают §G+5§! к стабильности на 10 лет."
 agenda_ps_vassal_legates_finish:0 "Наместники в вассалах"
 agenda_ps_vassal_legates_subjects:0 "Имперские наместники"
 ps_decree_mobilized:0 "Имперская мобилизация"
 ps_decree_mobilized_desc:0 "Сюзерен приказал поставить флот и армию под ружьё."
 ps_decree_development:0 "Имперская программа развития"
 ps_decree_development_desc:0 "Сюзерен финансирует стройки и порядок на наших мирах."
 edict_ps_decree_tribute:0 "Указ: Дань"
 edict_ps_decree_tribute_desc:0 "Каждый вассал единовременно платит дань из своих запасов."
 edict_ps_decree_tribute_tooltip:0 "Каждый вассал платит §Y300§! энергии, §Y300§! минералов, §Y200§! еды, §Y100§! товаров и §Y100§! сплавов (каждый ресурс — если у вассала его хотя бы вдвое больше)."
 edict_ps_decree_mobilization:0 "Указ: Мобилизация"
 edict_ps_decree_mobilization_desc:0 "Все вассалы ставят флот и армию под ружьё на 10 лет."
 edict_ps_decree_mobilization_tooltip:0 "Все вассалы на 10 лет получают §YИмперскую мобилизацию§!: §G+10%§! к скорострельности, урону армий и вместимости флота."
 edict_ps_decree_development:0 "Указ: Развитие"
 edict_ps_decree_development_desc:0 "Сюзерен финансирует стройки на мирах вассалов."
 edict_ps_decree_development_tooltip:0 "Все планеты вассалов на 10 лет получают §YИмперскую программу развития§!: §G+25%§! к скорости строительства, §G+5§! к стабильности, §G+5%§! к выработке рабочих мест."
 ps_decree_requires_subjects:0 "Нужен хотя бы один вассал."
