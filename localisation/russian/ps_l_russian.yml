l_russian:
 # ===== Общее =====
 civic_tooltip_ps_requires_megacorp:0 "Требуется §YКорпоративная§! власть (мегакорпорация)"
 civic_tooltip_ps_requires_criminal_heritage:0 "Требуется цивик §YКриминальное наследие§!"

 # ===== Происхождение =====
 origin_ps_partisan_legacy:0 "Наследие Сопротивления"
 origin_ps_partisan_legacy_desc:0 "Когда-то на наш родной мир пришли оккупанты. Армии сдались, правительства бежали, но в лесах и горах поднялись партизаны. Они пускали под откос эшелоны, жгли склады и держались там, где держаться было невозможно.\n\nВойна давно закончилась, а сеть так и не распалась. Связные стали контрабандистами, командиры отрядов — теневыми директорами, а старый партизанский Кодекс — уставом Синдиката. Теперь эта сеть уходит к звёздам."
 origin_tooltip_ps_partisan_legacy_effects:0 "£unity£ Начинает сюжетную цепочку §YНаследие Сопротивления§! (выбор Кодекса на старте).\n- Шифрование: §G+1§!\n- Урон армий: §G+10%§!\n- Посланники: §G+1§!\n- Открывает §YСпециализированных вассалов§!, §YПартизанскую войну§!, §YАгентурные операции§! и партизанские здания филиалов."

 # ===== Цивики =====
 civic_ps_partisan_network:0 "Партизанская сеть"
 civic_ps_partisan_network_desc:0 "Каждый филиал корпорации — это ещё и явка. Каждый курьер — связной. Корпорация помнит, как воевать без армии."
 civic_tooltip_ps_partisan_network_effects:0 "- Дешифровка: §G+1§!\n- Посланники: §G+1§!\n- Урон армий: §G+15%§!\n- Открывает здания филиалов §YПартизанская ячейка§! и §YПодпольная типография§!\n- Открывает §YАгентурные операции§! и §YПартизанскую войну§!"

 civic_ps_shadow_overlord:0 "Теневой сюзерен"
 civic_ps_shadow_overlord_desc:0 "Вассалы Синдиката — не просто данники. Каждый получает свою роль в общей сети: кто-то слушает, кто-то держит оборону, кто-то торгует, а кто-то изобретает."
 civic_tooltip_ps_shadow_overlord_effects:0 "- Посланники: §G+1§!\n- Шифрование: §G+1§!\n- Открывает §Y6 специализаций вассалов§! с прокачкой до III уровня: §YУдарный легион§!, §YШтурмовой корпус§!, §YКаперская флотилия§!, §YШпионская резидентура§!, §YТеневая биржа§!, §YРесурсный трест§!.\n- Открывает эдикт §YПрисяга Синдиката§! и операцию §YТайный переворот§!.\n- Открывает соглашение §YПартизанская франшиза§!."


 # ===== Эдикты =====
 edict_ps_sleeper_cells:0 "Спящие ячейки"
 edict_ps_sleeper_cells_desc:0 "По всей империи готовятся тайники и законсервированные отряды на случай вторжения."
 edict_ps_shadow_fleet:0 "Теневой флот"
 edict_ps_shadow_fleet_desc:0 "Корабли ходят без опознавательных огней по маршрутам контрабандистов."

 # ===== Технологии =====
 tech_ps_guerrilla_doctrine:0 "Партизанская доктрина"
 tech_ps_guerrilla_doctrine_desc:0 "Систематизация опыта Сопротивления: малые группы, удар и отход, опора на местное население."
 tech_ps_ghost_networks:0 "Призрачные сети"
 tech_ps_ghost_networks_desc:0 "Квантовые одноразовые шифры и агентура, которая не знает друг друга в лицо."

 # ===== Модификаторы =====
 ps_code_honor:0 "Кодекс чести"
 ps_code_honor_desc:0 "Синдикат помнит, за что воевали партизаны."
 ps_code_profit:0 "Кодекс прибыли"
 ps_code_profit_desc:0 "Сеть должна кормить себя сама."
 ps_code_silence:0 "Кодекс молчания"
 ps_code_silence_desc:0 "Сеть жива, пока её не видно."
 ps_legacy_liberator:0 "Синдикат-Освободитель"
 ps_legacy_liberator_desc:0 "Мы — наследники партизан, а не их оккупантов."
 ps_legacy_master:0 "Синдикат-Хозяин"
 ps_legacy_master_desc:0 "Сопротивление победило. Теперь сеть принадлежит нам."
 ps_partisan_harassment:0 "Партизанская война"
 ps_partisan_harassment_desc:0 "На оккупированных территориях действуют партизаны: засады, диверсии, исчезающие патрули."
 ps_sabotaged_shipyards:0 "Саботаж на верфях"
 ps_sabotaged_shipyards_desc:0 "Кто-то подменил калибровочные данные стапелей."
 ps_incited_unrest:0 "Подполье"
 ps_incited_unrest_desc:0 "Агенты Синдиката подогревают недовольство."
 ps_stolen_ledgers:0 "Украденные реестры"
 ps_stolen_ledgers_desc:0 "Бухгалтерия до сих пор не может свести баланс."

 opinion_ps_caught_spying:0 "Пойманный шпион"

 # ===== События: сюжет =====
 ps.1.name:0 "Архив Сопротивления"
 ps.1.desc:0 "В подвале старой штаб-квартиры хранится то, что Синдикат никому не показывает: потёртые карты лесов, списки отрядов, ржавые рации и первый вариант партизанского Кодекса, переписанный от руки.\n\nСовет директоров собрался, чтобы решить, каким будет Кодекс Синдиката теперь, когда сеть выходит за пределы родного мира."
 ps.1.a:0 "Кодекс чести. Мы помним, за что воевали."
 ps.1.b:0 "Кодекс прибыли. Сеть должна кормить себя."
 ps.1.c:0 "Кодекс молчания. Нас не должно быть видно."

 ps.2.name:0 "Тетрадь командира"
 ps.2.desc:0 "При сносе старого здания рабочие нашли замурованный тайник. В нём — тетрадь основателя сети, командира партизанского отряда. Шифрованные записи, координаты схронов, имена связных и последняя запись: «Когда война кончится, сеть не распускать. Оккупанты всегда возвращаются — под другими флагами»."
 ps.2.a:0 "Опубликовать. Пусть все знают, откуда мы."
 ps.2.b:0 "Вскрыть старые схроны."
 ps.2.c:0 "Засекретить. Только для совета."

 ps.3.name:0 "Последний приказ"
 ps.3.desc:0 "Расшифровщики закончили работу над последними страницами тетради командира. Это был приказ — не отрядам, а потомкам: решить, кем станет сеть, когда у неё будет сила целых звёздных систем.\n\nСовет понимает: сегодняшнее решение определит, чем Синдикат будет для галактики — щитом угнетённых или новым хозяином."
 ps.3.a:0 "Мы — освободители. Как наши предки."
 ps.3.b:0 "Мы победили. Теперь правила пишем мы."


 # ===== События: агентура =====
 ps.20.name:0 "Агентурный отчёт"
 ps.20.desc:0 "Наша шпионская сеть в §Y[ps_op_target.GetName]§! укоренилась достаточно глубоко. Резидент докладывает об уязвимости и ждёт приказа.\n\nЛюбая операция потребует пожертвовать частью агентуры."
 ps.20.a:0 "Украсть чертежи."
 ps.20.b:0 "Устроить диверсию на верфях."
 ps.20.c:0 "Поднять подполье."
 ps.20.d:0 "Обчистить их казну."
 ps.20.e:0 "Залечь на дно."
 ps.21.name:0 "Агент раскрыт"
 ps.21.desc:0 "Наш агент был схвачен контрразведкой. Операция провалена, а наши отношения с пострадавшими испорчены."
 ps.21.a:0 "Он ничего не скажет."
 ps.22.name:0 "Вражеский агент"
 ps.22.desc:0 "Наша контрразведка задержала агента, работавшего на иностранный синдикат. Следы ведут к §Y[From.GetName]§!."
 ps.22.a:0 "Мы этого не забудем."

 # ===== События: партизанская война =====
 ps.31.name:0 "Леса снова горят"
 ps.31.desc:0 "Враг занял §Y[ps_occupied_planet.GetName]§!, но не взял её. Старые схроны вскрыты, связные вышли на связь, и в первую же ночь у оккупантов исчез патруль.\n\nКак и века назад, сеть делает то, ради чего была создана."
 ps.31.a:0 "Ни шагу назад."
 ps.20.cost_10:0 "Уровень шпионской сети: §R-10§!"
 ps.20.cost_15:0 "Уровень шпионской сети: §R-15§!"
 ps.20.cost_20:0 "Уровень шпионской сети: §R-20§!"
 ps.20.e.tooltip:0 "Уровень шпионской сети: §G+5§!"

 # ===== Соглашение с вассалом =====
 preset_ps_partisan_franchise:0 "Партизанская франшиза"
 preset_ps_partisan_franchise_desc:0 "Вассал становится полноправной ячейкой сети: вступает во все войны сюзерена, делится сенсорами и платит умеренную дань."

 # ===== Вассалы: прокачка и рейды =====
 edict_ps_oath:0 "Присяга Синдиката"
 edict_ps_oath_desc:0 "Вассалы ежегодно приносят присягу сети. Их лояльность растёт на §G+1§! в месяц, поэтому специализация прокачивается быстрее."
 ps_oath_loyalty:0 "Присяга Синдиката"
 ps_oath_loyalty_desc:0 "Вассал присягнул сети Синдиката."
 ps_privateer_raids:0 "Каперские рейды"
 ps_privateer_raids_desc:0 "Каперы Синдиката грабят наши торговые пути и конвои."
 ps.15.name:0 "Каперы вышли на охоту"
 ps.15.desc:0 "Наши каперские флотилии получили приказ. Пока идёт война, каждый вражеский конвой — законная добыча, а доля в трофеях уходит в казну Синдиката."
 ps.15.a:0 "Доброй охоты."

 # ===== Операция: Тайный переворот =====
 operation_ps_puppet_coup:0 "Тайный переворот"
 operation_ps_puppet_coup_desc:0 "Подкупить и запугать совет цели, чтобы он стал марионеткой Синдиката. После успеха цель на 10 лет становится §Gочень расположенной§! к нам и охотно принимает вассалитет любого типа Синдиката."
 operation_ps_puppet_coup_not_subject:0 "Цель не должна быть чьим-либо вассалом."
 operation_ps_puppet_coup_too_big:0 "У цели должно быть меньше §Y10§! планет."
 operation_ps_puppet_coup_already:0 "Совет цели уже под нашим контролем."
 opinion_ps_puppet_council:0 "Марионеточный совет"
 ps_operation.1.name:0 "Связные в совете"
 ps_operation.1.desc:0 "Наши агенты нашли подход к нескольким советникам §Y[target.GetName]§!. Кто-то любит деньги, кто-то боится прошлого. Сеть начинает работу."
 ps_operation.1.a:0 "Продолжайте."
 ps_operation.2.name:0 "Компромат"
 ps_operation.2.desc:0 "Досье собраны. Половина совета подкуплена, вторая половина знает, что мы знаем. Осталось выбрать момент."
 ps_operation.2.a:0 "Ждём сигнала."
 ps_operation.3.name:0 "Ночь длинных ножей"
 ps_operation.3.desc:0 "За одну ночь совет §Y[target.GetName]§! сменил состав. Новые лица в правительстве помнят, кому обязаны своими креслами."
 ps_operation.3.a:0 "Предложите им покровительство."
 ps_operation.3.a.tooltip:0 "§Y[target.GetName]§! на 10 лет получает §YМарионеточный совет§!: §G+150§! к отношению к нам и §G+150§! к готовности принять вассалитет по любой специализации Синдиката."

 ps_branch_network_slots:0 "Сеть Синдиката"
 ps_branch_network_slots_desc:0 "Филиал партизанской сети: дополнительные слоты для зданий филиала."
