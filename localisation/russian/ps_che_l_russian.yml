l_russian:
 building_criminal_headquarters:0 "Криминальная штаб-квартира"
 building_criminal_headquarters_desc:0 "Планетарный штаб нашей корпорации. Его чиновники следят, чтобы местные власти не прикрыли наши операции."
 building_high_society_clubs:0 "Клубы высшего общества"
 building_high_society_clubs_desc:0 "Здесь богатые и знаменитые встречаются, общаются и занимаются тем, чем не стали бы заниматься на публике. Что происходит в этих клубах, остаётся в них… если только не всплывает."
 building_union_busting_lawfirm:0 "Юридическая фирма против профсоюзов"
 building_union_busting_lawfirm_desc:0 "Лучший способ заставить рабочих трудиться изо всех сил — не дать им узнать, сколько они стоят. Эти фирмы следят, чтобы рабочие объединялись ровно настолько, чтобы не вредить прибыли."
 building_unregulated_factories:0 "Нерегулируемые фабрики"
 building_unregulated_factories_desc:0 "Техника безопасности? Она только снижает выработку. Эти фабрики экономят на оборудовании и обучении и потому производят превосходно."
 building_unregulated_research_labs:0 "Нерегулируемые лаборатории"
 building_unregulated_research_labs_desc:0 "За право на патенты учёные могут ставить здесь любые опыты, которые им запрещают «этика» и «правила»."
 building_Xeno_Relations_bureau:0 "Бюро ксеноотношений"
 building_Xeno_Relations_bureau_desc:0 "Бюро управляет потоками информации не вполне законными методами и не делает из этого секрета."

 job_corrupt_bureaucrat:0 "Продажный чиновник"
 job_corrupt_bureaucrat_plural:0 "Продажные чиновники"
 job_corrupt_bureaucrat_desc:0 "Взятки, исчезающие улики, работа «кротом» — для этих людей нет ничего невозможного, был бы стимул."
 mod_job_corrupt_bureaucrat_add:0 "Должности: $job_corrupt_bureaucrat$"
