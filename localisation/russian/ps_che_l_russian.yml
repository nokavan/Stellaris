 job_corrupt_manager:0 "Продажный управляющий"
 job_corrupt_manager_plural:0 "Продажные управляющие"
 job_corrupt_manager_desc:0 "Руководить квалифицированными рабочими трудно. Заставить их делать опасную работу без прибавки к зарплате — ещё труднее. Эти люди умеют."
