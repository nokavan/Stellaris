 ps_arkv.1.name:0 "Ковчеги-ячейки"
 ps_arkv.1.desc:0 "Кочевая ячейка Синдиката живёт на ковчеге и не привязана к планетам. Можно отдать ей один из наших ковчегов (только кочевникам, не столичный) или построить новый ковчег у столицы. Каждой ячейке даётся специализация, её можно поднять до 3 уровня. Сюзерен получает бонус от лучшего вассала каждой специализации."
 ps_arkv.1.split:0 "Отделить наш ковчег"
 ps_arkv.1.split.tt:0 "Один из наших нестоличных ковчегов вместе с жителями становится кочевым вассалом. Стоимость: §Y100§! влияния. Перезарядка 2 года."
 ps_arkv.1.build:0 "Построить новый ковчег-ячейку"
 ps_arkv.1.build.tt:0 "Свободная планета рядом с ковчегом-столицей заселяется и отправляется в путь на ковчеге — так появляется новый кочевой вассал. Стоимость: §Y1500§! сплавов, §Y500§! еды, §Y200§! влияния. Перезарядка 2 года. Если игра не создаст ковчег, затраты вернутся."
 ps_arkv.1.up2:0 "Улучшить ковчег-вассала до уровня 2"
 ps_arkv.1.up2.tt:0 "Стоимость: §Y1000§! сплавов, §Y150§! влияния. +25 лояльности."
 ps_arkv.1.up3:0 "Улучшить ковчег-вассала до уровня 3"
 ps_arkv.1.up3.tt:0 "Стоимость: §Y2500§! сплавов, §Y300§! влияния, §Y1000§! единства. +25 лояльности."
 ps_arkv.1.cells:0 "К ячейкам на планетах"
 ps_arkv.1.cancel:0 "Закрыть"
 ps_arkv.2.name:0 "Специализация ковчега"
 ps_arkv.2.desc:0 "Чем займётся новый ковчег Синдиката?"
 ps_arkv.2.back:0 "Назад"
 ps_arkv.6.name:0 "Ковчег не собран"
 ps_arkv.6.desc:0 "Ковчег для новой ячейки так и не вышел из дока. Затраты возвращены."
 decision_ps_ark_vassals:0 "Ковчеги-ячейки"
 decision_ps_ark_vassals_desc:0 "Создать кочевого вассала на ковчеге с уникальной специализацией или улучшить существующего."
 ps_mega.30.arks:0 "Ковчег-ячейка (кочевой вассал)"
 ps_arkv_no_world_tt:0 "Рядом с ковчегом-столицей, у других наших ковчегов, в границах или у стоянок нет свободной пригодной планеты: на ней собирается новый ковчег."
