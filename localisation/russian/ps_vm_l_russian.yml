l_russian:
 decision_ps_vassal_management:0 "Управление вассалами"
 decision_ps_vassal_management_desc:0 "Передача систем, обзор и карточки вассалов, бюджет и рекомендации по договорам."
 ps_vm.1.name:0 "Управление вассалами"
 ps_vm.1.desc:0 "Выбранная ячейка: §Y[ps_cell.GetName]§!.\n\nПередача систем, сводка по вассалам, карточка выбранного вассала, его бюджет и рекомендации по договору."
 ps_vm.1.systems:0 "Передача систем"
 ps_vm.1.overview:0 "Обзор вассалов"
 ps_vm.1.card:0 "Карточка вассала"
 ps_vm.1.budget:0 "Бюджет и рекомендации"
 ps_vm.1.next:0 "Следующий вассал"
 ps_vm.1.panel:0 "Панель ячеек Синдиката"
 ps_vm.back:0 "Назад"
 ps_vm.close:0 "Закрыть"
 ps_vm.10.name:0 "Передача систем"
 ps_vm.10.desc:0 "Выбранная система: §Y[ps_sys.GetName]§!, владелец §Y[ps_sys_owner.GetName]§!, колоний владельца: [Root.ps_sys_colonies].\nПолучатель при передаче: ячейка §Y[ps_cell.GetName]§!.\nЦена: §Y[Root.ps_sys_cost]§! влияния (25 + 50 за колонию).\n\nПередавайте системы вассалам, забирайте их территории или перераспределяйте системы между ними. Общая граница не требуется.\n\n§HПравила:§! изъятие у вассала — §R−10§! лояльности; передача своей системы — без штрафа. Повторно ту же систему можно передать через 5 лет. Нужен мир, контроль форпоста и колоний. Столица и последняя система владельца защищены. Основание колонии, наземные бои и чужие обычные планеты мешают передаче. Чужие объекты (например, станции кочевников) сохраняют владельца."
 ps_vm.10.desc_none:0 "Система не выбрана. Выберите систему кнопками ниже.\n\nПолучатель при передаче: ячейка §Y[ps_cell.GetName]§!."
 ps_vm.10.next_own:0 "Следующая наша система"
 ps_vm.10.next_cell:0 "Следующая система выбранной ячейки"
 ps_vm.10.next_vassal:0 "Следующая система любого вассала"
 ps_vm.10.switch_cell:0 "Сменить получателя (следующая ячейка)"
 ps_vm.10.give:0 "Передать систему ячейке §Y[ps_cell.GetName]§!"
 ps_vm.10.give.tooltip:0 "Колонии владельца и форпост переходят к ячейке. Если система принадлежит другому вассалу — это изъятие: §R−10§! его лояльности."
 ps_vm.10.take:0 "Забрать систему себе"
 ps_vm.10.take.tooltip:0 "Колонии и форпост вассала переходят к нам. Лояльность вассала §R−10§!."
 ps_vm.11.name:0 "Новые земли"
 ps_vm.11.desc:0 "Сюзерен передал нам систему §Y[ps_sys.GetName]§!."
 ps_vm.11.a:0 "Принять"
 ps_vm_no_influence:0 "Не хватает влияния (25 + 50 за колонию)."
 ps_vm_fail_peace:0 "Нужен мир: ни мы, ни владелец, ни получатель не должны воевать."
 ps_vm_fail_same:0 "Система уже принадлежит получателю."
 ps_vm_fail_outpost:0 "Владелец должен контролировать форпост системы."
 ps_vm_fail_colonies:0 "Владелец должен контролировать все свои колонии в системе."
 ps_vm_fail_capital:0 "Столичную систему передать нельзя."
 ps_vm_fail_last:0 "Это последняя система владельца."
 ps_vm_fail_combat:0 "В системе идут наземные бои."
 ps_vm_fail_colonizing:0 "В системе основывается колония."
 ps_vm_fail_foreign:0 "В системе есть обычные планеты третьих стран."
 ps_vm_fail_cooldown:0 "Эту систему уже передавали в последние 5 лет."
 ps_vm.20.name:0 "Обзор вассалов"
 ps_vm.20.desc:0 "Лидеры и отстающие среди вассалов, в скобках — значение; в конце строки — для сравнения наши показатели.\n\n§HМощь флота:§! лидер §G[ps_vm_lead_fp.GetName]§! ([ps_vm_lead_fp.ps_fp]), отстаёт §R[ps_vm_lag_fp.GetName]§! ([ps_vm_lag_fp.ps_fp]); [Root.GetName]: [Root.ps_fp]\n§HНаука (изучено технологий):§! лидер §G[ps_vm_lead_tech.GetName]§! ([ps_vm_lead_tech.ps_tech]), отстаёт §R[ps_vm_lag_tech.GetName]§! ([ps_vm_lag_tech.ps_tech]); [Root.GetName]: [Root.ps_tech]\n§HФлот (занято вместимости):§! лидер §G[ps_vm_lead_nav.GetName]§! ([ps_vm_lead_nav.ps_nav]), отстаёт §R[ps_vm_lag_nav.GetName]§! ([ps_vm_lag_nav.ps_nav]); [Root.GetName]: [Root.ps_nav]\n§HЭкономика (баланс базовых):§! лидер §G[ps_vm_lead_inc_basic.GetName]§! ([ps_vm_lead_inc_basic.ps_inc_basic]), отстаёт §R[ps_vm_lag_inc_basic.GetName]§! ([ps_vm_lag_inc_basic.ps_inc_basic]); [Root.GetName]: [Root.ps_inc_basic]\n"
 ps_vm.30.name:0 "Карточка вассала"
 ps_vm.30.desc:0 "§H[ps_cell.GetName]§!\nСпециализация: §Y[ps_cell.PsVmSpec]§!\nВласть: §Y[ps_cell.PsVmAuth]§!\nПринципы: [ps_cell.PsVmEthMil], [ps_cell.PsVmEthXen], [ps_cell.PsVmEthEga], [ps_cell.PsVmEthMat]\nЛояльность — в окне вассала (дипломатия).\n\n§HСравнение (вассал / сюзерен)§!\nМощь флота: [ps_cell.ps_fp] / [Root.ps_fp]\nФлот: [ps_cell.ps_nav] из [ps_cell.ps_navmax] / [Root.ps_nav] из [Root.ps_navmax]\nТехнологий: [ps_cell.ps_tech] / [Root.ps_tech]\nСистем: [ps_cell.ps_sysn] / [Root.ps_sysn]\nКолоний: [ps_cell.ps_pops] / [Root.ps_pops]\nДипломатический вес: [ps_cell.ps_dw] / [Root.ps_dw]\nБаланс базовых ресурсов: [ps_cell.ps_inc_basic] / [Root.ps_inc_basic]\n\n§HПоддержка:§! экономическая — +10% к энергии, минералам и еде и +5% к сплавам на 10 лет; административная — +5 к стабильности, −10% к размеру империи, +10% к единству на 10 лет и §G+10§! лояльности. Каждая — раз в 5 лет."
 ps_vm.30.econ:0 "Экономическая поддержка: §Y1000§! энергии и §Y250§! сплавов"
 ps_vm.30.admin:0 "Административная поддержка: §Y100§! влияния и §Y500§! единства"
 ps_vm_support_cd:0 "Эту поддержку ячейка уже получала в последние 5 лет."
 ps_vm_econ_support:0 "Экономическая поддержка сюзерена"
 ps_vm_econ_support_desc:0 "Сюзерен вкладывается в нашу экономику."
 ps_vm_admin_support:0 "Административная поддержка сюзерена"
 ps_vm_admin_support_desc:0 "Советники сюзерена помогают нам управлять мирами."
 ps_vm.31.name:0 "Бюджет и рекомендации: [ps_cell.GetName]"
 ps_vm.31.desc:0 "§HДоход в месяц (≈ нижняя граница)§!\n£energy£ [ps_cell.ps_inc_energy]  £minerals£ [ps_cell.ps_inc_minerals]  £food£ [ps_cell.ps_inc_food]  £alloys£ [ps_cell.ps_inc_alloys]  £consumer_goods£ [ps_cell.ps_inc_consumer_goods]  £unity£ [ps_cell.ps_inc_unity]  £influence£ [ps_cell.ps_inc_influence]\n§HИсследования:§! £physics£ [ps_cell.ps_inc_physics_research]  £society£ [ps_cell.ps_inc_society_research]  £engineering£ [ps_cell.ps_inc_engineering_research]\n§HСтратегические:§! £rare_crystals£ [ps_cell.ps_inc_rare_crystals]  £exotic_gases£ [ps_cell.ps_inc_exotic_gases]  £volatile_motes£ [ps_cell.ps_inc_volatile_motes]\n§HРасходы всего:§! [ps_cell.ps_exp]\n\n§HЗапасы (≈ не меньше)§!\n£energy£ [ps_cell.ps_stock_energy]  £minerals£ [ps_cell.ps_stock_minerals]  £food£ [ps_cell.ps_stock_food]  £alloys£ [ps_cell.ps_stock_alloys]  £consumer_goods£ [ps_cell.ps_stock_consumer_goods]  £influence£ [ps_cell.ps_stock_influence]  £unity£ [ps_cell.ps_stock_unity]\n£rare_crystals£ [ps_cell.ps_stock_rare_crystals]  £exotic_gases£ [ps_cell.ps_stock_exotic_gases]  £volatile_motes£ [ps_cell.ps_stock_volatile_motes]\n\n§HРекомендации по договору§! (баланс группы → выплаты):\nБазовые (энергия, минералы, еда): [ps_cell.ps_inc_basic]/мес → [ps_cell.PsVmRec_basic] §Y[ps_cell.ps_rec_basic]%§!\nПродвинутые (сплавы, товары): [ps_cell.ps_inc_adv]/мес → [ps_cell.PsVmRec_adv] §Y[ps_cell.ps_rec_adv]%§!\nИсследования: [ps_cell.ps_inc_res]/мес → [ps_cell.PsVmRec_res] §Y[ps_cell.ps_rec_res]%§!\nСтратегические: [ps_cell.ps_inc_str]/мес → [ps_cell.PsVmRec_str] §Y[ps_cell.ps_rec_str]%§!\n\n§HПодходящая специализация:§! [ps_cell.PsVmRecSpec]\n§gОценка приблизительная: игра не отдаёт точные доходы в скрипт, поэтому значения округлены вниз по шкале.§!"
