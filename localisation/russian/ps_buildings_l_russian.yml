 building_ps_crim_pirate_radio:0 "Подпольная радиостанция Синдиката"
 building_ps_crim_pirate_radio_desc:0 "Музыка, новости и шифровки для своих.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_protection_racket:0 "«Крыша» для торговцев"
 building_ps_crim_protection_racket_desc:0 "Платишь — спишь спокойно.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_fight_club:0 "Подпольный бойцовский клуб"
 building_ps_crim_fight_club_desc:0 "Первое правило клуба — платить взнос.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_bouncers:0 "Сеть «вышибал»"
 building_ps_crim_bouncers_desc:0 "Крепкие ребята у каждой двери, готовые к драке.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_security_firm:0 "Подставная охранная фирма"
 building_ps_crim_security_firm_desc:0 "Лицензированная охрана, которая подчиняется не только заказчику.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_lost_weapons:0 "Склад «потерянного» оружия"
 building_ps_crim_lost_weapons_desc:0 "Списанное армейское оружие, которое так и не доехало до утилизации.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_shooting_ranges:0 "Подпольные тиры"
 building_ps_crim_shooting_ranges_desc:0 "Стрельба по мишеням — и не только по мишеням.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_debt_collectors:0 "Сеть «долговых» коллекторов"
 building_ps_crim_debt_collectors_desc:0 "Долги возвращаются всегда. С процентами.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_front_gym:0 "Подставной «спортзал»"
 building_ps_crim_front_gym_desc:0 "Качалка для будущих бойцов Синдиката.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_silence_prison:0 "Тайная тюрьма «Тишина»"
 building_ps_crim_silence_prison_desc:0 "Те, кто слишком много говорил, теперь молчат.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_crim_disposal_service:0 "«Служба утилизации» конкурентов"
 building_ps_crim_disposal_service_desc:0 "Конкуренты исчезают, их склады — тоже.\n\n§YТолько для криминальных синдикатов.§!"
 building_ps_corp_logistics_hub:0 "Логистический хаб корпорации"
 building_ps_corp_logistics_hub_desc:0 "Склады и транспорт корпорации ускоряют стройки союзника.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_bank:0 "Отделение банка корпорации"
 building_ps_corp_bank_desc:0 "Кредиты для союзника, проценты для корпорации.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_mining_consortium:0 "Горный консорциум"
 building_ps_corp_mining_consortium_desc:0 "Совместная добыча: оборудование наше, недра — союзника.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_agri_holding:0 "Агрохолдинг"
 building_ps_corp_agri_holding_desc:0 "Удобрения, семена и сбыт урожая.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_foundry_contract:0 "Литейный подряд"
 building_ps_corp_foundry_contract_desc:0 "Корпорация модернизирует литейные союзника.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_consumer_chain:0 "Торговая сеть корпорации"
 building_ps_corp_consumer_chain_desc:0 "Супермаркеты с товарами на любой вкус.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_research_park:0 "Научный парк корпорации"
 building_ps_corp_research_park_desc:0 "Общие лаборатории учёных корпорации и союзника.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_media_group:0 "Медиагруппа корпорации"
 building_ps_corp_media_group_desc:0 "Каналы и сериалы, которые смотрит вся планета.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_clinic_network:0 "Сеть клиник корпорации"
 building_ps_corp_clinic_network_desc:0 "Платная медицина хорошего уровня.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_shipyard_contract:0 "Верфевой подряд"
 building_ps_corp_shipyard_contract_desc:0 "Корпорация строит союзнику корабли, а часть заказа оставляет себе.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_strategic_traders:0 "Биржа стратегических ресурсов"
 building_ps_corp_strategic_traders_desc:0 "Торговля редкими ресурсами через корпорацию.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_corp_security_contract:0 "Охранный контракт"
 building_ps_corp_security_contract_desc:0 "Частные военные корпорации защищают союзника.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!"
 building_ps_gst_mining_swarm:0 "Подрядный шахтный рой"
 building_ps_gst_mining_swarm_desc:0 "Синдикат поставляет буры, рой — дронов. Добыча делится по договору.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_agri_incubator:0 "Агро-инкубатор"
 building_ps_gst_agri_incubator_desc:0 "Питательные чаны, которые обслуживают дроны хозяина.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_drone_foundry:0 "Литейная дронов"
 building_ps_gst_drone_foundry_desc:0 "Синдикат закупает сплавы прямо с конвейера роя.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_power_tap:0 "Подключение к энергосети"
 building_ps_gst_power_tap_desc:0 "Тихий отвод энергии из сети разума — по взаимной выгоде.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_server_farm:0 "Арендованная вычислительная ферма"
 building_ps_gst_server_farm_desc:0 "Синдикат снимает часть мощностей разума под свои расчёты.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_synaptic_relay:0 "Синаптический ретранслятор"
 building_ps_gst_synaptic_relay_desc:0 "Усилитель сигнала сети разума с нашим каналом внутри.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_signal_tap:0 "Перехват сигналов разума"
 building_ps_gst_signal_tap_desc:0 "Мы слышим, о чём «думает» рой.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_logic_backdoor:0 "Логическая лазейка"
 building_ps_gst_logic_backdoor_desc:0 "Закладка в протоколах разума, о которой он не знает.\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_deviant_node:0 "Девиантный узел"
 building_ps_gst_deviant_node_desc:0 "Сбившиеся с сети дроны работают на Синдикат.\n\n§YТолько на планетах ульев и машинных разумов.§!\n\n§RТолько на планетах соперников, врагов и недружественных империй.§!"
 building_ps_gst_drone_garrison:0 "Оборонный подряд дронов"
 building_ps_gst_drone_garrison_desc:0 "Боевые дроны хозяина охраняют наши склады, а мы платим им сплавами.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_maintenance_dock:0 "Ремонтный док Синдиката"
 building_ps_gst_maintenance_dock_desc:0 "Дроны-ремонтники латают корабли Синдиката вне очереди.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_exotic_exchange:0 "Обменник экзотики"
 building_ps_gst_exotic_exchange_desc:0 "Рою не нужны деньги, но нужны кристаллы и газы. Меняем.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!\n\n§YТолько на планетах ульев и машинных разумов.§!"
 building_ps_gst_coordination_cluster:0 "Кластер координации"
 building_ps_gst_coordination_cluster_desc:0 "Совместный узел управления: разум и Синдикат планируют вместе.\n\n§YТолько на планетах союзников, вассалов, членов федерации и дружественных империй.§!\n\n§YТолько на планетах ульев и машинных разумов.§!"
 ps_branch_host_is_friend_fail:0 "Планета должна принадлежать §Yсоюзнику§!: вассалу, члену федерации, партнёру по оборонному пакту или дружественной империи."
 ps_branch_host_is_enemy_fail:0 "Планета должна принадлежать §Rсопернику§!, врагу или недружественной империи."
 PS_BRANCH_GESTALT_ONLY_PARTISAN:0 "На планетах §Yульев§! и §Yмашинных разумов§! филиалы может открывать только §Yпартизанская мегакорпорация§!."
