    ##########################################################
    ####################### Decisions ########################
    ##########################################################
 iseeu_decision_choose_espionage_planet:0 "Основать «чёрный объект»"
 iseeu_decision_choose_espionage_planet_desc:0 "Эта планета станет центром наших шпионских сетей."
 iseeu_decision_choose_espionage_planet_tooltip:0 "Эта планета станет центром наших шпионских сетей: сюда будут доставлять похищенных и освобождённых."
    ##########################################################
    ####################### Operations #######################
    ##########################################################
 iseeu_success:0 "Успех!"
 iseeu_very_well:0 "Очень хорошо."
    ####################### Manipulation #######################
    # add claim to third party
 iseeu_operation_claim_other_capital:0 "Подарить им претензию"
 iseeu_operation_claim_other_capital_desc:0 "Подкупленные чиновники дадут нашей цели претензию на столичный мир другой страны."
 iseeu_operation_claim_other_capital_on_success:0 "Цель получит претензию на столицу другой страны."
 iseeu_manipulation.1.title:0 "$iseeu_success$"
 iseeu_manipulation.1.desc:0 "Нашим агентам удалось создать претензию."
 iseeu_manipulation.1.success:0 "$iseeu_very_well$"
    # Reduce diplo weight
 iseeu_operation_reduce_diplomatic_weight:0 "Подорвать дипломатический вес"
 iseeu_operation_reduce_diplomatic_weight_desc:0 "Подкупленные чиновники на время снизят дипломатический вес цели."
 iseeu_operation_reduce_diplomatic_weight_on_success:0 "Дипломатический вес цели снизится на время."
 iseeu_manipulation.11.title:0 "$iseeu_success$"
 iseeu_manipulation.11.desc:0 "Наши агенты устроили серьёзную неразбериху."
 iseeu_manipulation.11.success:0 "$iseeu_very_well$"
 iseeu_diplomatic_weight_reduced:0 "Дипломатический вес снижен"
    ######################## Sabotage ########################
    # destroy outpost
 iseeu_operation_destroy_outpost:0 "Уничтожить форпост"
 iseeu_operation_destroy_outpost_desc:0 "Взорвать форпост в системе без колоний."
 iseeu_operation_destroy_outpost_on_success:0 "Форпост в системе без колоний будет уничтожен."
 iseeu_sabotage.1.title:0 "$iseeu_success$"
 iseeu_sabotage.1.desc:0 "Форпост взлетел на воздух."
 iseeu_sabotage.1.fireworks:0 "Какой красивый фейерверк"
    # bomb a planet
 iseeu_operation_bomb_planet:0 "Взорвать бомбу на планете"
 iseeu_operation_bomb_planet_desc:0 "Мы заложим бомбу в жилых районах, чтобы посеять хаос."
 iseeu_operation_bomb_planet_on_success:0 "На планете взорвётся бомба."
 iseeu_sabotage.11.title:0 "Выбор планеты"
 iseeu_sabotage.11.desc:0 "Выберем планету для взрыва."
 iseeu_sabotage.11.option:0 "$iseeu_very_well$"
 iseeu_sabotage.15.title:0 "$iseeu_success$"
 iseeu_sabotage.15.desc:0 "Бомба взорвалась."
 iseeu_sabotage.15.option:0 "Бум!"
 iseeu_sabotage.16.title:0 "Взрыв!"
 iseeu_sabotage.16.desc:0 "На [iseeu_target.GetName] произошёл взрыв! Неизвестно, несчастный случай это или теракт, но жертв много."
 iseeu_sabotage.16.option:0 "Какая трагедия"
    # nuke planet
 iseeu_operation_nuke_planet:0 "Ядерный удар по планете"
 iseeu_operation_nuke_planet_desc:0 "Мы тайно взорвём ядерные заряды на планете."
 iseeu_operation_nuke_planet_on_success:0 "На планете взорвутся ядерные заряды."
 iseeu_operation_nuke_planet_require_tech:0 "Для этой операции нужен более мощный источник энергии."
 iseeu_sabotage.21.title:0 "Выбор планеты"
 iseeu_sabotage.21.desc:0 "Выберем планету для удара."
 iseeu_sabotage.21.option:0 "$iseeu_very_well$"
 iseeu_sabotage.23.title:0 "Идёт подготовка"
 iseeu_sabotage.23.desc:0 "Агенты подготовили места для зарядов на [iseeu_target.GetName]. Теперь заряды нужно тайно доставить на позиции."
 iseeu_sabotage.23.option:0 "$iseeu_very_well$"
 iseeu_sabotage.25.title:0 "$iseeu_success$"
 iseeu_sabotage.25.desc:0 "Заряды сработали. Около половины населения [iseeu_target.GetName] погибло — сразу или в следующие дни."
 iseeu_sabotage.25.option:0 "Это их научит"
 iseeu_sabotage.26.title:0 "Ядерные взрывы"
 iseeu_sabotage.26.desc:0 "На [iseeu_target.GetName] одновременно взорвались несколько ядерных зарядов, погибло около половины населения. Это не случайность, а прямое нападение! Но доказательств нет, только подозрения. Нужно готовиться к войне."
 iseeu_sabotage.26.option:0 "Мы отомстим!"
 iseeu_planet_nuked:0 "Ядерный удар"
    ######################## Subterfuge ########################
    # abducting slaves
 iseeu_operation_abduct_slaves:0 "Похитить рабов"
 iseeu_operation_abduct_slaves_desc:0 "Мы похитим часть населения и обратим её в рабство."
 iseeu_operation_abduct_slaves_on_success:0 "Часть населения будет похищена и станет рабами."
 iseeu_subterfuge.1.title:0 "Агенты в пути"
 iseeu_subterfuge.1.desc:0 "Наши агенты пробираются к [iseeu_target.GetName]."
 iseeu_subterfuge.1.option:0 "$iseeu_very_well$"
 iseeu_subterfuge.5.title:0 "$iseeu_success$"
 iseeu_subterfuge.5.desc:0 "Похищение удалось."
 iseeu_subterfuge.5.option:0 "Отлично"
 iseeu_subterfuge.6.title:0 "Исчезновения"
 iseeu_subterfuge.6.desc:0 "На [iseeu_target.GetName] каждый день пропадают люди. Что с ними происходит, неизвестно, требований выкупа нет. К счастью, в последние дни исчезновения прекратились."
 iseeu_subterfuge.6.option:0 "Странно"
 iseeu_pop_disappeared:0 "Пропавшие жители"
    # freeing slaves
 iseeu_operation_free_slaves:0 "Освободить рабов"
 iseeu_operation_free_slaves_desc:0 "Мы выкрадем рабов и дадим им свободу на наших мирах."
 iseeu_operation_free_slaves_on_success:0 "Рабы будут выкрадены и освобождены на наших мирах."
 iseeu_subterfuge.11.title:0 "Агенты в пути"
 iseeu_subterfuge.11.desc:0 "Наши агенты пробираются к [iseeu_target.GetName]."
 iseeu_subterfuge.11.option:0 "$iseeu_very_well$"
 iseeu_subterfuge.15.title:0 "$iseeu_success$"
 iseeu_subterfuge.15.desc:0 "Агентам удалось освободить часть рабов. Транспорты с ними уже прибыли."
 iseeu_subterfuge.15.option:0 "Отлично"
 iseeu_subterfuge.16.title:0 "Исчезновения"
 iseeu_subterfuge.16.desc:0 "На [iseeu_target.GetName] каждый день пропадают рабы. Что с ними происходит, неизвестно, но о восстании никто не сообщал. В последние дни исчезновения прекратились."
 iseeu_subterfuge.16.option:0 "Странно"
 iseeu_slaves_disappeared:0 "Пропавшие рабы"
    # steal relic
 iseeu_operation_steal_relic:0 "Украсть реликвию"
 iseeu_operation_steal_relic_desc:0 "Мы украдём случайную реликвию."
 iseeu_operation_steal_relic_on_success:0 "Мы украдём случайную реликвию."
 iseeu_subterfuge.21.title:0 "Реликвия найдена"
 iseeu_subterfuge.21.desc:0 "Агенты нашли, где хранится реликвия. Теперь они планируют, как войти и уйти. Текущий план: подкупить чиновников влиянием и кредитами, войти со взрывчаткой и уйти на гоночном корабле."
 iseeu_subterfuge.21.option:0 "Посмотрим, что выйдет"
 iseeu_subterfuge.25.title:0 "$iseeu_success$"
 iseeu_subterfuge.25.desc:0 "Агентам удалось войти и выйти с реликвией! Прежний владелец будет недоволен, но прямых доказательств против нас у него нет."
 iseeu_subterfuge.25.option:0 "$iseeu_very_well$"
 iseeu_opinion_relic_stolen:0 "Украдена реликвия"
