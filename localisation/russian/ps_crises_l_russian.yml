 ps_crisis.launch.tooltip:0 "У цели начинается §Rкризис§!. Первые 3 года наши агенты ускоряют его (§R+1§! в месяц). Если цель не справится, мы получаем §G500§! единства и §G50§! влияния. Следующий кризис у этой цели — не раньше чем через 10 лет."
