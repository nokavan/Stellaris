 ps_crisis.152.desc:0 "В лесах, шахтах и трущобах империи действуют вооружённые отряды. Патрули исчезают, склады горят, а население помогает партизанам.\n\nМы не справились. На трёх самых нестабильных планетах жертвы (кроме столицы) поднимается §Rвооружённый бунт§!: появляются партизанские отряды, начинается наземный бой."
