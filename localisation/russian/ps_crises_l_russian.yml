l_russian:
 situation_ps_general_strike:0 "Великая забастовка"
 situation_ps_general_strike_type:0 "Великая забастовка"
 situation_ps_general_strike_desc:0 "Профсоюзы, подкупленные иностранным синдикатом, поднимают одну отрасль за другой. Заводы стоят, порты пусты, а забастовочные комитеты требуют всё больше."
 situation_ps_general_strike_monthly_change_tooltip:0 "Кризис растёт сам. Его ускоряют нестабильные планеты и действующие агенты. Замедлить можно подходами."
 situation_ps_general_strike_complete_tooltip:0 "Экономика жертвы парализована на 3 года (§R-25%§! производства, §R-10§! стабильности), а на всех её планетах, кроме столицы, начинается §RСмута§!."
 ps_general_strike_stage_1:0 "Брожение"
 ps_general_strike_stage_2:0 "Волнения"
 ps_general_strike_stage_3:0 "Кризис"
 ps_general_strike_stage_4:0 "На грани"
 ps_general_strike_concessions:0 "Уступки профсоюзам"
 ps_general_strike_concessions_desc:0 "Повышаем зарплаты и закупаем товары. Прогресс кризиса §G-3§! в месяц."
 ps_general_strike_crackdown:0 "Разгон пикетов"
 ps_general_strike_crackdown_desc:0 "Полиция и штрейкбрехеры. Прогресс кризиса §G-2§! в месяц."
 operation_ps_crisis_general_strike:0 "Кризис: Великая забастовка"
 operation_ps_crisis_general_strike_desc:0 "Запустить у цели кризис «Великая забастовка». Профсоюзы, подкупленные иностранным синдикатом, поднимают одну отрасль за другой. Заводы стоят, порты пусты, а забастовочные комитеты требуют всё больше.\n\n§YЕсли цель не справится:§! Экономика жертвы парализована на 3 года (§R-25%§! производства, §R-10§! стабильности), а на всех её планетах, кроме столицы, начинается §RСмута§!."
 ps_crisis.11.desc:0 "Всё готово. Сеть Синдиката в империи §Y[target.GetName]§! получила сигнал, и кризис «Великая забастовка» начался."
 ps_crisis.151.desc:0 "Профсоюзы, подкупленные иностранным синдикатом, поднимают одну отрасль за другой. Заводы стоят, порты пусты, а забастовочные комитеты требуют всё больше.\n\nМы не справились. Экономика жертвы парализована на 3 года (§R-25%§! производства, §R-10§! стабильности), а на всех её планетах, кроме столицы, начинается §RСмута§!."
 ps_crisis_strike_aftermath:0 "Последствия Великой забастовки"
 ps_crisis_strike_aftermath_desc:0 "Экономика ещё не оправилась от забастовки."
 situation_ps_insurgency:0 "Партизанская война в тылу"
 situation_ps_insurgency_type:0 "Партизанская война в тылу"
 situation_ps_insurgency_desc:0 "В лесах, шахтах и трущобах империи действуют вооружённые отряды. Патрули исчезают, склады горят, а население помогает партизанам."
 situation_ps_insurgency_monthly_change_tooltip:0 "Кризис растёт сам. Его ускоряют нестабильные планеты и действующие агенты. Замедлить можно подходами."
 situation_ps_insurgency_complete_tooltip:0 "На трёх самых нестабильных планетах жертвы (кроме столицы) поднимается §Rвооружённый бунт§!: появляются партизанские отряды, начинается наземный бой."
