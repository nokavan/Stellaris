 specialist_ps_strike:0 "Ударный легион"
 specialist_ps_strike_desc:0 "Атакующий вассал. Вся экономика подчинена флоту: верфи работают круглосуточно, а лучшие экипажи служат в ударных эскадрах Синдиката.\n\nВступает во §Yвсе§! войны сюзерена.\nПредпочитают: §GМилитаристы§!. Против: §RПацифисты§!."
 preset_ps_strike:0 "Ударный легион"
 preset_ps_strike_desc:0 "Атакующий вассал. Вся экономика подчинена флоту: верфи работают круглосуточно, а лучшие экипажи служат в ударных эскадрах Синдиката.\n\nВступает во §Yвсе§! войны сюзерена.\nПредпочитают: §GМилитаристы§!. Против: §RПацифисты§!."
