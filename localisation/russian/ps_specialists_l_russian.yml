 ps_raiders_1_overlord_modifier:0 "Тайные маршруты"
 ps_raiders_1_overlord_modifier_desc:0 "Каперы делятся с сюзереном своими тропами."
 ps_raiders_1_letters_of_marque:0 "Каперские грамоты"
 ps_raiders_1_letters_of_marque_desc:0 "Когда сюзерен воюет, флотилия грабит его врагов: §G+100§! энергии сюзерену в год, а враги получают модификатор «Каперские рейды»."
