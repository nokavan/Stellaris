 specialist_ps_assault:0 "Штурмовой корпус"
 specialist_ps_assault_desc:0 "Атакующий вассал. Мир-казарма, поставляющий Синдикату штурмовые армии для высадок и партизанских рейдов в тылу врага.\n\nВступает во §Yвсе§! войны сюзерена.\nПредпочитают: §GАвторитаристы§!. Против: §RЭгалитаристы§!."
 preset_ps_assault:0 "Штурмовой корпус"
 preset_ps_assault_desc:0 "Атакующий вассал. Мир-казарма, поставляющий Синдикату штурмовые армии для высадок и партизанских рейдов в тылу врага.\n\nВступает во §Yвсе§! войны сюзерена.\nПредпочитают: §GАвторитаристы§!. Против: §RЭгалитаристы§!."
