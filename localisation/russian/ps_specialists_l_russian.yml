 specialist_ps_residency:0 "Шпионская резидентура"
 specialist_ps_residency_desc:0 "Вассал-разведка. Его посольства, торговцы и туристы — глаза и уши Синдиката по всей галактике.\n\nВступает только в оборонительные войны.\nПредпочитают: §GКсенофилы§!. Против: §RКсенофобы§!."
