 specialist_ps_trust:0 "Ресурсный трест"
 specialist_ps_trust_desc:0 "Экономический вассал. Шахты, фермы, литейные и банки работают на Синдикат: трест добывает ресурсы, торгует ими и переводит деньги сюзерену.\n\nВступает только в оборонительные войны.\nПредпочитают: §GМатериалисты§!. Против: §RСпиритуалисты§!."
 preset_ps_trust:0 "Ресурсный трест"
