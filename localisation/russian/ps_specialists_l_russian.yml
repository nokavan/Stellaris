 specialist_ps_raiders:0 "Каперская флотилия"
 specialist_ps_raiders_desc:0 "Атакующий вассал. Каперы с грамотами Синдиката: в мирное время контрабанда, в войну — рейды по вражеским торговым путям.\n\nВступает во §Yвсе§! войны сюзерена.\nПредпочитают: §GКсенофобы§!. Против: §RКсенофилы§!."
 preset_ps_raiders:0 "Каперская флотилия"
 preset_ps_raiders_desc:0 "Атакующий вассал. Каперы с грамотами Синдиката: в мирное время контрабанда, в войну — рейды по вражеским торговым путям.\n\nВступает во §Yвсе§! войны сюзерена.\nПредпочитают: §GКсенофобы§!. Против: §RКсенофилы§!."
