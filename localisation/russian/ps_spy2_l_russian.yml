l_russian:
 ps_spy2.1.name:0 "Агенты на месте"
 ps_spy2.1.desc:0 "Наши люди в §Y[target.GetName]§! получили доступ, документы и легенду. Осталось сделать дело."
 ps_spy2.1.a:0 "Продолжайте."
 operation_ps_target_no_subjects:0 "У цели нет вассалов."
 ps_spy_bribed_governor:0 "Подкупленный губернатор"
 operation_ps_bribe_governors:0 "Подкуп губернаторов"
 operation_ps_bribe_governors_desc:0 "Губернатор одной из колоний цели начинает работать на нас."
 ps_spy2.10.name:0 "Подкуп губернаторов: успех"
 ps_spy2.10.desc:0 "Губернатор взял деньги. Его колония теряет порядок (§R−10§! стабильности, §R+20§! преступности на 5 лет), а мы получаем §G75§! влияния."
 ps_spy2.10.a:0 "Отличная работа."
 operation_ps_steal_blueprints:0 "Кража чертежей"
 operation_ps_steal_blueprints_desc:0 "Агенты проникают в конструкторские бюро цели и копируют чертежи."
 ps_spy2.11.name:0 "Кража чертежей: успех"
 ps_spy2.11.desc:0 "Чертежи у нас: получаем исследования в объёме §Y6§! месяцев инженерных и §Y3§! месяцев физических."
 ps_spy2.11.a:0 "Отличная работа."
 ps_spy_counterfeit:0 "Фальшивые кредиты"
 operation_ps_counterfeit_credits:0 "Фальшивые кредиты"
 operation_ps_counterfeit_credits_desc:0 "Синдикат наводняет рынок цели поддельной валютой."
 ps_spy2.12.name:0 "Фальшивые кредиты: успех"
 ps_spy2.12.desc:0 "Рынок цели наводнён подделками: её энергия §R−10%§! на 5 лет, мы получаем §G500§! энергии."
 ps_spy2.12.a:0 "Отличная работа."
 operation_ps_turn_vassals:0 "Перевербовка вассалов"
 operation_ps_turn_vassals_desc:0 "Агенты убеждают вассалов цели, что настоящий друг — Синдикат."
 ps_spy2.13.name:0 "Перевербовка вассалов: успех"
 ps_spy2.13.desc:0 "Вассалы цели колеблются: их лояльность сюзерену §R−40§!, а их советы готовы перейти под нашу руку («Марионеточный совет» на 10 лет)."
 ps_spy2.13.a:0 "Отличная работа."
 ps_spy_blackmailed:0 "Шантаж правителя"
 ps_spy_blackmail_income:0 "Плата за молчание"
 operation_ps_blackmail_ruler:0 "Шантаж правителя"
 operation_ps_blackmail_ruler_desc:0 "Синдикат находит, чем прижать правителя цели."
 ps_spy2.14.name:0 "Шантаж правителя: успех"
 ps_spy2.14.desc:0 "Правитель платит за молчание: §R−1§! влияния в месяц у цели и §G+1§! у нас на 5 лет."
 ps_spy2.14.a:0 "Отличная работа."
 ps_spy_market_crash:0 "Обвал биржи"
 operation_ps_market_crash:0 "Обвал биржи"
 operation_ps_market_crash_desc:0 "Слухи, паника и короткие продажи — биржа цели рушится."
 ps_spy2.15.name:0 "Обвал биржи: успех"
 ps_spy2.15.desc:0 "Биржа рухнула: у цели §R−15%§! товаров и §R−5§! стабильности на 3 года, мы скупили активы — §G300§! энергии и минералов."
 ps_spy2.15.a:0 "Отличная работа."
 ps_spy_brain_drain:0 "Утечка мозгов"
 ps_spy_defectors:0 "Учёные-перебежчики"
 operation_ps_brain_drain:0 "Вербовка перебежчиков"
 operation_ps_brain_drain_desc:0 "Лучших учёных цели переманивают в лаборатории Синдиката."
 ps_spy2.16.name:0 "Вербовка перебежчиков: успех"
 ps_spy2.16.desc:0 "Учёные бежали к нам: у цели §R−10%§! к науке, у нас §G+5%§! на 5 лет."
 ps_spy2.16.a:0 "Отличная работа."
 ps_spy_alloy_theft:0 "Хищения со складов"
 operation_ps_smuggle_alloys:0 "Контрабанда сплавов"
 operation_ps_smuggle_alloys_desc:0 "Со складов цели «пропадают» эшелоны сплавов."
 ps_spy2.17.name:0 "Контрабанда сплавов: успех"
 ps_spy2.17.desc:0 "Эшелоны ушли налево: у цели §R−10%§! сплавов на 3 года, у нас §G+250§! сплавов."
 ps_spy2.17.a:0 "Отличная работа."
