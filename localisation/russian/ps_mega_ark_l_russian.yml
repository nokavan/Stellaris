l_russian:
 ps_mega_ark_boost:0 "Перегрузка мега-ковчега"
 ps_mega_ark_boost_desc:0 "Модульный корпус этого ковчега перегружен далеко за пределы расчётных допусков: колоссально больше вместимости районов и значительно выше производство энергии и минералов."
 building_ps_mega_ark_mine:0 "Буровая установка ковчега"
 building_ps_mega_ark_mine_desc:0 "Модульная установка для добычи руды, встроенная в сборочные отсеки ковчега. В отличие от единичных центров очистки, такие установки можно возводить массово, наполняя трюмы необработанными минералами."
