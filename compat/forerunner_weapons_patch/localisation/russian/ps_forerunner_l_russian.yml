l_russian:
 ps_fr.2.name:0 "Арсенал Предтеч"
 ps_fr.2.desc:0 "Наши агенты вскрыли тайник исчезнувшей цивилизации. Чертежи лучевых орудий Стражей уже в мастерских Синдиката, а остальная ветка оружия и корабельных систем Предтеч теперь открыта для исследования."
 ps_fr.2.a:0 "Чужое оружие — в наших руках."
