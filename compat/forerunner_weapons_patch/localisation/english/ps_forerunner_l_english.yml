 ps_fr.2.name:0 "The Precursor Arsenal"
 ps_fr.2.desc:0 "Our agents have cracked a cache of a vanished civilization. Blueprints for Sentinel beams are already in Syndicate workshops, and the rest of the Precursor weapons and ship systems are now open to research."
 ps_fr.2.a:0 "Their weapons, our hands."
