l_russian:
 ps_partisan_worldark_bonus:0 "Ковчег Сопротивления"
 ps_partisan_worldark_bonus_desc:0 "Мировой ковчег стал штабом партизанской сети Синдиката."
 ps_xhk.3.name:0 "Мировой ковчег Сопротивления"
 ps_xhk.3.desc:0 "Партизаны вложили в Мировой ковчег всё, что умели. Его верфи и казармы годятся для войны, лаборатории — для науки, а жилые палубы и трюмы — для жизни целого народа.\n\nКовчег получает специализации §Yвсех трёх ковчегов§! — §Yгражданского§!, §Yнаучного§! и §Yвоенного§! — сразу на §Gмаксимальном уровне§!."
 ps_xhk.3.a:0 "Сеть получила свой дом."
 origin_ps_partisan_worldark:0 "Мировой ковчег Сопротивления"
 origin_ps_partisan_worldark_desc:0 "Партизаны угнали не просто ковчег, а целый мир на двигателях. Поколения Синдиката рождаются, живут и умирают на его палубах, а сам он — штаб, крепость и родина в одном корпусе.\n\nГде встанет Мировой ковчег, там вырастет новая ячейка."
 origin_tooltip_ps_partisan_worldark_effects:0 "£unity£ Кочевая партизанская мегакорпорация (нужны DLC §YNomads§! и мод §YXHK World Ark§!).\n- Старт на §GМировом ковчеге§! XHK: огромный расширяемый ковчег с уникальными районами, модулями и системами; сразу открыты специализации §Yвсех трёх ванильных ковчегов§! на 3-м уровне.\n- Как у XHK: нельзя получить второй ковчег и основывать колонии обычным путём; −50% к эффекту возвышения планет, +100% к его стоимости, +50% к вместимости логистических кораблей.\n- Скорость действий ковчега: §G+15%§!, прочность военных ковчегов: §G+10%§!\n- Шифрование: §G+1§!, посланники: §G+1§!\n- Лидеры §Gне умирают от старости§! (§G+1000§! лет жизни)\n- Пролог §YКовчег Сопротивления§!, §YСтоянки Сопротивления§!, высадка ячеек, специализированные вассалы, агентурные операции, партизанская война и здания филиалов — всё как у «Ковчега Сопротивления»."
