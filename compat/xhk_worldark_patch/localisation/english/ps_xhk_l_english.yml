l_english:
 ps_partisan_worldark_bonus:0 "Ark of the Resistance"
 ps_partisan_worldark_bonus_desc:0 "The World Ark has become the headquarters of the Syndicate's partisan network."
 ps_xhk.3.name:0 "World Ark of the Resistance"
 ps_xhk.3.desc:0 "The partisans have poured everything they know into the World Ark. Its shipyards and barracks are fit for war, its laboratories for science, its habitation decks and holds for the life of a whole people.\n\nThe Ark gains the specializations of §Yall three arkships§! — §Ycivilian§!, §Yscience§! and §Ymilitary§! — at their §Gmaximum level§! right away."
 ps_xhk.3.a:0 "The network has found its home."
 origin_ps_partisan_worldark:0 "World Ark of the Resistance"
 origin_ps_partisan_worldark_desc:0 "The partisans did not steal a mere ark, but a whole world with engines. Generations of the Syndicate are born, live and die on its decks, and it is their headquarters, fortress and homeland in one hull.\n\nWherever the World Ark stops, a new cell will grow."
 origin_tooltip_ps_partisan_worldark_effects:0 "£unity£ Nomadic partisan megacorporation (requires the §YNomads§! DLC and the §YXHK World Ark§! mod).\n- Start on the XHK §GWorld Ark§!: a massive expandable arkship with unique districts, modules and systems; the specializations of §Yall three vanilla arks§! are unlocked at level 3.\n- As with XHK: cannot gain another arkship or settle normally; −50% planetary ascension effect, +100% ascension cost, +50% logistics ship capacity.\n- Arkship action speed: §G+15%§!, military arkship hull: §G+10%§!\n- Encryption: §G+1§!, envoys: §G+1§!\n- Leaders §Gdo not die of old age§! (§G+1000§! years)\n- The §YArk of the Resistance§! prologue, §YResistance Camps§!, cell seeding, specialist subjects, operations, partisan war and branch buildings — all as with the «Ark of the Resistance»."
