l_english:
 ps_partisan_worldark_bonus:0 "Ark of the Resistance"
 ps_partisan_worldark_bonus_desc:0 "The World Ark has become the headquarters of the Syndicate's partisan network."
 ps_xhk.3.name:0 "World Ark of the Resistance"
 ps_xhk.3.desc:0 "The partisans have poured everything they know into the World Ark. Its shipyards and barracks are fit for war, its laboratories for science, its habitation decks and holds for the life of a whole people.\n\nThe Ark gains the specializations of §Yall three arkships§! — §Ycivilian§!, §Yscience§! and §Ymilitary§! — at their §Gmaximum level§! right away."
 ps_xhk.3.a:0 "The network has found its home."
