 paladin_super_shield_ship_button: "\nНа §Y£time£ 3 месяца§! этот корабль получает:\n• §G+1 000%§! к прочности щитов\n• §G+75%§! к ежедневному восстановлению щитов\n• §G+15%§! к усилению щитов"
