 paladin_leadership: "По моей команде!"
 paladin_leadership_ship_button: "\nНа §Y£time£ 3 месяца§! все дружественные корабли в этой системе получают:\n• §G+20%§! к дальности действия корабельных орудий\n• §G+20%§! к урону от корабельных орудий\n• §G+20%§! к субсветовой скорости"
