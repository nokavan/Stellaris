 paladin_teamwork: "Гармония"
 paladin_teamwork_ship_button: "\nНа §Y£time£ 3 месяца§! все корабли паладинов в этой системе получают:\n• §G+7,5%§! к снижению урона\n• §G+7,5%§! к скорострельности корабельных орудий\n• §G+7,5%§! к шансу уклонения\n\nЭтот эффект умножается на количество паладинов в системе."
