 paladin_air_superiority_menu_title: "$paladin_air_superiority$"
 paladin_air_superiority_progress_activity_key: "$paladin_air_superiority$"
 paladin_plan_b: "Запасной план"
 paladin_plan_b_ship_button: "\nНа §Y£time£ 3 месяца§! все дружественные корабли в этой системе получают:\n• §G+10§! к снижению урона\n• §G+25%§! к пробиванию щитов\n• §G+25%§! к пробиванию брони\n• §G+50%§! к точности"
