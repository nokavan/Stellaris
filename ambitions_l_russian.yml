 resolution_category_paladins: "Программа «Паладин»"
 resolution_paladin_focus_teamwork: "Приоритет паладинов: гармония"
 resolution_paladin_focus_teamwork_desc: "Чтобы справиться с любой, даже самой страшной угрозой, паладины должны уметь работать сообща."
 resolution_paladin_focus_teamwork_tt: "$only_one_paladin_focus$\n\nОткрывается действие «§H$paladin_teamwork$§!» для кораблей §Yпаладинов§!:\n\n$paladin_teamwork_ship_button$"
 resolution_paladin_focus_leadership: "Приоритет паладинов: лидерство"
 resolution_paladin_focus_leadership_desc: "Паладины — не просто военачальники. Их отвага, стратегическое мышление и готовность к самопожертвованию вдохновляют союзников и служат примером для всех нас."
 resolution_paladin_focus_leadership_tt: "$only_one_paladin_focus$\n\nОткрывается действие «§H$paladin_leadership$§!» для кораблей §Yпаладинов§!:\n\n$paladin_leadership_ship_button$"
 resolution_paladin_focus_last_resort: "Приоритет паладинов: полевые испытания"
 resolution_paladin_focus_last_resort_desc: "Оружие, которое мы вверяем паладинам, зачастую не испытано и слишком опасно для широкого применения. Мы пускаем его в ход, потому что в данный момент у нас нет особого выбора. Остается надеяться, что паладины используют его с честью."
 resolution_paladin_focus_last_resort_tt: "$only_one_paladin_focus$\n\nОткрывается действие «§H$paladin_field_testing$§!» для кораблей §Yпаладинов§!:\n\n$paladin_field_testing_ship_button$"
 only_one_paladin_focus: "§RМожно принять только одну резолюцию по §Yприоритетам§! паладинов.§!"
 resolution_paladin_training_teamwork: "Обучение паладинов: синергия"
 resolution_paladin_training_teamwork_desc: "Каждый паладин — могущественный боец, однако их истинная сила кроется в единстве. Когда паладины сражаются плечом к плечу, их отвага не просто вдохновляет — она становится несокрушимой."
 resolution_paladin_training_teamwork_tt: "$only_one_paladin_training$\n\n§YПаладины§! в пределах одной системы дают друг другу следующие модификаторы:\n• $MOD_SHIP_DAMAGE_REDUCTION_MULT$:§G2,5%§!\n• $MOD_SHIP_FIRE_RATE_MULT$: §G2,5%§!"
 resolution_paladin_training_defense: "Обучение паладинов: оборона"
 resolution_paladin_training_defense_desc: "Погибшие паладины могут послужить источником вдохновения, зато уцелевшие защищают нас здесь и сейчас. Их выживание — стратегический вопрос, не просто сентиментальность. Необходимо использовать все ресурсы, чтобы паладины оставались в строю."
 resolution_paladin_training_defense_tt: "$only_one_paladin_training$\n\nЛидерская черта §Yпаладина§! теперь дает:\n$MOD_SHIP_EVASION_MULT$: §G25%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_PERC$: §G20%§!"
 resolution_paladin_training_offense: "Обучение паладинов: наступление"
 resolution_paladin_training_offense_desc: "Иногда достижение мира требует неограниченного применения силы. Паладины не знают гнева — они атакуют, чтобы защитить то, что необходимо сохранить."
 resolution_paladin_training_offense_tt: "$only_one_paladin_training$\n\nЛидерская черта §Yпаладина§! теперь дает:\n$MOD_SHIP_WEAPON_DAMAGE$: §G30%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$: §G25%§!"
 only_one_paladin_training: "§RМожно принять только одну резолюцию по §Yобучению§! паладинов.§!"
 resolution_paladin_direct_command: "Прямое управление"
 resolution_paladin_direct_command_desc: "Опасность, которая нам угрожает, требует крайних мер. Всех паладинов необходимо перевести в подчинение хранителю."
 resolution_repeal_paladin_direct_command: "Отмена прямого управления"
 resolution_repeal_paladin_direct_command_desc: "Кризис миновал, а с ним закончилась и необходимость в чрезвычайных мерах. Выполнив свою миссию, паладины могут вернуться под командование обычных военачальников."
 resolution_paladin_direct_command_tooltip: "Все §Yпаладины§! будут напрямую подчиняться хранителю."
 gal_com_too_early: "Пока еще рано обсуждать этот вопрос."
 #Special Projects and event chains
 defender_of_the_galaxy_chain_title: "Защитник галактики"
 defender_of_the_galaxy_chain_desc: "Галактика — удивительное место, и его следует беречь. Она является домом для множества разумных видов с их надеждами и мечтами, и все они достойны защиты. Мы не стремимся к власти — мы желаем лишь мира. Но мир необходимо защищать. Мы остановим каждого, кто попытается завоевать, уничтожить или осквернить нашу галактику. И пока мы боремся, галактика будет жить."
 ambition_level_reached: "Достигнут новый уровень амбиции"
 defender_of_the_galaxy_ending_chain_title: "Упреждающий удар"
 defender_of_the_galaxy_ending_chain_desc: "Безрассудно отрицать очевидное: в галактике есть темные силы, жаждущие уничтожить всё, что мы хотим сохранить. Нельзя дожидаться, пока грянет буря — мы должны быть готовы нанести удар.\n\nПусть те, кто угрожает галактике, знают: мы их найдем.\n\n§HЗАДАЧИ§!:\n• Уничтожить все державы, ответственные за кризис\n• Преодолеть два кризиса конца игры\n• Затем снять с себя полномочия хранителя"
 crisis_defeated: "С кризисом покончено"
 DEFENDER_CRISIS_SPECIAL_PROJECT_1: "Особая дипломатия"
 DEFENDER_CRISIS_SPECIAL_PROJECT_1_DESC: "Галактику невозможно защитить в одиночку.\n\nПрежде чем начать действовать, мы должны заслужить доверие тех, кого хотим защищать. Это доверие будет основано на честности, сдержанности и дипломатическом подходе.\n\nМы подготовим новое поколение послов, которые словом и делом докажут искренность наших намерений. Только объединившись, мы сможем создать союзы, способные выдержать грядущие испытания."
 DEFENDER_CRISIS_SPECIAL_PROJECT_2: "Источники вдохновения"
 DEFENDER_CRISIS_SPECIAL_PROJECT_2_DESC: "Доверие можно заслужить, вера же требует постоянной поддержки.\n\nТеперь, когда вся галактика на нашей стороне, пришло время подарить ее обитателям надежду — символы, которые будут освещать их путь даже в самые темные времена. Это будут не просто знамена и лозунги, но зримые воплощения мужества, единства и нерушимой клятвы быть щитом, что защитит их от надвигающейся бури.\n\nПусть эти символы напоминают всем разумным существам, что они не одни в галактике."
 DEFENDER_CRISIS_SPECIAL_PROJECT_4: "Инициативные действия"
 DEFENDER_CRISIS_SPECIAL_PROJECT_4_DESC: "Галактика полна угроз, которые нельзя игнорировать, и мы не вправе ждать, пока тьма не заявит о себе. Пора провести ряд рискованных операций и выяснить, какие опасности подстерегают нас впереди, — не забывая об осторожности, конечно.\n\n§RЭто спровоцирует кризис конца игры§!"
 DEFENDER_CRISIS_SPECIAL_PROJECT_5: "Усиление активности"
 DEFENDER_CRISIS_SPECIAL_PROJECT_5_DESC: "Предпринятые нами меры полностью себя оправдали. И хотя мы добились успеха, это еще не конец.\n\nГалактика велика и полна опасностей. Мы должны продолжать поиски, чтобы никакая угроза не осталась незамеченной.\n\nПодобные эксперименты сопряжены с огромным риском, однако, если во мраке по-прежнему таится зло, нам остается лишь встретиться с ним лицом к лицу.\n\n§RЭто спровоцирует второй кризис конца игры§!"
 PALADIN_SHIP_PROJECT: "Корабли паладинов"
 PALADIN_SHIP_PROJECT_DESC: "На стыке искусства и технологий рождаются символы свободы, призванные сиять наперекор тьме."
 MISSION_BE_ON_GALCOM: "Членство в сообществе"
 MISSION_JOIN_GALACTIC_COMMUNITY: "$BE_ON_GALCOM$"
 BE_ON_GALCOM: "Стать частью Галактического сообщества"
 MISSION_BE_ON_GALCOM_DESC: "Чтобы влиять на демократические процессы в галактике, прежде всего нужно занять свое место за общим столом."
 MISSION_BE_ON_GALACTIC_COUNCIL: "Сенатор галактики"
 BE_ON_GALACTIC_COUNCIL: "Занять место в Галактическом совете"
 MISSION_BE_ON_GALACTIC_COUNCIL_DESC: "Создание Галактического совета является важным шагом на пути к составлению протоколов обеспечения безопасности в галактике.\n\nДля избрания §Hсоветником§! мы должны:$TABBED_NEW_LINE$• Принять резолюцию «$resolution_galacticreforms_form_council$» в §HГалактическом сообществе§!$TABBED_NEW_LINE$• Попасть в тройку ведущих империй сообщества по показателю §Hдипломатического веса§!"
 MISSION_BE_CUSTODIAN: "Первые среди равных"
 BE_CUSTODIAN: "Добиться избрания Галактическим хранителем"
 MISSION_BE_CUSTODIAN_DESC: "Должность хранителя — тяжкое бремя. Но ради блага галактики мы готовы его принять.\n\nДля избрания §Hхранителем§! мы должны:$TABBED_NEW_LINE$• Принять резолюцию §H«$resolution_galacticreforms_nominate_custodian$: [Root.GetName]»§! в §HГалактическом сообществе§!"
 #Events
 ambition.100.name: "Безопасность галактики"
 ambition.100.desc: "Наша галактика более уязвима, чем кажется на первый взгляд. Опасности подстерегают ее повсюду: это и хищники, скрывающиеся в космической пустоте, и пираты, захватившие заброшенные системы, и войны, ведущиеся из гордыни или страха. А те, кто способен что-то изменить, зачастую предпочитают не вмешиваться.\n\nМы не будем стоять в стороне — и это не притязание на власть, но клятва хранить и оберегать. Совместными усилиями и обдуманными действиями мы обеспечим галактике будущее, за которое стоит бороться."
 ambition.100.a: "Мы делаем то, что должно."
 ambition.105.name: "Вечное служение"
 ambition.105.desc: "Галактику невозможно объединить силой оружия или чьим-то волевым решением. Для этого необходимы доверие, диалог и готовность нести бремя, которое никто другой принять не осмелится. С каждым новым союзом, с каждым кризисом, который нам удается преодолеть, мы становимся на шаг ближе к лучшему будущему.\n\nМы не жаждем господства, мы хотим лишь указывать путь. Там, где другие колеблются, мы всегда готовы протянуть руку помощи. Наш непрестанный труд не всегда ценят по заслугам, но таково наше предназначение. Вместе мы создадим галактику, способную устоять перед любыми испытаниями."
 ambition.105.a: "Мы живем ради того, чтобы служить галактике."
 ambition.110.name: "Символы свободы"
 ambition.110.desc: "В тяжелые времена особенно важны символы. Галактика нуждается не только в защите — ей необходимы источники вдохновения. Когда враги смелеют, а будущее погружается во тьму, мы осуществляем свой план и формируем авангард выдающихся личностей — выходцев из всех уголков известного космоса, которые станут воплощением наших идеалов.\n\nЭти паладины будут не просто командовать флотилиями или руководить спасательными операциями. Они станут героями в глазах всех народов галактики и зримым подтверждением нашей общей решимости."
 ambition.110.a: "Они станут маяком, освещающим всю галактику."
 ambition.115.name: "Клятва защитников"
 ambition.115.desc: "Галактика сказала свое слово — и не из страха, но из доверия. Нам доверили должность хранителей, облеченную властью, выходящей далеко за пределы обычного мандата. Такие чрезвычайные полномочия даны нам в связи с крайней необходимостью. Это не почести, которыми мы бы жаждали обладать, но бремя, которое мы принимаем ради общего блага.\n\nМы используем эту власть не для того, чтобы повелевать, а чтобы служить. Пока мир остается не более чем передышкой между войнами, пока среди звезд таятся угрозы, мы продолжим блюсти свою клятву. Однажды придет время, когда мы сложим с себя полномочия. А пока этот час не настал, мы будем использовать их осмотрительно, решительно и целеустремленно."
 ambition.115.a: "И в том клянемся."
 ambition.120.name: "Защитники галактики"
 ambition.120.desc: "Мы знали, что этот день настанет. Несмотря на все наши объединенные усилия, мы столкнулись с угрозой, ставящей под вопрос само существование галактики. Наш враг не знает пощады, ему чужды компромиссы. Он угрожает всем — и мы будем сражаться за все народы галактики.\n\nВсе наши союзы, все трудности, которые мы преодолевали, — всё готовило нас к этому моменту. Мы не ставим себя выше остальной галактики — мы выступаем в ее защиту. Мы вступаем в бой против гибели и отчаяния — не как завоеватели, но как хранители.\n\nСегодня, как никогда, мы не можем отступить."
 ambition.120.a: "За галактику!"
 ambition.125.name: "Без страха и упрека"
 ambition.125.desc: "Сегодня по коридорам Сената ступает новое поколение дипломатов. Великолепно обученные, безмерно терпеливые и безгранично преданные нашему делу, они олицетворяют нашу приверженность миру и единству. Их выступления не просто красноречивы — они полны искренности. Деятельность наших посланников редко попадает на первые полосы газет, но именно их работа обеспечивает прочный мир и сотрудничество в галактике.\n\nКаждое их слово, каждый жест служат лишь одной цели — показать, что мы стремимся не к власти, а только к стабильности. Нам нечего скрывать, а потому и нечего бояться."
 ambition.125.a: "Важна каждая дипломатическая победа."
 ambition.130.name: "Война символов"
 ambition.130.desc: "Символ не появляется сам по себе — его кропотливо и осознанно создают. Если нашим героям суждено стать маяками надежды, то и корабли их должны отражать эту роль. Это должны быть не просто боевые корабли — они должны стать тем самым светом, что ведет нас сквозь тьму.\n\nБело-золотые корпуса, сверкающие носовые фигуры, дизайн, сочетающий изящество и мощь. А внутри — лучшее, на что способны наши технологии, сколько бы это ни стоило. Эти корабли излучают не только мощь, но и уверенность. Это воплощение наших стремлений: единства, силы и несгибаемой воли перед ликом забвения."
 ambition.130.a: "Пусть они разожгут огонь надежды."
 ambition.135.name: "То, что скрывается в ночи"
 ambition.135.desc: "Наше расследование принесло результаты — пугающие и, увы, неопровержимые. Обсерватории в дальнем космосе, секретные посты перехвата, древние банки данных — все они говорят об одном. Что-то приближается.\n\nЭто не ложная тревога и не вызванная аномалией ошибка. Угроза реальна и неминуема, а ее масштабы превосходят всё, к чему готовили силы обычной космической обороны. Медлить нельзя, все наши приготовления следует немедленно довести до конца. Время на исходе, но врагу не удастся застать нас врасплох. Мы готовы."
 ambition.135.a: "Скоро ужас ужаснется."
 ambition.140.name: "Беда не приходит одна"
 ambition.140.desc: "Наша бдительность вновь принесла плоды. Пока галактика готовилась встретить одну экзистенциальную угрозу, мы обнаружили признаки второй. Враг пока еще таится и не проявляет себя, но доказательства неопровержимы: опасность реальна, и с каждым днем она всё ближе.\n\nНо на этот раз мы подготовились загодя. Надо перехватить инициативу и нанести удар прежде, чем враг наберет силу. Битва предстоит жестокая, но на нашей стороне будет элемент неожиданности. Мы не отступим — ни сегодня, ни впредь, и да будут звезды тому свидетелями."
 ambition.140.a: "Наша служба продолжается."
 ambition.200.name: "Программа «Паладин»"
 ambition.200.desc: "С принятием резолюции программа «Паладин» из абстрактной концепции превратилась в официально утвержденный проект. С этого момента все державы-участники начнут совместно разрабатывать доктрину, набирать персонал и выделять материальные ресурсы, необходимые для реализации программы.\n\nНабор в ряды паладинов все члены [global_event_country.GetCommunityOrImperium&gen] будет осуществлять самостоятельно, наша же задача — курировать разработку нового класса передовых кораблей, которые паладины примут на вооружение."
 ambition.200.a: "За работу."
 ambition.205.name: "Корабли паладинов готовы"
 ambition.205.desc: "Проект корабля паладинов готов. Мощь и красота его изящных обводов скоро станут зримым воплощением нашей решимости. Эти корабли снаряжены для битвы, однако их истинное предназначение — гарантировать мир. Само их существование подтверждает, что мы всегда будем там, где в нас нуждаются."
 ambition.205.a: "Так построим же его!"
 ambition.210.name: "Выбор паладина"
 ambition.210.desc: "Мы закончили сборку корабля паладина. Его позолоченный корпус мягко сияет в свете звезд, а двигатели издают мощный, уверенный гул. Отправлять такой шедевр в битву кажется почти кощунством…\n\nТеперь мы должны доверить мостик герою, достойному принять управление этим судном. Герою, решимость которого не уступает силе корабельных орудий. Герою, которому достанет мужества шагнуть в самое сердце тьмы."
 ambition.210.a: "Лишь самые достойные служат в наших рядах."
 ambition.216.name: "Подкласс паладина"
 ambition.216.desc: "[Root.GetName], наш новый паладин, уже [Root.GetAXX::зарекомендовал|||fem:зарекомендовала] себя как §Y[Root.GetPaladinSubclass]§!. В принципе, мы могли бы подобрать для н[Root.GetHisHer] другую специализацию, но это потребует немалых ресурсов, причем не только на переподготовку, но и на переосмысление [Root.GetHisHer] публичного имиджа в соответствии с новой ролью."
 ambition.216.a: "Не будем ничего менять."
 ambition.216.b: "Переучить [Root.GetHisHer] на §Yпилота-аса§!"
 ambition.216.c: "Переучить [Root.GetHisHer] на §Yхитроумного стратега§!"
 ambition.216.d: "Переучить [Root.GetHisHer] на §Yрейнджера§!"
 ambition.216.e: "Переучить [Root.GetHisHer] на §Yгения логистики§!"
 ambition.216.f: "Переучить [Root.GetHisHer] на §Yзащитника§!"
 ambition.216.g: "Переучить [Root.GetHisHer] на §Yострие копья§!"
 ambition.216.h: "Переучить [Root.GetHisHer] на §Yрыцаря§!"
 ambition.225.name: "Роспуск подразделения паладинов"
 ambition.225.desc: "С ликвидацией непосредственных угроз галактическому спокойствию программа «Паладин» выполнила свое предназначение. Согласно условиям мандата, подразделение будет расформировано, корабли выведены из эксплуатации, а командные структуры распущены.\n\nОт паладинов останется лишь память о героических подвигах, совершенных в час величайшей нужды галактики. Прекращение программы «Паладин» говорит не о провале, а об ошеломительном успехе проекта. В галактике воцарился мир, и она более не нуждается в защитниках."
 ambition.225.a: "Слава нашим доблестным защитникам!"
 ambition.230.name: "Прямое управление"
 ambition.230.desc: "В свете нарастающей напряженности и потребности в едином военном командовании авангард паладинов официально переходит под прямое управление Хранителя. Первоначальный мандат программы предполагал самостоятельность и гибкое взаимодействие, однако в нынешних условиях необходима более жесткая командная структура.\n\nЭто решение далось нам нелегко. Паладины по-прежнему сохраняют свой статус и авторитет, однако теперь они должны действовать в рамках существующей командной иерархии стратегических сил. Сегодня мы нуждаемся в них как никогда прежде, и потому деятельность паладинов будет продолжена — но теперь они будут действовать как единый слаженный механизм, а не как агенты-одиночки. Сама их миссия не изменилась."
 ambition.230.a: "Это вынужденная необходимость."
 ambition.235.name: "Отмена прямого управления"
 ambition.235.desc: "Так как непосредственная угроза миновала, в едином командовании больше нет нужды, и потому оперативный контроль над авангардом паладинов будет возвращен к принципам первоначального мандата. Паладины выйдут из прямого подчинения Хранителю и снова станут подотчетны членам Галактического совета.\n\nВосстановление их самостоятельности свидетельствует о нашей приверженности политике открытости и доверия. Паладины воплощают в себе идеалы единства, а не подчинения. Они служат не одному государству, но общей воле галактики."
 ambition.235.a: "Слава паладинам!"
 ambition.325.name: "В галактике воцарился мир"
 ambition.325.desc: "Угроза миновала. Галактика, еще недавно стоявшая на краю гибели, постепенно вступает в период возрождения. В мандате Хранителя более нет нужды, и потому мы делаем логичный шаг и добровольно слагаем с себя полномочия. Чрезвычайные меры, предпринятые в ответ на кризис, завершаются жестом доброй воли.\n\nСозданные нами союзы, пример, который мы подали галактике, — вот каким будет наше наследие. Мы остались верны своим принципам и доказали, что способны руководить и защищать без принуждения. Сейчас звезды в безопасности, и нам этого достаточно."
 ambition.325.a: "Наконец-то мы можем отдохнуть."
