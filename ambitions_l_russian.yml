 paladin_recall: "Экстренное возвращение"
 paladin_recall_ship_button: "\nТелепортирует корабль паладина к ближайшей невраждебной космической базе, а также ремонтирует до §G25%§! его §Yброни§! и §Yкорпуса§!."
