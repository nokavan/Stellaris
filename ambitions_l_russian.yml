 integrity: "Отвага"
 integrity_name: "$integrity$:"
 integrity_value: "£integrity£ $VAL|0$"
 integrity_gaining: "Выполняйте §Hзадания устремления§!, чтобы накапливать £integrity£ §Yотвагу§!."
 integrity_desc: "Отвага отражает нашу готовность защищать галактику от тирании и разрушения."
 integrity_crisis_objective: "Задания устремления"
 integrity_crisis_objective_gained: "Получена отвага"
 integrity_crisis_objective_reward: "$REWARD$"
 integrity_crisis_objective_progress: "Мы получили $AMOUNT$ £integrity£ от этого задания устремления."
 integrity_crisis_level_locked: "Требуется для открытия этого уровня:\n"
 integrity_crisis_level_unlocked: "$LEVEL$ даст награды:\n"
 integrity_crisis_level_desc: "Для получения уровней устремления накапливайте отвагу."
 integrity_crisis_level_unlock: "Значение отваги: §Y$CURRENCY$§! £integrity£"
 integrity_current_value: "Текущий показатель: §Y$VALUE|0$§!"
 integrity_crisis_description_title: "Защитник галактики"
 integrity_crisis_description: "Теоретики Галактического сообщества, экстраполирующие исторические события, уже давно предсказывали возможное появление §Rкризиса§! — угрозы всему сущему, для победы над которой потребуются невиданные доселе единство и жертвы. Если ее вообще возможно победить.\n\nНаиболее распространенными предположениями о природе возможного кризиса были вторжение межгалактических пожирателей, восстание разумных машин или борьба за наследство в другом измерении, захлестнувшая наше, и…\n\nТеперь ясно, что роль защитников галактики отведена §Gнам§!.\n\nКакие бы чудовища или тираны не угрожали космосу, наши стражи всегда наготове. Скоро все узнают, что эта часть вселенной никому не по зубам!"
 integrity_crisis_howto_title: "Служение и самопожертвование"
 integrity_crisis_howto: "Выполнение §Hзаданий амбиций§! повышает £integrity£ §Hотвагу§! — свидетельство нашей решимости, которая воодушевит свободные народы галактики присоединиться к нашей борьбе в защиту жизни и свободы."
 #Objectives
 crisobj_defensive_pacts_name: "Создавайте альянсы"
 crisobj_defensive_pacts_desc: "Секрет силы кроется в единстве. Наше дело правое, но даже правое дело не защитить без могущественных союзников, и мы не сможем спасти галактику, если она не хочет нашей защиты. Необходимо искать тех, кто разделяет наши ценности и готов сражаться за них плечом к плечу с нами.\n\nДля §Yежегодного§! прироста отваги заключайте §Yпакты о взаимной защите§! и предоставляйте §Yстатус ассоциации с федерацией§!."
 crisobj_federated_name: "Станьте частью федерации"
 crisobj_federated_desc: "Узы федерации разорвать непросто. Гармоничное сотрудничество с империями единомышленников откроет для нас эпоху невиданного процветания.\n\nДля §Yежегодного§! прироста отваги создайте §Yфедерацию§! или присоединитесь к существующей."
 crisobj_not_in_aggressive_war_name: "Не участвуйте в агрессивных войнах"
 crisobj_not_in_aggressive_war_desc: "Мы хранители, а не агрессоры. Нужно быть стойкими, чтобы заслужить доверие всей галактики.\n\nДля §Yежемесячного§! прироста отваги не начинайте §Yагрессивных войн§! и не присоединяйтесь к чужим войнам на стороне §Yагрессора§!."
 crisobj_galcom_activity_name: "Вносите вклад в Галактическое сообщество"
 crisobj_galcom_activity_desc: "Демократические принципы Галактического сообщества — наилучший способ обрести единство. Они позволят нам стать щитом, способным выстоять перед любой угрозой, но в то же время уважать автономию каждого участника.\n\nДля увеличения отваги поддерживайте успешные §Yрезолюции§! Галактического сообщества."
 crisobj_destroy_crisis_ships_name: "Уничтожайте корабли государств, ответственных за кризис"
 crisobj_destroy_crisis_ships_desc: "Применение силы должно быть нашим последним доводом, однако врагам галактики не стоит ждать пощады!\n\nДля увеличения отваги уничтожайте корабли §Yкризисов§!."
 crisobj_destroy_crisis_countries_name: "Избавиться от кризисов"
 crisobj_destroy_crisis_countries_desc: "Мы не стремимся к войне, но не станем мириться с теми, кто угрожает галактике. Если придется, мы позаботимся о том, чтобы эти разрушительные силы остались лишь в учебниках истории.\n\nДля увеличения отваги уничтожайте §Yгосударства-кризисы§!."
 #Perks
 triggered_opinion_ap_defender_of_the_galaxy_1: "$menp_defender_opinion_1$"
 triggered_opinion_ap_defender_of_the_galaxy_2: "$menp_defender_opinion_2$"
 triggered_opinion_ap_defender_of_the_galaxy_3: "$menp_defender_opinion_3$"
 menp_defender_objectives: "Отвага"
 menp_defender_objectives_desc: "Отвага растет в результате решительных действий по защите галактики. Она не дается просто так — ее необходимо заслужить, доказав всему обитаемому космосу, что мы действуем не в корыстных интересах, но во имя общей безопасности."
 unlocks_defender_objectives: "Позволяет накапливать £integrity£ §Yотвагу§!, выполняя §Hзадания амбиций§!."
 menp_defender_opinion_1: "Благородные сердца"
 menp_defender_opinion_1_desc: "Чтобы повести за собой других, нужно добиться признания — не внушая страх, но обещая надежду. Мы приложим все усилия, чтобы вдохновлять, просвещать и укреплять доверие между всеми обитателями галактики."
 unlocks_defender_opinion_1: "£opinion£ §YОтношение§! к нам всех государств, способных вести дипломатию, повышается на §G+40§!"
 menp_defender_galcom_1: "Вдохновленные ораторы"
 menp_defender_galcom_1_desc: "Речи хороши лишь настолько, насколько убедителен оратор. Надо подбирать слова так, чтобы достучаться до умов и сердец других обитателей галактики, какими бы чуждыми они нам ни казались."
 menp_defender_federation_1: "Надежные союзники"
 menp_defender_federation_1_desc: "Федеральная администрация — могущественный инструмент, способный сослужить хорошую службу всем нашим союзникам."
 menp_defender_crisis_damage_1: "Вызов"
 menp_defender_crisis_damage_1_desc: "Мы сильны духом и никогда не станем уклоняться от схватки из страха перед смертью."
 unlocks_defender_crisis_damage_1: "Урон фракциям, ответственным за кризис: §G+15%§!"
 menp_defender_galcom_2: "Политические лидеры"
 menp_defender_galcom_2_desc: "Наше влияние растет, а с ним увеличиваются и возможности вносить изменения в Галактическое сообщество. Союзники нам доверяют, и мы обязаны оправдать их надежды."
 menp_defender_galcom_2_structures: "Открывает возможность стоить некоторые §Yсооружения§! в §Yсоюзных§! системах.\n"
 menp_defender_federation_2: "Братья по оружию"
 menp_defender_federation_2_desc: "Мы защищаем галактику, но отрадно, что и у нас есть защитники. Мы все становимся сильнее, если можем положиться друг на друга."
 unlocks_defender_federation_2: "Ежемесячный прирост опыта федерации: §G+2§!"
 menp_defender_crisis_damage_2: "Преданность долгу"
 menp_defender_crisis_damage_2_desc: "Галактика верит в нас, и мы ее не подведем."
 unlocks_defender_crisis_damage_2: "Урон фракциям, ответственным за кризис: §G+15%§!"
 menp_defender_opinion_2: "Герои галактики"
 menp_defender_opinion_2_desc: "Символизм всегда играл важную роль в судьбе империй. Чтобы не оставить и тени сомнения в наших намерениях, нам следует выбрать узнаваемые символы, вокруг которых может сплотиться вся галактика."
 unlocks_defender_opinion_2: "£opinion£ §YОтношение§! к нам всех государств, способных вести дипломатию, повышается на §G+100§!\nОткрывается резолюция по §Yпрограмме «Паладин»§! в Галактическом сообществе."
 menp_defender_research_1: "Мозжечковая программа"
 menp_defender_research_1_desc: "Пусть знания — это сила, однако подлинная мощь кроется в обмене ими. Передавая союзникам знания, мы показываем, что сила не обязательно разделяет. Если использовать ее с умом, она способна сплотить ради общего дела."
 menp_defender_defense_1: "Укрепленные станции"
 menp_defender_defense_1_desc: "Главной силой для нас являются корабли, но это не единственное оружие в нашем арсенале. Станции остановят натиск врага и станут наковальней, по которой ударит молот нашего флота."
 menp_defender_defense_1_tt: "$defensive_stations_hull_mult$: §G+15%§!\n$defensive_stations_armor_mult$: §G+10%§!\n$defensive_stations_shield_hardening_add$: §G+15%§!"
 menp_defender_crisis_damage_3: "Почитаемые мученики"
 menp_defender_crisis_damage_3_desc: "В стремлении к смерти нет особой доблести, однако готовность погибнуть за правое дело — это великая честь. Победа в войне за спасение галактики не обходится без жертв, и те, кто отдал свою жизнь за других, не должны быть забыты."
 unlocks_defender_crisis_damage_3: "Урон фракциям, ответственным за кризис: §G+25%§!"
 menp_defender_opinion_3: "Светоч единства"
 menp_defender_opinion_3_desc: "Теперь вся галактика понимает, чего мы стоим. Жители бесчисленных миров твердо знают, что мы готовы пожертвовать жизнью, чтобы защитить их."
 unlocks_defender_opinion_3: "£opinion£ §YОтношение§! к нам всех государств, способных вести дипломатию, повышается на §G+200§!\nОткрываются новые резолюции по §Yпаладинам§! в Галактическом сообществе."
 menp_defender_custodian: "Высшая должность"
 menp_defender_custodian_desc: "Огромная власть влечет за собой огромную ответственность. Полномочия хранителя — это бремя, которое нам приходится нести ради общего блага. Подобная власть не должна использоваться ради удовлетворения личных амбиций, но только для достижения высших идеалов галактики."
 unlocks_defender_custodian: "Открываются 4 особые §Yрезолюции§! хранителя, которые может принять §Y[GetGalCommunityOrGalImperium]§!"
 menp_defender_defense_2: "Непоколебимая решимость"
 menp_defender_defense_2_desc: "Мы готовы шагнуть навстречу верной гибели не потому, что мы сильнее, а потому, что таков наш долг."
 menp_defender_crisis_damage_4: "Любой ценой"
 menp_defender_crisis_damage_4_desc: "Мы не раз нарушали законы войны — и хорошо осознаем, что за это придется заплатить. Когда кризис закончится, мы готовы предстать перед судом. Но до тех пор мы будем делать всё необходимое, чтобы в галактике остались те, кто сможет осудить нас."
 unlocks_defender_crisis_damage_4: "Урон фракциям, ответственным за кризис: §G+35%§!"
 menp_defender_galcom_3: "Гармоничная стратегия"
 menp_defender_galcom_3_desc: "Оборона всегда требует секретности, но в данной ситуации галактика должна объединить усилия, чтобы разработать наилучший план борьбы со смертельным врагом."
 unlocks_defender_galcom_3: "Открываюся особые §Yрезолюции§! по анализу кризисов, которые может принять §Y[GetGalCommunityOrGalImperium]§!"
 final_price_doctrine: "Окончательная цена"
 final_price_doctrine_desc: "Наши солдаты знают свой долг. Чтобы спасти нас, они готовы заплатить величайшую цену, и их имена будут навеки вписаны в историю галактики."
 force_preservation_doctrine: "Сохранение сил"
 force_preservation_doctrine_desc: "В интересах дела мы должны беречь свои силы и не растрачивать солдат попусту, пока не придет время отдать наши жизни с наибольшей пользой."
 menp_defender_research_2: "Никаких секретов"
 menp_defender_research_2_desc: "Мы откажемся от секретности, которая подталкивает нас эгоистично скрывать достижения технического прогресса. Чем сильнее будут наши союзники, тем сильнее станем и мы."
 menp_defender_defense_3: "Защитники галактики"
 menp_defender_defense_3_desc: "Мы будем бороться за каждую звезду, каждую планету, каждую жизнь. Не отдадим врагу ни пяди нашего космоса!"
 #Resolutions
 resolution_custodian_expand_gdf_2: "Наднациональные силы обороны"
 resolution_custodian_expand_gdf_2_desc: "Силы галактической обороны — наш лучший шанс сразиться против кошмаров, угрожающих нашей галактике. Армия, которая держится в стороне от раздоров между отдельными государствами, входящими в [global_event_country.GetCommunityOrImperium], станет самой надежной военной силой в космосе."
 resolution_custodian_gdf_drills: "Совместные военные учения"
 resolution_custodian_gdf_drills_desc: "Учения, скоординированные между участниками, входящими в [global_event_country.GetCommunityOrImperium], помогут выступить единым фронтом против любых захватчиков и тиранов. Вместе мы непобедимы."
 resolution_custodian_council: "Усиление совета"
 resolution_custodian_council_desc: "Бремя лидерства — тяжкая ноша. Сотрудничая с другими участниками, входящими в [global_event_country.GetCommunityOrImperium], мы получим возможность выделить дополнительные ресурсы членам Галактического совета — а они, в свою очередь, смогут помочь всем нам."
 resolution_custodian_council_tooltip: "Члены Совета:$TABBED_NEW_LINE$• $MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §G+10%§!$TABBED_NEW_LINE$• $mod_country_unity_produces_mult$: §G+10%§!$TABBED_NEW_LINE$• $mod_gdf_ship_cost_mult$: §G-5%§!$TABBED_NEW_LINE$• $MOD_DIPLO_WEIGHT_MULT$: §R-20%§!"
 resolution_custodian_reduce_council_power: "Аннулировать резолюцию «$resolution_custodian_council$»"
 resolution_custodian_reduce_council_power_desc: "Аннулируется резолюция §Y«$resolution_custodian_council$»§!"
 resolution_custodian_gdf_3: "$resolution_custodian_expand_gdf_2$"
 resolution_custodian_gdf_4: "$resolution_custodian_gdf_drills$"
 mod_gdf_ship_cost_mult: "[GetGDFOrArmada]: затраты на корабли"
 mod_shipclass_starbase_shield_hardening_add: "Усиление щитов космической базы"
 no_defender_of_the_galaxy: "$TRIGGER_FAIL$Защитники галактики не могут стать Галактическим императором"
 resolution_custodian_paladin_initiative: "Программа «Паладин»"
 resolution_custodian_paladin_initiative_desc: "Галактике нужен источник вдохновения — яркие, узнаваемые личности, которые поведут наши флотилии к победе."
 resolution_custodian_paladin_initiative_tooltip: "Открывает особый проект §Y«$PALADIN_SHIP_PROJECT$»§!, который позволит привлекать выдающихся героев, командующих уникальными кораблями."
 resolution_needs_gdf: "$TRIGGER_FAIL$Должна быть принята резолюция §H«Силы галактической обороны»§!"
 resolution_custodian_disband_paladin_initiative: "Расформировать паладинов"
 resolution_custodian_disband_paladin_initiative_desc: "Время героев миновало. Мы благодарим паладинов за службу и верим, что они всегда будут готовы вернуться в строй, когда в этом вновь возникнет необходимость."
 resolution_category_crisis_analysis: "$crisis_analysis$"
 crisis_analysis: "Кризисный анализ"
 crisis_analysis_upkeep_modifier: "Затраты на кризисный анализ"
 crisis_analysis_khan_modifier: "Вмешательство Галактического сообщества"
 crisis_analysis_tempest_modifier: "$crisis_analysis_khan_modifier$"
 crisis_analysis_voidworms_modifier: "$crisis_analysis_khan_modifier$"
 crisis_analysis_cetana_modifier: "$crisis_analysis_khan_modifier$"
 crisis_analysis_prethoryn_modifier: "$crisis_analysis_khan_modifier$"
 crisis_analysis_contingency_modifier: "$crisis_analysis_khan_modifier$"
 crisis_analysis_unbidden_modifier: "$crisis_analysis_khan_modifier$"
 resolution_custodian_democratic_proceedings: "Демократические процедуры"
 resolution_custodian_democratic_proceedings_desc: "Разделив часть полномочий хранителя с членами совета, мы позволим им оптимизировать работу сената и избавим себя от административной рутины."
 resolution_custodian_repeal_democratic_proceedings: "Отмена демократических процедур"
 resolution_custodian_repeal_democratic_proceedings_desc: "Быстро — не значит хорошо. Продолжительные заседания сената, предоставляющие достаточно времени для дискуссий, более соответствуют идеалам демократии."
 resolution_crisis_analysis_khan: "$crisis_analysis$: Великий хан"
 resolution_crisis_analysis_khan_desc: "Пусть хан и могущественный военачальник, однако его армия — просто сброд, не имеющий представления о дисциплине. Единственный козырь этих бойцов — зверская жестокость."
 resolution_crisis_analysis_tempest: "$crisis_analysis$: Серая буря"
 resolution_crisis_analysis_tempest_desc: "Нанитовые облака Серой бури внушают ужас, однако они следуют определенной программе. Если мы сумеем взломать ее алгоритм — им конец."
 resolution_crisis_analysis_voidworms: "$crisis_analysis$: Пустотные черви"
 resolution_crisis_analysis_voidworms_desc: "Какими бы мерзкими ни были пустотные черви, это просто животные. Наверняка мы найдем стратегию, которая поможет их остановить."
 resolution_crisis_analysis_cetana: "$crisis_analysis$: Королева синтетиков"
 resolution_crisis_analysis_cetana_desc: "Кетана — опасный противник, однако за ее загадочной улыбкой таится бездушная программа. Пусть в жилах королевы синтетиков и не течет кровь, мы сумеем ее одолеть."
 resolution_crisis_analysis_prethoryn: "$crisis_analysis$: Преторианский рой"
 resolution_crisis_analysis_prethoryn_desc: "Преторианцами движет неутолимый голод, в каком-то смысле это делает их предсказуемыми. Они могущественны, но победить их всё же можно."
 resolution_crisis_analysis_contingency: "$crisis_analysis$: Контингенция"
 resolution_crisis_analysis_contingency_desc: "Бездушная логика Контингенции внушает страх, но ее корабли были созданы тысячелетия назад. Мы обязательно найдем способ их уничтожить."
 resolution_crisis_analysis_unbidden: "$crisis_analysis$: Захватчики из другого измерения"
 resolution_crisis_analysis_unbidden_desc: "Незваные и их мерзкие сородичи слишком полагаются на энергетическое оружие и щиты. Мы можем использовать эту слабость."
 resolution_repeal_crisis_analysis: "Отмена кризисного анализа"
 resolution_repeal_crisis_analysis_desc: "Мы больше не нуждаемся в постоянно действующих стратегических комитетах."
 cancel_crisis_resolution: "Все действующие резолюции по §Hкризисному анализу§! будут аннулированы"
 ongoing_crisis: "Кризис в активной фазе"
 no_current_crisis: "Кризис завершен"
 anti_crisis_reprio: "Новый кризис требует нашего внимания"
