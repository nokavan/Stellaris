 paladin_field_testing: "Полевые испытания"
 paladin_field_testing_ship_button: "\nИспользование этих опасных прототипов вооружения может привести к непредсказуемым последствиям."
 paladin_field_testing_activity_key: "$paladin_field_testing$"
 paladin_field_testing_menu_title: "$paladin_field_testing$"
 paladin_field_testing_progress_activity_key: "$paladin_field_testing$"
 paladin_harmonic_disruption: "Нарушение гармонии"
 paladin_air_superiority: "Превосходство в воздухе"
 paladin_air_superiority_ship_button: "\nНа §Y£time£ 3 месяца§! все враждебные корабли в этой системе получают:\n• §R−85%§! к урону системы ПВО\n• §R−85%§! к урону штурмовика\n• §R−85%§! к восстановлению штурмовиков"
