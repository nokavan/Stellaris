 # Paladin Traits
 leader_trait_paladin: "Паладин"
 leader_trait_paladin_desc: "Этот лидер облачен в мантию паладина. Он является воплощением доблести, и все его слова и поступки подчинены одной цели — защите галактики."
 leader_trait_paladin_effect: "Этот лидер не требует §Yсодержания§! и не учитывается при подсчете §Yмаксимального количества лидеров§!"
 leader_trait_paladin_ace: "Пилот-ас"
 leader_trait_paladin_ace_desc: "Молниеносные рефлексы и способность быстро принимать решения позволяют этому паладину миновать любую защиту и ударить врага в самое сердце."
 leader_trait_paladin_strategist: "Хитроумный стратег"
 leader_trait_paladin_strategist_desc: "Этот хладнокровный и рассудительный паладин виртуозно составляет планы, эффективно раскрывающие весь потенциал его спутников."
 leader_trait_paladin_strategist_tt: "Флотилии в системе:$TABBED_NEW_LINE$• Скорострельность корабельных орудий: §G+30%§!"
 PALADIN_STRATEGIST_AURA: "Руководство хитроумного стратега"
 leader_trait_paladin_ambusher: "Рейнджер"
 leader_trait_paladin_ambusher_desc: "Этот сосредоточенный и терпеливый паладин — специалист по нанесению сокрушительного решающего удара."
 leader_trait_paladin_logistician: "Гений логистики"
 leader_trait_paladin_logistician_desc: "Обладая быстрым умом и научной подготовкой, этот паладин даже в жарком бою блестяще справляется с вопросами снабжения и технического обслуживания."
 leader_trait_paladin_logistician_tt: "Флотилии в системе:$TABBED_NEW_LINE$• Содержание кораблей: §G-15%§!"
 PALADIN_LOGISTICIAN_AURA: "Оптимизация гения логистики"
 leader_trait_paladin_defender: "Защитник"
 leader_trait_paladin_defender_desc: "Этот стойкий и непоколебимый паладин верит, что корабль и команда не подведут его даже в самой трудной ситуации. Он всегда готов встать на защиту союзников, попавших в беду."
 leader_trait_paladin_spearhead: "Острие копья"
 leader_trait_paladin_spearhead_desc: "Этот отважный паладин всегда бьется в первых рядах. Умелое руководство союзниками помогает ему совладать даже с самым грозным врагом."
 leader_trait_paladin_knight: "Рыцарь"
 leader_trait_paladin_knight_desc: "Этот паладин дал обет отваги. Его решимость непоколебима, и ему нет равных в бою."
 # Paladin Ships
 paladin_ship: "Корабль паладина"
 paladin_ship_plural: "Корабли паладинов"
