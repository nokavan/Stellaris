 SHIP_GRAPHICS_PALADIN_SHIP_DESC: "На стыке искусства и технологий рождаются символы свободы, призванные сиять наперекор тьме."
 SHIP_PALADIN_CREST: "Герб паладина"
 SHIP_PALADIN_CREST_DESC: "Этот изящный символ показывает, что кораблем командует паладин — героический защитник Галактического сообщества."
 SHIP_PALADIN_CREST_TT: "Открывает уникальные корабельные способности."
