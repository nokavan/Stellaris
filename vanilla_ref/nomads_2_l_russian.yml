 zone_ark_missile_silos: "Ракетные шахты"
 zone_ark_missile_silos_desc: "Специальные технические бригады следят за состоянием и готовностью ракетных шахт, жертвуя выработкой энергии ради возможности нанести первый удар."
 zone_ark_ammunition_lines: "Снарядные конвейеры"
 zone_ark_ammunition_lines_desc: "Круглосуточное производство кинетических боеприпасов гарантирует, что орудия никогда не смолкнут. Учтён каждый заряжающий механизм, каждая гильза, каждый грамм взрывчатого вещества."
