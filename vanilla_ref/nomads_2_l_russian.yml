 # Singular: £nomad£ ['concept_nomadic_empire'] or £nomad£ §H$concept_nomadic_empire$§!
 # Plural: £nomad£ ['concept_nomadic_empires'] or £nomad£ §H$concept_nomadic_empires$§!
 concept_nomadic_empire: "Кочевое государство"
 concept_nomadic_empires: "Кочевые государства"
 concept_nomadic_empire_desc: "£nomad£ §H$concept_nomadic_empires$§! — это цивилизации, существующие на борту космических £arkship£ ['concept_arkships', кораблей-ковчегов]. Они не привязаны к £colony£ ['concept_colonies', колониям], не могут захватывать £system£ ['concept_systems', системы] или колонизировать £planet£ ['concept_planets', планеты].\n\n§HКочевые государства§! могут строить £waystation£ ['concept_waystations', маршрутные станции] для сбора ресурсов, а также принимать £contract£ ['concept_contracts', контракты] у £planet£ ['concept_settled_empires', оседлых государств]."
 # Singular: £district£ ['concept_district_ark_military'] or £district£ §H$concept_district_ark_military$§!
 # Plural: £district£ ['concept_district_ark_military_plural'] or £district£ §H$cconcept_district_ark_military_plural$§!
 concept_district_ark_military: "$district_ark_military$"
 concept_district_ark_military_plural: "$district_ark_military_plural$"
 concept_district_ark_military_desc: "• £housing£ ['concept_housing', Жилье]: §G+200§!\n• Должности £mod_job_technician_add£ ['concept_technicians', техников]: §G+200§!\n\n§L$district_generator_desc$§!"
 # Singular: ['concept_operational_reserves'] or §H$concept_operational_reserves$§!
 concept_operational_reserves: "Оперативные резервы"
 concept_operational_reserves_desc: "§H$concept_operational_reserves$§! — это совокупность £minerals£ ['concept_minerals', минералов] и £energy£ ['concept_energy', энергокредитов] для £nomad£ ['concept_nomadic_empires', кочевых государств].\n\n£minerals£ §HМинералы§! и £energy£ §Hэнергокредиты§! у кочевников накапливаются и тратятся — так же как и у других государств, — но управление расходами и прибылью происходит посредством ['concept_situation', инцидента].\n\nОдно очко §Hоперативных резервов§! эквивалентно одной единице £minerals£ §Hминералов§! или одному £energy£ §Hэнергокредиту§!.\n\n$nomad_max_reserves_breakdown$\n\n§HЭтапы§! инцидента по-разному влияют на £arkship£ ['concept_arkships', корабли-ковчеги] государства. Тот или иной §Hподход§! позволяет, например, сэкономить ресурсы или увеличить их расход для повышения производительности.\n\n£minerals£§HМинералы§! и £energy£ §Hэнергокредиты§! можно покупать на £market£ ['concept_market', рынке], но нельзя продавать."
 operational_reserves_desc: "§t$concept_operational_reserves_desc$§!\n\n§GЩёлкните ['concept_operational_reserves'], чтобы открыть банк данных.\nЩёлкните по значку £operational_reserves£ в меню, чтобы открыть ['concept_situation_log_view', журнал].§!"
 # Singular: £planet£ ['concept_settled_empire'] or £planet£ §H$concept_settled_empire$§!
 # Plural: £planet£ ['concept_settled_empires'] or £planet£ §H$concept_settled_empires$§!
 concept_settled_empire: "Оседлое государство"
 concept_settled_empires: "Оседлые государства"
 concept_settled_empire_desc: "£planet£ §H$concept_settled_empires$§! — это цивилизации, управляемые из £colony£ ['concept_colonies', колоний] или с £planet£ ['concept_planets', планет]. Они могут захватывать £system£ ['concept_systems', системы] и защищать их с помощью ['concept_starbases', космических баз].\n\nДля £nomad£ ['concept_nomadic_empires', кочевников] §Hоседлые государства§! — потенциальные партнёры, которые могут выдавать £contract£ ['concept_contracts', контракты] и заключать ['concept_diplomatic_pacts', дипломатические пакты]. Однако если флотилия кочевников пересечёт границы оседлого государства, могут возникнуть дипломатические трения."
 # Singular: £contract£ ['concept_contract'] or £contract£ §H$concept_contract$§!
 # Plural: £contract£ ['concept_contracts'] or £contract£ §H$concept_contracts$§!
 concept_contract: "Контракт"
 concept_contracts: "Контракты"
 concept_contract_desc: "£contract£ §H$concept_contracts$§! — это задания, которые £planet£ ['concept_settled_empires', оседлые государства] поручают £nomad£ ['concept_nomadic_empires', кочевым], либо же внутренние поручения от одной части §Hкочевого государства§! для другой.\n\nКонтракты бывают разнообразными: от налётов на соперников до перевозки дипломатов, и для их выполнения, как правило, требуется £arkship£ ['concept_arkships', корабль-ковчег].\n\n§HКонтракты§! перечислены в £interface£ ['concept_situation_log_view', журнале] во вкладке «$situation_log_view_tab_situation_log$»."
 # Singular: £waystation£ ['concept_waystation'] or £waystation£ §H$concept_waystation$§!
 # Plural: £waystation£ ['concept_waystations'] or £waystation£ §H$concept_waystations$§!
 concept_waystation: "$waystation$"
 concept_waystations: "$waystation_plural$"
 concept_waystation_desc: "£waystation£ §H$concept_waystations$§! — это космические сооружения, которые могут строить £nomad£ ['concept_nomadic_empires', кочевые государства]. Благодаря таким станциям можно собирать космические ресурсы и прокладывать межзвёздные торговые пути — так называемые £wayline£ ['concept_waylines', маршрутные линии].\n\nСобираемые §Hмаршрутными станциями§! ресурсы будут находиться в §Hзапасах§!, пока их не заберёт £construction_ship£ ['concept_logistic_ship', логистический корабль] или £arkship£ ['concept_arkship', корабль-ковчег].\n\n§HМаршрутные станции§! можно строить в £system£ ['concept_systems', системах] без разрешения §Hвладельца§!, что влечёт за собой дипломатические штрафы: владелец системы получает цель войны §H«$war_goal_wg_expel_nomads$»§!. Чтобы избавиться от штрафа, необходимо подписать ['concept_wayline_pact', маршрутный пакт].$DOUBLE_NEW_LINE$Количество §Hмаршрутных станций§!, которые может содержать государство, ограничено ['concept_starbase_capacity', максимумом станций]."
 # Singular: £wayline£ ['concept_wayline'] or £wayline£ §H$concept_wayline$§!
 # Plural: £wayline£ ['concept_waylines'] or £wayline£ §H$concept_waylines$§!
 concept_wayline: "Маршрутная линия"
 concept_waylines: "Маршрутные линии"
 concept_wayline_desc: "£wayline£ §H$concept_waylines$§! — межзвёздные торговые пути, пролегающие между £waystation£ ['concept_waystations', маршрутными станциями] в соседствующих £system£ ['concept_systems', системах].\n\nЭффекты и модификаторы, предоставляемые §Hмодулями маршрутных станций§!, распространяются по §Hмаршрутной линии§! и действуют в рамках ['concept_wayline_pacts', маршрутных пактов] с §Hвладельцем системы§!. Так, например, §Hлогистический центр§! может накапливать ресурсы со всех £waystation£ §Hмаршрутных станций§!, расположенных вдоль одной §Hмаршрутной линии§!."
 # Singular: ['concept_wayline_pact'] or §H$concept_wayline_pact$§!
 # Plural: ['concept_wayline_pacts'] or §H$concept_wayline_pacts$§!
 concept_wayline_pact: "$wayline_pact$"
 concept_wayline_pacts: "$wayline_pact_plural$"
 concept_wayline_pact_desc: "§H$concept_wayline_pacts$§! — это ['concept_diplomatic_pact', дипломатические пакты] между £nomad£ ['concept_nomadic_empire', кочевниками] и другими государствами. Государства, заключившие такой пакт, извлекают обоюдную выгоду из §Hмодификаторов§!, распространяемых вдоль £wayline£ §H['concept_wayline', маршрутных линий]§!.\n\nКроме того, маршрутный пакт между §Hкочевым§! и £planet£ ['concept_settled_empire', оседлым] государством убирает дипломатические штрафы, связанные с §Hмаршрутной линией§!."
 # Singular: £construction_ship£ ['concept_logistic_ship'] or £construction_ship£ §H['concept_logistic_ships']§!
 # Plural: £construction_ship£ ['concept_logistic_ships'] or £construction_ship£ §H['concept_logistic_ships']§!
 concept_logistic_ship: "$nomads_constructor$"
 concept_logistic_ships: "$nomads_constructor_plural$"
 concept_logistic_ship_desc: "£construction_ship£ §H$concept_logistic_ship$§! может собирать ресурсы с небесных тел и перемещать их на наш корабль-ковчег.$tt_use$• ['scripted_action:logistic_harvest_resources', Собирайте ресурсы] с планет, лун и астероидов$NEW_LINE$• Стройте £waystation£ ['concept_waystations', маршрутные станции] в £system£ ['concept_systems', системах], чтобы расширять £wayline£ ['concept_waylines', маршрутные линии]$NEW_LINE$• Стройте ['concept_megastructures', мегасооружения]$NEW_LINE$• Собирайте ресурсы с £waystation£ §Hмаршрутных станций§! $NEW_LINE$• Нельзя строить новые £arkship£ ['concept_arkships', корабли-ковчеги] — это доступно только на других §Hкораблях-ковчегах§! $NEW_LINE$• Изучайте определённые ['concept_special_projects', особые проекты]$tt_gain$• Стройте §Hлогистические корабли§! на £arkship£ ['concept_arkship', корабле-ковчеге]"
 # Singular: £arkship£ ['concept_arkship'] or £arkship£ §H$concept_arkship$§!
 # Plural: £arkship£ ['concept_arkships'] or £arkship£ §H$concept_arkships$§!
 concept_arkship: "$arkship_cap$"
 concept_arkships: "$arkship_cap_plural$"
 concept_arkship_desc: "£arkship£ §H$concept_arkships$§! — колоссальные звездолёты, на которых £nomad£ ['concept_nomadic_empires', кочевые государства] перемещаются по космосу. Такой ковчег — одновременно и £colony£ ['concept_colony', колония], и ['concept_starbase', космическая база], и ['concept_military_ship', военный корабль]. $DOUBLE_NEW_LINE$• Как §Hколония§! корабль-ковчег содержит £district£ ['concept_districts', районы], которые можно £zone£ ['concept_district_specializations', специализировать], £building£ ['concept_buildings', сооружения] и £pop£ ['concept_pops', поселения]. $NEW_LINE$• Как §Hкосмическая база§! ковчег может выполнять роль ['concept_shipyards', верфи]. На него также можно устанавливать §Hмодули§! и §Hсистемы§!. $NEW_LINE$• Очередь строительства на §Hкорабле-ковчеге§! общая для §Hколониальных§! сооружений и сооружений §Hкосмической базы§!. $NEW_LINE$• Как §Hвоенный корабль§! §Hковчег§! несёт множество ангарных отсеков и систем ПВО. Он также оснащён прочной бронёй и щитами. $NEW_LINE$• §HКорабли-ковчеги§! могут забирать запасённые ресурсы у £construction_ship£ ['concept_logistic_ships', логистических кораблей] и £waystation£ ['concept_waystations', маршрутных станций]. $NEW_LINE$• §HКораблям-ковчегам§! доступны различные стратегические действия, в том числе: $TABBED_NEW_LINE$• ['concept_survey', Изучение] $TABBED_NEW_LINE$• ['concept_megastructure', $BUILD_MEGASTRUCTURE_ORDER$] $TABBED_NEW_LINE$• ['scripted_action:arkship_harvest_resources', Сбор ресурсов] $TABBED_NEW_LINE$• §HМодули корабля-ковчега§! открывают более продвинутые действия. $NEW_LINE$• Новые §Hкорабли-ковчеги§! можно строить с помощью других §Hковчегов§!; они считаются ['concept_megastructures', мегасооружениями] и требуют изучения технологии £engineering_research£ §Y«$tech_arkship_construction$»§!. $NEW_LINE$• §HКорабль-ковчег§! можно улучшить после изучения технологий £engineering_research£ §Y«$tech_arkship_tier_2$»§! и £engineering_research£ §Y«$tech_arkship_tier_3$»§!."
 # Verb (action): £settle£ ['concept_arkship_settle'] or £settle£ §H$concept_arkship_settle$§!
 # Verb (ongoing): £settle£ ['concept_arkship_settling'] or £settle£ §H$concept_arkship_settling$§!
 # Noun: £settle£ ['concept_arkship_settlement'] or £settle£ §H$concept_arkship_settlement$§!
 concept_arkship_settle: "Поселиться"
 concept_arkship_settling: "Поселение"
 concept_arkship_settlement: "$arkship_settle$"
 concept_arkship_settle_desc: "При £settle£ §Hпоселении§! £arkship£ ['concept_arkship', корабль-ковчег] приземляется на планету или луну, и его обитатели переселяются на поверхность, отказываясь от кочевого образа жизни.\n\nДля этого требуется завершить дерево традиций ['tradition_category:tradition_adaptability', «Адаптация»] или ['tradition_category:tradition_versatility', «Многогранность»].\n\nЧтобы §Hпоселиться§!, выберите §Hкорабль-ковчег§!, а затем щёлкните правой кнопкой мыши по незаселённому ['concept_habitable_world', пригодному для жизни миру] либо нажмите на кнопку §H«Колонизировать»§! в £interface£ ['concept_colony_view', обзоре колонии].\n\nГосударство с несколькими §Hкораблями-ковчегами§! может не приземлять остальные; в этом случае новое £planet£ ['concept_settled_empire', оседлое государство] станет ['concept_subject', подданным].\n\n£waystation£ ['concept_waystations'] в не принадлежащих £system£ ['concept_systems', системах] превращаются в ['concept_outposts', форпосты]."
 # Verb (action): £embark£ ['concept_arkship_embark'] or £embark£ §H$concept_arkship_embark$§!
 # Verb (ongoing): £embark£ ['concept_arkship_embarking'] or £embark£ §H$concept_arkship_embarking$§!
 # Noun: £embark£ ['concept_arkship_embarkation'] or £embark£ §H$concept_arkship_embarkation$§!
 concept_arkship_embark: "Отправиться в путь"
 concept_arkship_embarking: "Отправка в путь"
 concept_arkship_embarkation: "$decision_nomad_embarkation$"
 concept_arkship_embark_desc: "£embark£ §HОтправляясь в путь§!, население £planet£ ['concept_settled_empire', оседлого государства] покидает свой ['concept_habitable_world', годный для жизни мир], поднимается на борт £arkship£ ['concept_arkship', корабля-ковчега] и становится £nomad£ ['concept_nomadic_empire', кочевниками].\n\nДля этого требуется завершить дерево традиций ['tradition_category:tradition_adaptability', «Адаптация»] или ['tradition_category:tradition_versatility', «Многогранность»].\n\nЧтобы §Hотправиться в путь§!, откройте панель ['concept_decisions', решений] в £colony£ ['concept_colony', колонии] и выберите §H«$decision_nomad_embarkation$»§!.\n\nГосударство с несколькими ['concept_colonies', колониями] может либо сделать их своими ['concept_subject', подданными], либо выделить новое §Hкочевое государство§! и сделать его §Hподданным§!.\n\nВсе принадлежащие ему ['concept_starbases', космические базы] превращаются в £waystation£ ['concept_waystations', маршрутные станции], а покинутая планета становится §Hлишенным ресурсов миром§!."
