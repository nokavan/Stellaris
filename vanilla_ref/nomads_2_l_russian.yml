 # Aetherophasic Anchor Waystation Module
 sm_waystation_aetherophasic_anchor: "Эфирофазный якорь"
 sm_waystation_aetherophasic_anchor_desc: "Эта установка привязывает наш мобильный флот к одной точке в пространстве. Закрепив здесь нашу маршрутную станцию, мы делаем эту систему центральной точкой для §Hкаркаса эфирофазной установки§!. Вся энергия, добытая среди звёзд, сосредоточится тут и разорвёт грань между измерениями."
 requires_waystation_aetherophasic_anchor: "Кочевые государства должны соорудить §Hэфирофазный якорь§! на одной из маршрутных станций, чтобы приступить к финальному этапу. Постройте этот модуль на маршрутной станции в системе, где планируете развернуть §Hкаркас эфирофазной установки§!."
 # Shown when starbase construction is blocked because a Nomad Arkship is mid-Settle in the target system.
 NOMAD_SETTLING_IN_PROGRESS_FAIL: "В этой системе сейчас §Yселятся§! жители §Hкорабля-ковчега§!."
 # Seize Waystation - operation_seize_waystation / nomads.8010 / 8015
 operation_seize_waystation: "Захватить маршрутную станцию"
 operation_seize_waystation_desc: "Кочующий флот силён ровно настолько, насколько прочна сеть маршрутных станций, которая его питает. Захватить станции — значит ослабить их хватку."
 operation_seize_waystation_on_success: "$IF_SUCCESSFUL|E$\nУстроить налёт на маршрутную станцию кочевников, разграбив хранилище ресурсов и уничтожив один из модулей.\n\nЕсли назначить на эту операцию §Yактив§!, у нас появится шанс полностью уничтожить или захватить станцию."
 operation_seize_waystation_no_targets: "У указанного государства нет маршрутных станций в пределах действия наших сенсоров."
 nomads.8010.name: "Приближение к цели"
 nomads.8010.desc: "Наши оперативники совершили первое сближение с указанной маршрутной станцией. В результате были изучены протоколы охраны и маршруты проникновения. Мы готовы к следующему этапу."
 nomads.8015.name: "Взлом систем"
 nomads.8015.desc: "Наши агенты внедрились в состав экипажа, обслуживающий персонал маршрутной станции и толпы посетителей. Ключевые охранные реле отключены, все коммуникации проходят через наши фильтры. Судьба станции в наших руках."
 nomads.8020.name: "Налёт на маршрутную станцию"
 nomads.8020.desc: "Наша разведывательная сеть опутала указанную маршрутную станцию. Агенты внедрены и готовы. Резерв ожидает приказа на абордаж. Они нанесут удар по нашему сигналу."
 nomads.8025.name: "Маршрутная станция захвачена"
 nomads.8025.desc: "Наши оперативники нейтрализовали охрану станции §Y[target_waystation.GetName]§!, и мы уже приступили к изъятию ресурсов. Когда дело будет сделано, они..."
 nomads.8025.a: "...уничтожат станцию."
 nomads.8025.a.tt: "Станция §R[target_waystation.GetName]§! уничтожена."
 nomads.8025.b: "...покинут станцию."
 nomads.8025.c: "...возьмут станцию под контроль."
 nomads.8030.name: "Диверсия на маршрутной станции"
 nomads.8030.intro: "На станцию §Y[target_waystation.GetName]§! проникли! Взломщики силой захватили станцию и опустошили запасы ресурсов."
 nomads.8030.detected: "Несмотря на все их попытки замести следы, мы опознали нападавших — они принадлежат §Y[From.GetName&dat]§!. Они за это заплатят!"
 nomads.8030.anonymous: "Несмотря на все наши усилия, опознать нападавших не удалось."
 nomads.8030.destroyed: "Затем они заложили взрывчатку и подорвали станцию, из-за чего критически важные системы вышли из строя, а целостность корпуса была нарушена."
 nomads.8030.looted: "Станция пострадала в ходе боя, но нашим силам безопасности удалось вернуть контроль после того, как часть налётчиков ушла с добычей."
 nomads.8030.detected_destroyed.desc: "$nomads.8030.intro$ $nomads.8030.destroyed$\n\n$nomads.8030.detected$"
 nomads.8030.detected_looted.desc: "$nomads.8030.intro$ $nomads.8030.looted$\n\n$nomads.8030.detected$"
 nomads.8030.destroyed.desc: "$nomads.8030.intro$ $nomads.8030.destroyed$\n\n$nomads.8030.anonymous$"
 nomads.8030.looted.desc: "$nomads.8030.intro$ $nomads.8030.looted$\n\n$nomads.8030.anonymous$"
 nomads.8030.stolen.desc: "$nomads.8030.intro$ Теперь понятно, что за операцией [From.GetName::стоит|||pl:стоят] §Y[From.GetName]§!, поскольку они захватили контроль над маршрутной станцией, фактически отрезав её от нашей сети маршрутных линий."
