 # Economic Situation
 situation_nomad_economy: "Оперативные резервы"
 situation_nomad_economy_desc: "Наши ['concept_operational_reserves', оперативные резервы] — это общие запасы энергии и минералов.[Owner.GetSystemsVisited]"
 situation_nomad_economy_capacity_title: "§EМаксимум оперативных резервов:§!"
