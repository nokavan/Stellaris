 # Observation Insight situation - Nomad-specific approach tooltips
 favor_insights_nomad_tt: "Мы уделяем основное внимание наблюдению, что снижает объём социологических исследований, которые производят наши наблюдатели на маршрутной станции.\n£society_research£ Социологические исследования от досветовых цивилизаций: §R-2§!"
