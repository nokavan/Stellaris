 nomad_max_reserves_breakdown: "Базовое значение §Hмаксимума оперативных резервов§! равно §G$@nomad_reserves_base|0$§!.\nКаждый §Hкорабль-ковчег§! в нашем распоряжении повышает его:\n• Уровень I: §G+$@nomad_reserves_per_tier_1|0$§!\n• Уровень II: §G+$@nomad_reserves_per_tier_2|0$§!\n• Уровень III: §G+$@nomad_reserves_per_tier_3|0$§!\n§HГражданские корабли-ковчеги§! дают ещё §G+$@nomad_reserves_civilian_per_tier_1|0$§! за каждый уровень."
 situation_nomad_economy_harvest_everything: "Празднование"
 situation_nomad_economy_harvest_everything_tt: "Отпраздновать наше путешествие:\n\nРавномерно тратить наши оперативные резервы на протяжении §R6§! месяцев, после чего празднование заканчивается.\n"
 situation_nomad_economy_harvest_everything_desc: "Потратить всё, что у нас есть, ради этого славного мига"
 situation_nomad_economy_stringent_budget: "Сбережение"
 situation_nomad_economy_stringent_budget_tt: ""
 situation_nomad_economy_stringent_budget_desc: "Мы сокращаем расход ресурсов во флотилии. Меньше затрат на содержание — это меньше затрат энергии и минералов. Наши оперативные резервы будут истощаться медленнее."
 situation_nomad_economy_smooth_spending: "Баланс"
 situation_nomad_economy_smooth_spending_tt: "Обеспечить баланс запасов"
 situation_nomad_economy_smooth_spending_desc: "Умеренность во всём: мы ни запасаем, ни истощаем ресурсы. Оперативные резервы тратятся лишь по мере необходимости."
 situation_nomad_economy_full_spending: "Трата"
 situation_nomad_economy_full_spending_tt: ""
 situation_nomad_economy_full_spending_desc: "Мы выжимаем из корабля-ковчега всё и требуем, чтобы каждая палуба не жалела сил. Возросшая производительность специалистов влечет увеличенные затраты энергии и минералов — мы тратим оперативные резервы."
 situation_nomad_economy_stage_critical: "Критически низкие запасы"
 situation_nomad_economy_stage_critical_desc: "Наши хранилища почти полностью опустели. Наши исследования и производство будут существенно замедлены, пока мы не пополним запасы."
 situation_nomad_economy_stage_1_struggle: "Низкие"
 situation_nomad_economy_stage_1_struggle_desc: "Наши хранилища запасов пустеют. Нам приходится разыскивать самое необходимое."
 situation_nomad_economy_stage_2_stable: "Средние"
