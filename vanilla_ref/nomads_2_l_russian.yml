 nomadic_system_initializer: "§YНачальная система кочевников§!\n"
 protoplanetary_nomad_init_NAME: "Планетарная колыбель £nomad£"
 protoplanetary_nomad_init_DESC: "$nomadic_system_initializer$Коричневый карлик, окутанный туманностью. Вокруг него — протопланетный диск из каменистых и ледяных тел, которые ещё только соединяются в единое целое.\n\n$system_initializer_DESC$"
 neutron_star_nomad_init_NAME: "Останки сверхновой £nomad£"
 neutron_star_nomad_init_DESC: "$nomadic_system_initializer$Плотный остаток взорвавшейся звезды, вокруг которого вращаются выжженные каменистые миры и радиоактивные обломки.\n\n$system_initializer_DESC$"
 blue_giant_nomad_init_NAME: "Сияющий гигант £nomad£"
 blue_giant_nomad_init_DESC: "$nomadic_system_initializer$Ослепительно яркий голубой гигант, с чудовищной скоростью сжигающий своё топливо.\n\n$system_initializer_DESC$"
 xray_binary_nomad_init_NAME: "Двойная нейтронная £nomad£"
 xray_binary_nomad_init_DESC: "$nomadic_system_initializer$Яркая голубая звезда в паре с нейтронной звездой-компаньоном. Её внешние слои неумолимо утягиваются прочь, испуская поток высокоэнергетических частиц.\n\n$system_initializer_DESC$"
 black_hole_nomad_init_NAME: "Чёрная дыра £nomad£"
 black_hole_nomad_init_DESC: "$nomadic_system_initializer$Чёрная дыра звёздной массы, окружённая останками породившей её звезды. Вокруг неё кружат сильно облучённые каменистые миры и дрейфующие поля астероидов.\n\n$system_initializer_DESC$"
 twin_blue_star_nomad_init_NAME: "Гиганты-близнецы £nomad£"
 twin_blue_star_nomad_init_DESC: "$nomadic_system_initializer$Две пылающие голубые звезды на тесной орбите. Их совместное излучение выжигает внутреннюю часть системы дотла.\n\n$system_initializer_DESC$"
