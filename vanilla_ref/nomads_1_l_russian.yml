 spiritualist_contract_stellar_ignition_lore_issued: "§L«Внутри дремлющего гиганта таится божественная искра. Пробудите его».§!"
 spiritualist_contract_stellar_ignition_lore_completed: "§L«Теперь здесь пылает священный огонь, яркий и неугасаемый».§!"
 spiritualist_contract_stellar_ignition_lore_failed: "§L«Вы не смогли развести небесный огонь. Возможно, мы недостойны».§!"
 militarist_contract_stellar_ignition_lore_issued: "§L«Новая звезда обеспечит нам стратегическое преимущество в секторе. Приступайте к делу».§!"
 militarist_contract_stellar_ignition_lore_completed: "§L«Для сильных нет ничего невозможного — они могут даже зажечь звезду».§!"
 militarist_contract_stellar_ignition_lore_failed: "§L«Наличие второй звезды увеличило бы стратегическую ценность системы».§!"
