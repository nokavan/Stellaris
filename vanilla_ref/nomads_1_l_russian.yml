 sm_waystation_mining_module: "Добывающий комплекс"
 sm_waystation_mining_module_plural: "Добывающие комплексы"
 sm_waystation_mining_module_desc: "$sm_waystation_mining_module_plural$ извлекают минералы из ближайших залежей и запасают добытое сырье для будущего использования.\n"
 allows_mining_collection: "Добывает £minerals£ £food£ £consumer_goods£ £alloys£ §Yресурсы§! из орбитальных залежей."
 waystation_collection_penalty_mining_tt: "£minerals£ £food£ £consumer_goods£ $mod_station_gatherers_alloys_produces_mult$ $@waystation_modifier_negative_mult_25_percent|+0%$\n$waystation_collection_penalty_tt$"
 sm_waystation_hydroponics_module: "Гидропонный отсек"
 sm_waystation_hydroponics_module_plural: "Гидропонные отсеки"
 sm_waystation_hydroponics_module_desc: "В специальных отсеках на станции выращивают пищевые культуры, обеспечивая стабильные поставки провизии проходящим рядом флотилиям.\n"
 sm_waystation_research_module: "Исследовательская обсерватория"
 sm_waystation_research_module_plural: "Исследовательские обсерватории"
 sm_waystation_research_module_desc: "В этих передовых комплексах проводятся наблюдения за местными явлениями и хранятся результаты. Полученные знания могут оказаться бесценными.\n"
 allows_research_collection: "Получает £physics£ £society£ £engineering£ §Yпрогресс исследований§! из орбитальных залежей"
 waystation_collection_penalty_research_tt: "$mod_station_researchers_produces_mult$ $@waystation_modifier_negative_mult_25_percent|+0%$\n$waystation_collection_penalty_tt$"
 sm_waystation_refinery_module: "Отсек переработки"
 sm_waystation_refinery_module_plural: "Отсеки переработки"
 sm_waystation_refinery_module_desc: "У нас нет цели — есть только путь. Здесь редкие и летучие материалы перерабатываются в полезные стратегические ресурсы, необходимые на следующем отрезке дороги.\n"
 waystation_collection_penalty_refinery_tt: "£exotic_gases£ £rare_crystals£ $mod_station_gatherers_volatile_motes_produces_mult$ $@waystation_modifier_negative_mult_25_percent|+0%$\n$waystation_collection_penalty_tt$"
 allows_sr_collection: "Добывает £rare_crystals£ £exotic_gases£ £volatile_motes£ §Yредкие ресурсы§! из орбитальных залежей."
 sm_waystation_trade_module: "Торговый узел"
 sm_waystation_trade_module_plural: "Торговые узлы"
 sm_waystation_trade_module_desc: "Здесь постоянно кипит жизнь: пролетающие мимо флотилии обмениваются товарами с государствами поблизости. Мы открылись торговле — и она приносит нам прибыль.\n"
 sm_waystation_treasure_vault: "Хранилище дани"
 sm_waystation_treasure_vault_plural: "Хранилища дани"
 sm_waystation_treasure_vault_desc: "Надёжное место для сбора и хранения дани с повинующихся нам миров.\n"
 waystation_treasure_vault_tt: "\nСобирает ['concept_waystation_tribute', дань] с колоний-подданных в этой системе.\nПодданное государство: $TABBED_NEW_LINE$£loyalty£ $MONTHLY_LOYALTY$: §R-0,5§!"
