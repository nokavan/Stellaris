 concept_arkship_harvestable_resources_desc: "Корабли-ковчеги могут собирать на планетах, лунах и астероидах следующие ресурсы: $TABBED_NEW_LINE$• $energy_with_icon$ $TABBED_NEW_LINE$• $minerals_with_icon$ $TABBED_NEW_LINE$• $consumer_goods_with_icon$ $TABBED_NEW_LINE$• $alloys_with_icon$ $TABBED_NEW_LINE$• $exotic_gases_with_icon$ $TABBED_NEW_LINE$• $rare_crystals_with_icon$ $TABBED_NEW_LINE$• $volatile_motes_with_icon$ $TABBED_NEW_LINE$• $sr_living_metal_with_icon$ $TABBED_NEW_LINE$• $nanites_with_icon$"
