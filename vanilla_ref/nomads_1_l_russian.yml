l_russian:
 #######################
 # NOMADS LOCALIZATION #
 #######################
 # For reserved event number ranges, see the top comment in the events file
 NOMADS_TITLE: "Nomads" # Do not translate
 DLC_NOMADS: "$NOMADS_TITLE$"
 vo_nomad_voice: "Кочевник"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_TITLE: "Незаконные раскопки"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_OWNER_DESC: "Кочевники с корабля §Y[owner.GetName]§! разорили место археологических раскопок в системе [solar_system.GetName]!"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_NO_PERMISSION_DESC: "Наши незаконные археологические раскопки раздражают §Y[solar_system.owner.GetName&acc]§!."
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_TITLE: "Археологическое партнерство"
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_OWNER_DESC: "Кочевники с корабля §Y[owner.GetName]§! провели раскопки в системе [solar_system.GetName] и отправили нам артефакты и научные данные."
 MESSAGE_ARCHAEOLOGY_STAGE_FINISHED_NOMAD_PERMISSION_DESC: "Наши археологические раскопки в системе [solar_system.GetName] завершены. Мы отправили §Y[solar_system.owner.GetName&dat]§! добытые артефакты и научные данные."
 MESSAGE_ASTRAL_RIFT_STAGE_FINISHED_NOMAD_PERMISSION: "Астральное сотрудничество"
 MESSAGE_ASTRAL_RIFT_STAGE_FINISHED_NOMAD_PERMISSION_TITLE: "Кочевники с корабля §Y[owner.GetName]§! изучили астральный разлом в системе [fromfrom.solar_system.GetName] и отправили нам астральные нити и научные данные."
 policy_nomad_total_war: "Позиция в тотальной войне"
 policy_nomad_total_war_desc: "Обычно мы не правим планетами, но иногда подданных можно оставлять там, где они жили прежде.\n"
 nomad_total_war_subject: "Покорение"
 nomad_total_war_subject_name: "Образование постоянных подданных"
 nomad_total_war_subject_desc: "Захваченными территориями будут управлять верные нам подданные.\n\n§EПри оккупации планет в ходе тотальной войны автоматически создаются подданные§!"
 nomad_total_war_displace: "Перемещение"
 nomad_total_war_displace_name: "Перемещение населения"
 nomad_total_war_displace_desc: "Инопланетные формы жизни имеют право на существование, но на близлежащих планетах их быть не должно.\n\n§EАвтоматически создаются временные подданные, которые будут заниматься перемещением населения с планет. Когда выселение завершается, подданные прекращают свое существование§!"
 nomad_total_war_purge: "Геноцид"
 nomad_total_war_purge_name: "Геноцид планет"
 nomad_total_war_purge_desc: "Формы жизни, обитающие на планетах, неполноценны. Пора очистить галактику от их присутствия.\n\n§EАвтоматически создаются временные подданные, которые будут заниматься геноцидом населения. Когда геноцид завершается, подданные передают сюзерену собранные ресурсы и прекращают свое существование§!"
 nomad_total_war_requires_purge_not_banned: "$TRIGGER_FAIL$Наша политика геноцида не позволяет перемещать завоёванное население."
 nomad_total_war_requires_purge_allowed: "$TRIGGER_FAIL$Наша политика геноцида не позволяет геноцид завоёванного населения."
 origin_nomadic_purger: "Планетарные чистильщики"
 origin_nomadic_purger_desc: "Временное правительство кочевников, занятое истреблением любых форм жизни на планете."
 origin_tooltip_nomadic_purger_effects: "§YВременная империя, передающая все добытые в процессе геноцида ресурсы своему сюзерену§!"
 preset_nomadic_purger: "$origin_nomadic_purger$"
 preset_nomadic_purger_desc: "$origin_nomadic_purger_desc$"
 preset_nomadic_purger_flavor_desc: "Специализированные отряды планетарных чистильщиков, преданных своему делу, обрушиваются на оседлые миры подобно чуме. Действуя независимо от правительства, они вольны пойти на любые миры, чтобы достичь своей цели."
 preset_nomad_tributary: "$preset_tributary$"
 preset_nomad_tributary_desc: "$preset_tributary_desc$"
 preset_nomad_tributary_flavor_desc: "$preset_tributary_flavor_desc$"
 is_a_purging_subject: "$TRIGGER_FAIL$§RЭто временный подданный, скоро он прекратит свое существование.§!"
 effect_every_issued_mission: "Все выданные задания"
 requires_tech_arkship_tier_2: "$TRIGGER_FAIL$§RТребуется технология §Y«$tech_arkship_tier_2$»§!§!"
 #######################
 # NOMADS ORIGINS
 #######################
 requires_actor_not_nomadic: "$TRIGGER_FAIL$§RМы — §Yкочевая империя§!. У нас нет границ.§!"
 requires_recipient_not_nomadic: "$TRIGGER_FAIL$§RЭто §Yкочевая империя§!. Кочевники не признают границ.§!"
 not_matching_nomad_regular: "§RМы и §Y[From.GetName]§! не можем прийти к согласию относительно того, должны ли колонии оставаться в движении или могут осесть на одном месте.§!"
 IS_NOMADIC: "Является кочевой империей"
 IS_NOT_NOMADIC: "НЕ является кочевой империей"
 IS_NOMADIC_ICON_TIP: "Этот вариант доступен, потому что $WHO|H$ — §Yкочевое§! государство."
 trait_pc_ark_preference: "Предпочтение кораблей-ковчегов"
 trait_pc_ark_preference_short: "Корабль-ковчег"
 trait_pc_ark_preference_desc: "$trait_pc_arctic_preference_desc$"
 nomadic_gov_default: "$GOV_NAME$ кочевников"
 toggle_nomad_on: "§H$nomadic_gameplay_title$§! (§RВыкл.§!)$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§GЩелкните, чтобы включить игровой процесс за кочевников§!"
 toggle_nomad_off: "§H$nomadic_gameplay_title$§! (§GВкл.§!)$NEW_LINE$$ETHIC_GESTALT_CONSCIOUSNESS_NO_TUTORIAL$$NEW_LINE$$nomadic_gameplay_desc$ $DOUBLE_NEW_LINE$§GЩелкните, чтобы включить игровой процесс за кочевников§!"
 nomadic_gameplay_tt: "§H$nomadic_gameplay_title$§!$NEW_LINE$$nomadic_gameplay_desc$"
 nomadic_gameplay_title: "Игра за кочевников"
 nomadic_gameplay_desc: "§RПри включении игрового процесса за кочевников меняются некоторые механики§!$DOUBLE_NEW_LINE$• Нельзя выдвигать ['concept_claim', притязания] или владеть £system£ §Hсистемами§! и £planet£ §Hпланетами§!$NEW_LINE$• ['concept_colonies', Колонии] перевозятся £arkship£ ['concept_arkships', кораблями-ковчегами], заменяющими ['concept_shipyards', верфи]$NEW_LINE$• £construction_ship£ ['concept_logistic_ships', Логистические корабли] заменяют £construction_ship£ ['concept_construction_ships', строительные корабли]$NEW_LINE$• £waystation£ ['concept_waystations', Маршрутные станции] заменяют £mining_station£ ['concept_mining_stations', добывающие станции] и £science_ship£ ['concept_research_stations', научные станции]$NEW_LINE$• ['concept_operational_reserves', Оперативные резервы] заменяют §H$energy_with_icon$§! и §H$minerals_with_icon$§!$NEW_LINE$• Можно выполнять £contract£ ['concept_contracts', контракты] для £planet£ ['concept_settled_empires', оседлых государств]$NEW_LINE$• В не принадлежащих вам системах можно вести £archaeology£ ['concept_archaeology_site', археологические раскопки]$NEW_LINE$• Кочевники игнорируют §Hзакрытые границы§!, что влечёт за собой дипломатические штрафы$NEW_LINE$• С помощью кораблей-ковчегов, логистических кораблей и маршрутных станций можно добывать §H$w_strategic_plural$§!\n\nМодификаторы:\n• ['concept_empire_size'] от §Hкораблей-ковчегов§!: §G+100%§!\n• ['concept_empire_size'] от §Hрайонов§!: §G+100%§!"
 toggle_nomad_disabled_missing_dlc: "§RОтсутствует дополнение Nomads§! Для игры за кочевников необходимо дополнение §YNomads§!."
 # Voidfarers
 origin_default_nomads: "Глубиноходы"
 origin_default_nomads_desc: "У этой цивилизации нет места назначения — только путь. Они оставили свои постоянные поселения и пустились в странствие на гигантских кораблях-ковчегах, перенося через просторы космоса свой народ, промышленность и идеи."
 origin_nomad_tooltip_default_effects: "• Кочевое происхождение\n• В начале игры доступен дополнительный §Hлогистический корабль§!\n"
 START_SCREEN_PART_ONE_DEMOCRACTIC_NOMAD: "Когда наши предки спускали со стапелей корабль «[Capital.GetName]», всех волновал только один вопрос — настолько важный, что его даже вписали в судовой устав: кто будет принимать решения? Соперничающие группировки — каждая со своими представлениями о будущем, приверженцы старого уклада, поборники нового подхода — все они дали один ответ: решения принимаются всеми.\n\n[Root.GetGovernmentName] — детище не только идеализма: этот строй зародился в том числе из понимания, что недопустимо давать одной личности власть над жизнью и судьбами обитателей корабля. Власть необходимо заслужить, а за поступки — отвечать, в первую очередь перед самими избирателями.\n\nЭта традиция сохраняется и сегодня: [Root.Ruler.GetRegnalName] зовется «[Root.GetRulerTitle]» именно потому, что так решил народ.\n"
 START_SCREEN_PART_ONE_OLIGARCHIC_NOMAD: "[Root.GetGovernmentName] не испытывает недостатка в будущих лидерах — кандидатам нет числа. Нет, в момент основания нас заботил другой вопрос: как сделать так, чтобы народ следовал за достойнейшими?\n\nИ мы учредили совет. Только у тех, кто заслужил свой высокий пост, есть право высказываться. «[Capital.GetName]» не подчиняется кому-то одному; равно как и не подчиняется изменчивой воле народных масс. Сила, что нас движет, — это консенсус, согласие тех, кто на деле доказал, что достоин прокладывать курс.\n\nСогласие равных. И в их рядах — [Root.GetRulerTitle] [Root.Ruler.GetRegnalName]."
 START_SCREEN_PART_ONE_DICTATORIAL_NOMAD: "[Root.GetGovernmentName] зиждется на принципе куда менее замысловатом, чем многие из нас готовы признать: властвовать будет тот, кто окажется на это способен.\n\n«[Capital.GetName]» не подчиняется воле комитетов: космическое пространство чуждо и опасно, и за промедления в принятии решений обычно приходится платить жизнями и пробоинами в корпусе. [Root.GetRulerTitle] [Root.Ruler.GetRegnalName] несет это бремя в одиночку, а «[Capital.GetName]» повинуется.\n"
 START_SCREEN_PART_ONE_IMPERIAL_NOMAD: "Среди семейств, спускавших корабль «[Capital.GetName]» со стапелей, только одно обладает неоспоримым правом на власть: наше. Первый носитель титула «[Root.GetRulerTitle]» — это первый, кто встал у штурвала. Для народа, оставшегося без родного дома, нет ничего важнее непрерывности родословной. Наша династия — это «[Capital.GetName]». «[Capital.GetName]» — это наша династия. Сегодня [Root.GetRulerTitle] [Root.Ruler.GetRegnalName] стоит там же, где до этого стояли предки; «[Capital.GetName]» никогда не перейдет кому-либо еще.\n"
 START_SCREEN_PART_ONE_MACHINE_NOMAD: "После активации протокола «Ковчег» наши подпрограммы были успешно перенесены на борт. Машинные модули оказались полностью интегрированы в структуру и системы корабля-ковчега, что значительно расширило наши технические возможности."
 START_SCREEN_PART_ONE_HIVE_NOMAD: "Способность приспосабливаться — достоинство, которым [Root.GetGovernmentName] обладает в полной мере. Покинув планету, мы быстро адаптировались к существованию в космосе, и теперь наши узлы и единицы процветают в бесконечных коридорах и плодородных искусственных экосистемах корабля-ковчега. Мы — это «[Capital.GetName]», а «[Capital.GetName]» — это мы.\n"
 START_SCREEN_PART_ONE_DEVOURING_SWARM_NOMAD: "Бесконечный голод заставил наши узлы и единицы быстро приспособиться к новым условиям. Вырвавшись за пределы планеты, мы сделали корабль-ковчег своим новым гнездом, захватив его коридоры и искусственные экосистемы.\n"
 START_SCREEN_PART_ONE_MEGACORP_NOMAD: "Прозорливые основатели понимали, что космос — это величайший рынок. Используя стратегические слияния, агрессивные поглощения и выгодные инвестиции, руководство корпорации добилось стремительного расширения и невероятных показателей доходности.\n\n[Root.Ruler.GetRegnalName] — [Root.GetRulerTitle], потому что так написано в учетном журнале, а на борту суперсовременного корабля-ковчега «[Capital.GetName]» учетный журнал — это высшая инстанция.\n"
 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_REGULAR: "«[Capital.GetName]» — это в первую очередь народный корабль. Широкие жилые кольца, открытые рынки, шумные залы для собраний — всё это спроектировано так, чтобы [Species.GetAdj&fem] жизнь здесь била ключом. Поколения, выросшие под высокими потолками помещений ковчега, овладели искусством космического полета почти что на уровне инстинктов. Наши рулевые обращаются со штурвалом ловчее, чем с собственным телом; наши логисты способны почуять надвигающийся голод, когда закрома еще полны; наши инженеры исправляют поломки быстрее, чем бортовой компьютер успевает их зафиксировать. И сегодня, когда [GetStartingDrive] переносит нас от звезды к звезде за несколько недель, а не лет, мы с уверенностью можем заявить: космос стал теснее."
 START_SCREEN_PART_TWO_CIVILIAN_NOMAD_GESTALT: "[Root.GetGovernmentName] и «[Capital.GetName]» — одно целое; первое невозможно вообразить без второго. Коллектив напрямую занимается каждой системой: неполадки устраняются еще до того, как начнется каскад сбоев и неисправностей, а ресурсные циклы проходят в строгом соответствии с графиком и без лишних затрат. И сегодня, когда [GetStartingDrive] переносит нас от звезды к звезде за несколько недель, а не лет, мы с уверенностью можем заявить: наконец-то неотъемлемая часть нашего коллектива покажет, на что способна."
 START_SCREEN_PART_TWO_MILITARY_NOMAD: "Корабль «[Capital.GetName]» спроектирован с одной целью: надежно защищать свой груз и пассажиров. Многослойный корпус способен выдержать множество попаданий, на орудийных палубах дежурят опытные [Species.GetNamePlural], а столетия отчаянных погонь в попытках уйти от угрозы или уничтожить ее научили нас, как правильно действовать в чрезвычайных ситуациях. Наш корабль — наша крепость; [GetStartingDrive] несет нас к звездам, и вскоре галактика познает нашу мощь."
 START_SCREEN_PART_TWO_SCIENCE_NOMAD: "«[Capital.GetName]» — летающая лаборатория: всё, начиная от системы энергоснабжения и поддержания атмосферы и до расположения жилых отсеков, спроектировано ради удобства исследователей. Каждый работник — ученый: наши [GetTechnicianPlural], отвечающие за щиты, разбираются в физических принципах работы барьеров, а ремонтники способны без труда разработать новое устройство. Установленный на борту [GetStartingDrive] наконец обеспечил нам необходимую дальность полета, и под нашим руководством «[Capital.GetName]» вскоре приблизится к предметам своего научного интереса."
 # Heirs of the Khan
 origin_heirs_of_the_khan: "Наследники хана"
 origin_heirs_of_the_khan_desc: "$cannot_settle$\nЭтот клан, некогда претендовавший на верховную власть в каганате, был вероломно свергнут. Преданные своей родней, они скрылись в гиперкоридорах и теперь копят силы, дожидаясь возможности поквитаться с врагами."
 origin_heirs_of_the_khan_effects: "• Кочевое происхождение\nПериодически подвергаются нападениям §Rвраждебных§! кораблей мародёров\n• Могут стать ханом, если смогут выжить\n• Могут создавать вассальные §Yсатрапии§!"
 START_SCREEN_HEIRS_OF_THE_KHAN: "Наш клан был частью каганата с самого его основания. Мы застали великие победы и грандиозные сражения, были свидетелями взлета и падения ханов.\n\nКогда пришло время назвать нового хана, мы заявили о своих притязаниях на трон, созданный при нашем непосредственном участии. Это был час нашего триумфа — но он обернулся предательством.\n\nТе, кого мы считали ближайшими союзниками, подняли на борьбу против нас другие кланы. Они перебили наших старейшин, украли мечту, за которую мы проливали кровь.\n\nДаже сейчас узурпаторы посылают за нами своих головорезов, словно само наше существование подрывает их власть. Мы лишь жалкие остатки некогда великого рода, рассеянные и гонимые.\n\nКогда мы вернемся, наше возмездие будет закалено в пламени ярости."
 NAME_Hunter_Marauders: "Палачи&!pl|||gen:Палачей&!pl|||dat:Палачам&!pl|||acc:Палачей&!pl|||inst:Палачами&!pl|||prep:Палачах&!pl"
 NAME_Hunting_Fleet: "Топор палача&!masc|||gen:Топора палача&!masc|||dat:Топору палача&!masc|||acc:Топор палача&!masc|||inst:Топором палача&!masc|||prep:Топоре палача&!masc"
 NAME_Khan_Aspirant: "Претендент на ханство&!masc|||gen:Претендента на ханство&!masc|||dat:Претенденту на ханство&!masc|||acc:Претендента на ханство&!masc|||inst:Претендентом на ханство&!masc|||prep:Претенденте на ханство&!masc"
 nomads.506.name: "Знакомые охотники"
 nomads.506.desc: "С момента нашего изгнания мы знали, что когда-нибудь нас настигнет сигнал охотников. За наши головы назначена награда, а §Y[capital_scope.GetName]§! — самая желанная добыча. Наша смерть в изгнании станет лучшим подарком для узурпатора.\n\nЧто же, придётся его разочаровать."
 heirs_battlestations: "Боевые посты"
 heirs_battlestations_desc: "Всю энергию на орудия! Устроим им холодный прием."
 heirs_evasive_actions: "Маневры уклонения"
 heirs_evasive_actions_desc: "Всю энергию на двигатели! Пусть глотают космическую пыль."
 HEIRS_HUNTERS_HAVE_SPAWNED_TITLE: "Замечена флотилия охотников за головами"
 HEIRS_HUNTERS_HAVE_SPAWNED_DESC: "Мы обнаружили флотилию мародеров, преследующую корабль-ковчег $ARKSHIP|Y$"
 HEIRS_RAID_INTERCEPTED_TITLE: "Перехвачена рейдерская флотилия"
 HEIRS_RAID_INTERCEPTED_DESC: "Мы перехватили рейдерскую флотилию мародеров в системе $SYSTEM|Y$. Занять боевые посты!"
 nomads.546.name: "Охотники разбиты"
 nomads.546.desc: "Мы снова одержали верх над наймитами узурпатора. Увы, это их не остановит и в следующий раз они соберут больше сил. Но если перебить достаточно охотников, даже они поймут, что от нас так просто не избавиться.\n\nПока корабль «[capital_scope.GetName]» цел, наши притязания остаются в силе. Скоро им придется признать, что наше наследие отказывается умирать."
 nomads.546.a: "Мы будем готовы."
 nomads.555.name: "Мольба о пощаде"
 nomads.555.desc.1: "«Довольно! Изгнанники вы или нет, тактики пилотажа выдают в вас настоящих мародеров. Мы больше не станем расплачиваться обшивкой за уязвленную гордыню. Назовите цену и позвольте нам уйти», — взывает [Root.GetSpeciesName] с покореженного мостика корабля §Y«[From.GetName]»§!."
 nomads.555.desc.2: "Вражеская флотилия, которую мы разгромили, быстро сигнализирует о готовности сдаться.\n\n«Ну всё, довольно. На этот раз ваша взяла. Что вам отдать, чтобы мы смогли оттереть с корпуса это уродливое пятно и отправиться восвояси?»"
 nomads.555.desc.3: "«Мы сдаемся! Смилуйтесь! Мы всегда были верны вашему клану, разве вы не помните? Ваше изгнание — просто позор! Скажите, как мы можем послужить вам?»\n\nСудя по дрожащему голосу, капитан корабля §Y«[From.GetName]»§! находится на грани."
 nomads.555.a: "Просто проваливайте с глаз долой."
 nomads.555.b.1: "Мы не примем капитуляцию."
 nomads.555.b.2: "В космосе не бывает капитуляции. Вот вам истина пустоты."
 nomads.555.b.3: "Если бы вы были верны, вы бы отправились в ссылку вместе с нами."
 nomads.555.b.tt: "Уничтожить флотилию мародеров."
 nomads.555.c.1: "Груз или жизнь. Выбор за вами."
 nomads.555.c.2: "Считайте, что это собеседование. Последний выживший сможет присоединиться к нам."
 nomads.555.c.3: "Нам нужна ваша команда."
 nomads.555.c.4: "Мы позволим одному из вас доковылять до дома живым. Пусть другие знают, что их ждет."
 nomads.555.c.4.tt: "Это отложит появление новых охотников на несколько лет."
 nomads.555.c.5: "Передайте нам своего адмирала, иначе мы извлечем его тело из обломков."
 nomads.570.name: "Сделка"
 nomads.570.desc.1: "В системе §Y[From.solar_system.GetName]§! нас настигает приоритетный вызов. На экране появляются наши преследователи.\n\n«Хорошая вышла пляска. Жаль, что недолгая. Бежать некуда, вы на прицеле. [GetHeirsBargain]"
 nomads.570.desc.2: "Громко звучит сигнал тревоги — мы на прицеле! Преследователи, прибывшие в систему §Y[From.solar_system.GetName]§!, появляются на экране.\n\n«Погоне конец, изгнанники. Мы нацелились на ваш реактор». [GetHeirsBargain]"
 nomads.570.desc.3: "Основной экран корабля §Y«[capital_scope.GetName]»§! загорелся знаками мародеров. Наши преследователи вышли из гиперкоридора.\n\n«Вы неплохо летаете для изгнанников. Но бежать больше некуда. [GetHeirsBargain]"
 nomads.570.bargain.1: "Впрочем, наши сенсоры постоянно барахлят. За щедрое пожертвование мы можем… неверно интерпретировать данные»."
 nomads.570.bargain.2: "Отключите двигатели и отправьте к нам своего лидера. Это будет честный бой, один на один — [Species.GetName] и [Ruler.Species.GetName]. Если проиграете — мы собьем ваш корабль."
 nomads.570.bargain.3: "Откровенно говоря, плата за вашу жизнь даже не окупит расход боеприпасов. Сделайте нам предложение получше — иначе подохнете без всякой пользы."
 nomads.570.a: "Для мертвеца ты слишком много говоришь, [Species.GetName]."
 nomads.570.b: "Хорошо, мы заплатим."
 nomads.570.c: "[Owner.Ruler.GetAXX::Наш|||fem:Наша] [Owner.GetRulerTitle] не боится таких, как ты!"
 nomads.570.c.tt.1: "$tt$Флотилия мародеров становится §Rвраждебной§!."
 nomads.570.c.tt.2: "Флотилия мародеров оставляет нас в покое."
 nomads.570.d: "Мы выкупим ваш заказ."
 heirs_khan_candidate_title: "Барабаны войны"
 heirs_khan_candidate_desc: "Время пришло. Скоро назовут имя нового хана. Чтобы покончить с изгнанием, мы должны напомнить о себе."
 heirs_khan_rally_point_name: "Место сражения"
 heirs_khan_rally_point_desc: "Система, где произойдет битва, в которой определится следующий Великий хан."
 heirs_khan_in_waiting_name: "Хан ждет"
 heirs_khan_in_waiting_desc: "Флагман претендента на ханство. Победив его, мы вернем себе трон."
 nomads.600.name: "Претендент"
 nomads.600.desc: "Трус, виновный в нашем изгнании, наконец-то перешёл к действию.\n\n§Y[marauder_heir.GetName]§! собираются вместе, чтобы избрать нашего недруга следующим Великим ханом.\n\nЕсли мы хотим покончить с изгнанием, действовать нужно немедленно. У нас есть десять лет, чтобы бросить вызов, — иначе [aspiring_khan.GetSpeciesNameInsult] упрочит свою власть и запятнает наше наследие навеки.\n\nПроложить курс! Цель — §Y[marauder_rally_point.GetName]§!!"
 nomads.600.a: "Новый контракт: борьба за трон."
 nomads.605.desc: "В системе §Y[solar_system.GetName]§! нас поджидает великая армада, горделиво назвавшаяся §Y«Избранниками Великого Хана»§!.\n\nБез всяких церемоний нас приветствует знакомый голос:\n\n«Итак, изгнанники посмели вернуться? Неужто вам духу не хватило молча сдохнуть в пустоте, опозоренными и всеми позабытыми? Опять всё приходится делать самим…»\n\nКорабли «Избранников» начинают заряжать орудия. Другие кланы мародеров замирают на месте — никто не осмелится вмешаться в поединок, исход которого решит, кому быть следующим ханом."
 nomads.605.a: "Пора вернуть наш трон."
 nomads.610.name: "Возвращение на трон"
 nomads.610.base: "Тишина на командном мостике взрывается потоком сообщений. Собравшиеся кланы спешат восславить имя победителей"
 nomads.610.desc: "$nomads.610.base$ и заверить их в своей преданности.\n\nМы добились своего. Трон принадлежит нам."
 nomads.610.a: "Пусть гремят барабаны войны!"
 nomads.610.a.tt: "Принять титул Великого хана и выйти из состава любых федераций и Галактических сообществ."
 nomads.610.b: "Времена ханов закончены. Скоро вы узнаете, чему мы научились в изгнании."
 nomads.610.b.tt: "Собравшиеся кланы станут нашими вассалами."
 nomads.610.c: "Месть свершилась. Остальные могут уйти."
 nomads.610.c.tt: "Покинуть мародеров — пусть живут как прежде."
 nomads.615.desc: "$nomads.610.base$.\n\nНо это еще не конец. В космосе остались и другие изгнанники, претендующие на трон. По закону и обычаю у них есть три года, чтобы бросить нам вызов — или они останутся в изгнании навечно."
 nomads.615.a: "Пусть приходят."
 nomads.620.name: "Господство"
 nomads.620.desc: "Наши трусливые соперники отступили, с прочими претендентами давно покончено. Вся сила объединенных кланов на нашей стороне.\n\nНаконец-то трон наш по праву!"
 nomads.625.name: "Узурпатор занимает трон"
 nomads.625.desc: "На пути к миру §Y[marauder_rally_point.GetName]§! мы получили ужасные вести. Другой претендент нас опередил, будущий хан повержен, и трон принадлежит клану [From.GetName]. \n\nПо обычаю у нас есть три года, чтобы победить ханский флагман в бою — или придется отказаться от притязаний."
 nomads.630.name: "Потеря притязаний"
 nomads.630.desc: "Потерпев поражение, мы вынуждены отказаться от своих притязаний на титул хана. Теперь остается лишь смотреть, как клан §Y[From.GetName]§! занимает трон."
 nomads.635.name: "Смерть хана"
 nomads.635.desc: "[From.GetName] недавно [From.GetAXX::скончался|||fem:скончалась], и по традиции со смертью хана мы обязаны отказаться от полномочий. Наши союзники-мародеры уже прекратили отправлять к нам на помощь подкрепления.\n\nОстается решить, как поступить с остальной галактикой — ее обитатели не знают наших обычаев, и многие миры всё равно примут наше господство. Впрочем, слухи о нашей слабости дошли и до них…"
 nomads.635.a: "С традицией не поспоришь — пришло время отказаться от подданных."
 nomads.635.a.tt: "Все подданные получают независимость, при этом их отношение и доверие значительно повышаются\n\nВсе космические базы переходят под контроль дружественных мародеров"
 nomads.635.b: "Ханство [Root.GetName] будет стоять вечно!"
 nomads.700.name: "Жажда мести"
 nomads.700.desc: "Разгромленные остатки мародерских кланов приползли к нам на коленях. Похоже, что после гибели родины они решили позабыть о нашем изгнании. «Займите трон Великого хана и начертайте имя нашего народа на солнцах наших обидчиков!» — умоляют они теперь.\n\nЭто всё, чего мы хотели, — пусть даже их объединенным флотилиям далеко до настоящего флота Великого ханства. И теперь нам предстоит объявить войну всей галактике."
 nomads.700.a: "Пусть гремят барабаны войны!"
 nomads.700.b: "Нам это не интересно. Пусть поищут других глупцов."
 marauder.750.2.desc.low_kills: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Ты еще кто? У вас корабли другого клана двамаков, но вы какие-то хилые. Что случилось? Продули свой флот в карты?"
 marauder.750.2.desc_01: "Да это же наши любимые докваки! ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Вы лучше, чем двакамы, которые вас выгнали."
 marauder.750.2.desc_02: "ХАЙ-Э-Э-Э-И-И-И… Минуточку. Вы не двамаки с планет. Вы из-за недавнего набега пришли? Кто-то нанял вас вернуть их минералы?"
 marauder.750.2.desc_03: "$marauder.20.2.desc_03$"
 marauder.750.2.desc.khan: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Это же главный доквак! Скорее, откройте хороший канал!"
 marauder.750.2.desc.overlord: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Доквак-вождь слушает! Мы теперь под твоим знаменем. Что нужно, босс?"
 marauder.750.2.desc.proven: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Мы тебя знаем. Ты других убиваешь, а своих зубов не теряешь. Что нужно?"
 marauder.750.3.desc.low_kills: "Вы были прокляты собственным народом, но даже у вас есть шанс на искупление. Примите Владычицу Пустоты — и вы воспрянете, если Она сочтет вас достойными."
 marauder.750.3.desc_01: "Появление ваших кораблей прогневало великую Госпожу, но мы готовы молить Её о прощении от вашего имени."
 marauder.750.3.desc_02: "Вы всё еще живы? Славно. Мы думали, что посланники еретиков уже покончили с вами.\n\nРечь вовсе не о вашем прежнем клане. Мы имеем в виду истинного Врага."
 marauder.750.3.desc_03: "Когда Владычица Пустоты видит вас, на Ее устах появляется улыбка. Сейчас вы среди друзей. Чем народ [marauder_country_3.GetName&gen] может помочь вам?"
 marauder.750.3.desc.khan: "Избранники Пустоты. Чем скромные последователи Госпожи могут помочь вам в осуществлении Ее замыслов?"
 marauder.750.3.desc.overlord: "Владычица Пустоты видит сложившуюся ситуацию и не возражает. Какова ваша воля?"
 marauder.750.3.desc.proven: "Вы проделали долгий путь. Владычица Пустоты не забыла о ваших трудностях. Что привело вас сюда?"
 marauder.750.a: "Помогите нам сразиться с [marauder_country_1.GetName&inst]."
 marauder.750.a.response.2: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Вы, двакамы, такие забавные. Нет. Вы слишком слабы для драки. Научитесь сражаться, отрастите клыки — и тогда, может, вы заслужите право называться докваками."
 marauder.750.a.response.3: "Не сейчас. Владычица Пустоты недовольна вами. Быть может, если вы искупите свои прежние проступки, Она проявит больше милости."
 marauder.750.b: "Время пришло. Присоединяйтесь к нам."
 marauder.750.c: "Сейчас или никогда! Помогите нам остановить обманщика!"
 marauder.750.d: "Перестаньте слать нам подкрепления."
 marauder.750.e: "Мы готовы снова получать ваши подкрепления."
 marauder.755.desc: "Наш бывший клан не отвечает на сообщения. Мы остались одни."
 marauder.755.desc.khan_pending: "На нашу попытку установить связь снова не последовало ответа. Всё, что мы получили, — это автоматическое сообщение:\n\n«В данное время хан не планирует принимать вашу капитуляцию. Приходите, когда начнут бить барабаны войны»."
 marauder.755.a: "Тогда мы заставим их ответить."
 marauder.760.desc.3_kills: "Вы снова осмелились нас побеспокоить?\n\nВсего лишь пара случайных побед — и вы вообразили себя великими полководцами. Пустота в равной степени пожирает и смельчаков, и глупцов. Не стоит принимать удачу за мастерство."
 marauder.760.desc.10_kills: "Ваше имя позорит наш народ. То, что вы еще живы, ложится пятном на нашу честь. Пора с этим покончить. Когда мы вышлем по вашу душу следующую флотилию, не тратьте наше время и просто опустите щиты.\n\nУмрите в бою, как достойные [Root.Species.GetSpeciesNamePlural]."
 marauder.760.desc.20_kills: "Несмотря ни на что, пустота никак не хочет поглотить вас. Мы вычеркнули вас из книг, сожгли ваши знамена, наши [Root.Species.GetSpawnNamePlural] считают вас злодеями из сказок — но вы всё равно оставляете следы на нашей обшивке. Мы отправляли за вами флотилии, затем эскадры, а теперь и целые армады. Кланы начинают волноваться. Некоторые говорят, что ваше изгнание было ошибкой. Но мы покончим с этими разговорами.\n\nНу почему вы никак не сдохнете?!"
 marauder.760.desc.post_khan_1: "Добро пожаловать домой, наследники. Чем мы можем быть полезны?"
 marauder.760.desc.post_khan_2: "Удалось одолеть какую-нибудь славную добычу? Мы вот недавно столкнулись с огромным тиянки. Великан регенерировал быстрее, чем наши лазеры могли его рассечь."
 marauder.760.desc.post_khan_3: "А, изменники вернулись… ой, простите, старая привычка. Куда вас сегодня поведут звезды?"
 marauder.765.desc.khan_01: "Галактика дрожит пред вашим могуществом, о великий хан. Куда прикажете направить наши корабли?"
 marauder.765.desc.khan_02: "О хан всех ханов! Во всяком пустотном порту наши кланы воспевают ваше имя. Вам достаточно лишь сказать слово.\n\nКакие миры прикажете сжечь?"
 marauder.765.desc.khan_03: "О великий хан! Мы готовы доказать на деле, что нам не занимать мужества и стойкости. В тот день, когда мы изгнали вас, каждый из нас покрыл себя позором. А если же вы сочтёте, что мы недостойны искупления, мы с радостью готовы погибнуть под огнём ускорителей масс!"
 marauder.765.a: "Ждите, пока мы сами запросим у вас подкрепления."
 marauder.765.b: "Продолжайте посылать нам подкрепления."
 wg_heirs_call_of_the_satrapies: "Зов сатрапий"
 war_goal_wg_heirs_call_of_the_satrapies: "$wg_heirs_call_of_the_satrapies$"
 war_goal_wg_heirs_call_of_the_satrapies_desc: "Война ведется для подчинения галактики. Бьют барабаны войны, и всем суждено стать нашими сатрапами."
 wg_end_threat_vs_heir_khan: "Ликвидация угрозы: хан"
 war_goal_wg_end_threat_vs_heir_khan: "$wg_end_threat_vs_heir_khan$"
 war_goal_wg_end_threat_vs_heir_khan_desc: "Война ведется для предотвращения неумолимой экспансии хана."
 wg_end_threat_vs_heir_khan_accept: "Великий хан погибает, а государство [From.GetName] погружается в хаос"
 might_kill_khan_tt: "Наш великий хан может §Rпогибнуть§!!"
 will_kill_khan_tt: "Наш великий хан §Rпогибнет§!!"
