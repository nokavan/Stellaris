 # Arkship Readiness Checklist
 #######################
 nomads.50.name: "[GetStartingDrivePluralCap] задействованы"
 nomads.50.default.desc: "После того как мы установили на корабль §Y[root.capital_scope.GetName]§! [GetStartingDrive], пришло время инспекции. В ходе подготовки к межзвездному полету [GetCrew::наш инженерный <1>|||fem:наша инженерная <1>|||neut:наше инженерное <1>|||pl:наши инженерные <1>] тщательно [GetCrew::осмотрел|||fem:осмотрела|||neut:осмотрело|||pl:осмотрели] все системы корабля-ковчега — несколько устаревшие, а потому местами давшие сбой."
 nomads.50.shields: "$NEW_LINE$Диагностика щитов показала, что калибровка некоторых проекторов нарушена, и необходимо провести ее повторно."
 nomads.50.sensors: "$NEW_LINE$В некоторых комплексах датчиков обнаружились постоянные помехи."
 nomads.50.hangars: "$NEW_LINE$Часть ангарных отсеков уже давно отведена под хранилища, из-за чего оперативная готовность наших летных экипажей оказалась ограничена."
 nomads.50.comms: "$NEW_LINE$В базах данных системы связи постоянно воспроизводится один и тот же сигнал, поступивший из неизученной звездной системы."
 nomads.50.coolant: "$NEW_LINE$Из-за утечек едкого хладагента нарушена прочность корпуса."
 nomads.50.harvest: "$NEW_LINE$Бортовые системы извлечения ресурсов еще не прошли испытания в полевых условиях. Разведка ресурсов выявила наличие в соседних системах подходящих залежей."
 nomads.50.end.desc: "$NEW_LINE$Чтобы привести корабль-ковчег в полную летную готовность, все эти неисправности необходимо устранить."
