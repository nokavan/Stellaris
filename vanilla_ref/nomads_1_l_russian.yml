 checklist_harvest_resources_bonus: "Оптимизированные протоколы добычи"
 checklist_harvest_resources_bonus_desc: "§LБлагодаря накопленному опыту нам удалось увеличить эффективность добычи ресурсов с помощью корабля-ковчега.§!"
 d_fallen_empire_arkship: "Совершенный ковчег"
 d_fallen_empire_arkship_desc: "Над этим ковчегом трудились дольше, чем кто-либо помнит. Тайна его устройства и способа создания давно канула в лету, но он по-прежнему бороздит звёзды, превосходя все прочие ковчеги."
