 NAME_Champions_Forge_Arena: "Студия «Кузня чемпионов»"
 gov_champions_forge_enclave: "Медиа-анклав"
 gov_champions_forge_enclave_desc: "Кочевая мегакорпорация транслирует зрелищные состязания кораблей по всей галактике, превращая бои в развлечение, а чемпионов — в товар."
 NAME_Champions_Forge_Enclave: "Кузня чемпионов онлайн" #empire
 NAME_Champions_Forge_Enclave_adj: "Чемпионск|||masc:Чемпионский $1$|||masc,gen:Чемпионского $1$|||masc,dat:Чемпионскому $1$|||masc,acc:Чемпионский $1$|||masc,inst:Чемпионским $1$|||masc,prep:Чемпионском $1$|||fem:Чемпионская $1$|||fem,gen:Чемпионской $1$|||fem,dat:Чемпионской $1$|||fem,acc:Чемпионскую $1$|||fem,inst:Чемпионской $1$|||fem,prep:Чемпионской $1$|||neut:Чемпионское $1$|||neut,gen:Чемпионского $1$|||neut,dat:Чемпионскому $1$|||neut,acc:Чемпионское $1$|||neut,inst:Чемпионским $1$|||neut,prep:Чемпионском $1$|||pl:Чемпионские $1$|||pl,gen:Чемпионских $1$|||pl,dat:Чемпионским $1$|||pl,acc:Чемпионские $1$|||pl,inst:Чемпионскими $1$|||pl,prep:Чемпионских $1$|||corp:Ригган $1$" #empire, e.g. 'an Artisan starbase'
 RT_ETERNAL_CHAMPION: "Кузнец легенд"
 champions_forge_tournament_chain_title: "Турнир «Кузня чемпионов онлайн»"
 champions_forge_tournament_chain_desc: "Прошли десятилетия, и корпорация решила начать новый турнир. Отправьте флотилии на арену, чтобы продемонстрировать всей галактике свой ум, силу и решительность."
 CHAMPIONS_FORGE_TRAVEL: "Червоточина: Кузня чемпионов онлайн"
 CHAMPIONS_FORGE_TRAVEL_DESC: "Оргкомитет КЧО создал специальную червоточину к месту проведения соревнований. Отправьте флотилию в указанное место до окончания регистрации и приготовьтесь ковать свою славу!"
 NAME_Contestant_Fleet: "Чемпионы [event_target:champions_forge_contestant.GetName&gen]"
 nomads.160.desc: "Добро пожаловать на КЧО! Здесь рождаются легенды и исполняются звездные мечты. Мы странствуем в космосе, даря острые ощущения скучающей галактике.\n\nЧто вас привлекает? Ловкие пилоты? Грандиозные взрывы? Или простая тяга к славе и наживе? Зарегистрируйтесь — и мы сделаем вас звездой!"
 nomads.100.name: "§YАнклав:§! «Кузня чемпионов онлайн»"
 nomads.100a.desc: "Ага, старые знакомые снова на арене! Чем вы удивите нас на этот раз?\n\nНаши зрители ждут, а с ними и вся галактика!"
 nomads.100b.desc: "С возвращением! Букмекерские компьютеры раскалились докрасна, фанаты просят продолжения, а стюарды как раз закончили убирать обломки.\n\nГотовы побить еще один зрительский рекорд?"
 nomads.100c.desc: "Ух ты, это же наши любимые меценаты войны и поджигатели массовых зрелищ! Мы как раз готовим битву флотилий…\n\nХотите сыграть там главную роль?"
 nomads.100.a.invitation: "§YЗарегистрируйте§! нас на следующее шоу."
 nomads.100.a.stop: "§YПрекратите§! присылать нам приглашения."
 nomads.100.b: "Сколько стоит сменить место проведения?"
 nomads.100.b.tt: "$opinion10$\nУ нас будет §Y5 лет§! на то, чтобы выдать особый §Yконтракт§!, определяющий систему для проведения следующего турнира КЧО."
 hosting_cfl_cooldown_tt: "Следующая лицензия на проведение турнира КЧО будет доступна §Y[champions_forge_enclave_country.cfl_cooldown_timer]§!"
 nomads.100.b.reply: "Похоже, скоро мы увидим новую звезду! Нам уже не терпится увидеть ваше выступление.\n\nВыдайте нам §Yконтракт§! в любой системе по своему выбору, и мы позаботимся об остальном!"
 nomads.100.c: "§YПредставьте§! нас другим."
 nomadic_paragon_cooldown_tt: "§RМы сможем повторно попросить о представлении §Y[root.nomadic_paragon_timer]§!.§!"
 nomadic_paragon_already_hired: "§RМы уже наняли на службу лидера-кочевника.§!"
 nomadic_paragon_all_hired: "§RУ Кузнеца легенд закончились контакты.§!"
 nomadic_paragon_explanation: "\nС нами свяжется лидер-кочевник."
 champions_forge_trust_tt: "Нам нужно завоевать доверие §YКузнеца легенд§!."
 nomads.100.d: "§YРасскажите подробнее§! о ваших соревнованиях."
 nomads.100.d.reply: "Примерно раз в четверть века мы проводим состязание между желающими стать легендой! Претенденты участвуют со своими флотилиями, места проведения регулярно меняются, а сражения никогда не разочаровывают!\n\nПобедители получают награды, славу и место в турнирной таблице.\n\nЕсли опоздаете — упустите свой шанс. Мы никого не ждем."
 nomads.100.e: "§YКупить§! боевые данные о наших соперниках."
 nomads.100.e.reply: "Свежие боевые данные! Наши аналитики обрабатывают каждое видео о боевых столкновениях флота ваших соперников. Шаблоны, предсказуемые моменты, уязвимые места. Мы отдадим вам данные, а ваши стрелки доделают остальное."
 cfl_combat_data: "Боевая аналитика КЧО"
 cfl_combat_data_desc: "Подробный боевой анализ, купленный у продакшн-команды «Кузни чемпионов онлайн». В нём раскрыты боевые шаблоны ваших соперников."
 contract_host_cfl_tournament: "Предложить систему для проведения турнира КЧО"
 contract_host_cfl_tournament_issuer_desc: "Мы купили права на проведение следующего турнира «Кузня чемпионов онлайн». Возможно, мы сумеем извлечь из этого выгоду."
 contract_host_cfl_tournament_desc: "$contract_host_cfl_tournament_issuer_desc$"
 contract_host_cfl_tournament_chain_title: "$contract_host_cfl_tournament$"
 contract_host_cfl_tournament_chain_desc: "$contract_host_cfl_tournament_desc$"
 champions_forge_tournament_ongoing_tt: "$TRIGGER_FAIL$§RТурнир КЧО уже идет, придется подождать.§!"
 nomads.105.name: "[from.GetName]" #country - may return as an unknown name
 nomads.105.desc: "Анклав «Кузни чемпионов» не отвечает на наши запросы."
 nomads.105.desc.unknown: "Если не считать перевода, как только мы обменялись информацией с [From.GetPlanetMoon_RULOC&inst] [From.GetName], они тотчас оборвали связь и прекратили дальнейшее общение."
 nomads.105.a: "Как они смеют?!"
 nomads.110.desc: "Мы знали, что у вас получится!\n\nДо связи."
 nomads.115.desc: "Оставить выигрыш на столе? Как можно им пренебрегать!\n\nНу, если передумаете и сможете нас найти, в КЧО всегда рады победителям."
 nomads.120.desc: "Ищете пополнение в свою команду? Воинов, дельцов, скитальцев? В нашей галактике такие приметные ребята недолго остаются без дела… Кое-кого мы и правда встречали в пути. Однако в этом мире ничто не дается бесплатно. Заплатите комиссию — и мы попробуем вас свести."
 nomads.120.a: "Договорились."
 nomads.125.name: "КЧО: актуальность боевой аналитики истекла"
 nomads.125.desc: "Здравствуйте! Ваша боевая аналитика больше не актуальна, такие данные надо периодически обновлять. Постоянно появляются новые соперники, новые доктрины флотилий, новые уязвимости.\n\nНаши аналитики уже подготовили для вас свежие документы. Те же условия, то же превосходство в бою. Что скажете?"
 nomads.125.a: "§YОбновить§! аналитику."
 nomads.125.b: "Пока не надо."
 nomads.255.name: "КЧО: пламя разгорается вновь"
 nomads.255.desc: "Это «Кузня чемпионов онлайн», главный источник зрелищ и разрушений в галактике!\n\nМы открываем регистрацию участников на следующий турнир КЧО, который пройдёт в системе §Y[champions_forge_enclave_system.GetName]§!. Вас ждёт славная битва!\n\nВступительные требования: флотилия размером не более §H[champions_forge_enclave_country.GetCFLFleetSizeRequirement]§!.\n\nПобедителям достанутся награды, престиж и кубок КЧО.\n\nХотите войти в легенды? Регистрируйтесь.\n\nХотите мира и покоя? Очень жаль!"
 nomads.255.desc.relic: "$nomads.255.desc$\n\nА еще нам нужно будет забрать тот кубок."
 nomads.255.a: "Запишите нас! Мы победим."
 nomads.255.a.tooltip: "Изучите особый проект в системе §H[capital_scope.solar_system.GetName]§!."
 nomads.255.b: "Спросите нас как-нибудь потом."
 nomads.255.c: "Перестаньте слать нам приглашения."
 nomads.255.c.tooltip: "Свяжитесь с §Hканалом «Кузня чемпионов»§!, чтобы снова включить приглашения на турнир."
 CFL_NO_TOURNAMENT_TITLE: "Турнир отменен"
 CFL_NO_TOURNAMENT_DESC: "В связи с нехваткой достойных участников оргкомитет §Y«Кузни чемпионов онлайн»§! решил отменить турнир и ожидать дальнейшего развития событий."
 CHAMPIONS_FORGE_TRAVEL_FLEET_REQ: "Вступительные требования: флотилия размером не более §H[event_target:champions_forge_enclave_country.GetCFLFleetSizeRequirement]§!."
 cfl_fleet_size_heavy_late: "500"
 cfl_fleet_size_medium_late: "200"
 cfl_fleet_size_medium_mid: "100"
 cfl_fleet_size_small_mid: "50"
 cfl_fleet_size_small_early: "25"
 nomads.270.name: "Кузня чемпионов начинается"
 nomads.270.desc: "ЛИТОИДЫ, ОРГАНИКИ И БОЕВЫЕ МАШИНЫ ГАЛАКТИКИ — «КУЗНЯ ЧЕМПИОНОВ ОНЛАЙН» ПРИВЕТСТВУЕТ ВАС!\n\nСистема §Y[event_target:champions_forge_enclave_system.GetName]§! очищена перед сражением, букмекеры вовсю принимают ставки, а у меня есть чувство, что мы увидим, как выходит из строя чье-то космически дорогое оборудование.\n\nТем, кто остался дома, напоминаем: это не какой-нибудь патруль или пограничная стычка. Это Кузня! Здесь на кону стоит гордость!\n\nУчастники… СОТВОРИТЕ НЕЧТО ЛЕГЕНДАРНОЕ!!!»"
 nomads.285.desc.intro: "Вот и отгремело яростное сражение в системе §Y[event_target:champions_forge_enclave_system.GetName]§!. Огонь Кузни угас. Обломки дрейфуют по космосу в тусклом свете аварийных маяков.\n\n«Какое зрелище! — кричит комментатор КЧО с неподдельным восторгом. — Ради этого мы и собрались! Ради этого нас смотрит вся галактика!»"
 nomads.285.name: "«Кузня чемпионов» завершилась"
 nomads.285.desc: "$nomads.285.desc.intro$\n\nТретье место — не позор, а свидетельство того, что мы достойны этого турнира. Даже на нижней ступени пьедестала мы смотрим свысока на разгромленные флотилии соперников."
 nomads.285.a: "Наша флотилия неплохо полетала!"
 nomads.290.name: "«Кузня чемпионов» завершилась"
 nomads.290.desc: "$nomads.285.desc.intro$\n\nВторое место пахнет горечью. Мы уже тянули [This.Species.GetHandNamePlural] за кубком, но он достался кому-то еще. Что ж, пусть радуются. Мы это запомним. И когда Кузня позовет снова, уже не проиграем."
 nomads.290.a: "Если бы мы еще чуть-чуть улучшили флотилию…"
 nomads.295.name: "«Кузня чемпионов» завершилась"
 nomads.295.desc: "$nomads.285.desc.intro$\n\nПервое место! Купаясь в лучах славы, мы вырвали кубок у стюарда КЧО и подняли его к небу. Эхо этой победы прогремит далеко за пределами арены.\n\nТеперь наши флотилии будут внушать страх всей галактике."
 nomads.295.a: "Неужели кто-то сомневался?"
 nomads.305.name: "«Кузня чемпионов» завершилась"
 nomads.305.desc: "$nomads.285.desc.intro$\n\nМы не вошли в число победителей. На кубке не будет нашего имени, а внимание зрителей достанутся другим. Пора возвращаться."
 nomads.305.a: "Кому какое дело до этого глупого состязания?"
 nomads.306.name: "«Кузня Чемпионов» прервана"
 nomads.306.desc: "Сражение в системе §Y[event_target:champions_forge_enclave_system.GetName]§! затянулось без надежды на исход. Потрёпанные флотилии кружили одна против другой, но никому не удавалось нанести решающий удар.\n\nНаконец, команда КЧО вынесла вердикт: победителя определить невозможно. Триумфальной развязки не будет, никто не поднимет трофей и не взойдёт на пьедестал. Флотилии участников распущены и отправлены по домам, а трансляцию без лишнего шума оборвали, заменив повтором."
 nomads.306.a: "Пресная концовка."
 nomads.405.desc: "Трансляция оборвалась: корабль-ковчег КЧО взорвался. Прочесав обломки в системе §Y[champions_forge_destruction_system.GetName]§!, мы забрали всё содержимое его трюмов.\n\nИх последнее «шоу» оказалось крайне выгодным… для нас."
 nomads.405.desc.relic: "$nomads.405.desc$\n\nНаши имена останутся последними на этом кубке… а поскольку этих идиотов из КЧО больше нет, наш титул никто не сможет оспорить."
 nomads.410.desc: "Несколько секунд вся галактика наслаждалась последним шоу КЧО.\n\nПод отчаянные крики комментатора корабль-ковчег поглотила стена пламени.\n\nЗатем экраны погасли.\n\n§Y[champions_forge_destroyer.GetName]§! [champions_forge_destroyer.GetName::уничтожил|||fem:уничтожила|||neut:уничтожио|||pl:уничтожили] анклав «Кузни чемпионов онлайн» в системе §Y[champions_forge_destruction_system.GetName]§!."
 nomads.410.desc.relic: "$nomads.410.desc$\n\nНаши имена останутся последними на этом кубке… а благодаря уничтожению КЧО наш титул никто не сможет оспорить."
 nomads.410.a: "Галактика найдет себе новые забавы. Как и всегда."
