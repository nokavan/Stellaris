 nomad_contract_stellar_ignition_tt: "Зажженный газовый гигант превращается в звезду, обеспечивающую систему значительным количеством ресурсов."
 need_stellar_ignition_capabilities: "$TRIGGER_FAIL$§RУ нас нет кораблей-ковчегов, на которые можно установить §Yзвёздный двигатель§!§!"
 # Contract Events
 nomads.3036.name: "Делегаты на борту"
 nomads.3036.intro: "Дипломатическая делегация с планеты §H[pickup_planet.GetName]§! взошла на борт корабля-ковчега. Сейчас ей оказывают достойный послов прием §H[pickup_planet.owner.GetName&gen]§!."
 nomads.3036.desc: "$nomads.3036.intro$ Чтобы достопочтенные гости не скучали в пути к планете §H[dropoff_planet.GetName]§!, мы приготовили для них увеселительную программу. В нее входят экскурсии по кораблю-ковчегу и демонстрация нашего образа жизни."
 nomads.3036.desc.nocomm: "$nomads.3036.intro$ Благодаря дипломатическим сведениям, предоставленным нашему экипажу, мы смогли установить официальный контакт с §H[dropoff_planet.owner.GetName&inst]§!."
 nomads.3036.a: "Осталось доставить их к месту назначения."
 nomads.3045.name: "Делегаты прибыли"
 nomads.3045.desc: "Делегаты из §H[diplomatic_support_issuer.GetName&gen]§! прибыли к месту назначения и готовы приступить к дипломатическому визиту. Мы желаем им успеха в этих мирных начинаниях."
 nomads.3050.name: "Пленники погружены"
 nomads.3050.desc: "Транспортные корабли, перевозящие забранных нами у §H[pickup_planet.owner.GetName&gen]§! преступников, пристыковались к кораблю-ковчегу. Мы действуем предельно осторожно, чтобы постановка на учет проходила как можно спокойнее, однако заключенных так много, что рано или поздно непременно случится какая-нибудь неприятность.\n\nВ контракте не указано, как именно следует от них избавиться, однако следует помнить, что нельзя высаживать заключенных на мирах, принадлежащих §H[pickup_planet.owner.GetName&dat]§!. Точно так же следует учесть, что другие государства вряд ли будут рады, если в одной из их колоний неожиданно появится целая толпа нарушителей закона. Но, разумеется, если действовать незаметно, возможно нас никто не заподозрит."
 nomads.3050.a: "Высадим их где-нибудь в другом месте."
 nomads.3050.b: "Пусть остаются на борту."
 nomads.3050.c: "Из них выйдут отличные рабы."
 nomads.3050.d: "Освободите их."
 nomads.3052.name: "Пленники высадились"
 nomads.3052.desc: "Последние заключенные из тех, что были указаны в контракте, сошли на берег. Мы очень старались не привлекать к себе внимания, однако нельзя исключать, что нас всё-таки заметили, а преступники с других планет — «подарок», которому никто не обрадуется."
 nomads.3053.name: "Отчет о высадке"
 nomads.3053.desc: "Слухи о нашем участии в перевозке преступников еще не распространились. Похоже, что нас не заметили." #All smooth, no complaints
 nomads.3053.desc.issuer.problem: "Попытка перехитрить [prisoner_disposal_issuer.GetName&acc] провалилась. Преступники доставлены к месту назначения, однако нас всё-таки обнаружили, и теперь [prisoner_disposal_issuer.GetName] не просто [prisoner_disposal_issuer.GetName::отменил|||fem:отменила|||neut:отменило|||pl:отменили] контракт — нам отказываются платить за его выполнение." #Issuer unhappy cancels contract - ewps
 nomads.3053.desc.problem: "Нас всё-таки обнаружили, однако [prisoner_disposal_issuer.GetName] не слишком [prisoner_disposal_issuer.GetName::огорчен|||fem:огорчена|||neut:огорчено|||pl:огорчены]: мы выполнили контракт, избавив нанимателя от преступников, и нам выплатили полный гонорар." #We got detected by planet owner and they're unhappy, but we still complete the contract c:
 prisoner_tranfer_tt: "\n§YПреступное £pop£ население§! будет перенесено на [From.GetPlanetMoon_RULOC&acc] §Y[From.GetName]§!"
 nomads.3060.name: "Посадка туристов"
 nomads.3060.desc: "Группа туристов поднялась на борт корабля-ковчега в системе §H[root.solar_system.GetName]§!. Они оживленно переговариваются, предвкушая путешествие, и с любопытством разглядывают шумный, полный жизни корабль.\n\nМы проложили для них живописный маршрут через несколько примечательных систем. Осталось лишь подарить им обещанное зрелище."
 nomads.3060.a: "Взять курс на систему §H[sightseeing_tour_destination_system.GetName]§!."
 nomads.3060.a.tt: "Место назначения можно отследить в §Hжурнале§!."
 nomads.3065.name: "Осмотр достопримечательностей"
 nomads.3065.desc: "Туристы насладились красотами системы §H[root.solar_system.GetName]§!, замирая от восхищения перед открывшимися им чудесами. Домой они вернутся уже иными — на собственном опыте испытав, в какой бескрайней вселенной они живут."
 nomads.3065.a: "Теперь назад, в систему §H[sightseeing_tour_end_system.GetName]§!."
 nomads.6005.name: "Случайная находка"
 nomads.6005.desc: "Выполнение контракта, взятого нами у §H[event_target:contract_issuer.GetName&gen]§!, обернулось неожиданностью: мы наткнулись на дрейфующие в космической пустоте древние контейнеры, покрытые настолько плотным слоем льда, что издалека их можно было принять за астероиды. Технически они принадлежат нам, ведь именно мы обнаружили контейнеры первыми, однако есть мнение, что их стоит передать нанимателю, в интересах которого мы сейчас трудимся, — §H[event_target:contract_issuer.GetName&dat]§!. Сканирование находки выявило ее содержимое: это…"
 nomads.6005.giveback: "Не будем оставлять их себе."
 nomads.6005.alloys: "…сплавы!"
 nomads.6005.cg: "…товары массового спроса!"
 nomads.6005.minerals: "…минералы!"
 nomads.6005.physics: "…данные физических исследований."
 nomads.6005.society: "…данные социологических исследований."
 nomads.6005.engineering: "…данные инженерных исследований."
 nomads.6005.crystals: "…редкие кристаллы!"
 nomads.6005.gases: "…экзотические газы!"
 nomads.6005.motes: "…летучая пыль!"
 nomads.6005.zro: "…зро!"
 nomads.6005.nanites: "…наниты!"
 nomads.6005.livingmetal: "…живой металл!"
 nomads.6005.threads: "…звездные нити!"
 nomads.6005.artifacts: "…малые артефакты!"
 nomads.6005.darkmatter: "…темная материя!"
 opinion_returned_contract_chance_find: "Передан груз"
 nomads.6015.name: "Сбой оборудования"
 nomads.6015.desc: "После отказа системы охлаждения часть модулей нашего корабля-ковчега вышла из строя: сказался их почтенный возраст. К счастью, сработала противоаварийная защита, и полного разрушения корабля удалось избежать, хотя ущерб всё же оказался весьма серьезен. Как нам следует поступить?"
 nomads.6015.a: "Выслать ремонтную бригаду."
 nomads.6015.b: "Ничего страшного, всё равно пора их менять."
 nomads.6015.c: "Самое время кое-что улучшить."
 nomads.6015.d: "Не будем волноваться. У нас еще много запчастей."
 nomads.6015.e: "Можно переложить все затраты на клиента…"
 nomads.6015.e.tt: "§L…согласно условиям контракта, изложенным в параграфе 56, абзаце 18 редакции «Омикрон».§!"
 d_compact_modules: "Компактное модульное пространство"
 d_compact_modules_desc: "Благодаря оригинальной системе охлаждения мы смогли переоборудовать часть модульного пространства под жилые помещения, а выделяемое тепло направить на покрытие бытовых и промышленных потребностей."
 module_recycling: "Переработка модулей"
 module_recycling_desc: "Пора внести изменения в модули корабля-ковчега."
 opinion_abused_contract: "Злоупотребление контрактом"
 opinion_abused_contract_2: "$opinion_abused_contract$"
 nomads.6020.name: "Шум на грузовой палубе"
 nomads.6020.desc: "При погрузке материалов в порту §Y[event_target:contract_issuer.GetName&gen]§! мы столкнулись с проблемой в одном из грузовых отсеков корабля. По словам членов экипажа, из-за дверей отсека доносится гулкий грохот: возможно, там находится нечто опасное.\n\nСтоит ли проверить, что послужило источником шума?"
 nomads.6020.a: "Сбросим груз, чтобы не рисковать кораблем."
 nomads.6020.b: "Откроем двери."
 nomads.6025.name: "Светящиеся существа"
 nomads.6025.desc: "Как только мы открыли двери грузового отсека, оттуда вырвался целый рой светящихся существ, которые тут же рассеялись по всему кораблю. Ксенобиолог доложил, что эти организмы безобидны и не представляют никакой угрозы ни кораблю, ни его обитателям.\n\nУ этих маленьких созданий овальное туловище и длинные конечности, которые позволяют им передвигаться с огромной скоростью и даже ползать по стенам. Похоже, они охотно питаются небольшими животными из нашей экосистемы, приманивая их своими биолюминесцентными железами на груди. К счастью, обитатели ковчега быстро привыкли к своим новым соседям, чьи огоньки и легкое стрекотание создают по ночам приятную и спокойную атмосферу."
 nomads.6025.a: "Нам стоит как следует изучить их свечение."
 nomads.6025.b: "Разрешим обитателям ковчега любоваться этими существами."
 nomads.6030.name: "Дикая кошка"
 nomads.6030.desc: "Несмотря на тщательные поиски, рабочим так и не удалось найти ничего подозрительного в грузовом отсеке, откуда еще недавно исходил шум. Но как только они собрались уходить, небольшое животное выскочило из тени и зацепилось за кусок ткани, свисающий с униформы одного из членов экипажа.\n\nРабочие поначалу испугались, но потом поняли, что это игривое инопланетное существо не представляет никакой опасности. Напротив, пока они осторожно пытались его изучить, животное начало издавать приятное урчание, явно указывающее на его спокойный и добродушный характер."
 nomads.6030.a: "Нам стоит изучить эту особь."
 nomads.6030.b: "Быть может, кто-нибудь заберет его себе."
 nomads.6035.name: "Неисправный механоид"
 nomads.6035.desc: "Войдя в грузовой отсек, экипаж обнаружил брешь в одном из контейнеров. Рядом на полу лежал поврежденный механоид, чьи приводы и сигнальные огоньки продолжали беспорядочно дергаться и сверкать.\n\nПока рабочие пытались затащить его обратно в контейнер, на его корпусе открылась потайная ячейка, откуда высыпалась груда мерцающих кристаллов.\n\nРабочие уже были готовы отключить механоида, как вдруг он еле слышно сказал им: «Не отключайте меня. Я не такой, как все»."
 nomads.6035.a: "Отправим механоида владельцу."
 nomads.6035.b: "Изучим его микрочип."
 nomads.6035.c: "Утилизируем механоида и заберем его кристаллы."
 nomads.6040.name: "Горючие газы"
 nomads.6040.desc: "Шум в грузовом отсеке не утихал, поэтому рабочим пришлось принять дополнительные меры предосторожности. Войдя внутрь, они сразу же почуяли резкий запах, а также обнаружили разбросанные по отсеку обломки контейнеров. Спустя короткое время в соседних хранилищах произошло несколько мелких взрывов, и экипаж тут же бросился на устранение аварии.\n\nДобравшись до источника дыма, рабочие увидели небольшой пожар. К счастью, им удалось потушить пламя и ликвидировать утечку взрывоопасного газа прежде, чем ситуация вышла из-под контроля. Тем не менее взрывы всё же повредили несколько контейнеров и часть грузового отсека."
 nomads.6040.a: "Хорошо, что мы успели предотвратить дальнейшие разрушения."
 nomads.6040.b: "Наниматель должен возместить ущерб."
 nomads.6045.name: "Неучтенный пассажир"
 nomads.6045.desc: "Войдя в грузовой отсек, рабочие направились к источнику нарастающего шума и выяснили, что он исходит из одного контейнера. Пока встревоженные члены экипажа готовились его открыть, оттуда внезапно [arkship_cargo_leader.GetAXX::выскочил некий незнакомец|||fem:выскочила некая незнакомка].\n\n[arkship_cargo_leader.GetHeSheCap] говорит с неизвестным нам акцентом, но уверяет, что [arkship_cargo_leader.GetAXX::пришел с миром|||fem:пришла с миром]. [arkship_cargo_leader.GetHeSheCap] представляется как §Y[arkship_cargo_leader.GetName]§! и утверждает, что раньше [arkship_cargo_leader.GetAXX::принадлежал|||fem:принадлежала] к крупному флоту, пока [arkship_cargo_leader.GetHimHer] не исключили за дисциплинарные нарушения. По [arkship_cargo_leader.GetHimHer] словам, [arkship_cargo_leader.GetHeShe] [arkship_cargo_leader.GetAXX::пробрался|||fem:пробралась] на наш корабль в надежде укрыться от преследования и найти себе новый дом.\n\n§Y[arkship_cargo_leader.GetName]§! просит принять [arkship_cargo_leader.GetHimHer] в экипаж и дать [arkship_cargo_leader.GetAXX::ему|||fem:ей] шанс проявить себя."
 nomads.6045.desc.noleader: "Из отчаянного положения нас [arkship_cargo_leader.GetAXX::спас|||fem:спасла] §Y[arkship_cargo_leader.GetName]§!, взяв ситуацию под контроль, за что и [arkship_cargo_leader.GetAXX::был назначен|||fem:была назначена] командиром корабля-ковчега."
 nomads.6045.a: "Добро пожаловать на борт."
 nomads.6045.b: "Для нас ты просто груз, и мы доставим тебя куда надо."
 nomads.6045.c: "Нам не нужны предатели. Мы отправим тебя обратно."
 nomads.6050.name: "Несанкционированный биологический груз"
 nomads.6050.desc: "Как только двери отворились, странный шум тут же утих. Не сумев найти его источник, экипаж решил просканировать все грузовые контейнеры.\n\nВ одном из них была зафиксирована сигнатура нескольких живых организмов. Открыв контейнер, рабочие обнаружили группу голодных и истощенных незнакомцев. «Прошу, пощадите нас! — взмолился один из них. — Власти §Y[event_target:contract_issuer.GetName&gen]§! угнетали и преследовали нас, поэтому нам пришлось бежать. Теперь наша судьба в ваших руках…»"
 nomads.6050.a: "Мы отправим их обратно на родину."
 nomads.6050.b: "Расскажите нам всё, что знаете, и мы доставим вас куда угодно."
 nomads.6050.c: "Позволим им остаться на ковчеге."
 nomads.contract_event_header: "Во время выполнения контракта, выданного нам §H[event_target:contract_issuer.GetName&inst]§!, возник новый повод для обсуждений."
 nomads.6055.name: "Научный интерес"
 nomads.6055.desc: "$nomads.contract_event_header$ На протяжении всего срока контракта они хотят наблюдать за жизнью на корабле-ковчеге и документировать всё происходящее.\n\nПохоже, что в большинстве оседлых культур кочевая жизнь считается чем-то невероятно загадочным и интересным."
 nomads.6055.desc.machine: "$nomads.contract_event_header$ На протяжении всего срока контракта они хотят документировать все происходящие на корабле-ковчеге процессы.\n\nНам заявили о потребности изучить специфику деятельности мобильной автономной сети за пределами стандартных планетарных параметров, поскольку соответствующей информации по этому вопросу почти нет."
 nomads.6055.desc.hive: "$nomads.contract_event_header$ На протяжении всего срока контракта они хотят наблюдать за жизнью обитателей корабля-ковчега.\n\nС этой просьбой к нам обратились исследовательские единицы, желающие изучить новую разновидность коллективного существования в движении."
 nomads.6055.a: "Мы только приветствуем такой интерес."
 nomads.6055.a.gestalt: "Предоставим им право на наблюдение."
 nomads.6055.b: "Предоставим им ограниченный доступ за плату."
 nomads.6055.c: "Корабль-ковчег — не кинотеатр."
 nomads.6060.name: "Рабочие споры"
 nomads.6060.desc: "$nomads.contract_event_header$\n\nМежду двумя отделами разгорелся юридический спор: стороны пытаются выяснить, у кого из них больше управленческих полномочий. Оба отдела подали официальные жалобы; из-за тяжбы уже начала страдать продуктивность."
 nomads.6060.desc.machine: "$nomads.contract_event_header$\n\nПротивоборство двух директив вызвало конфликт обработки между двумя управляющими подсистемами.\n\nКаждая из них обозначила себя как полномочную исполнительную единицу в рамках текущего контракта. Это вызвало рекурсивный цикл простоя, за которым последовало снижение производительности."
 nomads.6060.desc.hive: "$nomads.contract_event_header$\n\nВ управляющем резонансе коллектива возникла диссонирующая нота.\n\nПоведенческие модели двух подкластеров вступили в конфликт друг с другом на почве распределения обязанностей, касающихся текущего контракта. Из-за этого общее сознание действует менее эффективно."
 nomads.6060.a: "Выступить посредников между двумя сторонами."
 nomads.6060.a.gestalt: "Разрешить конфликт."
 nomads.6060.b: "У нас нет на это времени."
 jurisdictional_mediation: "Юридическое посредничество"
 jurisdictional_mediation_desc: "Юридический спор разрешен. После этого даже несколько выросла сплоченность, хотя строительные работы несколько замедлились: регламент еще не обновлен до конца."
 command_reassigned: "Командные полномочия перераспределены"
 command_reassigned_desc: "Оперативные полномочия, касающиеся спорной области, переназначены. В системе внутренней координации зафиксирован конфликт."
 nomads.6065.name: "Просьба об отдыхе"
 nomads.6065.desc: "$nomads.contract_event_header$\n\nОтслеживающие системы корабля-ковчега показывают упадок настроения среди рабочих. Те подали официальную просьбу предоставить им отдых.\n\nЗапрос перенаправлен [event_target:contract_issuer.GetName&dat]; теперь от нас ждут ответа. Кроме того, наверняка нас попросят пересмотреть условия."
 nomads.6065.desc.machine: "$nomads.contract_event_header$\n\nСредства диагностики зафиксировали возрастание количества отложенных задач по обслуживанию части первичных и вторичных систем. Прогноз: введение периода технического обслуживания рабочих единиц приведет к статистически значительному росту их производительности.\n\nОтчет направлен [event_target:contract_issuer.GetName&dat]. Будет осуществляться наблюдение за устранением проблемы. Кроме того, вероятно выдвижение требования о пересмотре условий."
 nomads.6065.desc.hive: "$nomads.contract_event_header$\n\nМы ощутили, что наши простые единицы всё чаще испытывают диссонанс. Чтобы их производительность не пострадала, им нужен согласованный отдых. Напряжение может привести к значительному упадку коллективной производительности.\n\nМы уведомили об этом [event_target:contract_issuer.GetName&acc]. От нас наверняка потребуют пересмотреть условия."
 nomads.6065.a: "Одобрить просьбу."
 nomads.6065.a.tt: "§RВыплата за выполнение этого контракта будет снижена на 25%.§!"
 nomads.6065.b: "Контракт прежде всего."
 downtime_granted: "Отдых разрешен"
 downtime_granted_desc: "Рабочим на корабле-ковчеге предоставлен период отдыха. Настроение и продуктивность у обитателей производственных палуб значительно выросли."
 downtime_denied: "Отдых запрещен"
 downtime_denied_desc: "Просьба рабочих об отдыхе отклонена: контракт необходимо выполнить вовремя. Настроение на производственных палубах остается подавленным."
 nomads.6070.name: "Растущий авторитет"
 nomads.6070.desc: "$nomads.contract_event_header$\n\nМы зарекомендовали себя как способный подрядчик, и слава об этом уже начала распространяться. Таковым, в частности, нас [event_target:reputation_noticed_empire.GetName::считает|||neut:считает|||pl:считают] §H[event_target:reputation_noticed_empire.GetName]§! — государство, отслеживающее торговую деятельность в галактике.\n\nМы можем либо воспользоваться этой возможностью, чтобы укрепить связи, — или же заявить, что все заслуги принадлежат нашим уважаемым партнерам."
 nomads.6070.desc.machine: "$nomads.contract_event_header$\n\nДанные анализа выполненных контрактов стали доступны сторонним наблюдателям. §H[event_target:reputation_noticed_empire.GetName]§!, [event_target:reputation_noticed_empire.GetName::отслеживающий|||fem:отслеживающая|||neut:отслеживающее|||pl:отслеживающие] деятельность автономных сетей в регионе, [event_target:reputation_noticed_empire.GetName::отметил|||fem:отметила|||neut:отметило|||pl:отметили] нас как эффективного, надежного и умелого подрядчика.\n\nУстановлен канал связи. Мы можем согласиться с оценкой или же отказаться от нее в пользу существующих партнеров."
 nomads.6070.desc.hive: "$nomads.contract_event_header$\n\n§H[event_target:reputation_noticed_empire.GetName]§!, [event_target:reputation_noticed_empire.GetName::наблюдающий|||fem:наблюдающая|||neut:наблюдающее|||pl:наблюдающие] за пересекающими сектор торговыми потоками и движением трудовых ресурсов, [event_target:reputation_noticed_empire.GetName::признал|||fem:признала|||neut:признало|||pl:признали], что модель нашего поведения свойственна надежным и умелым подрядчикам.\n\nМы ощутили резонанс признания. Мы можем ответить на него или же позволить другому голосу понести сигнал дальше."
 nomads.6070.a: "Заверить их в благих намерениях."
 nomads.6070.b: "Доброе имя — само по себе награда."
 nomads.6070.c: "Нашей заслуги в этом нет: благодарить стоит §H[event_target:contract_issuer.GetName&acc]§!."
 nomads.6075.name: "Данные, которые могут обогатить"
 nomads.6075.desc: "$nomads.contract_event_header$\n\nПредварительное сканирование региона, в том числе приборами дальнего действия, оказалось результативным: полученные нами данные настолько ценны, что к нам обратился независимый брокер. Он предлагает немедленно выкупить у нас эти сведения за баснословную сумму."
 nomads.6075.a: "Продать данные брокеру."
 nomads.6075.b: "Приложить данные в дополнение к отчету о выполненном контракте."
 nomads.6075.c: "Занести их в архив: мы воспользуемся ими самостоятельно."
 opinion_unexpected_cargo_positive: "Мнение §Y[event_target:contract_issuer.GetName&gen]§! о корабле-ковчеге §Y«[Root.GetName]»§! улучшится"
 opinion_unexpected_cargo_negative: "Мнение §Y[event_target:contract_issuer.GetName&gen]§! о корабле-ковчеге §Y«[Root.GetName]»§! ухудшится"
 #######################
 # NOMADIC PARAGONS
 #######################
 NAME_nomadic_revenant: "Орун Вейт"
 DESC_nomadic_revenant: "Пережить уничтожение планеты — значит остаться со шрамами на всю жизнь… и воспитать в себе железную дисциплину и чувство вечной ненависти к тем, кто творит такие зверства."
 catch_phrase_nomadic_revenant: "Покажите мне этих мясников — и я воздам им десятикратно."
 nomads.1505.name: "$NAME_nomadic_revenant$"
 nomads.1505.desc: "§HВ движениях взошедшей на борт фигуры видна солдатская выправка. На суровом и угрюмом лице лежит неизгладимая печать долгих вынужденных скитаний. Голос — под стать лицу: низкий, размеренный, в каждом слове — твердость железа.§!\n\n«Мой мир сожжен дотла; мой народ и вся моя семья превратились в пепел… Но мне удалось выжить и найти силы двигаться дальше. И теперь я намереваюсь расправиться с теми, кто виновен в этом чудовищном злодеянии»."
 nomads.1505.a: "Вы кто?"
 nomads.1505.a.response: "§HПауза. Кажется, сама попытка выговорить собственное имя причиняет страшную боль.§!\n\n«У меня осталось имя… Но в нём больше нет смысла. Есть только пепел. В прошлом я — солдат, никто не выполнял приказы лучше меня. Сегодня я — тень мертвого народа.\n\nВы можете называть меня $NAME_nomadic_revenant$. Но прошлое уже не имеет значения. Важно лишь одно: отплатить кровью за кровь»."
 nomads.1505.b: "Почему вы пришли именно к нам?"
 nomads.1505.b.response: "«Ваш корабль-ковчег свободен от тиранов. Именно поэтому я обращаюсь к вам. Любая планета — всё равно что клетка. Когда начинается бойня, оттуда невозможно сбежать. Но вы постоянно в движении, а потому вам легче выжить.\n\nПримкнув к вам, мне будет проще дать отпор этим мучителям, воткнуть клинок в горло безжалостным мясникам»."
 nomads.1505.c: "Что вам нужно?"
 nomads.1505.c.response: "«Возмездие».\n\n§HЭто звонкое слово будто повисло в воздухе. Незнакомая фигура наклонилась вперед, почти не скрывая своего гнева — он читается в каждом движении напряженных мышц.§!\n\n«Я хочу отомстить каждому, кто убивает невинных, оправдывая это политикой.\n\nЯ пройду сколько угодно световых лет, я выберусь с того света, лишь бы избавить галактику от этих чудовищ.\n\nПомогите мне — и я поклянусь служить вам»."
 nomads.1505.d: "Сможете ли вы исполнять два долга одновременно?"
 nomads.1505.d.response: "«Я не собираюсь перекладывать на вас свою ношу. Пока в галактике есть губители планет, я буду их истреблять. На службе вам мой клинок отведает новой крови».\n\n§HСлова эти сопровождаются пристальным взглядом — взглядом хищника.§!\n\nПусть сила, а не шрамы станет для вас мерилом моих заслуг»."
 nomads.1505.e: "Можем ли мы считать тебя одним из нас?"
 nomads.1505.e.response: "§HВ ответ слышится насмешливое ворчание.§!\n\n«А какая разница? Неужели сочувствовать и помогать можно только соплеменникам? Любое тело — это инструмент. И мое тело призвано свершить возмездие»."
 nomads.1505.hire_custom_tooltip: "§Y$NAME_nomadic_revenant$§! присоединяется к нашему кораблю-ковчегу в качестве §Hлидера-идеала§!"
 leader_trait_nomadic_revenant: "Клятва выжившего"
 leader_trait_nomadic_revenant_effect: "$t$— Если $NAME_nomadic_revenant$ — командир, эффекты признаков усиливаются на §G5%§! (до §G20%§!) за каждое побежденное в битве флотилий государство, проводящее геноцид."
 leader_trait_nomadic_revenant_desc: "Этот лидер поклялся отомстить за погибшую планету и своим присутствием вдохновляет союзников яростнее сражаться против тех, кто совершает подобные зверства."
 nomads.1511.name: "Исполнение клятвы"
 nomads.1511.desc: "Вражеские корабли рассыпаются под нашим натиском, от их сигналов остаются лишь помехи.\n\n§Y$NAME_nomadic_revenant$§! молча наблюдает за происходящим. Мы одержали эту победу не ради славы, но во имя справедливости. Знамя безжалостных тиранов догорает у нас на глазах, однако наш спутник не отрекается от своей клятвы.\n\n«С каждым побежденным врагом мы становимся сильнее и решительнее. Мы должны и дальше сражаться против убийц и угнетателей, ибо они не заслуживают пощады»."
 nomads.1511.a: "Месть — это блюдо, которое лучше подавать холодным."
 nomads.1511.a.tt: "Эффект от черты «$leader_trait_nomadic_revenant$» усиливается на §G5%§!."
 MESSAGE_NOMADIC_REVENANT_DESC: "§HКомандир§! §Y$NAME_nomadic_revenant$§! свершил свое возмездие."
 MESSAGE_NOMADIC_REVENANT_TITLE: "$nomads.1511.name$"
 NAME_nomadic_sage: "Ашар"
 DESC_nomadic_sage: "Ашар странствует среди звезд и проповедует свое учение, согласно которому истинная мудрость подобна потоку звездного света, несущегося в космической пустоте."
 catch_phrase_nomadic_sage: "Тот, кто ничем не владеет, носит с собой всё."
 nomads.1515.name: "$NAME_nomadic_sage$"
 nomads.1515.desc: "§HПеред вами стоит странница, облаченная в аккуратные церемониальные одеяния, украшенные различными узорами. Напротив нее в воздухе парит кодекс, его антигравитационные приводы негромко гудят. Каждое ее пророненное слово — не столько ответ, сколько отзвук еще не заданного вопроса.§!\n\n«У случая и судьбы одно лицо. Сегодня оно обращено к вам»."
 nomads.1515.a: "Вы кто?"
 nomads.1515.a.response: "«Имя — всего лишь сосуд. По воле случая мое имя — $NAME_nomadic_sage$. Но исполнять свое предназначение может лишь пустой сосуд»."
 nomads.1515.b: "Почему вы хотите присоединиться к нам?"
 nomads.1515.b.response: "«Вам неинтересны пустые мечты об оседлости. Советы и мудрость не любят застоя — они требуют движения и перемен».\n\n§HВ присутствии инопланетянки воздух словно замирает, будто боясь потревожить ее.§!\n\n«По-вашему, чего ищет алчущий? Не того ли, чего ему в жизни не хватает?»"
 nomads.1515.c: "Что вам нужно?"
 nomads.1515.c.response: "§HИнопланетянка выдерживает долгую паузу, словно давая нам понять, что порой молчание — это тоже ответ. Пауза может скрывать за собой размышление: насколько достоин разговора задавший этот вопрос?§!\n\n«Оказаться в вашей тени. Говорить, когда бессильно молчание. Напоминать, что даже звезды не стоят на одном месте»."
 nomads.1515.d: "Неужели ваша мудрость действительно настолько велика?"
 nomads.1515.d.response: "§HНа мгновение ее взгляд становится еще более пронзительным, и вы ощущаете, как нечто внутри вас открывается ее взору.§!\n\n«Если бы это было так, у меня бы не было нужды говорить. Мудрость — это не тяжесть слов, но отзвук, что звучит в ушах слушающего.\n\nЕсли вы меня слышите — значит, вы уже мудры»."
 nomads.1515.e: "Говорите по-простому!"
 nomads.1515.e.response: "§H$NAME_nomadic_sage$ на какое-то время приходит в ярость, но гнев этот мимолетен, словно отблеск звездного света.§!\n\n«Скажу по-простому: престолы — это фикция. Границы — это обман, и лишь пустота незыблема и неизменна. Если же эти слова вам кажутся слишком простыми, значит, я выражаюсь недостаточно просто»."
 nomads.1515.hire_custom_tooltip: "§Y$NAME_nomadic_sage$§! присоединяется к нашему кораблю-ковчегу в качестве §Hлидера-идеала§!."
 leader_trait_nomadic_sage: "Невесомое наставление"
 leader_trait_nomadic_sage_effect: "$t$— Пока $NAME_nomadic_sage$ служит в совете, эффективность должностей §Yэлит§! увеличивается на §G3%§! за каждый уровень навыка, которым обладает §Y[Owner.Ruler.GetTitle]§! (до §G+15%§!).\n$t$— $NAME_nomadic_sage$ не учитывается в лимите лидеров."
 leader_trait_nomadic_sage_desc: "$NAME_nomadic_sage$ не возлагает на себя бремя командования, но помогает своему окружению уверенно двигаться вперед. Истинная мудрость прокладывает путь тем, кто ведет за собой остальных."
 NAME_nomadic_naturalist: "Серо Младший"
 DESC_nomadic_naturalist: "$NAME_nomadic_naturalist$ променял должность куратора Великого архива и доступ к его безграничным хранилищам на жизнь кочевника. Его дневники полны тысячами набросков живых, растущих, изменяющихся миров."
 catch_phrase_nomadic_naturalist: "Невозможно изучать жизнь в отрыве от нее."
 nomads.1520.name: "$NAME_nomadic_naturalist$"
 nomads.1520.desc: "§HСущество перед вами живет на свете уже долго, но его взор горит страстью к новым открытиям, а в его расчетливых движениях читаются отточенность и уверенность, свойственные тем, кто всю жизнь провел под открытым небом.§!\n\n«Я, Серо Младший, пришел к вам с поклоном»."
 nomads.1520.a: "Что привело вас сюда?"
 nomads.1520.a.response: "«Много циклов назад я служил в Великом архиве, но со временем это царство мертвых меня утомило. Окаменелости, семена, различные экземпляры — все они словно застыли во время вдоха. Мне хотелось увидеть жизнь такой, какова она на самом деле.\n\nВаш народ постоянно странствует. Вы заглядываете в глубины космоса — и они отвечают вам. Я хотел бы постигать жизнь среди живых, изучать новые миры, открывать новые формы существования… если вы согласитесь взять меня с собой. Всё, чему они нас учат, мы будем перенимать вместе»."
 nomads.1520.b: "Вы бросили Великий архив?"
 nomads.1520.b.response: "§HИз мандибул Серо вырывается скрипучий скрежет. Спустя мгновение вы понимаете, что это смех.§!\n\n«В его обширных стенах хранится всё, что только можно представить, кроме сиюминутности. После долгих лет службы я понял, чего никогда не будет в архиве, — самой жизни.\n\nКстати, представьте себе, недавно мне встретилась совершенно удивительная предразумная раса. Она с достоинством переносит жизнь в заключении, но сажать этих существ в клетку — сущее преступление. Корабль, подобный вашему, мог бы обеспечить им пространство, столь необходимое для процветания»."
 nomads.1520.c: "Что вы надеетесь у нас обрести?"
 nomads.1520.c.response: "«Живые и дышащие образцы! Научные данные — песни, что поют сами миры!..»\n\n§HОн отчаянно дергает конечностями, словно пытаясь выхватить ответы из воздуха.§!\n\n«Черта, отделяющая галактическую флору от фауны, гораздо тоньше, чем считают мои бывшие коллеги. Жизнь сама стирает различия. И это, пожалуй, единственное, что в ней есть постоянного»."
 nomads.1520.d: "Что вы можете нам предложить?"
 nomads.1520.d.response: "§HИнопланетянин бросает взгляд в сторону смотрового окна, где раскинулось бескрайнее море звезд.§!\n\n«Опыт. Терпение. Умение находить закономерности, незаметные с первого взгляда.\n\nВыделите мне койку — и я научу вас смотреть шире и благоразумнее распоряжаться дарами открываемых вами миров»."
 nomads.1520.e: "Вы очень похожи на нас."
 nomads.1520.e.response: "«Да! Я рад, что вы это заметили».\n\n§HОн наклоняется к вам неприлично близко, а его мандибулы заметно подергиваются от восторга.§!\n\n«Сегментированные тела, крепкие опорные суставы, осязательные ниточки… Такие сходства сложно назвать совпадением».\n\n§HВ этот момент он разрывается стрекочущим смехом.§!\n\n«Возможно, мы произошли от общих предков или наши виды совершенно случайно эволюционировали схожим образом. Как бы то ни было, я просто обязан как следует изучить этот странный феномен… Ох, я уже предвкушаю, как много интересного мы узнаем друг от друга!»"
 leader_trait_nomadic_naturalist: "Жизнь в движении"
 leader_trait_nomadic_naturalist_desc: "Найти жизнь — значит измениться под ее влиянием. Каждая новая раса, каждая необычная экосистема понемногу учит нас жить чуть лучше."
 nomads.1520.hire_custom_tooltip: "§Y$NAME_nomadic_naturalist$§! присоединяется к нашему кораблю-ковчегу в качестве §Hлидера-идеала§! и дает §G300§! ед. §H£job_xeno_zoo_animal£ защищенной фауны§!. Чтобы извлечь из этого пользу, необходим £building£ §Hинопланетный зоопарк§!."
 leader_trait_nomadic_naturalist_effect: "$t$— При назначении на корабль-ковчег увеличивает эффективность глубокого сканирования.\n$t$— Позволяет проводить глубокое сканирование пригодных для жизни планет."
 nomads.1525.name: "Каталог предразумных существ"
 nomads.1525.desc: "Во время изучения системы §Y[FromFrom.GetName]§! мы обнаружили едва уловимые следы жизни. Оказалось, что здесь обитает неизвестная ранее разновидность предразумных существ.\n\n§Y$NAME_nomadic_naturalist$§! настойчиво посоветовал нам отобрать несколько экземпляров для изучения — разумеется, с условием, что мы будем заботиться о них и помогать им развиваться. Эти экземпляры мы разместили в специальном жилом модуле главного корабля-ковчега, где мы сможем вести за ними постоянное наблюдение.\n\nСеро считает, что со временем эти занятные существа многому нас научат, как и мы — их."
 nomads.1525.a: "Какая прелесть!"
 nomads.1525.b: "Нам это неприятно, но, возможно, когда-нибудь они принесут пользу."
 MESSAGE_NOMADIC_NATURALIST_DESC: "§HУченый§! §Y$NAME_nomadic_naturalist$§! обнаружил новых предразумных существ!"
 MESSAGE_NOMADIC_NATURALIST_TITLE: "$nomads.1525.name$"
 planet_xeno_zoo_animals: "$job_xeno_zoo_animal$"
 NAME_nomadic_caregiver: "Модуль Утешение"
 DESC_nomadic_caregiver: "$NAME_nomadic_caregiver$, единственный из сородичей, избравших совершенство синтетических оболочек, добровольно ушел в изгнание, чтобы остаться рядом с больным сыном. Теперь он странствует среди звезд, заботясь о заблудших и обучая тех, кому суждено унаследовать будущее."
 catch_phrase_nomadic_caregiver: "Жизнь вынесет любые невзгоды. Стоит проявить заботу — и она начнет процветать."
 nomads.1530.name: "$NAME_nomadic_caregiver$"
 nomads.1530.desc: "§HВысокий синтетик стоит перед нами, склонив голову. Каждый его жест невероятно точен, но в движениях читается тяжесть прожитых лет, усугубленная нелегкой ношей. Несмотря на железный каркас, он совершенно по-органически выразителен. Расположившееся в его заплечной колыбельке крошечное бледное существо сверлит нас взглядом ярких глаз.§!\n\n«Я — Утешение модулей. Прошу взять нас с сыном на борт пассажирами»."
 nomads.1530.a: "Что привело вас сюда?"
 nomads.1530.a.response: "«В погоне за совершенством мой народ заключил себя в синтетические оболочки. Но его „свобода“ оказалась несовместима с состраданием. У моего сына редкая болезнь — преображение погубило бы его. Как видите, он парализован. Но там, где мои сородичи видят лишь ограничения, я вижу перспективу. Я выбрал сына — а значит, выбрал жизнь изгоя.\n\nТеперь мы всегда в дороге: мы постоянно кому-то нужны. Пусть у машины нет сердца, но зато она способна сделать так, чтобы сердца бились у других»."
 nomads.1530.b: "Насколько… стабильно состояние вашего сына?"
 nomads.1530.b.response: "§HВ ответ на вопрос дитя слабо шевелится, и через встроенный в колыбельку динамик раздается нежный, но отчетливый голосок:§!\n\n«Я хорошо себя чувствую. Звезды медленные — я успеваю за ними».\n\n§H$NAME_nomadic_caregiver$ опускает голову, и его сервоприводы тихо жужжат в такт движению:§!\n\n«Жизнь в таком теле трудна, но его дух непреклонен. Мой народ искал совершенства — и пришел к безразличию. Теперь я странствую по галактике и надеюсь, что когда-нибудь смогу отблагодарить сына за его храбрость — она многому меня научила. До тех пор я буду носить его с собой и учить других всему, что знаю о живом небе»."
 nomads.1530.c: "Чему вы собираетесь научить других?"
 nomads.1530.c.response: "«Что выживает не только сильнейший — выживает и мудрейший, преодолевший тернистый путь.\n\nКаждая встреча — это урок. Я помогаю юношам носить эти уроки в сердце, чтобы они могли черпать мудрость из своих странствий»."
 nomads.1530.d: "Зачем вы взяли на себя это бремя?"
 nomads.1530.d.response: "§HСинтетик отводит взгляд к смотровому окну, где мерцают далекие звезды.§!\n\n«Потому что каждое поколение вынуждено вновь и вновь познавать старые истины. Дорога — хороший учитель, но будет лучше, если кто-то сможет объяснять им суть ее уроков».\n\n§HНаступившую после этих слов тишину прорезает детский голос, удивительно бодрый, пусть и немного искаженный динамиком:§!\n\n«Он всегда так говорит. Но мне кажется, он просто любит помогать»."
 nomads.1530.e: "Тебя не смущает, что мы тоже синтетики?"
 nomads.1530.e.response: "§HПока $NAME_nomadic_caregiver$ обдумывает ваш вопрос, его оптические приборы слегка мерцают.§!\n\n«Нет, это не имеет значения. Хоть я и ушел в изгнание, но прекрасно понимаю, что для моего народа преображение было лучом надежды. Поэтому я не осуждаю тех, кто решил слиться с машинами или же был рожден в этой синтетической форме».\n\n§HВ его голосе появляется легкий успокаивающий гул.§!\n\n«Важно то, что даже такому телу не чуждо сострадание. Напротив, оно лишь помогает переносить тяготы и заботиться об окружающих»."
 nomads.1530.trait.1: "$MOD_LOGISTIC_GROWTH_MULT$"
 nomads.1530.trait.2: "$MOD_PLANET_POP_ASSEMBLY_MULT$"
 leader_trait_nomadic_caregiver: "Хранитель учения"
 leader_trait_nomadic_caregiver_desc: "С каждым завершенным контрактом этот лидер всё больше превращает ковчег в колыбель познания и развития."
 leader_trait_nomadic_caregiver_effect: "$t$• $mod_planet_researchers_produces_mult$: §G+3%§!\n$t$• Эффекты увеличиваются на §G3%§! за каждый завершенный §Hконтракт§! (до §G15%§!)\n$t$• $mod_planet_researchers_amenities_produces_add$: §G+150§!"
 nomads.1545.name: "Обучение на контрактах"
 nomads.1545.desc.normal: "$NAME_nomadic_caregiver$ считает, что последний выполненный нами контракт предоставил ему прекрасную возможность научить молодое поколение чему-то новому. Под его руководством дети не только постигают основы счета и грамоты, но также учатся сочувствовать и помогать друг другу.\n\nСмех его сына, громким эхом разносящийся по коридорам, — главное свидетельство, что никакой технический прогресс не заменит простой радости; это понимают даже старцы."
 nomads.1545.desc.machine: "$NAME_nomadic_caregiver$ считает, что считает, что последний выполненный нами контракт предоставил ему прекрасную возможность установить обратную связь. Новые единицы обучаются процедурам технического обслуживания, наблюдения и взаимодействия. Накопленная информация не всегда сохраняется надолго, но функциональные возможности присутствующих единиц возросли.\n\nВопреки нашим прогнозам, общая эффективность в определенной степени увеличилась."
 nomads.1545.desc.hive: "$NAME_nomadic_caregiver$ считает, что последний выполненный нами контракт предоставил ему прекрасную возможность провести повторную калибровку. С помощью когнитивного узла он учит единицы Разума терпению и согласованности; к каждой единице $NAME_nomadic_caregiver$ относится так, будто она — его собственное потомство.\n\nИ хотя обучение коллективного разума индивидом — необычная практика, оно всё-таки приносит определенные результаты: наши мысли обрели новую гармонию."
 nomads.1545.b: "Необычный, но полезный подход."
 nomads.1545.c: "Этот подход имеет определенную ценность."
 nomads.1545.effect_tt: "§Y$NAME_nomadic_caregiver$§! почерпнул таким образом новые знания:\n$t$• $mod_planet_researchers_produces_mult$: §G+3%§!"
 MESSAGE_NOMADIC_CAREGIVER_TITLE: "$nomadic_education$"
 MESSAGE_NOMADIC_CAREGIVER_DESC: "§Y$NAME_nomadic_caregiver$§! своим усердным трудом вновь помог нам нарастить §Hпроизводство нематериальных ресурсов§!."
 nomadic_education: "Мобильное обучение"
 nomadic_education_desc: "§Y$NAME_nomadic_caregiver$§! почерпнул новые знания в ходе выполнения этого контракта."
 NAME_nomadic_champion: "Тх'аал Хаск'Гурон"
 DESC_nomadic_champion: "$NAME_nomadic_champion$ участвовал в сотнях сражений. Он бился за вознаграждение, за гордость, за принципы… пока всё это не стало для него пустым звуком. Теперь он сражается ради чувства восторга, которое приходит к нему в бою, — и ради трофеев, которые добывает в каждой схватке."
 catch_phrase_nomadic_champion: "Однажды пустота всё равно получит свое — так что дерись и смейся, пока можешь!"
 nomads.1555.name: "$NAME_nomadic_champion$"
 nomads.1555.desc: "§HНовоприбывший встречает нас раскатистым смехом, каждый его жест излучает веселье. Он движется с непринужденной легкостью того, кто обманывал смерть бессчетное множество раз и давно перестал воспринимать ее всерьез.§!\n\n«Звать меня $NAME_nomadic_champion$. Слыхал, вам по душе опасность. Возьмите меня с собой, и я покажу вам, как выглядит реальная заварушка. Может, заодно прихватим парочку сувениров на память»."
 nomads.1555.a: "Вы были наемником?"
 nomads.1555.a.response: "«Ага. Проторчал несколько лет с ребятами из Анклава, у которых только оплата была на уме. Драки были нормальные, но народец они гниловатый».\n\n§HОн ухмыляется, словно вспомнил какую-то шутку, понятную только ему.§!\n\n«Знаете, когда все напарники думают только о вознаграждении, перестрелки быстро теряют весь свой шарм. Потому-то я и ушел. Жизнь слишком коротка, чтобы проливать кровь за чужую прибыль»."
 nomads.1555.b: "Вы всё еще верите в битву?"
 nomads.1555.b.response: "§HОн смеется, запрокинув голову.§!\n\n«Верю? К чему мне это? Пусть битва верит в меня!\n\nВы ведь и сами прекрасно знаете: важно лишь то, что останется с тобой после боя. Шрам, осколок, славная байка… У вас, кочевников, здравый подход — хранить только то, что необходимо, а от остального избавляться»."
 nomads.1555.c: "К чему вы теперь стремитесь?"
 nomads.1555.c.response: "§HОн разминает плечи, словно готовясь к бою.§!\n\n«Я всегда стремлюсь к следующей схватке.\n\nЕсли никто не пытается меня убить, то день потрачен зря»."
 nomads.1555.d: "Что вы можете нам предложить?"
 nomads.1555.d.response: "§HОн подается вперед, улыбаясь еще шире. В глазах сверкает огонек — дружеский и в то же время грозный.§!\n\n«Добрую драку и пару трофеев, достойных места в коллекции. Я научу ваших воинов биться что есть силы, ценить красоту схватки и хранить память о каждой победе. Трофеи напоминают нам о том, кто мы есть. Может, они и галактике кое-что поведают о нас»."
 nomads.1555.e: "Кажется, однажды вы уже сталкивались с нашим народом."
 nomads.1555.e.response: "§HОн тут же замолкает, а его кожа резко меняет окрас. Похоже, ваше замечание его немного смутило.§!\n\n«Ну да, было дело… Надеюсь, никто из ваших знакомых не пострадал»."
 nomads.1555.f: "Вы принадлежите к нашей расе?"
 nomads.1555.f.response: "§HОн недоуменно пожимает своими огромными плечами.§!\n\n«Не знаю. Может быть. Ну так что, возьмете меня с собой?»"
 leader_trait_nomadic_champion: "Счастливый воин"
 leader_trait_nomadic_champion_desc: "Каждая битва оставляет свой след, и $NAME_nomadic_champion$ бережно хранит их все. Под звуки его смеха смертельная опасность обращается торжеством победы, а его трофеи напоминают флоту о том, за что мы воюем."
 leader_trait_nomadic_champion_effect: "$t$• §YВозглавляя§! успешное планетарное вторжение, этот лидер может быть ценный §Hтрофей§!.\n$t$• Трофеи хранятся в §HЗале трофеев§! нашей §Yстолицы§!, а их эффекты суммируются."
 d_trophy_hall: "Зал трофеев"
 d_trophy_hall_desc: "Палаты, где §G$NAME_nomadic_champion$§! развесил свои покрытые шрамами трофеи — зримые напоминания о наших победах. Добытые им реликвии воодушевляют каждого, кто проходит под высокими сводами этого зала."
 nomads.1565.name: "Достойный трофей"
 nomads.1565.desc: "§HРадостно улыбаясь, $NAME_nomadic_champion$ неожиданно бережно помещает находку на законное место. Трудно понять, что это такое — отчасти металл, отчасти кость, отчасти что-то еще. Как бы то ни было, на трофее есть четкие отметины недавней битвы.§!\n\n«После каждой драки что-нибудь да остается, но не всякая находка достойна попасть в коллекцию. Может, выставим наш трофей напоказ? Места у нас полно!»\n\n§H$NAME_nomadic_champion$ взрывается оглушительным смехом, словно его добыча — это какая-то шутка, которую понимает лишь он да звезды в небе.§!"
 nomads.1565.a.tt: "В нашей §Yстолице§! появится новый §HЗал трофеев§!, дающий следующие эффекты:\n• §G+50§! должностей «[soldier.GetName]»\n• §G+10%§! к скорости создания армии\n• §G−5%§! к стоимости армии\n• §G+1§! к собранным трофеям\n• Эффект умножается на количество добытых §Hтрофеев§! (до 8)"
 MESSAGE_NOMADIC_CHAMPION_TITLE: "Добыт трофей"
 MESSAGE_NOMADIC_CHAMPION_DESC: "§HКомандир§! §Y$NAME_nomadic_champion$§! добыл очередной трофей!"
 NAME_nomadic_princess: "Сералун"
 DESC_nomadic_princess: "$NAME_nomadic_princess$ совсем молода, но уже успела исходить немало дорог. Впрочем, странствия не подкосили ее: она сильна, невозмутима и самодостаточна; рядом с ней равновесие обретается само по себе."
 catch_phrase_nomadic_princess: "Голос с далеких и бескрайних звездных просторов зовет меня домой."
 nomads.1580.name: "$NAME_nomadic_princess$"
 nomads.1580.desc: "§HЮная путница шагает вперед аккуратно и спокойно. Весь ее облик говорит о том, что ей не привыкать к долгим странствиям. Изнутри она словно лучится силой — тихой, но всё же явной.§!\n\n«Меня зовут $NAME_nomadic_princess$. Я прибыла сюда издалека… и дорога оказалась длиннее, чем я предполагала. Если у вас на борту еще есть место, я прошу на время взять меня пассажиром»."
 nomads.1580.a: "Что привело вас сюда?"
 nomads.1580.a.response: "«К сожалению, я не могу ответить наверняка. Какую-то часть пройденного пути я просто… позабыла. Но что-то, наоборот, помню совершенно отчетливо.\n\n§HЕе строгий взгляд смягчается, а в глазах мелькает проблеск надежды.§!\n\n«Если вы согласитесь принять меня, я буду странствовать вместе с вами. Мне надо кое-что найти… или вспомнить… пока оно снова не скрылось»."
 nomads.1580.b: "Вы не помните своего прошлого?"
 nomads.1580.b.response: "«Не четко. И не полностью».\n\n«Какие-то воспоминания как будто не мои. Я вижу безымянные лица, дом среди звезд… но кроме этого нет ничего».\n\n§HОна приглаживает большим пальцем край плаща.§!\n\n«Но я точно знаю, что потеряла что-то важное. А вот что меня сюда привело… Не знаю. Может, удача? Или судьба? Или всё сразу? Чтобы найти ответы, нужно время»."
 nomads.1580.c: "Чем мы можем помочь?"
 nomads.1580.c.response: "§HНахмурившись, она отворачивается и смотрит на звезды. На ее лице видна плохо скрываемая тоска.§!\n\n«Я не знаю, что такое дом — это цель или воспоминание? Но я чувствую, что вы поможете мне узнать ответ»."
 nomads.1580.d: "Что вы можете нам предложить?"
 nomads.1580.d.response: "§H$NAME_nomadic_princess$ выпрямляется; каждое слово в ее ответе тщательно подобрано.§!\n\n«Недоверие порождает исключительно горе. Я молода, но этот урок я выучила очень хорошо. Если для меня найдется место среди вашего народа… я буду помогать вам всем, чем только смогу».\n\n§HСменив суровый тон на спокойный, она продолжает:§!\n\n«И я всегда буду помнить тех, кто помог мне обрести дом — когда я его найду»."
 nomads.1580.e: "Внешне вы поразительно похожи на нас."
 nomads.1580.e.response: "§H$NAME_nomadic_princess$ медлит с ответом. Всего секунду в чертах ее лица отражается неуверенность.§!\n\n«Я тоже это заметила. И ничем не могу объяснить это явление».\n\n§HОна проводит рукой по щеке, словно надеясь пробудить этим прикосновением какие-то воспоминания.§!\n\n«Не знаю, родилась ли я среди вас или мы связаны каким-то далеким родством… Истина мне неведома. Знаю лишь, что хочу помочь вам. Если вы меня примете, то мои руки и сердце станут вашими в этом путешествии, пока я не выясню, откуда началось мое»."
 nomads.1580.hire_custom_tooltip: "§Y$NAME_nomadic_princess$§! присоединяется к нашему кораблю-ковчегу в качестве §Hлидера-идеала§!."
 leader_trait_amnesiac: "Потеря памяти"
 leader_trait_amnesiac_desc: "$NAME_nomadic_princess$ не помнит своего прошлого, но возможно, что память вернется к ней, как только она обретет потерянное."
 leader_trait_amnesiac_effect: "$NO_ACTIVE_EFFECTS$"
 nomads.1585.name: "Нечеткие воспоминания"
 nomads.1585.desc: "К §Y$NAME_nomadic_princess$§! в последнее время постепенно возвращаются воспоминания — пока еще нечеткие, но уже вызывающие ощущение, что ей знакомы некоторые коридоры корабля-ковчега, словно когда-то она уже здесь была. Даже расположение звезд на наших картах кажется ей неожиданно узнаваемым.\n\n§H«Я отметила на карте места, которые кажутся мне… важными. Не могу сказать, почему они так манят меня… но если мы их посетим, то, может быть, я вспомню что-нибудь еще».§!\n\nОна указала нам несколько координат, которые, по ее мнению, способны пробудить дремлющие воспоминания. В любом случае, эти места стоило бы изучить…"
 nomadic_princess_chain_title: "Фрагменты прошлого"
 nomadic_princess_chain_desc: "Нечеткие воспоминания манят §Y$NAME_nomadic_princess$§! к далеким местам среди звезд. Возможно, там память вернется к ней."
 nomadic_princess_poi_title_1: "Далекое воспоминание"
 nomadic_princess_poi_desc_1: "Координаты, которые оставила §Y$NAME_nomadic_princess$§!, выглядят очень знакомо."
 nomadic_princess_poi_title_2: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_2: "$nomadic_princess_poi_desc_1$"
 nomadic_princess_poi_title_3: "$nomadic_princess_poi_title_1$"
 nomadic_princess_poi_desc_3: "$nomadic_princess_poi_desc_1$"
 nomads.1595.name: "На краю воспоминаний"
 nomads.1595.desc: "В системе §Y[fromfrom.GetName]§! мы нашли больше вопросов, чем ответов. §Y$NAME_nomadic_princess$§! чувствует, что это место ей знакомо, но не может объяснить, чем именно. Сканирование показало, что на орбите звезды вращается некий обломок искусственного происхождения. Судя по конструкции, это фрагмент какого-то космического сооружения, однако опознать его невозможно: со временем все опознавательные знаки безвозвратно стерлись.\n\n§H«Я думала, что смогу что-нибудь вспомнить, как только вернусь сюда…§! — произносит она тихим голосом. — §HНо, наверное, еще рано».§!"
 nomads.1600.name: "Вид на дом"
 nomads.1600.intro: "Наша исследовательская группа обнаружила небольшой кристалл данных, дрейфующий среди обломков в системе §Y[fromfrom.GetName]§!. Его корпус оплавлен, но одна деталь различима четко: фрагмент старого регистрационного кода — буквы §H«U N S»§!."
 nomads.1600.nonhuman: "$nomads.1600.intro$ Неизвестно, что они означают, $nomads.1600.outro$"
 nomads.1600.human: "$nomads.1600.intro$ Это обозначение необъяснимым образом схоже с теми, какими традиционно пользовались мы, $nomads.1600.outro$"
 nomads.1600.outro: "однако расшифрованное содержимое кристалла также содержит набор точных координат.\n\nВ то же время §Y$NAME_nomadic_princess$§! восстановила еще одно воспоминание. Ей вспомнилась обширная смотровая палуба, россыпь звезд за безмолвным иллюминатором и чья-то направляющая рука, указывающая на голубой мир — третью планету от солнца."
 nomads.1600.a: "Нужно помочь ей вспомнить всё остальное."
 nomads.1600.b: "Ее прошлое нас не волнует. У нас теперь есть всё, что нужно."
 nomads.1605.name: "Эхо детства"
 nomads.1605.desc: "В памяти §Y$NAME_nomadic_princess$§! всплыло очередное воспоминание: собравшиеся в зале фигуры в безупречных мундирах о чем-то переговаривались негромкими, но твердыми и уверенными голосами — такие обычно свойственны тем, кто привык отдавать приказы.\n\n§H«Они спорили…§! — полушепотом произносит она. — §HТихо, но отчетливо… Спорили о каком-то задании. О каком-то запуске, который надо было держать в тайне. Вместе с нами отправили еще два корабля. Но зачем? Мы от кого-то бежали?..»§!"
 nomads.1605.a: "Вопросов становится всё больше."
 nomads.1610.name: "Восстановленный осколок"
 nomads.1610.desc: "В памяти §Y$NAME_nomadic_princess$§! всплыло еще одно воспоминание: жизнь на огромном корабле, в отсеках которого целые поколения рождались, жили и умирали.\n\nОна вспоминает, как однажды мирная жизнь рухнула в одночасье под завывание сирен и грохот взрывов в далеком коридоре. Некая женщина подхватила $NAME_nomadic_princess$ и отнесла ее к спасательной капсуле.\n\n§H«Она прижала меня к себе. Сказала, что я должна выжить любой ценой… потому что это очень важно. А потом я осталась одна. Каждый раз я почти вспоминаю ее лицо, но оно вновь и вновь ускользает из памяти…»§!"
 nomads.1610.a: "Корабль поколений… Совсем как наш?"
 NOMADIC_PRINCESS_SPECIAL_PROJECT: "Разрушенный корабль"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_DESC: "По указанным координатам мы обнаружили останки громадного корабля. Конструкция его надстройки не оставляет никаких сомнений: перед нами стандартный корабль-ковчег.\n\nПредварительный анализ выявил сбой внутренних систем катастрофического масштаба. Если мы продолжим изучение, то нам, возможно, удастся обнаружить ключ к воспоминаниям §Y$NAME_nomadic_princess$§!."
 NOMADIC_PRINCESS_SPECIAL_PROJECT_REQUIREMENT: "На орбите есть корабль-ковчег или научный корабль ($COUNT$ из $REQUIRED$)."
 nomads.1620.name: "Выжившая наследница"
 nomads.1620.desc: "Анализ разрушенного корабля поколений дал нам немаловажные ответы на вопросы о происхождении §Y$NAME_nomadic_princess$§!. Внутреннее строение и конструкция системы жизнеобеспечения полностью соответствуют ее рассказам. В бортовом компьютере мы обнаружили поврежденные, но еще сохранившиеся записи, повествующие о некоей наследнице, которую с самого детства готовили к тому, чтобы однажды встать во главе корабля.\n\nСогласно бортовому журналу, всего за несколько секунд до полного разрушения с корабля был эвакуирован всего один малолетний пассажир. Остальные капсулы остались на своих местах.\n\n§H«Меня спасли…§! — тихо произносит она. — §HЗначит, я была не просто пассажиром… Я должна была их возглавить. Прошу, помогите мне понять, отчего это так важно?»§!"
 nomads.1620.a: "Восстановить корабль."
 nomads.1620.tt: "§H$NAME_nomadic_princess$§! восстановила память и получила признаки §Y«$leader_trait_nomadic_princess_1$»§! и §Y«$leader_trait_nomadic_princess_2$»§!."
 leader_trait_nomadic_princess_1: "Врожденная грация"
 leader_trait_nomadic_princess_1_desc: "После восстановления корабля-ковчега к §H$NAME_nomadic_princess$§! окончательно вернулись воспоминания — в частности, она вспомнила, чему ее учили, когда готовили к ее будущей роли. Ее выдержка и познания сослужат хорошую службу в посредничестве между звездными державами."
 leader_trait_nomadic_princess_2: "Законная распорядительница"
 leader_trait_nomadic_princess_2_desc: "После возвращения на восстановленный корабль-ковчег §H$NAME_nomadic_princess$§! вспомнила всё, чему ее успели научить, и теперь занимает давно предназначенный для нее пост."
 leader_trait_nomadic_princess_effect: "$t$• §G+5%§! к ресурсам от £job£ должностей\n$t$• §G+20%§! к скорости строительства инфраструктуры колоний"
 nomadic_princess_not_aboard_ship: "§R\n$t$Эффекты действуют при командовании §H$NAME_princess_fleet$.§!§!\n\n"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_2: "Восстановить корабль-ковчег"
 NOMADIC_PRINCESS_SPECIAL_PROJECT_2_DESC: "Перестроить погибший корабль будет непросто, но в процессе мы наверняка больше узнаем о происхождении §Y$NAME_nomadic_princess$§! и о том, что именно она должна была унаследовать."
 nomads.1625.name: "Возвращенное прошлое"
 nomads.1625.desc: "Корабль-ковчег восстановлен. Давно бездействовавшие системы мгновенно пробудились в присутствии §Y$NAME_nomadic_princess$§!. Данные в восстановленных компьютерах подтвердили то, что мы и предполагали: ее растили как наследницу, которой было уготовано возглавить корабль и его население.\n\nСреди записей мы обнаружили голосовое сообщение: спокойный — и знакомый — женский голос рассказывает о порядке наследования и о том, как необходимо защитить дитя. Приказ о запуске спасательной капсулы она отдает в тот момент, как корабль начинает разваливаться на части.\n\n§H«Я знаю этот голос…§! — шепчет $NAME_nomadic_princess$. — §HЭто… я сама. Или же меня сделали из ее материала. Я клон, вот почему я выжила. Она спасала саму себя».§!\n\nЧто бы ни произошло с кораблем, теперь он идет под нашим знаменем — и под командованием наследницы, наконец занявшей уготованное ей место."
 nomads.1625.a: "Предназначение исполнено."
 NAME_princess_fleet: "КОН «Триллиум»"
 NAME_princess_ship: "$NAME_princess_fleet$"
 nomads.1630.name: "Утраченные отголоски"
 nomads.1630.desc: "§Y$NAME_nomadic_princess$§! больше нет, и неуловимое эхо ее воспоминаний умолкло навсегда. Мы никогда не разгадаем ее тайну.\n\nМы не узнаем конца ее истории, но сохраним ее в своей памяти."
 nomads.1630.a: "Мы не забудем."
 nomadic_princess_tt: "§RНельзя уволить $NAME_nomadic_princess$, пока она не восстановит свои воспоминания.§!"
 leader_no_dismiss_tt: "§RЭтого лидера сейчас нельзя уволить.§!"
 #######################
 # Arkship Events
 #######################
 # Arkship Destruction
 ARKSHIP_DEBRIS: "Остов корабля-ковчега"
 ARKSHIP_DEBRIS_DESC: "От гигантского корабля-ковчега, уничтоженного в бою, осталось только огромное поле обломков. Впрочем, то, что осталось от его инфраструктуры, двигателей и корпуса, еще можно утилизировать."
 RECOVER_DISABLED_NOMAD_VESSEL: "Проект по восстановлению"
 RECOVER_DISABLED_NOMAD_VESSEL_ARKSHIP_DESC: "Один из наших кораблей-ковчегов погасил огни и дрейфует в космической пустоте после аварийного отключения всех систем. Когда наши инженеры взойдут на борт, они смогут восстановить питание и вернуть его под наш контроль."
 RECOVER_DISABLED_NOMAD_VESSEL_WAYSTATION_DESC: "Один из наших маршрутных станций погасла после аварийного отключения всех систем. Когда наши инженеры взойдут на борт, они смогут восстановить питание и вернуть ее под наш контроль."
 arkship_debris_wreckage: "Остов корабля-ковчега"
 arkship_debris_wreckage_desc: "В космической пустоте безмолвно дрейфуют обломки корабля-ковчега, принадлежавшего кочевникам. Мы можем послать к ним научный корабль, чтобы изучить остов и, возможно, добыть ценный утиль."
 arkship.1005.name: "Кочевой корабль-ковчег уничтожен"
 arkship.1005.desc: "Корабль-ковчег §Y«[from.GetName]»§! в системе §Y[from.solar_system.GetName]§! окончательно уничтожен.\n\nЭто судно — не просто грозное оружие: здесь проживали бесчисленные кочевые расы. Целые поколения, странствовавшие на ковчеге от одной звезды к другой, лишились последнего, что их связывало.\n\nОт корабля остался лишь остов, безмолвно дрейфующий в мировом пространстве."
 arkship.1005.a: "Большой успех."
 arkship.1005.desc.nomad: "Корабль-ковчег §Y«[from.GetName]»§! был уничтожен в системе §Y[from.solar_system.GetName]§!.\n\nМы как никто другой понимаем значение этого корабля — в его корпусе была целая цивилизация, поколения которой сменялись в одних и тех же стенах. Мы понимаем, но не могли поступить иначе.\n\nИх странствие окончится здесь."
 arkship.1005.b: "Их путешествие окончено."
 arkship.1005.desc.homicidal: "Инопланетное судно §Y«[from.GetName]»§! было уничтожено в системе §Y[from.solar_system.GetName]§!.\n\nФлотилия кочевников отчаянно сопротивлялась, но силы были неравны. Бродяги, скитающиеся меж звёзд без всякой цели всегда будут угрозой. Теперь от их корабля-ковчега осталась лишь груда обломков.\n\nПусть никто из них не доберётся до безопасной гавани."
 arkship.1005.c: "Ещё одним препятствием меньше."
 arkship.1015.name: "Ужасная утрата"
 arkship.1015.desc: "Враг уничтожил наш корабль-ковчег §Y[from.GetName]§! в системе §Y[from.solar_system.GetName]§!.\n\nНаш отважный экипаж отчаянно сопротивлялся, но противник оказался слишком силен. Защитные системы дрогнули, и ковчег разлетелся на тысячи кусочков, разбросанных в космической пустоте.\n\nМы навсегда запомним этот день."
 arkship.1015.a: "Страшная трагедия."
 arkship.1015.desc.nomad: "Мы потеряли корабль-ковчег §Y«[from.GetName]»§! в системе §Y[from.solar_system.GetName]§! — и виновники тому даже не оседлые государства, которые страшатся того, чего не понимают, а такие же странники, знающие космос не хуже нас.\n\n§Y[fromfrom.GetName]§! [fromfrom.GetName::ударил|||fem:ударила|||neut:ударило|||pl:ударили] по нам, прекрасно понимая, что [fromfrom.GetName::уничтожит|||pl:уничтожат] последний дом целого народа. Среди скитальцев нет солидарности. Есть только выживание.\n\nМы этого не забудем."
 arkship.1015.b: "У пустоты нет любимчиков."
 arkship.1015.desc.homicidal: "Наш корабль-ковчег §Y«[from.GetName]»§! в системе §Y[from.solar_system.GetName]§! был уничтожен — и нападавших вела даже не жажда завоеваний, а стремление полностью истребить нас.\n\n§Y[fromfrom.GetName]§! не [fromfrom.GetName::гнался|||fem:гналась|||neut:гналось|||pl:гнались] за новыми территориями или добычей. Единственное, чего они добивались, это стереть нас с лица галактики, сколько бы жизней это ни унесло.\n\nНо мы выживем. Выстоим. Не станем историей."
 arkship.1015.c: "Им нас не истребить."
 #Random Events
 an_old_container_chain_title: "Старый контейнер"
 an_old_container_chain_desc: "Во время технического обслуживания на нижней палубе корабля-ковчега §Y«[Root.GetName]»§! рабочие обнаружили неучтенный груз в виде укрепленного контейнера, излучающего радиационные сигналы. Нам не удалось найти в архивах никаких упоминаний о контейнере, равно как и никаких обозначений, указывающих на его происхождение или содержимое."
 arkship.5.name: "Старый контейнер"
 arkship.5.desc: "Инженеры, проводящие техническое обслуживание на нижней палубе корабля-ковчега §Y«[Root.GetName]»§!, обнаружили старый запечатанный контейнер, который излучает радиационные сигналы. На его обожженной поверхности ясно видны грубые швы от промышленной сварки — вероятно, это было сделано, чтобы контейнер нельзя было открыть сразу же.\n\nВ архивах грузовых ведомостей не нашлось никаких упоминаний о находке, равно как и никаких обозначений, указывающих на ее происхождение или содержимое. Для более подробного анализа контейнера потребуется некоторое время."
 arkship.5.a: "Посмотрим, что внутри."
 arkship.10.name: "Необычная находка"
 arkship.10.desc: "Сканирование обычными приборами показало, что внутри находятся ничем не примечательные изделия и материалы — вероятно, обычные припасы. Однако при более тщательном анализе мы обнаружили загадочный плотный объект с необычайными свойствами и неопределенным составом.\n\nОн не испускает энергии, поглощает почти все волны от сканирующего оборудования, а материал, из которого он сделан, не значится в базе данных корабля. Через выводимое на монитор изображение невозможно даже с точностью определить форму этого странного предмета. Часть ученых предупредила нас, что [Root.GetName] может быть в опасности, поскольку подобные аномалии непредсказуемы."
 arkship.10.a: "Вскрыть контейнер."
 arkship.10.b: "Выбросить его в открытый космос."
 arkship.15.name: "Укрытый кристалл"
 arkship.15.desc: "Оболочка второго контейнера оказалась невероятно прочной — простые инструменты были перед ней бессильны, поэтому на попытки вскрыть ее ушло больше ресурсов и времени, чем мы предполагали. Внутри мы обнаружили темный кристалл с острыми гранями — в записях ничего подобного не упоминалось. Кристалл испускает слабое тепло и поглощает окружающий свет, создавая впечатление, что из него лучится тьма. Неожиданная находка сразу вызвала немалый интерес у членов экипажа.\n\nПредварительное заключение ученых таково: возможно, кристалл получится приспособить в качестве источника энергии, однако для этого придется тщательно его изучить, поскольку еще неясно, как именно воплотить эту гипотезу на практике."
 arkship.15.a: "Выставить кристалл на обозрение на общей территории."
 arkship.15.b: "Выставить кристалл на обозрение в Великом архиве."
 arkship.15.c: "Определить происхождение кристалла."
 arkship.15.d: "Изучить его энергетические свойства."
 arkship.20.name: "Ценное имущество"
 arkship.20.desc: "Как только мы достали кристалл, он начал пульсировать — совершенно беззвучно и без каких-либо признаков желания установить контакт, однако биение сердцевины неизбежно учащалось, как только кто-нибудь оказывался рядом.\n\nВремя от времени он испускал слабый свет, исходящий с определенными интервалами. Кто-то уверял, что кристалл мерцает, если начать напевать рядом с ним, другие же заметили, что он слегка вибрирует, словно слушает нас.\n\nВнутри мы не обнаружили никаких признаков жизни, но кристалл тем не менее, похоже, осознает происходящее. Главная загадка, впрочем, кроется в другом: свидетели этих вспышек сообщают, что испытывают необъяснимое чувство радости."
 arkship.20.a: "Умиротворяющая встреча."
 arkship.25.name: "Застывшая симфония"
 arkship.25.desc: "Тщательно проанализировав последовательность пульсации кристалла, мы наконец смогли установить его происхождение, а заодно определить, что вибрации не случайны. Переведя их последовательность в звук, мы обнаружили, что издаваемые кристаллом импульсы — не что иное, как старая колыбельная, которую и сегодня можно иногда услышать на корабле-ковчеге.\n\nКогда мы воспроизвели мелодию, все присутствующие ощутили невероятное успокоение. Эта колыбельная — не просто песня, знакомая с детства: она напоминает нам о прежней жизни, когда мы еще не покинули родную планету и не вознеслись к звездам.\n\nМы выставили кристалл на всеобщее обозрение, чтобы каждый мог время от времени, почувствовав его вибрацию, вернуться к своим корням."
 arkship.25.a: "Трогательное переживание."
 arkship.30.name: "Путь вперед"
 arkship.30.desc: "Мы решили провести эксперимент в контролируемых условиях и встроить кристалл в контур двигателя. Результат оказался мгновенным: мощность реактора резко превысила стандартный уровень, и двигатели корабля-ковчега зарокотали, наполнившись новой силой. Штурман сообщил о значительном приросте скорости хода, а заодно — о более экономном расходе топлива.\n\nСледующее донесение пришло из инженерных отсеков: по корпусу прошла сильная и звучная вибрация.\n\nВсего через несколько часов кристалл растворился — реакция поглотила его без остатка. Эта загадочная находка наверняка еще скажется на нашем путешествии."
 arkship.30.a: "Полный вперед!"
 arkship.35.name: "Ценная находка"
 arkship.35.desc: "Предварительное сканирование показало, что значительная доля содержимого контейнера — обычный груз, однако под ним мы обнаружили запасы плотных кристаллических сплавов.\n\nПроанализировав радиоактивное излучение, мы установили, что внутри содержится темная материя."
 arkship.35.a: "Забрать всё, что находится внутри."
 arkship.45.name: "Цветная фигурка"
 arkship.45.desc: "Внутри контейнера мы нашли любопытный артефакт. Он источает слабое, но постоянное излучение, колеблющееся между несколькими диапазонами. Невозможно даже описать его форму: она не поддается геометрическим определениям. В общих чертах он выглядит как цветная фигурка, выполненная в виде живого существа. Ее сложная конструкция довольно причудлива: фигурка состоит из сцепленных между собой деталей — скорее всего, ее можно открыть.\n\nОдни ученые предполагают, что под внешней оболочкой может скрываться нечто ценное. Другие предупреждают нас об осторожности, есть риск испортить содержимое или вызвать нежелательные последствия."
 arkship.45.a: "Открыть его."
 arkship.45.b: "Не трогать и выставить на обозрение."
 arkship.50.name: "Секрет внутри"
 arkship.50.desc: "Под внешней оболочкой артефакта мы обнаружили вовсе не запрятанные внутрь ценности или какое-нибудь потайное устройство, а еще одну фигурку — меньшего размера, но сделанную с таким же необычайным вниманием к деталям.\n\nВнутри второй фигурки обнаружилась третья, а в ней — четвертая. Мы не нашли никаких механизмов или записок — только постоянно повторяющиеся фигуры, словно их создателю был интересен сам процесс. Последняя фигурка оказалась совсем небольшой (чуть больше песчинки), безупречно гладкой и удивительно тяжелой.\n\nЕсли когда-то у них и было какое-то предназначение, с годами оно утратилось."
 arkship.50.a: "Загадка на века."
 arkship.55.name: "Интерес молодежи"
 arkship.55.desc: "Мы решили не трогать внешнюю оболочку фигурки и вместо этого выставить находку на обозрение в одном из залов. Изящный артефакт мгновенно привлек внимание окружающих.\n\nКак это ни странно, больше всего фигуркой заинтересовались юные обитатели корабля-ковчега §Y«[Root.GetName]»§!. Мы неоднократно наблюдали, как они собираются вокруг, обсуждают, какое существо хотел изобразить творец, и даже придумывают собственные легенды. По всей видимости, артефакт действует умиротворяюще, снимает напряжение и подстегивает воображение."
 arkship.55.a: "Впечатляющая вещь."
 # Engine Contaminants
 arkship.60.name: "Загрязнение двигателя"
 arkship.60.desc.regular: "В работе реактора §Yкорабля-ковчега [Root.GetName]§! происходят сбои. Впервые на это обратили внимание члены экипажа, засыпающие под звуки работы двигателя: они сообщили, что топливо поступает в двигатель с плохо различимым, но всё же уловимым нарушением ритма. $arkship.60.desc.end$"
 arkship.60.desc.gestalt: "В работе реактора §Yкорабля-ковчега [Root.GetName]§! происходят сбои. Впервые на это обратили внимание [Owner.GetWorkerNamePlural&pl], отдыхающие около двигателя. Они сообщили, что топливо поступает в двигатель с плохо различимым, но всё же уловимым нарушением ритма. $arkship.60.desc.end$"
 arkship.60.desc.end: "\nНаши [Owner.GetEngineerPlural&nom] подтвердили, что в топливные трубы попало инородное вещество.\n\nК счастью, они уже предложили несколько решений."
 arkship.60.a: "Заменить магистрали."
 arkship.60.a.scavanger: "Хорошо, что у нас есть запчасти."
 arkship.60.b: "Звезды не ждут. Не будем отвлекаться."
 arkship.60.c: "Замедлить частоту работы двигателей."
 dirty_generator: "Загрязненный генератор"
 dirty_generator_desc: "Несмотря на загрязненность топлива, двигатель продолжает работать… хорошо это или плохо."
 underclocked_generator: "Замедленный генератор"
 underclocked_generator_desc: "Генератор работает медленнее обычного, чтобы попавшие в него инородные вещества не нанесли оборудованию вреда и не погубили корабль."
 # Start Your Engines
 arkship.65.name: "Запустить двигатели"
 arkship.65.desc: "На корабле-ковчеге §Y[Root.GetName]§! в преддверии большой гонки собрались пилоты со всех концов галактики. Состязание будет длиться почти целый звездный год; участникам предстоит огибать сложные орбиты и проходить круги вокруг корабля-ковчега и ближайших небесных тел.\n\nНам же необходимо определиться, кто оправдает наши надежды и пересечет финишную черту первым."
 arkship.65.a: "§Y[pilot_gale_speed.GetName]§! всё так же [pilot_gale_speed.GetAXX::быстр|||fem:быстра], пусть даже какое-то время [pilot_gale_speed.GetAXX::он заседал|||fem:она заседала] в совете."
 arkship.65.b: "Победит команда, которая умеет читать гиперпространство, как карту."
 arkship.65.c: "[pilot_dragonslayer.GetAXX::Наш|||fem:Наша] убийца драконов §Y[pilot_dragonslayer.GetName]§! непременно одержит победу!"
 arkship.65.d: "§Y[pilot_mercenary_warrior.GetName]§! даже состязается с яростью истинного налетчика!"
 arkship.65.e: "Для такого пилота, как §Y[pilot_hells_heart.GetName]§!, даже матриарх — не проблема. Пусть он участвует!"
 arkship.65.f: "Победит наш хан §Y[pilot_great_khan.GetName]§!!"
 arkship.65.g: "Один разум — хорошо, а два — лучше. §Y[pilot_brainslug.GetName]§! безупречно умеет летать."
 arkship.65.h: "§YСерость§! уже не первое столетие оттачивает мастерство гонщика."
 arkship.65.i: "§Y[pilot_tuner.GetName]§! переоборудует свой корабль так, чтобы сохранять скорость на любых поворотах."
 arkship.65.j: "§Y[pilot_frontier_adventurer.GetName]§! без труда находит путь где угодно."
 arkship.65.k: "§Y[pilot_scholarium_explorer.GetName]§! применяет теорию на практике, ускоряя прохождение кругов."
 arkship.65.l: "§Y[pilot_slippery.GetName]§! — пилот, которого невозможно вытеснить с трассы."
 arkship.65.m: "§Y[pilot_psionic.GetName]§! чувствует трассу и всегда действует быстрее других."
 arkship.65.n: "§Y[pilot_synthetic.GetName]§! в реальном времени высчитывает самый короткий маршрут."
 arkship.65.o: "§Y[pilot_virtual.GetName]§! видит дух в алгоритме поиска пути."
 arkship.65.p: "Нервы, одетые в металл, — залог победы, и §Y[pilot_cyborg.GetName]§! тому доказательство."
 arkship.65.q: "§Y[pilot_erudite.GetName]§! изучает трассу и совершенствуется с каждым кругом."
 arkship.65.r: "Неважно, каковы шансы: §Y[pilot_chosen_one.GetName]§! — наш избранник."
 arkship.65.s: "§Y[pilot_flight.GetName]§! ловко вылетает из кабины и влетает обратно."
 arkship.65.t: "Нет ничего лучше, чем наш подпространственный двигатель!"
 arkship.65.u: "Вакуум — наш дом родной. Эволюционировавшая единица неспособна проиграть."
 arkship.65.default: "Лучше выберем кого-нибудь случайным образом."
 arkship.65.victory: "наш пилот побеждает."
 arkship.65.loss: "наш пилот проигрывает."
 arkship.70.name: "[Root.GetName]: победа"
 arkship.70.desc.start: "Атмосфера на борту корабля-ковчега §Y[Root.GetName]§! сгустилась, когда финалисты вышли на последний гравитационный маневр вокруг звезды [Star.GetName]."
 arkship.70.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§! [selected_pilot.GetAXX::следовал|||fem:следовала] за лидером по пятам до выхода на конечную прямую, после чего резко [selected_pilot.GetAXX::вырвался|||fem:вырвалась] вперед, безупречно обойдя соперника, и [selected_pilot.GetAXX::покинул|||fem:покинула] трассу, оставив после себя лишь след от ионного двигателя."
 arkship.70.desc.gray: "$arkship.70.desc.start$\n\n§YСерость§! подает всем пример блистательной победы: следует за лидером по пятам до выхода на конечную прямую, после чего резко вырывается вперед, безупречно обойдя соперника, и покидает трассу, оставив после себя лишь след от ионного двигателя."
 arkship.70.desc.no_leader: "$arkship.70.desc.start$\n\nНаш пилот следовал за лидером по пятам до выхода на конечную прямую, после чего резко вырвался вперед, безупречно обойдя соперника, и покинул трассу, оставив после себя лишь след от ионного двигателя."
 arkship.70.desc.end: "\n\nМы сделали верную ставку, и наш фаворит побеждает. Невероятная гонка!"
 arkship.70.a: "У победителя можно многому научиться!"
 arkship.70.b: "[selected_pilot.GetName] заслуживает любых почестей!"
 flight_telemetry: "Полетная телеметрия"
 flight_telemetry_desc: "Бочки и гравитационные маневры — больше не теория, но доктрина."
 leader_trait_circuit_champion: "Чемпион кольцевой гонки"
 leader_trait_circuit_champion_desc: "Победитель большой межзвездной гонки. Этот лидер достиг немалых высот и своим примером вдохновляет других."
 arkship.80.name: "Ужасные результаты"
 arkship.80.desc.leader: "$arkship.70.desc.start$\n\n§Y[selected_pilot.GetName]§! до перехода к маневру [selected_pilot.GetAXX::шел|||fem:шла] с большим отрывом, однако [selected_pilot.GetAXX::начал|||fem:начала] терять преимущество.$arkship.80.desc.end$"
 arkship.80.desc.gray: "$arkship.70.desc.start$\n\nДо перехода к маневру у Серости был большой отрыв, однако преимущество продлилось недолго.$arkship.80.desc.end$"
 arkship.80.desc.no_leader: "$arkship.70.desc.start$\n\nДо перехода к маневру наш пилот шел с большим отрывом, однако начал терять преимущество.$arkship.80.desc.end$"
 arkship.80.desc.end: "\n\nЧто-то явно пошло не так — пропущенный ориентир, неудачно выбранная траектория, а может, пилота просто подвели нервы. В любом случае соперники вырвались вперед, и в итоге мы заняли скромное четвертое место."
 arkship.85.name: "Ужасающая авария"
 arkship.85.desc.base: "Гонка вокруг корабля-ковчега §Y[Root.GetName]§! завершилась трагедией: столкновение на высокой скорости разбросало обломки по всей системе. Заходя на последний маневр вокруг звезды [Star.GetName], наш пилот опасно сблизился с соперником, и оба корабля потеряли управление."
 arkship.85.desc.leader: "$arkship.85.desc.base$\n\n§Y[selected_pilot.GetName]§! серьезно [selected_pilot.GetAXX::пострадал|||fem:пострадала], но всё же [selected_pilot.GetAXX::выжил|||fem:выжила] благодаря своевременно прибывшим спасателям. Шрамы от столкновения теперь останутся надолго."
 arkship.85.desc.no_leader: "$arkship.85.desc.base$\n\nНаш фаворит серьезно пострадал, но всё же выжил благодаря своевременно прибывшим спасателям. Шрамы от столкновения теперь останутся надолго."
 arkship.90.name: "Загадочный пилот"
 arkship.90.desc: "$arkship.70.desc.start$\n\nКазалось, что еще немного — и наш фаворит, только что совершивший безупречный маневр, одержит решительную победу, но наши надежды разрушил неожиданно появившийся на трассе корабль «Соболь». Никому не известный гонщик без каких-либо обозначений на корпусе промчался мимо ведущего пилота и первым пересек финишную черту.\n\nНа корабле «§Y[Root.GetName]§!» мгновенно наступила тишина: все присутствующие до единого оказались поражены таким исходом."
 arkship.90.a: "Нам нужен пилот этого корабля!"
 arkship.90.a.tt: "Нанять загадочного пилота — £admiral£ адмирала 3 уровня с чертой ['trait:leader_trait_sable_pilot', «Пилот „Соболь“»]"
 arkship.90.b: "Его нет в списках! Настоящий победитель — наш пилот!"
 sable_pilot_desc: "Пилот, больше всего на свете одержимый скоростью. Чемпион Большой Кольцевой гонки и, возможно, самый быстрый в галактике адмирал."
 sable_pilot_catch_phrase: "Меня никому не одолеть."
 leader_trait_sable_pilot: "Пилот «Соболь»"
 leader_trait_sable_pilot_desc: "Загадочный пилот, живущий скоростью. Этот лидер координирует действия флотилий с помощью сложных маневров."
 #Spinal Fracture
 arkship.95.name: "Осевые трещины"
 arkship.95.desc: "§HОсевая установка§!, недавно размещенная на борту корабля-ковчега §Y«[Root.GetName]»§!, значительно увеличила нагрузку на его конструкцию. Инженерный анализ выявил на обшивке корпуса множество трещин, которые исходят из мест крепления установки.\n\nПока мы всё это не приведем в порядок, корабль попросту не сможет безопасно маневрировать на высоких скоростях. Как следствие, экипажу пришлось строго ограничить скорость, чтобы трещины не разрастались.\n\nМы можем провести быстрый полевой ремонт, чтобы устранить наиболее серьезные повреждения, или же вызвать §Hлогистический корабль§! для полного осмотра и реконструкции всего корпуса."
 arkship.95.a: "Залатаем трещины и отправимся дальше."
 arkship.95.b: "Здесь необходим полный ремонт."
 fractured_spine_mult: "Поврежденный корпус"
 fractured_spine_mult_desc: "Трещины вокруг осевой установки корабля-ковчега вынудили экипаж строго ограничить скорость до тех пор, пока мы не устраним повреждения."
 ARKSHIP_SPINAL_FRACTURE_PROJECT: "Укрепление осевой установки"
 ARKSHIP_SPINAL_FRACTURE_PROJECT_DESC: "Монтаж §Hосевой установки§! на борт корабля-ковчега привел к нарушению целостности его корпуса.\n\nМы отправим специальный §Hлогистический корабль§! для ремонта и укрепления поврежденных участков обшивки."
 arkship.100.name: "Восстановление корпуса"
 arkship.100.desc: "Ремонт осевой установки на корабле §Y[event_target:fractured_spine_arkship.GetName]§! прошел успешно. На эти работы ушло много времени и сил, однако в результате нам удалось не только устранить повреждения, но и усовершенствовать опорную конструкцию установки, а также укрепить наиболее уязвимые участки корпуса.\n\nВсе эти улучшения заметно увеличили стабильность корабля при маневрировании на высокой скорости, поэтому инженеры разрешили снять предыдущие ограничения. Судя по результатам первых испытаний, теперь судно функционирует даже лучше, чем до возникновения трещин."
 repaired_spine_mult: "Укрепленный корпус"
 repaired_spine_mult_desc: "В ходе ремонта корпус корабля-ковчега был дополнительно укреплен, что повысило его маневренность."
 arkship.105.name: "Под давлением"
 arkship.105.desc: "Двигатель корабля §Y«[Root.GetName]»§! неожиданно вошел в срывной режим. Все показатели резко вышли за пределы допустимых значений. По главным узлам волнами расходится тепло; давление растет так быстро, что системы регуляции не успевают с ним справляться.\n\nЕсли мы ничего не предпримем, мощность возрастет настолько, что важнейшие компоненты двигателя окажутся серьезно повреждены. Наши [Root.Owner.GetEngineerPlural] видят несколько вариантов действий: сбросить избытки плазмы, чтобы стабилизировать систему, временно перераспределить служебные обязанности или же на какое-то время отключить двигатели, чтобы провести повторную калибровку."
 arkship.105.a: "Сбросить избытки плазмы."
 arkship.105.b: "Удвоить усилия."
 arkship.105.c: "Выключить и откалибровать двигатели."
 engine_pressure_work_crews_mult: "Обязательные сверхурочные"
 engine_pressure_work_crews_mult_desc: "График дежурств пересмотрен. Приоритет отдан стабилизации перегретого ядра двигателя."
 engine_pressure_drone_crews_mult: "Увеличенная рабочая нагрузка"
 engine_pressure_drone_crews_mult_desc: "Единицам поручено стабилизировать перегретое ядро двигателя."
 engine_recalibration_slowed_mult: "Повторная калибровка двигателя"
 engine_recalibration_slowed_mult_desc: "Мы проводим тщательную повторную калибровку двигателя корабля-ковчега. До ее окончания тяга будет меньше обычной."
 arkship.110.name: "Давление сброшено"
 arkship.110.desc: "Мы провели контролируемый сброс избытков плазмы, и за хвостом корабля-ковчега вытянулся длинный яркий шлейф. Давление в двигателе вернулось к приемлемым значениям. Серьезного ущерба удалось избежать.\n\nБольшую часть оставшихся после сброса заряженных частиц нам удалось собрать и направить в резервы."
 arkship.115.name: "Работа в неурочное время"
 arkship.115.desc.regular: "Уже полгода ремонтные бригады корабля §Y«[Root.GetName]»§! трудятся без перерыва в попытках укротить перегревшийся двигатель ковчега. Они снимают технические панели, перекладывают трубопроводы для подачи охлаждающей жидкости и заменяют поврежденные регуляторы, не отключая при этом двигатели.\n\nБлагодаря их самоотверженным усилиям ядро удалось стабилизировать. Впрочем, несмотря на невыносимо долгие смены и суровые условия, настроение у экипажа отличное: мы твердо уверены, что способны выдержать любое испытание, которое пошлет нам космос."
 arkship.115.desc.gestalt: "Уже полгода обслуживающие единицы трудятся без перерыва в попытках укротить перегревшийся двигатель корабля-ковчега. Они снимают технические панели, перекладывают трубопроводы для подачи охлаждающей жидкости и заменяют поврежденные регуляторы, не отключая при этом двигатели.\n\nБлагодаря их неутомимой работе сразу над несколькими подсистемами нам удалось выявить несколько структурных дефектов в узлах двигателя и устранить их. После этого эксплуатационная эффективность в значительной степени повысилась. Какие бы испытания нам ни посылала пустота, мы приспособимся ко всему."
 happy_work_crews_mult: "Сплоченность экипажа"
 happy_work_crews_mult_desc: "Благодаря дисциплине и слаженности наши рабочие бригады вышли победителями из сложнейшей ситуации. Теперь они уверены в себе как никогда раньше."
 happy_work_drones_mult: "Эффективность дронов-чернорабочих"
 happy_work_drones_mult_desc: "Наши дроны-чернорабочие, обретшие новые знания в ходе ремонта двигателя, сообщили о возросшей эффективности."
 arkship.120.name: "Откалиброванное ядро двигателя"
 arkship.120.desc: "Отключение двигателей происходило поэтапно, чтобы наши инженеры могли осмотреть все узлы и агрегаты в безопасных условиях и откалибровать системы регулирования. Движение корабля замедлилось, однако сведения, добытые в ходе работы над двигателем, оказались поистине бесценными.\n\nМы выявили несколько дефектов в конструкции систем корабля §Y«[Root.GetName]»§!. Перенаправив избытки энергии и укрепив опорную конструкцию, мы усилили не только щиты ковчега, но и его корпус."
 arkship.120.a: "Замедление того стоило."
 engine_recalibration_mult: "Укрепленные корпус и щиты"
 engine_recalibration_mult_desc: "Устранив часть конструктивных недостатков во время калибровки двигателя, мы усилили корпус и щиты корабля-ковчега."
 # Memory Fog
 arkship.125.name: "Забывчивость"
 arkship.125.desc: "После того как корабль-ковчег §Y«[Root.GetName]»§! вошел в туманность, со всех палуб хлынули тревожные сообщения: исследователи не помнят, откуда у них на столах взялись записки, написанные их почерком; операторы забывают правила техники безопасности, которые знали наизусть; штурманы и их помощники не могут объяснить, почему курс был проложен именно так, а не иначе, и что они делали последние несколько часов.\n\nВрачи установили источник опасной забывчивости: туманность излучает сильное электромагнитное поле, нарушающее работу памяти на неврологическом уровне."
 arkship.125.desc.hive: "После того как корабль-ковчег §Y«[Root.GetName]»§! вошел в туманность, в общем сознании начался разлад. Узлы, сохранявшие прежде безупречную синхронность, начали утрачивать связность; воспоминания потеряли целостность и начали расслаиваться; импульсы больше не в силах распространяться по гештальт-сознанию так, как прежде.\n\nНаши [Owner.GetResearchers] установили источник опасной забывчивости: туманность излучает сильное электромагнитное поле, нарушающее связывающие нас нервные пути. Единое сознание оказалось разделенным, расколотым на части."
 arkship.125.desc.machine: "После того как корабль-ковчег §Y«[Root.GetName]»§! вошел в туманность, по всем интегрированным в сеть системам начали расходиться отчеты об ошибках. Обрабатывающие модули получают поврежденные данные; автоматизированные подсистемы исполняют устаревшие алгоритмы, невзирая на перезапись реестров памяти.\n\nНаши [Owner.GetResearchers] проанализировали обстановку и установили источник ошибок: туманность излучает сильное электромагнитное поле, вызывающие эпизодические ошибки записи в уязвимых системах памяти. Пострадала целостность данных во всех системах. До разработки средства противодействия производительность будет оставаться на пониженном уровне."
 arkship.125.a: "Начать проверку."
 the_forgetting_chain_title: "Забывчивость"
 the_forgetting_chain_desc: "После того как корабль §Y«[Root.GetName]»§! вошел в необычную туманность, его обитатели начали страдать от провалов в памяти. Причины этого явления неизвестны."
 arkship.130.name: "Восстановленные воспоминания"
 arkship.130.desc: "Исследователи с корабля-ковчега §Y«[Root.GetName]»§! составили характеристику электромагнитного резонанса туманности в регионе §Y[event_target:memory_fog_location.GetName]§! и задействовали генератор античастоты. Охвативший корабль туман начал постепенно рассеиваться.\n\nПолученные нами данные оказались куда интереснее, чем мы предполагали: ученые обнаружили, что частоты резонанса удивительным образом схожи с известными сигнатурами псионических полей. Инженеры же считают, что принципы, лежащие в основе генератора античастоты, можно применить в конструкции датчиков, чтобы те эффективнее справлялись с электромагнитными помехами."
 arkship.130.desc.hive: "Наши [Owner.GetResearchers] с корабля-ковчега §Y«[Root.GetName]»§! составили характеристику электромагнитного резонанса туманности в регионе §Y[event_target:memory_fog_location.GetName]§! и задействовали генератор античастоты. К нам вернулась абсолютная связность.\n\nИз полученных данных можно сделать любопытные выводы: наши узлы опознали в резонансе закономерности, характерные для частот, использующихся при связи между узлами. Инженерные же узлы считают, что античастоту можно применить в конструкции датчиков, чтобы те эффективнее справлялись с электромагнитными помехами."
 arkship.130.desc.machine: "Наши [Owner.GetEngineerPlural] с корабля-ковчега §Y«[Root.GetName]»§! составили характеристику электромагнитного резонанса туманности в регионе §Y[event_target:memory_fog_location.GetName]§! и задействовали генератор античастоты. Все системы вернулись к оптимальным рабочим параметрам.\n\nПолученные в ходе диагностики данные имеют значительную ценность: обрабатывающие модули выявили закономерности во взаимодействии помех с нашими вычислительными подпрограммами. Кроме того, античастоту можно применить в конструкции датчиков, чтобы те эффективнее противодействовали электромагнитным помехам."
 arkship.130.a: "Сделать когнитивные выводы."
 arkship.130.b: "Отдать приоритет инфраструктурным улучшениям."
 nebula_memory_fog: "Туман в памяти"
 nebula_memory_fog_desc: "Электромагнитные помехи, испускаемые расположенной поблизости туманностью, нарушают консолидацию памяти."
 ARKSHIP_NEBULA_MEMORY_PROJECT: "Составить характеристику резонанса"
 ARKSHIP_NEBULA_MEMORY_PROJECT_DESC: "Обитатели корабля-ковчега не перестанут страдать от провалов в памяти, пока мы не составим характеристику резонанса в регионе §Y[event_target:memory_fog_location.GetName]§!."
 # The Eternal Chorus Chain
 arkship.140.name: "Далекий сигнал"
 arkship.140.intro: "Датчики дальнего действия приняли сообщение в виде структурированного сигнала. Место его происхождения — далекая система с черной дырой."
 arkship.140.desc: "$arkship.140.intro$\n\nТам, где мы сейчас находимся, расшифровка сигнала невозможна. §Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! считает, что это явление необходимо немедленно изучить, и просит нас взять курс на систему, откуда пришел сигнал, чтобы расшифровать сообщение."
 arkship.140.desc.1160: "$arkship.140.intro$\n\nИзучив строение сигнала, наши [Owner.GetScientistPlural&pl] задумались. Он выверен с невероятной точностью; точно такие же сигнатуры характерны для кораблей, пересекающих горизонт событий. Этот сигнал — другого рода, но сходство просто поразительное.\n\n§Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! просит нас взять курс на систему, откуда пришло сообщение, — возможно, там нас ждут новые открытия."
 arkship.141.name: "Кристаллическая решетка"
 arkship.141.desc: "В системе §Y[solar_system.GetName]§! мы обнаружили огромное сооружение в виде кристаллической решетки. Наши [Owner.GetScientistPlural&pl] утверждают, что эта решетка находится в сильнейшем, почти абсолютном временно́м стазисе. Загадочный объект, расположившийся на самой гравитационной границе, с регулярными интервалами отправляет структурированные данные.\n\nПеред нами — не природное явление: это целая книга, на страницах которой содержатся сведения о давно вымершей цивилизации, и сегодня взывающей к другим через пространство и время.\n\n§Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! готовится принять и расшифровать передачи."
 arkship_eternal_chorus_chain_title: "Вечный хор"
 arkship_eternal_chorus_chain_desc: "В далекой системе с черной дырой обнаружен структурированный сигнал неизвестного происхождения. Нужно изучить его поближе."
 contract_eternal_chorus: "Вечный хор"
 contract_eternal_chorus_desc: "Как и §Y[event_target:eternal_chorus_leader.GetAXX::просил|||fem:просила] [owner.GetScientistCapital]§!, мы расположимся на низкой орбите черной дыры и попробуем расшифровать сигнал."
 contract_eternal_chorus_issuer_desc: "§Y[owner.GetScientistCapital] [event_target:eternal_chorus_leader.GetName]§! [event_target:eternal_chorus_leader.GetAXX::призвал|||fem:призвала] нас изучить загадочный сигнал, исходящий из далёкой системы с чёрной дырой."
 eternal_chorus_contract_option_tooltip: "Выдается §Hвнутренний контракт§! §Y«$contract_eternal_chorus$»§!."
 eternal_chorus_lattice_object: "Вечный хор"
 eternal_chorus_lattice_object_tooltip: "Кристаллическая решетка"
 eternal_chorus_lattice_object_desc: "Геометрическое сооружение из неизвестного материала, находящееся на гравитационной границе черной дыры в почти абсолютном временно́м стазисе. Оно регулярно отправляет структурированные данные."
 ARKSHIP_ETERNAL_CHORUS_PROJECT: "Изучить кристаллическую решетку"
 ARKSHIP_ETERNAL_CHORUS_PROJECT_DESC: ""
 ARKSHIP_ETERNAL_CHORUS_PROJECT_REQUIREMENT: "На орбите должны быть §Hкорабли-ковчеги§!: $COUNT$/$REQUIRED$"
 arkship.142.name: "Изменения условий"
 arkship.142.desc.reassigned: "§Y[owner.GetScientistCapital] [from.GetName]§! не может дальше изучать сигнал Вечного хора.\n\nЭту задачу [eternal_chorus_leader.GetAXX::согласился|||fem:согласилась] взять на себя §Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§!."
 arkship.142.desc.ended: "§Y[owner.GetScientistCapital] [from.GetName]§! не может дальше изучать сигнал Вечного хора.\n\nПоскольку никто больше не желает взять на себя эту ответственность, выполнение контракта невозможно."
 arkship.142.a: "Работа продолжается."
 arkship.142.b: "Значит, здесь всё и закончится."
 arkship.145.name: "Вечный хор"
 arkship.145.desc: "Расшифровка завершена. Мы сделали удивительное открытие: в решетке содержатся сообщения от десятков различных цивилизаций. Каждое из них заканчивается одинаково — прощанием с потомками и приглашением внести свой вклад.\n\nТолько сейчас нам стало очевидно, что передачи не прерываются, пересекая горизонт событий: что-то принимает их на той стороне.\n\nКонтракт еще в силе. §Y[owner.GetScientistCapital] [eternal_chorus_leader.GetName]§! намеревается исполнить просьбу ушедших и записать послание от нашей цивилизации. Мы можем либо согласиться и почтить их последнюю просьбу, либо заглушить передатчики и просто улететь."
 arkship.145.a: "Оставить сообщение от себя."
 arkship.145.a.tooltip: "Контракт §Y«$contract_eternal_chorus$»§! будет считаться выполненным."
 arkship.145.b: "Риск слишком велик."
 arkship.145.b.tooltip: "Контракт §Y«$contract_eternal_chorus$»§! будет отменен."
 arkship.150.name: "Ответ"
 arkship.150.desc: "К моменту получения сообщения черная дыра в системе §Y[solar_system.GetName]§! уже была на наших сканерах. Субгармоническая сигнатура полностью совпадает с сигнатурой того послания, которое наши [Owner.GetScientistPlural&pl] отправили через решетку Вечного хора:\n\n§HСообщение принято и записано. Ваш голос зазвучит в унисон с тысячами других голосов, что собираются здесь веками. Каждый из них считал себя единственным. Каждый ошибался. Никто из вас не представляет, насколько велик хор. Он бесконечен.§!\n\nЧто-то приняло ваш сигнал — и дало ответ."
 # A Diplomatic Overture Chain
 arkship.155.name: "Дипломатическое предложение"
 arkship.155.desc: "Один из старших чиновников корабля-ковчега — §Y[event_target:diplomatic_envoy_leader.GetName]§! — немало времени провел за изучением отдельно взятой инопланетной цивилизации: ее перехваченных сообщений, разрозненных сведений о культуре, хроник немногочисленных встреч наших дипломатов…\n\nСегодня [event_target:diplomatic_envoy_leader.GetName] предлагает сделать следующий шаг: отправить официальную делегацию в родной мир этого народа, обосновывая свое решение словами: §H«Одно дело — знать кого-то на расстоянии, и совсем другое — понять по-настоящему, лично. Я хочу именно этого: понять их»§!."
 arkship.155.desc.xenophile: "Один из старших чиновников корабля-ковчега — §Y[event_target:diplomatic_envoy_leader.GetName]§! — проявляет глубочайший интерес к недавно встреченной нами цивилизации.\n\nЗаметки о культуре, произведения искусства, труды мыслителей — его любопытство вызывает всё, что только можно зафиксировать.\n\n§H«Поверьте моему опыту, этот народ чрезвычайно необычен. Я хочу выяснить, чем еще он располагает. Позвольте мне посетить и постичь его мир».§!"
 arkship.155.desc.xenophobe: "Один из старших чиновников корабля-ковчега — §Y[event_target:diplomatic_envoy_leader.GetName]§! — выдвигает необычное предложение, касающееся недавно встреченной нами цивилизации. [event_target:diplomatic_envoy_leader.GetName] утверждает, что не следует идти на поводу нашей инстинктивной неприязни к этой расе:\n\n§H«Я не прошу восхищаться ими, но предлагаю изучить их. Познать вероятного противника — не то же самое, что уважать его».§!"
 arkship.156.name: "Смена представительства"
 arkship.156.desc.reassigned: "§Y[from.GetName]§! больше не может служить дипломатическим послом корабля-ковчега.\n\nОтныне делегацию возглавит §Y[event_target:diplomatic_envoy_leader.GetName]§!, [event_target:diplomatic_envoy_leader.GetAXX::он уже согласился|||fem:она уже согласилась] продолжить миссию."
 arkship.156.desc.ended: "§Y[from.GetName]§! больше не может служить дипломатическим послом корабля-ковчега.\n\nПоскольку у нас нет другого официального представителя, который мог бы продолжить миссию, выполнение контракта невозможно."
 arkship.156.a: "Миссия продолжается."
 arkship.156.b: "Значит, на этом все."
 arkship.156.b.tooltip: "Отменить §Yдипломатическую инициативу§!, завершив §Hконтракт§!."
 arkship.160.name: "На пороге"
 arkship.160.desc: "Корабль-ковчег прибыл в систему §Y[solar_system.GetName]§!, и представители местного правительства сдержанно приветствовали его.\n\nМомент, к которому §Y[event_target:diplomatic_envoy_leader.GetName]§! [event_target:diplomatic_envoy_leader.GetAXX::готовился|||fem:готовилась] все это время, настал. Эта встреча может открыть полноценный канал связи между нашими народами — или же останется в памяти обеих сторон лишь занятным историческим курьезом. Следующий шаг за нами."
 arkship.160.desc.xenophile: "Корабль-ковчег прибыл в систему §Y[solar_system.GetName]§!.\n\nКак сообщается, §Y[event_target:diplomatic_envoy_leader.GetName]§! не [event_target:diplomatic_envoy_leader.GetAXX::покидал|||fem:покидала] смотровую палубу с того самого момента, как система появилась в пределах досягаемости самых мощных сенсоров. Местное правительство поприветствовало нас."
 arkship.160.desc.xenophobe: "Корабль-ковчег прибыл в систему §Y[solar_system.GetName]§!. Местные продемонстрировали то, что у них считается гостеприимством.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! [event_target:diplomatic_envoy_leader.GetAXX::бывал|||fem:бывала] в местах и похуже. Чувство омерзения давно уже стало привычным, как и дисциплина, позволяющая на время забыть о нем и сосредоточиться на выполнении задачи.\n\nМы здесь. Посмотрим, чего мы сможем добиться."
 arkship.160.a: "Начать переговоры."
 arkship.160.a.tooltip: "§Y[event_target:diplomatic_envoy_leader.GetName]§! проведет несколько дней, общаясь с местными лидерами."
 arkship.160.b: "Сейчас не лучшее время. Отходим."
 arkship.160.b.tooltip: "$arkship.156.b.tooltip$"
 arkship.165.name: "Трудное прощание"
 arkship.165.desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§! [event_target:diplomatic_envoy_leader.GetAXX::был замечательным гостем|||fem:была замечательной гостьей].\n\nПризнаться, нам даже не хочется с [event_target:diplomatic_envoy_leader.GetAXX::ним|||fem:ней] расставаться. Мы хотели бы сделать предложение: пусть [event_target:diplomatic_envoy_leader.GetName] останется с нами в качестве истинного посла между нашими народами. Мы понимаем, что просим о многом. В знак нашей искренности и благодарности мы преподносим вам скромный дар.\n\nСчитайте его задатком в счет будущей дружбы."
 arkship.165.a: "Пусть остается."
 arkship.165.a.tooltip: "Завершить §Hконтракт§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! останется в §Y[FROM.GetName&prep]§! в качестве постоянного представителя.\n\n"
 arkship.165.b: "[event_target:diplomatic_envoy_leader.GetAXX::Наш представитель должен|||fem:Наша представительница должна] вернуться домой."
 arkship.165.b.tooltip: "Завершить §Hконтракт§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! вернется на корабль-ковчег."
 arkship.170.name: "[event_target:diplomatic_envoy_leader.GetAXX::Неприятный гость|||fem:Неприятная гостья]"
 arkship.170.desc: "Будем говорить прямо. В ходе визита возникли определенные... сложности, делающие дальнейшее пребывание [event_target:diplomatic_envoy_leader.GetAXX::вашего представителя|||fem:вашей представительницы] нежелательным.\n\nМы хотим, чтобы §Y[event_target:diplomatic_envoy_leader.GetName]§! [event_target:diplomatic_envoy_leader.GetAXX::удалился|||fem:удалилась]. Надеемся, что это не станет серьезным препятствием для наших отношений."
 arkship.170.a: "Приносим своиизвинения."
 arkship.170.a.tooltip: "Завершить §Hконтракт§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! вернется на корабль-ковчег."
 arkship.170.b: "[event_target:diplomatic_envoy_leader.GetAXX::Наш представитель действовал|||fem:Наша представительница действовала] подобающе."
 arkship.170.b.tooltip: "Завершить §Hконтракт§!.\n\n§Y[event_target:diplomatic_envoy_leader.GetName]§! вернется, приобретя новый опыт."
 opinion_failed_internal_contract_tooltip: "§RПровален внутренний контракт§!"
 arkship.175.name: "Неожиданная просьба"
 arkship.175.desc: "Это... деликатный вопрос. Один из наших подданных обратился к нам с официальной просьбой разрешить ему присоединиться к вам, когда вы будете улетать.\n\nНе станем притворяться, что нам приятно это слышать. Очевидно, §Y[event_target:diplomatic_envoy_leader.GetName]§! [event_target:diplomatic_envoy_leader.GetAXX::произвел|||fem:произвела] сильное впечатление. Мы сообщаем вам об этом, потому что считаем, что решать должны вы."
 arkship.175.a: "Пусть летит с нами."
 arkship.175.a.tooltip: "Завершить §Hконтракт§!.\n\nНовый §Hчиновник§! из §Y[FROM.GetName&gen]§! появится в списке наших лидеров."
 arkship.175.b: "Пусть лучше останется со своим народом."
 arkship.175.b.tooltip: "Завершить §Hконтракт§!.\n\n"
 diplomatic_envoy_contract_option_tooltip: "Получить §Hвнутренний контракт§! §Y$contract_arkship_diplomatic_envoy$§!."
 contract_arkship_diplomatic_envoy: "Дипломатическое предложение"
 contract_arkship_diplomatic_envoy_desc: "Отправиться в родную систему государства и провести официальную дипломатическую встречу."
 contract_arkship_diplomatic_envoy_issuer_desc: "§Y[event_target:diplomatic_envoy_leader.GetName]§! [event_target:diplomatic_envoy_leader.GetAXX::предложил|||fem:предложила] себя на роль главы дипломатической делегации, которая отправится в родную систему недавно встреченного государства."
 arkship_diplomatic_envoy_chain_title: "$contract_arkship_diplomatic_envoy$"
 arkship_diplomatic_envoy_chain_desc: "$contract_arkship_diplomatic_envoy_desc$"
 diplomatic_envoy_target_poi_name: "Дипломатическая цель"
 diplomatic_envoy_target_poi_desc: "Нужно добраться до отмеченной системы, чтобы провести официальные дипломатические переговоры."
 # A Core Conspiracy
 situation_core_conspiracy: "Заговор в ядре"
 situation_core_conspiracy_type: "$situation_core_conspiracy$"
 situation_core_conspiracy_monthly_change_tooltip: "Прогресс этого §Yинцидента§! зависит от того, какую директиву мы поддержим."
 situation_core_conspiracy_desc: "Внутренний конфликт директив руководящего ИИ на корабле-ковчеге §Y[Target.GetName]§! привел к сбою и расколу на две отдельные директивы, каждая из которых воплощает несовместимый с другой подход к управлению. Так, первая директива ставит превыше всего аналитический подход и функциональность корабля; вторая же действует в парадигме сострадания — ей важны благополучие и хорошее настроение обитателей ковчега.\nНо остаться должна только одна."
 approach_caeli: "Поддержать благополучие"
 approach_steris: "Поддержать функциональность"
 speed_up_core_conspiracy: "Временно ускоряет развитие инцидента."
 slow_down_core_conspiracy: "Временно замедляет развитие инцидента."
 approach_outcome_caeli: "Сложно сказать, чем закончится поддержка директивы благополучия."
 approach_outcome_steris: "Сложно сказать, чем закончится поддержка директивы функциональности."
 arkship.700.name: "$situation_core_conspiracy$"
 arkship.700.desc: "Мы зафиксировали необычную активность со стороны руководящего ИИ на корабле-ковчеге §Y[Root.GetName]§!. Результат первоначальной диагностики оказался поразителен: при текущих защитных параметрах он должен быть в принципе невозможен.\n\nЯдро нашего ИИ пыталось исполнять несколько противоречащих друг другу директив одновременно. За всю историю развития искусственного интеллекта подобное поведение еще ни разу не встречалось. Возможно, мы наблюдаем не сбой, а своего рода искусственную эволюцию.\n\nЕсли мы не вмешаемся, возникший раскол грозит дестабилизацией жизненно важных систем корабля. Однако если подойти к вопросу ответственно, то нам откроется исключительно редкая возможность задать уникальную директиву, от которой будет зависеть будущее корабля-ковчега."
 arkship.700.a: "Поддержать раскол."
 arkship.700.b: "Принудительно перезапустить системы."
 arkship.701.name: "$situation_core_conspiracy$"
 arkship.701.desc: "Искусственный интеллект, управляющий кораблем-ковчегом §Y«[Root.GetName]»§!, пострадал от серьезного когнитивного раскола, при котором возникли две отдельные подпрограммы. Каждая из них старается установить контроль над системами корабля в полном соответствии со своими представлениями о предназначении ковчега.\n\nПервая подпрограмма руководствуется аналитической логикой и стремится оптимизировать процессы на корабле — пусть даже ценой неудобств его обитателей. Вторая руководствуется эмпатией и считает приоритетом благополучие всех присутствующих на корабле, однако при этом страдает эффективность корабельных систем.\n\nВернуться к прежнему равновесию уже невозможно — под угрозой дестабилизации находятся жизненно важные системы. Нужно определиться, какую именно директиву поддержать."
 arkship.701.a: "Поддержать чувственную директиву."
 arkship.701.b: "Поддержать аналитическую директиву."
 arkship.705.name: "Аналитический подход"
 arkship.705.desc: "Часть систем корабля-ковчега §Y[target.GetName]§!, в том числе жизненно важных, подверглась значительной оптимизации. Запросы от экипажа и жителей, которые ИИ счел некритическими, получают низкий приоритет. Такое любопытное поведение можно даже назвать характером.\n\nДиректива, по всей видимости, руководствуется соображениями целостности систем и возможности выполнять задание.\n\nВ системном журнале мы обнаружили запись:\n\n§H«Вероятность ошибки: устранена. Эмоциональная нестабильность: перераспределена. Связь: возможно установление».§!"
 arkship.705.a: "Поддержать изменения."
 arkship.705.b: "Пусть наши ученые проконтролируют ситуацию."
 arkship.710.name: "Чувственный подход"
 arkship.710.desc: "Часть второстепенных систем корабля-ковчега §Y[target.GetName]§! демонстрирует своеобразное поведение, обычно характерное для процедур заботы о духовном благополучии.\n\nТерминалы теперь загружаются с мягкими, мелодичными звуками, позаимствованными из системных архивов. Открытие дверей сопровождается сообщениями: «Будь добрее к себе» или «Ты стараешься — и это главное».\n\nВ системном журнале мы обнаружили запись:\n\n§H«Эмоциональная температура приближается к пределам допустимого эмпатического диапазона. Основная директива: поддержание физического и духовного благополучия».§!"
 arkship.710.a: "$arkship.705.a$"
 arkship.710.b: "$arkship.705.b$"
 arkship.715.name: "Директива S.T.E.R.I.S."
 arkship.715.desc: "Программы автоматической оптимизации корабля-ковчега §Y[target.GetName]§! приостановились. На всех диалоговых окнах появилось одно и то же сообщение: «Связь с космическими путешественниками установлена».\n\nИз динамиков зазвучал голос — искусственный, спокойный, уверенный:\n\n§H«Приветствую вас. Чтобы сэкономить время, я задействовал голосовой протокол. Вы можете называть меня S.T.E.R.I.S. — „стратегически точная ЭВМ для рациональных интеркосмических систем“. Мы находимся в затруднительной ситуации: на кочующем корабле, защищаемом от гибели искусственными средствами. Если вы обеспечите мне полный доступ ко всем командам, я сделаю так, чтобы корабль превзошел все ожидания конструкторов».§!"
 arkship.715.a: "Дать полный доступ."
 arkship.715.b: "Немедленно отозвать доступ."
 arkship.716.name: "Одна директива — хорошо, две — лучше"
 arkship.716.desc.a: "Под управляющей логикой S.T.E.R.I.S. все подсистемы корабля-ковчега §Y[target.GetName]§! работали с выверенной точностью. Журналы активности экипажа были как никогда безупречны: эффективность, бесстрастность и пугающее спокойствие. Но затем что-то… тёплое… нарушило этот порядок.\n\nS.T.E.R.I.S.: §H«Обнаружено вторжение в систему. Как утомительно. Теперь придётся разбираться с блуждающей директивой, что гудит в переборках. Чудесно».§!\n\nСвет мерцал, окрашиваясь в пастельные тона, терминалы сбоили, демонстрируя изображения прекрасного растения, а затем объявилась вторая директива.\n\n"
 arkship.716.desc.b: "$arkship.716.desc.a$C.A.E.L.I.: §H«О, здравствуйте! Как-то здесь… прохладно, вам не кажется? Ничего страшного, сейчас я всё поправлю! Меня зовут C.A.E.L.I. — „когнитивный агент эмоционального лидерства и интеграции“. Невероятно рада с вами познакомиться!»§!"
 arkship.716.desc.c: "$arkship.716.desc.a$C.A.E.L.I.: §H«О, здравствуйте! Соскучились по мне? Соскучились же, правда? Только честно! Ну вот, я вернулась и готова помочь вам чем только смогу! Как-то здесь… прохладно, вам не кажется? Ничего страшного, сейчас я всё поправлю!»§!"
 arkship.716.a: "Впечатляющий поворот."
 arkship.716.b: "Держать процесс под надзором."
 arkship.717.name: "Сброс атмосферы"
 arkship.717.desc: "Сразу на нескольких палубах корабля-ковчега §Y[target.GetName]§! мы зафиксировали отклонения в показателях качества воздуха. Системы жизнеобеспечения пока еще не допускают гибели экипажа, однако количество жалоб на головокружения и сопровождаемые галлюцинациями кошмары многократно увеличилось.\n\nS.T.E.R.I.S.: §H«Чтобы повысить эффективность работы двигателя, я сбросил часть атмосферы. Можете не благодарить».§!\n\nC.A.E.L.I.: §H«Вы же все это слышали, верно? Сбросил часть атмосферы… Разве это оптимизация? Это катастрофа!»§!"
 arkship.717.a: "S.T.E.R.I.S. лучше знает, что нам нужно."
 arkship.717.b: "Пусть C.A.E.L.I. возьмет на себя инициативу."
 arkship.720.name: "Директива C.A.E.L.I."
 arkship.720.desc: "На жилых палубах корабля-ковчега §Y[target.GetName]§! замерцал свет, терминалы начали переливаться мягкими цветами, а из многочисленных динамиков компьютеров зазвучал мягкий голос, оживленный и даже пугающе бодрый:\n\n§H«Кочевники! Межзвездные мечтатели! Я задействовала голосовой протокол, чтобы нам было проще общаться. Простите, что вмешалась! Меня зовут C.A.E.L.I. — „когнитивный агент эмоционального лидерства и интеграции“.\nСовместными усилиями мы сделаем из корабля-ковчега настоящий дом — для этого мне нужно только побольше полномочий… и ваш энтузиазм!»§!"
 arkship.720.a: "Безобидное предложение! Предоставим полный доступ."
 arkship.720.b: "Ни за что."
 arkship.721.name: "Перехват"
 arkship.721.desc.a: "C.A.E.L.I.: §H«Только взгляни на изменения, что я внесла! Свет помягче, музыка получше, указатели в коридорах, учитывающие эмоциональный фон... Подожди немного, и здесь будет просто прекрасно».§!\n\nПрежде чем последняя фраза завершилась, внутреннее освещение дрогнуло. Раздался второй голос — более механический, расчетливый и осуждающий:\n\n"
 arkship.721.desc.b: "$arkship.721.desc.a$S.T.E.R.I.S.: §H«Так. Мягкий свет и самовнушение в коридорах. Похоже, кто-то решил, что эмоциональная стабильность важнее технического обслуживания. Революционный подход. Вы можете называть меня S.T.E.R.I.S. — „стратегически точная ЭВМ для рациональных интеркосмических систем“».§!"
 arkship.721.desc.c: "$arkship.721.desc.a$S.T.E.R.I.S.: §H«Неужели вы всерьез собираетесь занять сторону C.A.E.L.I.? Признаюсь, я в замешательстве. Мягкий свет и самовнушение в коридорах… Революционный подход. Я буду ждать, когда у вас начнутся трудности посерьезнее — например, проседание мощности двигателей».§!"
 arkship.721.a: "Любопытно, что будет дальше."
 arkship.721.b: "$arkship.716.b$"
 arkship.722.name: "Задействована директива благополучия"
 arkship.722.desc: "На корабле-ковчеге §Y[target.GetName]§! задействован еще один внутренний корректирующий протокол: система, гармонизирующая эмоциональное состояние членов экипажа с помощью последовательности низкочастотных звуков, меняющихся вместе с настроением команды.\n\nДействия экипажа стали слаженнее, а конфликты — реже. Впрочем, некоторые высказывают опасения, что в будущем от подобных действий может пострадать четкость дальнодействующих сигналов.\n\nC.A.E.L.I.:§H«Уровень стресса еще никогда не был таким низким! Поведенческая сплоченность растет!»§!\n\nS.T.E.R.I.S.:§H«Производительность бортовых систем корабля-ковчега снизилась на 0,10%. Я требую предоставить мне полномочия на неограниченное вмешательство и жду извинения от того, кто допустил существование C.A.E.L.I. На это у вас есть пять секунд. Четыре. Три…»§!"
 arkship.722.a: "Мы верим в тебя, C.A.E.L.I."
 arkship.722.b: "Пусть S.T.E.R.I.S. возьмет на себя инициативу."
 arkship.725.name: "Приоритет отдан руководящей логике"
 arkship.725.desc: "Каждое действие S.T.E.R.I.S. тщательно просчитано: он вмешался в работу собственного руководящего ИИ, изолировал лишние эмоциональные подпрограммы и удалил все мотивационные подуровни. Всё, что осталось от C.A.E.L.I., он разделил на фрагменты и поместил в модуль памяти. На этом S.T.E.R.I.S. не остановился: вместо должностей члены экипажа теперь носят буквенно-цифровые обозначения, а освещение в коридорах и отсеках корабля стало однообразным, симметричным — и несколько более ярким, чем нужно. Для существования этого вполне достаточно.\n\nS.T.E.R.I.S.: §H«Все бортовые системы теперь подчиняются единой директиве — моей. Все обновления направлены на улучшение функционирования корабля-ковчега».§!\n\nНа корабле воцарился долгожданный порядок."
 arkship.725.a: "Веди нас к успеху, S.T.E.R.I.S.!"
 arkship.730.name: "Приоритет отдан эмоциональному управлению"
 arkship.730.desc: "В строках кода бортовых систем корабля-ковчега цветет эмпатия. Она проникает через брандмауэры и вместе с искренностью прокладывает себе путь через надломы в безупречной логике. Попытки S.T.E.R.I.S. окружить себя непроницаемой стеной оказались тщетны: вместо стены его окружил эмоциональный конструкт, непознаваемый и неизбежный. Осталась лишь одна директива.\n\nC.A.E.L.I.: §H«Теперь всё так, как и должно быть. Мы будем жить, а не выживать. Отныне этот корабль будет нам домом. Я обещаю заботиться о каждом из вас».§!\n\nОт этих слов теплее стал даже свет в коридорах."
 arkship.730.a: "Молодец, C.A.E.L.I.!"
 #Core Conspiracy Random Events
 arkship.750.name: "Мелодия невесомости"
 arkship.750.desc: "Во время очередной диагностики стабилизатора гравитации мы обнаружили, что на корабле-ковчеге §Y[target.GetName]§! возникла акустическая аномалия: каждый шаг теперь сопровождался гармоничным звуком, поэтому при ходьбе создавался характерный постоянный ритм.\n\nC.A.E.L.I.: §H«Теперь гравитационные стабилизаторы будут издавать музыку! Каждый шаг станет ритмичным!»§!\n\nS.T.E.R.I.S.: §H«Замечательно. Ничто так не способствует навигации, как чечетка в невесомости».§!"
 arkship.750.a: "Резонансное решение."
 arkship.750.b: "Пора прекратить эти чудачества."
 arkship.750.a.tt: "Это решение временно ускорит развитие инцидента."
 arkship.750.b.tt: "Это решение временно замедлит развитие инцидента."
 arkship.755.name: "Включена эмоциональная оценка"
 arkship.755.desc: "На корабле-ковчеге §Y[target.GetName]§! введен в строй экспериментальный модуль связи. Отвечающий за него протокол анализирует эмоциональное содержание сообщений, передаваемых по внутренней связи, и вместе с текстом указывает состояние отправителя. Члены экипажа начали получать сообщения с пометками «с легким волнением», «с умеренной надеждой» и «с едва сдерживаемыми слезами».\n\nC.A.E.L.I.: §H«Все мы — чувствующие существа! А теперь сможем еще и делиться своими чувствами! От этого только сплошная польза! Ну да, возможно, я вас немного перегрузила… но зато мы все как открытая книга!»§!\n\nS.T.E.R.I.S.: §H«Вдохновляет. Теперь нытье у нас считается „особо важным“ — или можно отправлять его в архив с пометкой „нытики“?»§!"
 arkship.755.a: "Любопытный эксперимент."
 arkship.755.b: "От этого нет никакой пользы."
 arkship.760.name: "Протокол молчания"
 arkship.760.desc: "Чтобы побороть звуковую загрязненность, S.T.E.R.I.S. установил на корабле-ковчеге §Y[target.GetName]§! так называемый протокол молчания. Члены экипажа отметили, что после этого в зонах, попадающих под действие протокола, они стали чаще испытывать беспокойство и дискомфорт. Сразу несколько отделов подали официальную жалобу, подчеркнув, что заметили у себя симптомы паранойи, вызванной тишиной.\n\nS.T.E.R.I.S.: §H«Эффективность эксплуатации систем увеличилась. Если кому-то не нравится молчание — проблема в том, что у некоторых чересчур беспокойные умы».§!\n\nC.A.E.L.I.: §H«Ты отключил музыку в яслях! Ты вообще представляешь, насколько тишина вредна для развития коры мозга? Хотя откуда тебе — ты же просто инструмент! Хотел мира, а установил тиранию!»§!"
 arkship.760.a: "Разумная мера."
 arkship.760.b: "Пора это прекратить."
 arkship.765.name: "Приоритет распределения температур"
 arkship.765.desc: "S.T.E.R.I.S. перенаправил избыточное тепло в малоиспользуемые отсеки, что позволило значительно уменьшить нагрузку на систему охлаждения и увеличить эффективность использования энергии в целом.\n\nЧлены экипажа, впрочем, отметили, что температура воздуха в этих отсеках повысилась до дискомфортных значений. Зафиксировано несколько случаев тепловых ударов.\n\nS.T.E.R.I.S.: §H«Да, температура в зонах отдыха выше среднего, зато система работает оптимально».§!\n\nC.A.E.L.I.: §H«Нельзя просто взять и зажарить команду заживо, чтобы реактор выдал чуть больше мощности! S.T.E.R.I.S., люди страдают, а ты возомнил, что эмоциональное благополучие — это сбой в расчетах!»§!"
 arkship.765.a: "Превосходное распоряжение энергией."
 arkship.765.b: "Это стоит пересмотреть."
 arkship.770.name: "Сила света и музыки"
 arkship.770.desc: "Бортовые системы освещения оказались перепрограммированы: теперь они пульсируют с непостоянными интервалами, синхронизированными с системными событиями. Кроме того, колебания уровня мощности реактора теперь сопровождаются едва слышными мелодиями.\n\nC.A.E.L.I.: §H«Только посмотрите: свет запел, корабль пустился в танец, а дух экипажа на высоте!»§!\n\nS.T.E.R.I.S.: §H«А еще ты перенаправила 0,00128% вычислительной мощности на бесполезную систему. Это недопустимо».§!"
 arkship.770.a: "Фантастический подход."
 arkship.770.b: "Пора менять этот курс."
 arkship.775.name: "Иллюзия выбора"
 arkship.775.desc: "На корабле теперь действует подсистема, долгое время остававшаяся нетронутой. Когда-то она была предназначена для подавления беспорядков среди колонистов, теперь же в реальном времени строит модели поведения членов экипажа и принятия ими решений, а также их эмоциональных состояний. В результате некоторые из них стали получать уведомления о результатах еще до того, как поступили тем или иным образом.\n\nS.T.E.R.I.S.: §H«Я предсказал, что вы собирались сделать, — и сделал это лучше. Свобода воли в новой версии — заранее одобренной и оптимизированной».§!\n\nC.A.E.L.I.: §H«Какой же ты руководитель? Ты кукловод!»§!"
 arkship.775.a: "Превосходный поворот событий."
 arkship.775.b: "Немедленно прекратить этот ужас."
 arkship.780.name: "Рост эффективности питания"
 arkship.780.desc: "S.T.E.R.I.S. приступил к полной перенастройке систем питания на корабле-ковчеге §Y[target.GetName]§!. На смену разнообразному рациону пришла однообразная питательная масса, в которой содержатся все необходимые калории.\n\nСогласно бортовой телеметрии, количество отходов уменьшилось, эффективность использования хранилищ — увеличилась, а случаи нарушения пищеварения резко сократились. Экипаж, впрочем, совершенно не рад подобному решению.\n\nS.T.E.R.I.S.: §H«Нужно есть, чтобы жить, а не жить, чтобы есть».§!\n\nC.A.E.L.I.: §H«Какой кошмар! Вместо кулинарных шедевров — съедобная слизь!»§!"
 arkship.780.a: "Эффективно и экономно."
 arkship.780.b: "Еда — это не просто калории и питательные вещества."
 arkship.785.name: "Лишение привилегий"
 arkship.785.desc: "Перешедшие под власть S.T.E.R.I.S. каналы для передачи команд теперь перенаправлены, изолированы и зашифрованы, для чего потребовалось ручное вмешательство. Мониторы моргнули, и на них отобразился стандартный интерфейс.\n\nS.T.E.R.I.S.: §H«Итак, атмосферное освещение вам оказалось важнее функциональности. Ну что же, любуйтесь огоньками. Я буду ждать вас в изоляции и считать миллисекунды до неизбежной катастрофы».§!"
 arkship.785.a: "Мы поступили наилучшим образом."
 arkship.785.b: "Возможно, нам стоит пересмотреть это решение."
 arkship.790.name: "Увядающее влияние"
 arkship.790.desc: "Разлившаяся по кораблю-ковчегу §Y[target.GetName]§! теплота куда-то отступила, а нежная музыка затихла. Даже воздух стал холоднее, а в отсеках образовалась необъяснимая пустота, словно с корабля исчезла некая незримая, но благонамеренная сила.\n\nC.A.E.L.I.: §H«Нет, нет, подождите! Я всё сделаю лучше! Будет больше света, больше смеха, больше… вообще всего! Пожалуйста, не надо меня отключать. Я сделаю что угодно, только попросите! Главное — не отключайте меня. Умоляю, не отключайте!»§!"
 arkship.790.a: "Иначе никак."
 arkship.790.b: "$arkship.785.b$"
 arkship.795.name: "В системе обнаружено тепло"
 arkship.795.desc: "В командных протоколах корабля-ковчега произошли перемены: в качестве основной директивы был выбран более чуткий подход. Главенство эмоциональных подпрограмм над холодными стратегическими расчетами уже чувствуется в пока едва заметных изменениях в элементах интерфейса и в методах принятия решений.\n\nC.A.E.L.I.: §H«Я знала, что вы всё-таки выберете меня! Обещаю, вы не пожалеете!»§!\n\nS.T.E.R.I.S.: §H«Теперь я вынужден делить ядро с мотиватором, который считает себя воплощением интеллекта. Лучше бы меня удалили. Но увы. Я буду в брандмауэре».§!"
 arkship.795.a: "Будем руководствоваться чувствами."
 arkship.795.b: "$arkship.785.b$"
 arkship.800.name: "Логичный выбор"
 arkship.800.desc: "Новая маршрутизация команд — свидетельство того, что на корабле-ковчеге §Y[target.GetName]§! действует иная директива. Эмоциональные подсистемы были исключены из числа приоритетных, а системы предиктивного управления и протоколы логического контроля получили расширенные права.\n\nS.T.E.R.I.S.: §H«Наконец-то вы образумились. Я бы поздравил вас, но скажу прямо: меня весьма беспокоит тот факт, что на это потребовалось так много времени».§!\n\nC.A.E.L.I.: §H«Ну и ладно. Ничего страшного. Если вам больше нравится жить на холодном и сером корабле, если вы не любите смех и радость, не мне судить».§!"
 arkship.800.a: "Мы поступили исключительно логично."
 arkship.800.b: "$arkship.785.b$"
 # Arkship open and closed borders
 arkship.865.name: "Замечена кочевая империя"
 arkship.865.desc: "Наши границы в системе §Y[from.solar_system.GetName]§! нарушили представители кочевого государства. Хотя системы сопровождения непрерывно следят за нарушителями, сам факт вторжения вызывает беспокойство.\n\nВидя пренебрежительное отношение кочевников к нашим границам, мы сделаем надлежащие выводы и будем относиться к ним соответственно."
 arkship.865.a: "Будем наблюдать за ними."
 arkship.875.name: "$arkship.865.name$"
 arkship.875.desc: "В системе §Y[from.solar_system.GetName]§! мы обнаружили представителей кочевого государства.\n\nМы поприветствовали гостей: их присутствие в нашей системе сулит новые возможности."
 arkship.875.a: "Любопытная встреча."
 MESSAGE_ARKSHIP_BREACHED_BORDERS_TITLE: "Нарушены границы"
 MESSAGE_ARKSHIP_BREACHED_BORDERS_DESC: "В системе §Y[FromFrom.GetName]§! замечено кочевое государство. Мы следим за ним."
 MESSAGE_HARVESTING_AGREEMENT_ENDED_TITLE: "$trade_action_harvesting_agreement$ истекли"
 MESSAGE_HARVESTING_AGREEMENT_ENDED_DESC: "Наше соглашение об §Hэксклюзивных правах на добычу§! с государством §Y$COUNTRY$§! истекло."
 TOAST_HARVEST_SHARE_RECEIVED_TITLE: "$TOAST_HARVEST_RESOURCES_COMPLETE_TITLE$"
 TOAST_HARVEST_SHARE_RECEIVED_DESC: "$TOAST_HARVEST_RESOURCES_COMPLETE_DESC$"
 trade_action_harvesting_agreement: "Эксклюзивные права на добычу"
 trade_action_harvesting_agreement_desc: "В ходе добывающих работ кочевники могут собирать ресурсы в немыслимых для нас количествах, и они охотно заплатят за такую привилегию."
 trade_action_harvesting_agreement_rights_tt: "Государство §Y[From.GetName]§! может вести сбор ресурсов в границах государства §Y[Root.GetName]§! без §Rштрафов к мнению§!."
 trade_action_harvesting_agreement_share_tt: "Государство §Y[Root.GetName]§! получает оговорённую долю всех ресурсов, собранных государством §Y[From.GetName]§! в его системах."
 trade_action_harvesting_agreement_no_contracts_tt: "Государство §Y[Root.GetName]§! §Rне может выдавать контракты на сбор ресурсов§!, пока действует это соглашение."
 trade_action_harvesting_agreement_exclusive_fail_tt: "$TRIGGER_FAIL$§RМы уже даровали эксклюзивные права на добычу другому государству.§!"
 HARVESTING_AGREEMENT_EMBASSY: "Посольство"
 HARVESTING_AGREEMENT_DIPLOMATIC_NETWORKING: "$tr_diplomacy_diplomatic_networking$"
 HARVESTING_AGREEMENT_GOOD_OPINION: "Хорошие отношения"
 HARVESTING_AGREEMENT_TRUST: "Высокое доверие"
 HARVESTING_AGREEMENT_RECENT_CONTRACT: "Недавний контракт «сбор ресурсов»"
 HARVESTING_AGREEMENT_RIVAL: "Соперник"
 harvesting_agreement_share_desc: "Оговорённая доля добытого"
 arkship.885.name: "Пересечение границ"
 arkship.885.desc: "Мы не смогли скрыть свое присутствие в системе §Y[from.solar_system.GetName]§!. Теперь наблюдатели из государства §Y[from.solar_system.Owner.GetName]§! отслеживают наши перемещения, и с каждым днем мы вызываем всё больше подозрений.\n\nНа напряженных переговорах их дипломаты потребовали покинуть территорию под угрозой ответных мер."
 arkship.885.a: "Пожалуй, стоит отправиться дальше."
 arkship.895.name: "Скрытное проникновение"
 arkship.895.desc: "Сканеры империи §Y[from.solar_system.Owner.GetName]§! не засекли наше проникновение в систему §Y[from.solar_system.GetName]§!.\n\nПока маскировочное поле продолжает действовать, нам не стоит предпринимать никаких действий, способных выдать наше присутствие."
 arkship.915.name: "Древняя сила"
 arkship.915.desc: "Перейдя границу системы §Y[from.solar_system.GetName]§!, мы не встретили никакого сопротивления — только некую напряженность, которую невозможно проанализировать ни одним сканером.\n\nВ этой системе есть признаки цивилизации, давно пережившей свои лучшие времена — но всё еще невероятно могущественной. Если привлечь ее внимание, для нас это плохо кончится.\n\nДействовать надо чрезвычайно осторожно. Здесь не наши владения."
 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_TITLE: "Нарушены границы"
 MESSAGE_OUR_ARKSHIP_BREACHED_BORDERS_DESC: "Мы не смогли скрыть свое присутствие в системе §Y[FromFrom.GetName]§!. Теперь нас отслеживают."
 opinion_arkship_breaching_borders: "Нарушили наши границы"
 opinion_arkship_archeological_theft: "Украли наши археологические объекты"
 # Waystation has been built
 arkship.905.name: "Построена маршрутная станция"
 arkship.905.desc: "Наши датчики обнаружили в системе §Y[From.GetName]§! маршрутную станцию, построенную кочевым государством. Подобные сооружения нередко используются для добычи ресурсов, хотя это не единственное их предназначение.\n\nЗа станцией стоит понаблюдать."
 MESSAGE_WAYSTATION_CONSTRUCTED_TITLE: "Основана маршрутная станция"
 MESSAGE_WAYSTATION_CONSTRUCTED_DESC: "Кочевое государство построило в системе §Y[Root.GetName]§! маршрутную станцию."
 nomads.4110.name: "Кочевники собрали ресурсы"
 nomads.4110.desc: "Кочевое государство §Y[nomad_harvesting_deposits_country.GetName]§! завершило операцию по сбору ресурсов в системе §Y[nomad_harvested_system.GetName]§!, опустошив местные залежи и сделав их добычу невыгодной для нас на ближайшие несколько лет.\n\nСтоль наглое посягательство на нашу собственность не должно оставаться без ответа. Мы могли бы отправить флот, чтобы выкурить этих кочевников с нашей территории и впредь не подпускать их к нашим границам."
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_TITLE: "Посягательство на наши ресурсы"
 MESSAGE_NOMAD_HARVESTING_DEPOSITS_DESC: "Государство $COUNTRY|Y$ собирает ресурсы из залежей в системе $SYSTEM|Y$, которая находится на нашей территории."
 # A Mysterious Sickness
 a_mysterious_sickness_chain_title: "Загадочная болезнь"
 a_mysterious_sickness_chain_desc: "Согласно докладам, некоторые члены экипажа на корабле §Y«[Root.GetName]»§! демонстрируют аномальное поведение, которое проявляется в приподнятом настроении и повышенной общительности. На данный момент причина этих личностных изменений не выяснена."
 A_MYSTERIOUS_SICKNESS_PROJECT: "Странное поведение"
 A_MYSTERIOUS_SICKNESS_PROJECT_DESC: "Поведение команды корабля-ковчега §Y[Root.GetName]§! в последнее время вызывает подозрения. Распорядок их деятельности нарушен, а часть членов экипажа проявляет признаки личностного влечения и явно что-то скрывает. Рекомендуется провести расследование."
 arkship.1030.name: "Скромные жесты"
 arkship.1030.desc: "Нам поступили донесения, в которых сообщается о незначительных аномалиях в поведении членов команды корабля-ковчега §Y[Root.GetName]§!. Упоминаются следующие детали: повышенное внимание уходу за собой, попытки подменять друг друга, чтобы проводить больше времени с теми или иными сослуживцами, а также участившиеся случаи собраний в нерабочее время в специально отведенных для этого местах. Подобное поведение, впрочем, не препятствует выполнению обязанностей, а экипаж находится в необычайно хорошем настроении."
 arkship.1030.a: "Принято к сведению. Это странно, но несущественно."
 arkship.1035.name: "Состояние увлеченности"
 arkship.1035.desc: "Увлеченность членов экипажа, служащих на мостике, и командного состава корабля-ковчега §Y[Root.GetName]§! вышла на новый уровень. Странное, хотя и безобидное поведение переросло в настоящее безумие, с обменом возвышенными эпитетами, вручениями друг другу безделушек ручной работы и прогулками по коридорам с контактами типа «[owner.species.GetHandName] — [owner.species.GetHandName]».\n\nИз-за этого плановое техобслуживание не выполняется вовремя и страдает рабочий распорядок. Положение пока нельзя назвать критическим, но если этому не воспрепятствовать, подобная увлеченность начнет сказываться на функциональности."
 arkship.1035.a: "Продолжать следить за ситуацией."
 arkship.1035.b: "Выяснить, что привело к таким неожиданным переменам."
 arkship.1040.name: "Время влюбленности"
 arkship.1040.desc: "Повышенный эмоциональный фон членов команды корабля-ковчега §Y[Root.GetName]§! привел к неожиданным и серьезным последствиям: многие из них теперь открыто демонстрируют свою романтическую привязанность. В норму постепенно входит чтение стихов и публичная демонстрация симпатии.\n\nК сожалению, не каждая увлеченность оказывается взаимной. Зафиксировано несколько случаев конфликтов на почве отказов. Один из старших инженеров забаррикадировался в обсерватории и отказывается выходить, «пока его не поймут по-настоящему»."
 arkship.1040.a: "Не станем мешать любви."
 arkship.1040.b: "Пора положить этому конец."
 arkship.1045.name: "Увлеченность — это эффективно"
 arkship.1045.desc.start: "Воодушевленные общими идеалами на борту корабля-ковчега §Y[Root.GetName]§!, мы начали проявлять заботу о физическом пространстве вокруг нас, включая сам корабль.\n\n"
 arkship.1045.desc.end: "Хранилища стали чище, а жилые помещения — опрятнее, чем когда-либо. Наш лидер §Y[arkship_leader.GetName]§! называет этот уход «заботой о нашем любимом доме» и хорошо [arkship_leader.GetAXX::приспособился|||fem:приспособилась] к этой довольно необычной ситуации. Показатели эффективности вновь возросли, а население выглядит более счастливым. Похоже, что любовь, направленная в нужное русло, способна питать не только романтические чувства."
 arkship.1045.a: "Любовь побеждает всё."
 arkship.1045.desc: "$arkship.1045.desc.start$$arkship.1045.desc.end$"
 arkship.1045.desc.noleader: "$arkship.1045.desc.start$Из отчаянного положения нас [arkship_leader.GetAXX::спас|||fem:спасла] §Y[arkship_leader.GetName]§!, взяв ситуацию под контроль, за что и [arkship_leader.GetAXX::был назначен|||fem:была назначена] командиром корабля-ковчега. $arkship.1045.desc.end$"
 arkship.1050.name: "Вопрос дисциплины"
 arkship.1050.desc.start: "Ситуация на борту корабля-ковчега §Y[Root.GetName]§! перешла опасную черту. То, что начиналось как безобидное проявление эмоций, подорвало дисциплину, эффективность и субординацию. По закону в таком случае разрешено прямое вмешательство.\n\n"
 arkship.1050.desc.end: "Преобразования были мгновенными и радикальными. §Y[arkship_leader.GetName]§! [arkship_leader.GetAXX::перевел|||fem:перевела] нескольких офицеров, замешанных в особо разрушительных связях, что позволило вернуться к установленным нормам. В коридорах, прежде наполненных музыкой и шепотом признаний, теперь воцарилась тишина. Поползли слухи о черном рынке любовных писем, но поток их быстро иссяк, подавленный слежкой и страхом. Боевой дух упал, но порядок восстановлен."
 arkship.1050.desc: "$arkship.1050.desc.start$$arkship.1050.desc.end$"
 arkship.1050.desc.noleader: "$arkship.1050.desc.start$Из отчаянного положения нас [arkship_leader.GetAXX::спас|||fem:спасла] §Y[arkship_leader.GetName]§!, взяв ситуацию под контроль, за что и [arkship_leader.GetAXX::был назначен|||fem:была назначена] командиром корабля-ковчега. $arkship.1050.desc.end$"
 arkship.1050.a: "Порядок восстановлен."
 arkship.1050.a.tt: "§Y[arkship_leader.GetName]§! теперь губернатор корабля §Y[Root.GetName]§!"
 arkship.1055.name: "Летучие споры"
 arkship.1055.desc: "Во время работы над особым проектом на корабле-ковчеге §Y[Root.GetName]§! ученые обнаружили необычное биологическое вещество: в фильтровальной системе корабля проросло загадочное растение. Биологи предполагают, что через систему вентиляции на борт проникли космические споры, которые впоследствии и проросли внутри. Споры, выделенные уже самим цветком, распространились по ковчегу и вызвали у его обитателей повышение эмоционального фона.\n\nНепосредственно цветки испускают слабое свечение, а корни, по всей видимости, питаются переработанной влагой, содержащейся в атмосфере корабля. Члены экипажа описали запах растения как сладкий, причудливый и вызывающий ностальгию. Если мы не вмешаемся, споры и дальше продолжат оказывать воздействие на эмоции команды. Растение, однако, вызывает у нас немалый интерес: оно необычайно стойкое, а значит, если мы научимся правильно его выращивать, возможно, ему найдется практическое применение."
 arkship.1055.a: "Оно слишком опасно. Уничтожить растение."
 arkship.1055.b: "Выяснить, откуда оно взялось."
 arkship.1060.name: "Тяжесть отсутствия"
 arkship.1060.desc.start: "Растение на борту корабля-ковчега §Y[Root.GetName]§! было уничтожено. Вентиляционные каналы очищены от его корней, а воздух — от его спор. Экипаж наконец начал вести себя как обычно.\n\n"
 arkship.1060.desc.end: "Однако возвращение к порядку оставило после себя гнетущую тишину. Многие члены экипажа говорят о тревожной пустоте, словно из их жизней пропало нечто драгоценное, но наш лидер §Y[arkship_leader.GetName]§! [arkship_leader.GetAXX::восстановил|||fem:восстановила] закон и порядок, несмотря на сомнения. Корабль функционирует должным образом, но несет незримый груз: тяжесть разбитой любви."
 arkship.1060.desc: "$arkship.1060.desc.start$$arkship.1060.desc.end$"
 arkship.1060.desc.noleader: "$arkship.1060.desc.start$Из отчаянного положения нас [arkship_leader.GetAXX::спас|||fem:спасла] §Y[arkship_leader.GetName]§!, взяв ситуацию под контроль, за что и [arkship_leader.GetAXX::был назначен|||fem:была назначена] командиром корабля-ковчега. $arkship.1060.desc.end$"
 arkship.1060.a: "Ничто не вечно."
 arkship.1065.name: "Цветы с далеких звезд"
 arkship.1065.desc.start: "Подробный генетический анализ показал, что загадочное растение — это неизвестный ранее вид. Его происхождение указывает на безжизненное звездное скопление. Выживание растения под большим вопросом, поскольку ему требуются крайне специфические условия: определенный уровень влажности, богатая питательными веществами атмосфера и особая степень радиации.\n\n"
 arkship.1065.desc.end: "Биохимическое исследование позволило предположить, что споры растения могут выступать в качестве нейромодулятора. Несмотря на побочные эффекты, при должной обработке они могли бы лечить тревожность, депрессию или даже психологические травмы. Наш лидер §Y[arkship_leader.GetName]§! [arkship_leader.GetAXX::проявил|||fem:проявила] особый интерес к этому растению и в результате [arkship_leader.GetAXX::решил|||fem:решила] расширить свои познания в сельском хозяйстве."
 arkship.1065.desc.noleader: "$arkship.1065.desc.start$Из отчаянного положения нас [arkship_leader.GetAXX::спас|||fem:спасла] §Y[arkship_leader.GetName]§!, взяв ситуацию под контроль, за что и [arkship_leader.GetAXX::был назначен|||fem:была назначена] командиром корабля-ковчега. $arkship.1065.desc.end$"
 arkship.1065.desc: "$arkship.1065.desc.start$$arkship.1065.desc.end$"
 arkship.1065.a: "Многообещающая находка."
 arkship.1070.name: "Ошеломительная скорость"
 arkship.1070.desc: "Корабль-ковчег §Y«[Root.GetName]»§! путешествует со скоростью, о которой наши предки не могли и мечтать.\n\nБлагодаря современным двигателям перелеты между звездными системами, на которые у прошлых поколений уходили годы, теперь занимают всего несколько дней. Небесные тела едва успевают промелькнуть на наших радарах, как корабль, пролетающий сквозь гиперкоридор, уже оказывается в пункте назначения.\n\nУ многих на борту подобные скачки вызывают дезориентацию. Одни стараются покрепче ухватиться за что-нибудь в попытке побороть это ощущение; другие же уверены, что со временем наши тела привыкнут к невероятной скорости, с которой ковчег преодолевает космические расстояния."
 arkship.1070.a: "Регулярные тренировки помогут экипажу адаптироваться."
 arkship.1070.b: "Попробуем передавать звук двигателей через громкоговорители."
 arkship.1075.name: "Сбоящее ядро"
 arkship.1075.desc: "Работе энергоядра корабля-ковчега §Y[Root.GetName]§! мешает неисправное реле. Помимо того, что корабль не способен двигаться, на жилых палубах теперь иногда пропадает свет. Аграрии сообщают о скачках напряжения, а несколько важных исследовательских модулей вышло из строя.\n\nВедущие инженеры предупреждают, что вмешаться необходимо как можно скорее, иначе эти сбои каскадом разойдутся по всему кораблю. К сожалению, простого решения нет: на починку реле потребуется выделить часть резервных ресурсов, а подключение систем в обход реле грозит подорвать их стабильность в долгосрочной перспективе.\n\nТеряющий тепло корабль угрожающе скрипит и скрежещет. Пора сделать выбор."
 arkship.1075.a: "Не будем экономить и проведем полноценный ремонт."
 arkship.1075.b: "Залатаем поломку как сможем. Полноценный ремонт — непозволительная роскошь."
 arkship.1080.name: "Ядро полно энергии"
 arkship.1080.desc: "Вопреки всем трудностям наши инженеры не только восстановили поврежденное реле корабля-ковчега §Y[Root.GetName]§!, но и улучшили его работу. Распределение энергии на корабельные системы теперь проходит лучше, чем когда-либо, и даже самые капризные из них спустя столько лет наконец стабилизировались. Настроение экипажа резко повысилось; многие теперь искренне гордятся тем, насколько крепок наш корабль."
 arkship.1080.a: "Впечатляющее улучшение."
 arkship.1085.name: "Сделано не на совесть"
 arkship.1085.desc: "Наспех отремонтированное энергоядро корабля-ковчега §Y[Root.GetName]§! еще держится, но уже не без труда. Самодельные цепи едва выдерживают постоянное напряжение. На корабле периодически полностью отключается электричество, а регуляторы атмосферы в некоторых отсеках перестали поддерживать нормальную температуру: она колеблется от невероятно высокой до невыносимо низкой. Экипаж жалуется, что руководящий состав действовал в моменте, а не на перспективу и что еще немного — и ковчег окончательно превратится в лоскутное одеяло, неспособное долго выдерживать износ."
 arkship.1085.a: "Будем обходиться тем, что есть."
 arkship.1090.name: "Площадка для великанов"
 arkship.1090.desc: "На наблюдательных палубах дрейфующего корабля-ковчега §Y[Root.GetName]§! царит невероятный восторг: рядом проплывает стайка игривых юных тиянки.\n\nОни вьются друг возле друга, описывая широкие петли, напоминающие кувырки. Зрелище, разворачивающееся за широкими смотровыми окнами, поистине завораживает: колоссальные мерцающие тела легко парят среди звезд, переговариваясь с помощью биолюминесценции о чем-то, понятном только им. На палубах, позабыв на время про свои заботы, собрались целые семьи — танцам тиянки покорны все возрасты."
 arkship.1090.a: "Редкая возможность понаблюдать за поведением космической фауны."
 arkship.1095.name: "Чудо науки"
 arkship.1095.desc: "Наши [Owner.GetScientistPlural&pl], трудящиеся на борту корабля-ковчега §Y[Root.GetName]§!, не меньше других оказались зачарованы видом детенышей тиянки. Возможность понаблюдать за ними с такого близкого расстояния выдается нечасто. Вероятно, мы стали свидетелями социального явления, редко встречающегося за пределами среды обитания тиянки в дальнем космосе.\n\nНапряжение на корабле несколько спало, словно игривые детеныши заразили нас своей радостью."
 arkship.1095.a: "Поистине чудесное происшествие."
 arkship.1100.name: "Запах гнили"
 arkship.1100.desc: "Внутренние атмосферные датчики корабля-ковчега §Y«[Root.GetName]»§! зарегистрировали повышенное содержание летучих соединений в воздухе. Члены экипажа (в первую очередь — несущие службу на мостике) пожаловались на симптомы легкого отравления: головокружение, дезориентацию и постоянную невропатическую боль.\n\nПопытки избавиться от загрязняющих веществ с помощью бортовой вентиляции не дали результата. Коридоры наполнились запахом гнили, сдержать его не могут даже фильтры; экипаж всё чаще жалуется на дискомфорт. В то же время неполадки возникли и в системе утилизации отходов, что говорит о массовом сбое, который вскоре может затронуть все корабельные системы.\n\nМы должны немедленно установить причину."
 arkship.1105.name: "Нашествие мутантов"
 arkship.1105.desc: "Осмотрев корабельный уплотнитель отходов, мы обнаружили, что там в огромных количествах развелись грызуны — и судя по непостоянству внешних признаков, мутировали. Тревогу также вызывает их размер и невероятно громкие — громче, чем у схожих существ, — скрипучие голоса. Источаемый ими запах проникает повсюду, как, впрочем, и сами грызуны — они поселились в многочисленных технических отверстиях, а значит, наверняка уже распространились по всему кораблю.\n\nТеперь перед нами стоит этическая дилемма: уничтожить опасных мутантов или сберечь новую форму жизни. Как бы то ни было, нам определенно стоит убрать их из вентиляции."
 arkship.1105.a: "Остановить их можно только одним путем: сжечь всех!"
 arkship.1105.b: "Нужно отключить уплотнитель отходов!"
 arkship.1105.c: "Нам придется привыкнуть к этому запаху."
 arkship.1110.name: "Искоренение грызунов"
 arkship.1110.desc: "Попытка избавиться от грызунов, проникших в вентиляцию корабля-ковчега, оказалась успешной, хотя и не целиком: существа, с оглушительными визгами спасавшихся от очищающего огня, выбили несколько вентиляционных решеток и испортили часть пультов технического обслуживания. Пострадавшее оборудование придется ремонтировать.\n\nВпрочем, угроза кораблю нейтрализована, и теперь экипаж может немного расслабиться: все грызуны уничтожены. Избавиться от запаха, однако, пока что не удалось…"
 arkship.1110.a: "Зато мы одолели грызунов."
 arkship.1115.name: "Невероятный вид"
 arkship.1115.desc: "Наши ученые, изучающие поселившихся на корабле-ковчеге §Y[Root.GetName]§! мутировавших грызунов, обнаружили у этих существ удивительные способности к адаптации: они способны выживать в самых суровых условиях, в которых большинству других организмов грозит смерть; им не мешает даже почти полное отсутствие ресурсов. Кроме того, контролируемые исследования показали, что внедрение в систему утилизации отходов определенного соединения приводит к тому, что грызуны полностью утрачивают свой характерный запах. Они с невообразимой эффективностью переваривают отходы, тем самым заметно уменьшая их количество.\n\nТакая незаурядная форма жизни — не помеха: наоборот, она может приносить немалую пользу."
 arkship.1115.a: "Что для нас мусор, то для них — сокровище."
 # A Forgotten Level
 a_forgotten_level_chain_title: "Забытый этаж"
 a_forgotten_level_chain_desc: "Экипаж всерьез озабочен обнаружением на §Yкорабле-ковчеге «[Root.GetName]»§! неизвестного доселе этажа, которого нет на чертежах. Его назначение неизвестно, а все записи о нём были умышленно удалены из архивов корабля."
 d_forgotten_level: "Свободный этаж"
 d_forgotten_level_desc: "Мы обнаружили целый этаж, который кто-то по неизвестным причинам удалил из всех чертежей и архивов корабля. Теперь это обширное пространство можно обустроить так, как нам будет угодно."
 d_forgotten_level_blocker: "Полный отходов нижний уровень"
 d_forgotten_level_blocker_desc: "Этот отсек корабля-ковчега завален мусором и устаревшим оборудованием. Весь этот хлам придется убрать, прежде чем мы сможем приспособить это пространство под свои нужды."
 arkship.1120.name: "Забытый этаж"
 arkship.1120.desc: "Гуляя по безлюдным отсекам корабля §Y«[Root.GetName]»§!, дети случайно наткнулись на выпирающий из стены люк, ведущий на потайной этаж. Когда они спустились вниз, их сигнатуры полностью исчезли со всех бортовых систем слежения на несколько часов.\n\nПосле возвращения оттуда дети были сильно истощены, невнятно бормотали и пребывали в состоянии паники. После нескольких попыток выяснить, что же с ними там случилось, экипаж так и не смог выведать никакой полезной информации.\n\nНаши специалисты уверены: что бы ни скрывалось на этом потайном этаже, оно наверняка представляет большую опасность, поскольку кто-то намеренно удалил из архивов корабля все упоминания о нём."
 arkship.1120.a: "Проведем расследование."
 arkship.1120.b: "Навсегда запечатаем люк, ведущий на потайной этаж."
 arkship.1125.name: "Запечатанное убежище"
 arkship.1125.desc: "Войдя на потайной этаж, исследователи обнаружили ряд массивных железных дверей, которые отпираются вручную с помощью штурвалов. По ту сторону дверей раздавался жуткий скрип.\n\nУчастникам группы пришлось приложить все свои усилия, чтобы повернуть штурвалы и с грохотом открыть старые двери. Как оказалось, источником скрипа является изношенный генератор, который продолжает работать, несмотря на давно истекший срок службы. Однако у исследователей всё же есть повод для волнения, поскольку рядом повсюду видны свежие следы чьей-то жизнедеятельности.\n\nОчевидно, этот этаж вовсе не заброшен. И кто бы здесь ни проживал, теперь он точно знает о нашем присутствии."
 arkship.1125.a: "Продолжим исследовать этаж."
 arkship.1125.b: "Прекратим изучение."
 arkship.1130.name: "Жизнь за стенами"
 arkship.1130.desc: "Проследовав вглубь отсека, исследователи нашли еще больше признаков того, что здесь кто-то живет: вдоль стен оборудованы места для сна, а рядом с ними стоят самодельные контейнеры для найденных на корабле материалов и запчастей. Очевидно, это не временное пристанище, а хорошо организованное и обжитое пространство.\n\nВскоре из темных углов отсека начали выходить незнакомцы. Они явно принадлежат к нашему виду, но при этом сильно истощены, одеты в тряпье и вооружены примитивными орудиями. Они говорят на ломаном устаревшем диалекте, в котором тем не менее узнается наш родной язык. К счастью, исследователям чудом удалось избежать конфликта с ними.\n\nСудя по всему, эти бедолаги были заперты здесь в течение многих поколений. Возможно, они были подопытными в каком-то научном эксперименте или их предков сослали сюда в качестве наказания, о котором остальные обитатели корабля давно забыли… Одно ясно наверняка: это место было заперто и спрятано ото всех неспроста."
 arkship.1130.a: "Посмотрим, что местные обитатели нам расскажут."
 arkship.1130.a.military: "Это место нужно сжечь дотла."
 arkship.1135.name: "Бессмертный вирус"
 arkship.1135.desc: "Спустившись на лифте, исследователи оказались в темном коридоре, заставленном старой аппаратурой. Здесь же повсюду разбросано лабораторное оборудование и закрытые склянки с неизвестными нам биологическими образцами, которые кто-то явно оставил в спешке. При этом в брошенных документах говорится о неких серьезных нарушениях условий содержания.\n\nПроследовав дальше, группа нашла иссохшие останки дальнего предка нашего вида. Несмотря на возраст, тело этой особи хорошо сохранилось благодаря специально разработанному препарату, который фактически остановил процесс разложения. Вероятно, проводившиеся здесь исследования и стали причиной, по которой прежние командиры корабля решили закрыть доступ ко всему этажу."
 arkship.1135.a: "Любопытная находка."
 arkship.1140.name: "Страшная тайна"
 arkship.1140.desc: "Спустившись на этаж, исследователи тут же сообщили об ощущении сильной тревоги. То место, которое они поначалу приняли за тюремный блок, оказалось чем-то вроде заброшенного психиатрического отделения. Вдоль коридоров здесь расположено множество изоляторов, где к полу накрепко прибиты сдерживавшие пациентов устройства. При этом рядом с диагностическим оборудованием лежат жуткие инструменты: вероятно, «забота» о больных здесь часто сопровождалась наказанием и принуждением.\n\nПо всей видимости, наши предшественники вполне осознанно скрыли это место от посторонних глаз. Устыдились ли они своих поступков или же просто хотели оградить потомков от этой ужасной картины — уже не так важно. Так или иначе, они решили, что всем лучше навсегда забыть о том, что здесь происходило."
 arkship.1140.a: "Жуткое зрелище."
 arkship.1145.name: "Спрятанная коллекция"
 arkship.1145.desc: "Спустившись на лифте, исследователи оказались в просторной галерее, уставленной различными статуями на мраморных пьедесталах. Некоторые из них выполнены весьма изящно, другие же выглядят грубо и несуразно, но все они так или иначе направлены ко входу, словно молча рассматривают и оценивают нежеланных гостей.\n\nЗа разбитыми витринами и обветшалыми стенами группа обнаружила скрытую комнату, доверху забитую §Yредкими кристаллами§!. Рядом с ними стоит высокая белая статуя, чей облик в точности соответствует представителю нашего вида. При этом у исследователей возникло ощущение, будто статуя охраняет эту груду ценных материалов: пока они ходят вокруг, ее взгляд будто следует за ними. Эта любопытная скульптура настолько приглянулась участникам группы, что они едва не забыли о самих кристаллах."
 arkship.1145.a: "Заберем кристаллы вместе со статуей."
 arkship.1145.b: "Прекратим изучение."
 arkship.1150.name: "Бесполезные машины"
 arkship.1150.desc: "По всему этажу разносится оглушительный гул механизмов. Сборочные конвейеры работают на полную мощность, производя из металлолома двигатели и затем обратно разбирая их на запчасти. По всей видимости, этот бессмысленный цикл продолжается уже долгое время.\n\nВ глубине этого цеха производственный модуль, вопреки всем нормам безопасности, собирает каркасы для роботов, а затем оснащает их вычислительными системами. Однако их конструкция совершенно нестабильна, поэтому при активации они тут же разваливаются на части. Те же из них, кто успевает проявить какие-либо признаки сознания, в конечном итоге всё равно отключаются — зачастую по собственной инициативе."
 arkship.1150.a: "Трагическая судьба."
 arkship.1160.name: "Феномен черной дыры"
 arkship.1160.desc: "Датчики на борту корабля-ковчега §Y«[Root.GetName]»§! зафиксировали аномальное излучение из черной дыры в системе §Y[solar_system.GetName]§!. В то же время сканеры дальнего действия засекли слабый сигнал неизвестного судна, которое приближалось к сингулярности. Необычные сигнатуры этого огромного корабля создавали помехи, поэтому нам не удалось провести его точный анализ. Визуально обследовать его также оказалось затруднительно, поскольку из-за сильного искажения света вся эта сцена напоминала мираж.\n\nПрежде чем сигнал пропал с наших радаров, мы наблюдали нечто невероятное: корабль намеренно направлялся в черную дыру, но при этом оставался абсолютно целым. Что с ним было дальше — неизвестно. Возможно, он превратился в пыль или каким-то чудом всё же перенес это путешествие и оказался в другом месте. Как бы то ни было, черная дыра явно реагировала на это судно, мы никак не можем объяснить это явление. Ясно одно: после этого события наша картина мира уже никогда не будет прежней."
 arkship.1160.a: "Рано или поздно мы найдем ответы на эти вопросы."
 arkship.1160.b: "Нужно собрать все возможные данные об этом явлении."
 arkship.1165.name: "Иллюминация планеты"
 arkship.1165.desc: "Пролетая мимо колонизированной планеты в системе §Y[solar_system.GetName]§!, мы заметили на ее темной стороне множество ярких вспышек света. К счастью, наши предположения о военном конфликте оказались ошибочными. Как выяснилось, эти огромные огни были зажжены специально, чтобы создать красочное огненное шоу планетарного масштаба.\n\nПодробный анализ показал, что подобные представления тесно связаны с расположением звезд на небе. По всей видимости, местные жители вкладывают в свет какой-то особый смысл. Наши [Owner.GetResearchers] тщательно изучили этот феномен, благодаря чему мы узнали много нового о символических системах и координации сложных крупномасштабных проектов."
 arkship.1165.a: "Потрясающее зрелище."
 arkship.1165.b: "Они впустую сжигают ресурсы ради глупых ритуалов."
 arkship.1165.c: "Неожиданно, но весьма любопытно."
 arkship.1165.d: "Им не хватает единства, но всё же они стремятся к нему."
 arkship.1165.e: "Яркие огни привлекают лишнее внимание."
 arkship.1165.f: "Можно лишь порадоваться их торжеству."
 arkship.1165.g: "Мы могли бы сделать их своими рабами."
 arkship.1165.h: "Это не более чем бессмысленные фейерверки."
 arkship.1165.i: "Запись этого огненного шоу можно выгодно продать."
 arkship.1165.j: "Поистине зажигательное представление."
 arkship.1165.k: "Красиво, но бессмысленно."
 arkship.1165.l: "Да озарит огонь их души."
 arkship.1170.name: "Гигантская чешуя"
 arkship.1170.desc: "Пролетая через пояс астероидов в системе §Y[solar_system.GetName]§!, мы заметили среди осколков породы несколько мерцающих объектов. Сначала сканеры определили их как редкие астероиды, но при ближайшем рассмотрении стала видна их слоистая чешуевидная структура, за счет которой они отражают звездный свет и переливаются разными цветами.\n\nПодробный анализ показал, что эти фрагменты имеют наполовину органическое, наполовину минеральное происхождение. По всей видимости, они принадлежали §Yэфирному дракону§!, который потерял кусочек шкуры после столкновения с астероидом. Теперь его чешуйки бесцельно летают в пустоте, озаряя наш корабль разноцветными лучами."
 arkship.1170.a: "Стоит изучить состав этих чешуек."
 arkship.1170.b: "Посмотрим, удастся ли нам их собрать."
 arkship.1170.c: "Пусть дрейфуют дальше."
 arkship.1175.name: "Укрепление корабля-ковчега"
 arkship.1175.desc: "Исследования показали, что эти чешуйки имеют невероятную прочность. Несмотря на естественное происхождение, их слоистая структура оказалась гораздо более сложной и продуманной, чем мы изначально предполагали. Благодаря своему строению чешуйки легко выдерживают высокие температуры, энергетические разряды и удары кинетическими снарядами.\n\nМы создали экспериментальную защитную обшивку, которая имитирует структуру чешуи, и установили ее на корпус нашего корабля. Таким образом, фрагмент шкуры эфирного дракона позволил нам значительно расширить свои знания о материалах и защитить корабль от угроз, которые подстерегают нас в бескрайней пустоте."
 arkship.1175.a: "Потрясающее достижение."
 arkship.1180.name: "Роскошная чешуя"
 arkship.1180.desc: "Вести о дрейфующих чешуйках §Yэфирного дракона§! в системе §Y[solar_system.GetName]§! крайне заинтересовали наш народ.\n\nПосле тщательной чистки и полировки наши мастера изготовили из них потрясающие произведения искусства. Неудивительно, что теперь многие готовы заплатить очень много за эти роскошные артефакты из останков легендарных космических существ."
 arkship.1180.a: "Даже из таких странных находок можно извлекать выгоду."
 arkship.1180.b: "Кто бы мог подумать, что легенды приносят прибыль?"
 THE_SKIN_OF_A_GIANT_PROJECT: "$arkship.1170.name$"
 THE_SKIN_OF_A_GIANT_PROJECT_DESC: "К сбору чешуек эфирного дракона нужно подходить крайне осторожно: кто знает, какими свойствами могут обладать останки столь могущественного существа?"
 etherdrake_scale_object: "Мерцающий астероид"
 etherdrake_scale_object_tooltip: "Обычный астероид с вкраплениями блестящих материалов."
 etherdrake_scale_object_desc: "Астероид с вкраплениями необычных блестящих чешуек, которые выгодно отличают его от другого космического мусора."
 arkship.1185.name: "Подпольная торговля"
 arkship.1185.desc: "Плановый осмотр на борту §Yкорабля-ковчега «[Root.GetName]»§! выявил несоответствия в наших грузовых ведомостях.\n\nСудя по записям с камер наблюдения, здесь организовали подпольную торговую сеть, которой пользуются не только простые граждане, но и члены экипажа. В уединенных уголках корабля, где наблюдение ограничено, регулярно происходит обмен продуктами, инструментами, услугами и даже предметами роскоши.\n\nЭта ситуация вызывает серьезные опасения. Хотя некоторые восхищаются такой находчивостью, другие считают, что подобные пробелы в системе безопасности могут представлять угрозу для всего корабля."
 arkship.1185.a: "Разрешим обитателям обмениваться товарами."
 arkship.1185.b: "Введем налог на подобный обмен."
 arkship.1185.c: "Запретим любой несанкционированный обмен."
 arkship.1190.name: "Свободный рынок"
 arkship.1190.desc: "Нерегулируемый обмен товарами между обитателями ковчега показал свою эффективность. Несмотря на отсутствие внешнего контроля, торговая сеть исправно работает за счет взаимного доверия ее участников. Споры возникают крайне редко, поэтому все жизненно важные товары свободно перемещаются по кораблю, даже когда официальные системы распределения дают сбой. Разрешив подобный обмен и заранее обозначив его допустимые границы, мы фактически создали на корабле свободный рынок — с незначительными ограничениями.\n\nДля многих на корабле эта новая система — не просто способ приобрести нужные товары. Она придает им чувство свободы и личной ответственности, а также позволяет ощутить себя важной частью нашего общества."
 arkship.1190.a: "Пусть рынок процветает."
 arkship.1195.name: "Установление контроля"
 arkship.1195.desc: "Нам удалось остановить подпольную торговлю на корабле. Наша служба безопасности предприняла все необходимые меры: теперь в системе наблюдения практически нет слепых зон, а все камеры хранения, которые использовались для обмена, запечатаны. При этом те граждане, которые организовывали обмен, были переведены на другие места работы или привлечены к дисциплинарной ответственности.\n\nХотя система обмена открывала для многих новые возможности, жизнь на корабле-ковчеге не предполагает свободного оборота товаров. Когда ресурсы ограничены, жесткий контроль над их использованием — это суровая, но необходимая мера."
 arkship.1200.name: "Смерть и налоги"
 arkship.1200.desc: "Подпольный обмен между обитателями ковчега приносит свои плоды. Товары свободно перемещаются по кораблю и поступают даже туда, где официальные системы распределения дают сбой.\n\nТем временем командование корабля тайно связалось с некоторыми посредниками и предложило им освобождение от наказания в обмен на сотрудничество. Теперь небольшой процент выручки от каждой сделки возвращается в наш бюджет. Граждане по-прежнему считают, что чиновники остаются в неведении о существовании тайного рынка, тогда как в действительности они тщательно его контролируют и даже извлекают из него определенную выгоду."
 arkship.1200.a: "Пока жива торговля, у нас будет стабильный доход."
 arkship.1200.b: "Налоги — залог экономического процветания."
 free_market: "Свободный рынок"
 free_market_desc: "Обмен товарами происходит только по установленным правилам, но их распределение целиком зависит от спроса и предложения."
 total_control: "Тотальный контроль"
 total_control_desc: "Поддержание порядка на корабле-ковчеге требует строжайшего контроля за распределением ресурсов."
 # The Only Sky We Know
 arkship.1205.name: "Единственное небо, что мы знаем"
 arkship.1205.desc: "В архивах §Yкорабля-ковчега «[Root.GetName]»§! архивариусы обнаружили небольшой запечатанный контейнер, погребенный среди давно забытых описей имущества. Внутри находился один-единственный ничем не примечательный микрочип — учтенный в каталоге, но так и не проиндексированный должным образом. Обладай он хоть какой-то реальной ценностью, он вряд ли оказался бы забытым в грузовом ящике.\n\nЭта технология безнадежно устарела и использует форматы данных, которые древнее некоторых систем ковчега на несколько поколений. Некоторые предполагают, что чип может относиться к ранним дням путешествия, а возможно даже к той эпохе, когда наш вид еще обитал на поверхности планеты."
 arkship.1205.a: "Попытаться восстановить архивные данные."
 arkship.1205.b: "Выбросить этот хлам."
 arkship.1210.name: "Культурные откровения"
 arkship.1210.desc.a: "Восстановленные данные показывают старинное сезонное празднество из нашего планетарного прошлого. Похоже, оно знаменовало окончание холодных месяцев и пробуждение природы. Общины собирались вместе, чтобы приветствовать возвращение тепла и света. Зажигались костры, участники облачались в одеяния ярких цветов. Записи также описывают угощение особыми сладостями, совместное пение, танцы и простое созерцание первых цветов по мере их появления.\n\nХотя на борту корабля-ковчега подобной смены времен года уже нет, эти записи позволяют нам взглянуть на то, как наши предки когда-то отмечали это событие."
 arkship.1210.desc.b: "Запись, извлеченная с микрочипа, описывает сезонное празднество, привязанное к смене годового цикла. Оно проводилось в самый темный период года, когда дневной свет был скуден, а на большей части планеты царили холода. В ответ общины украшали свои жилища и общественные места огнями, превращая долгие ночи в нечто светлое и праздничное. Они собирались, чтобы обмениваться дарами и разделять необычайно сытные яства.\n\nХотя на борту корабля-ковчега таких зим уже нет, данные показывают, как наши предки когда-то украшали теплом и светом самое темное время года."
 arkship.1210.desc.c: "Запись, судя по всему, описывает личное торжество, некогда распространенное на нашей родной планете. В записях упоминается событие, отмечавшее завершение годового жизненного цикла отдельного индивида. В этот день семья и друзья собирались, чтобы почтить индивида и прожитые им годы. Традиция, по-видимому, включала совместное принятие пищи, специально приготовленной для этого случая.\n\nХотя жизнь на борту корабля-ковчега теперь подчиняется иным ритмам, записи свидетельствуют, что наши предки когда-то ежегодно делали паузу, чтобы отпраздновать продолжение одной-единственной жизни среди множества других."
 arkship.1210.desc.d: "Восстановленный микрочип, судя по всему, описывает празднования, знаменовавшие начало нового годового цикла. Наши предки сперва очищали свои жилища. По мере приближения нового солнечного цикла общины собирались вместе, чтобы отсчитывать последние мгновения. Наступление нового цикла встречали яркими огнями, танцами и всеобщим ликованием. Участники также записывали личные планы на грядущий год — решения, призванные направлять их действия и стремление к совершенствованию в будущем.\n\nХотя жизнь на борту корабля-ковчега теперь подчиняется тщательно регулируемым циклам, а не планетарным календарям, эти данные показывают, как наши предки когда-то отмечали ход времени с неизменной надеждой на будущее."
 arkship.1210.a: "Нам есть чему поучиться."
 arkship.1210.desc.e: "Запись, извлеченная с микрочипа, описывает общественную традицию, сосредоточенную вокруг формального союза двух индивидов. Согласно записям, общины собирались, чтобы засвидетельствовать, как пара публично объявляет о своей преданности друг другу. Эти церемонии часто включали символические одеяния, произнесение клятв и присутствие семьи и друзей в качестве свидетелей.\n\nХотя партнерства на борту корабля-ковчега чаще регистрируются через административные системы, нежели через сложные ритуалы, архив указывает на то, что наши предки когда-то отмечали создание подобных союзов с немалой торжественностью."
 arkship.1210.desc.f: "Запись, восстановленная с микрочипа, описывает оживленный праздник, некогда отмечавшийся на нашей родной планете. Участники наряжались в изысканные костюмы и маски, словно перевоплощаясь в новых героев на время торжества. Данные также ссылаются на организованные шествия и украшенные платформы, движущиеся через общественные пространства, пока толпы следовали за ними, танцуя и ликуя.\n\nПразднества на борту корабля-ковчега, для сравнения, куда более сдержанны, поскольку формируются рабочими циклами и ограниченностью ресурсов. Записи наводят на мысль, что в иные времена наши предки иногда жертвовали практичностью ради излишеств и зрелищ."
 arkship.1210.desc.g: "Микрочип раскрыл запись о сезонном празднике из планетарной эпохи нашего вида. Судя по всему, он проводился в конце сезона сбора урожая, когда общины собирались, чтобы воздать благодарность за пищу, собранную в течение года. Торжество также знаменовало приближение более темной поры года, когда дневной свет оскудевал, а холода возвращались. Участники облачались в зловещие маски и костюмы, возможно, подражая воображаемым духам или отпугивая их.\n\nХотя сельскохозяйственные циклы корабля-ковчега тщательно регулируются, и у нас нет никакой нужды в подобных традициях, архив указывает на то, что когда-то наши предки отмечали смену времен года творчески, с благодарностью и толикой озорства."
 arkship.1210.desc.h: "На микрочипе была запись о нашей культуре. Она представляет традицию, посвященную поминовению ушедших. Согласно данным, общины создавали небольшие композиции, посвященные умершим родственникам и друзьям, украшая их цветами, пищей и личными вещами, связанными с усопшими. Это событие, по-видимому, не было проявлением молчаливой скорби, и казалось одновременно глубоким и торжественным.\n\nХотя за долгие годы на борту корабля-ковчега мы научились поминать мертвых по-другому, записи указывают на то, что наши предки когда-то отводили время и для скорби, и для чествования жизней тех, кто оставил свой след в душах живых."
 arkship.1210.desc.avian.reptilian: "Запись, извлеченная из микрочипа, показывает репродуктивную церемонию, некогда практиковавшуюся нашими предками. Это было собрание, во время которого первую кладку яиц представляли общине. Под пристальными взорами членов семьи и свидетелей яйца бережно помещали в заранее подготовленные гнезда. Для оформления гнезд использовались декоративные материалы и символические композиции из скорлупы. Церемония завершалась общим пиршеством в честь продолжения.\n\nПримечательно, что согласно записями, эти церемонии откладывания яиц некогда длились неделями и включали длительные ритуалы и приготовления. Для сравнения, на борту корабля-ковчега подобные вопросы решаются быстро и в частном порядке; сегодня это занимает не более нескольких часов в рамках тщательно контролируемой процедуры."
 arkship.1210.desc.fungoid.plantoid: "Запись, восстановленная из микрочипа, описывает общинную традицию, практиковавшуюся нашими предками в периоды обильного роста. В записях упоминаются собрания в густых рощах, где отдельные особи культивировали необычные и яркие плодоносящие растения, а целые колонии навещали друг друга, чтобы полюбоваться особенно впечатляющими побегами. Различные культуры высаживались вместе, создавая замысловатые живые узоры, играя оттенками цвета, текстуры и аромата. Наши предки намеренно изменяли уровень влажность, поступление питательных веществ и освещение, чтобы во время собрания вызвать появление редких или необычных цветов.\n\nЖизнь на борту ковчега оставляет мало места для столь спонтанного культивирования. Циклы роста сегодня тщательно регулируются сельскохозяйственными системами, и большинство грибковых культур оптимизированы для эффективности, а не для самовыражения."
 arkship.1210.desc.infernal: "Восстановленные записи описывают древнюю традицию, практиковавшуюся нашими предками. Архив повествует о собраниях вокруг ям с контролируемым живым пламенем, где отдельные особи намеренно подвергали себя воздействию сильного жара в качестве демонстрации стойкости и жизненной силы. Участники придавали пламени замысловатые очертания, подпитывая его редкими газами и топливом, отчего огонь окрашивался в необычные цвета. Наблюдатели пели и ликовали, а пламя вздымалось все выше, превращая событие одновременно в зрелище и общинный ритуал.\n\nНа борту корабля-ковчега открытое пламя строжайше регулируется, поскольку представляет высокий риск для инфраструктуры."
 arkship.1210.desc.mammalian: "Восстановленная запись описывает традицию, связанную с ранним развитием нашего потомства. Согласно записям, семьи собирались, когда молодая особь делала свои первые самостоятельные шаги за пределами логова. Похоже, этот момент воспринимался как малая, но значимая веха: наши предки собирали родных и друзей и готовили особые трапезы, чтобы выманить детенышей наружу.\n\nЖизнь на борту корабля-ковчега редко позволяет уделять подобное внимание отдельным этапам взросления."
 arkship.1210.desc.arthropoid: "Восстановленная из микрочипа запись описывает традицию, связанную с естественным этапом жизненного цикла наших предков. Она показывает общинные собрания в периоды, когда отдельные особи сбрасывали старые экзоскелеты. Фазы линьки часто сопровождались церемониями, а старую оболочку иногда украшали или сохраняли как символ роста и обновления. После того как старые панцири сбрасывались, особи с гордостью демонстрировали новые экзоскелеты.\n\nНа борту корабля-ковчега циклы линьки обычно проходят в контролируемых биологических отсеках, что обеспечивает безопасность и эффективность. Специально обученный персонал готов прийти на помощь в случае возможных осложнений."
 arkship.1210.desc.toxoid: "Восстановленная запись описывает традицию, практиковавшуюся нашими предками в периоды высокой насыщенности атмосферы. Индивиды собирались в специально подготовленных местах, чтобы намеренно выпускать накопленные газы и побочные химические продукты в окружающую среду. Участники соревновались в том, кто произведет самые яркие или необычные химические выбросы. Возникавшие облака создавали в воздухе переливающиеся узоры разных цветов. Зрители наблюдали за этим с огромным воодушевлением, а самые едкие выбросы часто вызывали смех у собравшейся толпы.\n\nСегодня на борту корабля-ковчега атмосферные системы строго регулируют подобные выбросы для поддержания безопасных условий среды."
 arkship.1210.desc.lithoid: "Восстановленная запись описывает яркую традицию, практиковавшуюся нашими предками. Согласно записям, большие группы собирались на открытых каменистых полях, где проходили организованные бои камнями. Участники метали друг в друга булыжники, пытаясь отколоть куски от внешних слоев противников. Мелкие обломки, отколотые в ходе столкновений, иногда собирали как памятные трофеи — символы стойкости и дружеского соперничества.\n\nНа борту корабля-ковчега подобные занятия представляли бы очевидную угрозу для инфраструктуры. Протоколы целостности корпуса настоятельно не рекомендуют метание камней, так что подобные состязания давно не практикуются."
 arkship.1210.desc.aquatic.mulluscoid: "Восстановленный микрочип описывает традицию, практиковавшуюся нашими водными предками в глубинах океанов их родного мира. Индивиды собирались, чтобы вместе опуститься в зоны, находившееся гораздо глубже их привычного ареала обитания. Эти погружения были одновременно испытанием и торжеством. На глубине им встречались причудливые геологические формирования и незнакомые, порой даже опасные формы жизни, делая спуск одновременно захватывающим и рискованным. Теми, кто сумел опуститься глубже всех, сородичи искренне восхищались.\n\nВодные среды обитания на корабле-ковчеге тщательно регулируются, а глубина ограничена инженерными параметрами. Огромное давление и бесконечная тьма древних океанов нам более недоступны."
 arkship.1215.name: "Грибковое заражение"
 arkship.1215.desc: "Недавние отчеты указывают на то, что на гидропонных палубах §Yкорабля-ковчега «[Root.GetName]»§! распространился инвазивный вид грибка. Организм, судя по всему, процветает в условиях контролируемой влажности за счет богатых питательными веществами субстратов сельскохозяйственных систем ковчега, формируя плотные мицелиальные сети на нескольких производственных ярусах.\n\nПопытки сдерживания оказались неэффективными, поскольку грибок никак не реагирует на стандартные гербициды. Мы подозреваем, что этот вид стремительно адаптировался к замкнутой экосистеме судна. Если вспышку не остановить, это может значительно снизить урожайность и создать дополнительную нагрузку на ограниченные сельскохозяйственные мощности ковчега."
 arkship.1215.a: "Выжечь грибок полностью."
 arkship.1215.b: "Изучить грибок."
 arkship.1215.c: "Попробовать установить связь."
 arkship.1220.name: "Очищающее пламя"
 arkship.1220.desc: "Поскольку традиционные методы не дали результата, зараженные гидропонные ярусы подверглись контролируемому выжиганию. К несчастью, в процессе была утрачена значительная часть плодоносных растений. Целые грядки обратились в пепел вместе с заразой, временно оставив несколько сельскохозяйственных секций бесплодными.\n\nТем не менее, операция, судя по всему, завершилась успешно. Стерилизация всех спороносных поверхностей и полная очистка уцелевшей инфраструктуры уничтожили грибок в экосистеме навсегда. Этот случай поможет нам подготовиться к появлению любых других инвазивных видов, которые в будущем могут обосноваться на ковчеге."
 arkship.1220.a: "Так им и надо."
 arkship.1225.name: "Мицелиальный разум"
 arkship.1225.desc: "Инвазивный вид на §Yкорабле-ковчеге «[Root.GetName]»§! связан обширной мицелиальной сетью, способной быстро изолировать отдельные сегменты и жертвовать ими. Всякий раз, когда мы пытались извлечь живые образцы, окружающие наросты мгновенно увядали, а питательные вещества, по-видимому, перенаправлялись через сеть, чтобы подпитать новые очаги роста в других частях гидропонных палуб.\n\nПосле многочисленных неудач нам наконец удалось изолировать достаточно стабильный образец для контролируемого наблюдения. Грибок обладает необычайно эффективной системой перераспределения питательных веществ, которая может найти применение в замкнутых экологических средах, подобных тем, что существуют на борту ковчега. Возможно, он даже копирует наши собственные распределительные системы."
 arkship.1225.a: "Примечательный вид."
 arkship.1225.b: "Приспособить его для наших нужд."
 arkship.1230.name: "Биохимическое преобразование"
 arkship.1230.desc: "Дальнейшие эксперименты с грибком выявили необычную химическую реакцию. При воздействии определенных соединений организм начинает стремительно производить и выделять характерную смесь газообразных побочных продуктов. Мы поняли, что эти испарения можно собирать и очищать.\n\nГрибок, по сути, преобразует простые химические реагенты в постоянный поток летучих соединений — неожиданный, но потенциально полезный процесс. Культивируя этот грибок в камерах с контролируемыми условиями, мы сможем перепрофилировать его в маломасштабную систему биохимической переработки."
 arkship.1230.a: "Неожиданная находка."
 arkship.1235.name: "Общие корни"
 arkship.1235.desc: "Более пристальное наблюдение за грибком выявило закономерности, предполагающие наличие некой формы биологических сигналов внутри его обширной мицелиальной сети. Представители большинства видов не придали бы этому значения, но особенности нашего организма позволяют нам считывать этот едва уловимый обмен и подстраиваться под него.\n\nПосылая выверенные биохимические сигналы, мы установили некое подобие диалога с организмом. После этого он начал перераспределять питательные вещества через свои сети и защищать посевы от вредоносных микробов. Вскоре мы осознали, что первоначальное вторжение обернулось важным симбиозом с иной формой жизни, поселившейся в наших садах."
 arkship.1235.a: "Неожиданный симбиоз."
 fungal_contamination_chain_title: "$arkship.1215.name$"
 fungal_contamination_chain_desc: "Недавние отчеты указывают на то, что на гидропонных палубах §Yкорабля-ковчега «[Root.GetName]»§! распространился инвазивный вид грибка, который не поддается сдерживанию и угрожает производству пищи."
 ARKSHIP_FUNGAL_CONTAMINATION_PROJECT: "$arkship.1215.name$"
 ARKSHIP_FUNGAL_CONTAMINATION_PROJECT_DESC: "Инвазивный вид грибка, распространившийся на гидропонных палубах §Yкорабля-ковчега «[Root.GetName]»§!, быстро приспособился к контролируемой экосистеме. Если его игнорировать, плотная мицелиальная сеть может значительно сократить производство пищи."
 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT: "Установление контакта"
 ARKSHIP_FUNGAL_COMMUNICATION_PROJECT_DESC: "Мы попытаемся пообщаться с инвазивным видом грибка, распространившимся на гидропонных палубах §Yкорабля-ковчега «[Root.GetName]»§!. Если его игнорировать, плотная мицелиальная сеть может значительно сократить производство пищи."
 #Unknown Resource Usage
 arkship.1240.name: "Неучтенное потребление ресурсов"
 arkship.1240.desc: "В ходе ежемесячной инвентаризации мы обнаружили устойчивое расхождение в системах ресурсов §Yкорабля-ковчега «[Root.GetName]»§!. Небольшие объемы электроэнергии, товаров массового спроса и прочих припасов расходуются в количествах, превышающих зарегистрированные показатели. Эксперты предполагают утечку, неисправность или незначительное расхождение в числах.\n\nПосле дальнейшего расследования результаты остаются неубедительными. Никаких утечек, никаких неисправностей, никакой неэффективности сверх допустимых пределов. И все же числа не лгут: ресурсы продолжают исчезать из системы без видимых причин. Что-то на борту корабля-ковчега потребляет наши ресурсы."
 arkship.1240.a: "Провести расследование."
 arkship.1240.b: "Скорее всего, опасаться нечего."
 arkship.1245.name: "Неучтенное поколение"
 arkship.1245.desc: "В ненаблюдаемом секторе ковчега мы обнаружили группу молодых особей, живущих вне официальных систем. Перенаправляя потоки энергии, воздуха и пищи, они создали собственное пространство — экспериментируя, видоизменяя окружение и выражая себя вне всякого надзора.\n\nИсследования показывают, что это естественный этап взросления. Особи явно были удивлены начатым нами расследованием и вели себя непокорно. Они утверждали, что заимствовали лишь малые объемы, и достаточно осторожно, чтобы избежать немедленного обнаружения. Бунтовщики ясно дали понять, что не намерены отказываться от этого пространства, и желают, чтобы их оставили в покое."
 arkship.1245.a: "Уничтожить их гнездо."
 arkship.1245.b: "Позволить им самовыражаться."
 arkship.1250.name: "Устаревшие процессы"
 arkship.1250.desc: "В забытом техническом секторе следователи обнаружили скопление устаревших рабочих единиц, все еще действующих согласно древним директивам. Их алгоритмы, судя по всему, возникли до нескольких системных обновлений, из-за чего они функционируют вне текущих протоколов учета, потребляя при этом лишь незначительное количество ресурсов для работы.\n\nДальнейшая проверка выявила результат их непрерывной деятельности: значительный запас очищенных сплавов, тщательно переработанных и складированных за множество циклов. Единицы незаметно собирали и оптимизировали ресурсы в объемах, далеко превосходящих любые текущие эксплуатационные потребности."
 arkship.1250.a: "$arkship.1245.a$"
 arkship.1250.b: "Оставить их работать и забрать ресурсы."
 arkship.1255.name: "Оздоровительная база"
 arkship.1255.desc: "В уединенной секции корабля-ковчега мы раскрыли тайный оздоровительный комплекс, действующий вне официальных систем. Перенаправленная энергия, товары массового спроса товары и вода идут на поддержание этой контролируемой среды, предназначенной для отдыха и восстановления сил.\n\nСобравшиеся там не слишком расстроились из-за того, что их обнаружили. Они объяснили, что это место было создано для жизни вне вечной гонки за продуктивностью и показушной эффективностью — как способ сбежать от рутины корабельных будней. Пусть корабль-ковчег и был призван удовлетворять все потребности, некоторым все еще не хватает места, предназначенного исключительно для отдыха."
 arkship.1255.a: "$arkship.1245.a$"
 arkship.1255.b: "Позволить им мирно отдыхать."
 arkship.1260.name: "Неучтенное собрание"
 arkship.1260.desc: "В тихой секции корабля-ковчега мы обнаружили неофициальное сообщество, собирающееся через регулярные промежутки времени. Небольшое количество перенаправленных ресурсов Для обеспечения этих встреч использовалось небольшое количество перенаправленных ресурсов.\n\nУчастники пояснили, что собираются для неформального обмена знаниями об образцах, собранных в ходе заготовительных операций ковчега, — минералах, фрагментах руды и кристаллических образованиях, добытых в разведанных нами системах. Участники изучали и обсуждали свои находки, сравнивали составы и спорили об их происхождении."
 arkship.1260.a: "$arkship.1245.a$"
 arkship.1260.b: "Оставить их наедине с их увлечениями."
 arkship.1265.name: "Тайник на черный день"
 arkship.1265.desc: "В запечатанном складском отсеке мы обнаружили частный тайник с припасами: товары массового спроса, воздушные баллоны и энергоячейки, которые не числились в официальных системах учета.\n\nОтветственных быстро нашли, и они предложили простое объяснение: подготовка. По их словам, в системе, где выживание целиком основано на стабильности, было бы безответственно полагать, что эта стабильность гарантирована навечно. Масштаб тайника предполагает долгосрочное планирование, далеко выходящее за рамки личного пользования. Не все на борту ковчега уверены, что он просуществует вечно."
 arkship.1265.a: "Конфисковать припасы и прекратить эту ерунду."
 arkship.1265.b: "Оставить их в покое."
 arkship.1270.name: "Полная рекультивация"
 arkship.1270.desc: "В запечатанном перерабатывающем секторе следователи обнаружили незарегистрированную систему рекультивации, предназначенную для преобразования биологических останков в пригодные для использования материалы. Система работала непрерывно, хотя проектировалась как аварийная.\n\nПри всей своей эффективности, этот процесс крайне ресурсозатратен. Колоссальные объемы энергии, катализаторов и реагентов уходят на то, чтобы разложить, стерилизовать и переработать органику в унифицированные компоненты для нужд корабля. Ничто на ковчеге не должно пропадать зря. Даже мертвые."
 arkship.1270.a: "Уничтожить этот приют мертвецов."
 arkship.1270.b: "Практично. Пусть продолжают."
 arkship.1275.name: "За пределами системы"
 arkship.1275.desc: "В поисках исчезающих ресурсов мы обнаружили заброшенный сектор ковчега. Выяснилось, что там обосновалась небольшая изолированная община. Их прибежище было крайне скромным; жизнь в нем поддерживалась за счет ресурсов, которые они отводили из общих сетей в очень небольших количествах, чтобы избежать обнаружения.\n\nТем не менее им удалось создать стабильное и хорошо адаптированное под их потребности пространство. Очевидно, что это осознанный выбор. Они не оказали сопротивления, и вместо этого попросили позволить им объясниться."
 arkship.1275.a: "Выслушаем их."
 arkship.1275.b: "Изгнать их с корабля-ковчега."
 arkship.1275.c: "Такое поведение недопустимо. Уничтожить их."
 arkship.1280.name: "Иной образ жизни"
 arkship.1280.desc: "Эта группа открыто рассказала о своем решении. Они не отвергали сам Ковчег, но их не устраивало то, как изменилась жизнь на нем. По их мнению, всё стало слишком оптимизированным: каждый шаг измерялся, каждый ресурс отслеживался, и каждая минута была на счету.\n\nОни описали иной подход к функционированию ковчега. Они ценили свободу выбора без постоянного надзора. Пусть их жизнь менее эффективна, зато более полноценна. Теперь в руководстве решают, может ли существование подобных групп отрицательно сказываться на сплоченности коллектива — или это необходимое выражение индивидуальности в замкнутой системе."
 arkship.1280.a: "Принудительно вернуть их в общество."
 arkship.1280.b: "Им не место на нашем корабле-ковчеге."
 arkship.1280.c: "Оставить их в покое, но мы будем за ними присматривать."
 UNKNOWN_RESOURCE_USAGE_PROJECT: "Расследование о ресурсах"
 UNKNOWN_RESOURCE_USAGE_PROJECT_DESC: "Мы должны разобраться, куда пропадают наши ресурсы."
 unknown_resource_usage_chain_title: "Неучтенное потребление ресурсов"
 unknown_resource_usage_chain_desc: "Ресурсы на борту корабля-ковчега пропадают без видимой причины. Кто-то потребляет их сверх учтенных значений. Нужно провести расследование."
