 concept_artificial_colonies: "Искусственные миры"
 concept_artificial_colony: "Искусственный мир"
 concept_artificial_colonies_desc: "Эти массивные обитаемые сооружения, парящие в космосе — не природный феномен, а творение цивилизации. \n\n§EВ число искусственных миров входят:§!\n• $pc_habitat$\n• $pc_ringworld_habitable$\n• $pc_ark$"
 concept_nomad_traits: "Признаки кочевников"
 concept_nomad_trait: "Признак кочевников"
 concept_nomad_traits_desc: "§HОрганики:§!\n• ['trait:trait_photoadaptive']\n• ['trait:trait_recursive_learners']\n• ['trait:trait_reavers']\n• ['trait:trait_terraphobic']\n§HМашины:§!\n• ['trait:trait_solar_cells']\n• ['trait:trait_structural_awareness']\n• ['trait:trait_interconnected']\n• ['trait:trait_defence_drones']"
 concept_waystation_tribute: "Дань"
 concept_waystation_tribute_desc: "Дань — ежемесячная выплата в размере определённой доли производства каждой подданной колонии. В качестве дани выплачиваются следующие ресурсы:$TABBED_NEW_LINE$• $r_energy$$TABBED_NEW_LINE$• $r_minerals$$TABBED_NEW_LINE$• $r_food$$TABBED_NEW_LINE$• $r_alloys$$TABBED_NEW_LINE$• $r_consumer_goods$$TABBED_NEW_LINE$• $r_rare_crystals$$TABBED_NEW_LINE$• $r_exotic_gases$$TABBED_NEW_LINE$• $r_volatile_motes$"
 # Star Luminosity
 concept_star_luminosity: "$climate_luminosity$"
 concept_star_luminosity_desc: "Светимость показывает интенсивность излучения звезды. Она влияет на классификацию звезды, температуру системы и ее потенциальную приспособленность к жизни.\n\n§E$luminosity_0$§! \n• $pc_black_hole$ \n• $pc_t_star$ \n• $pc_protostar$ \n\n§E$luminosity_1$§! \n• $pc_m_star$ \n• $pc_m_giant_star$ \n\n§E$luminosity_2$§! \n• $pc_g_star$ \n• $pc_k_star$ \n\n§E$luminosity_3$§! \n• $pc_b_star$ \n• $pc_a_star$ \n• $pc_f_star$ \n\n§E$luminosity_4$§! \n• $pc_neutron_star$ \n• $pc_pulsar$"
 climate_luminosity: "Светимость"
 luminosity: "§Y(Светящаяся)§!"
 luminosity_0: "Светимость: §Yминимальная§!"
 luminosity_1: "Светимость: §Yслабая§!"
 luminosity_2: "Светимость: §Yумеренная§!"
 luminosity_3: "Светимость: §Yсильная§!"
 luminosity_4: "Светимость: §Yинтенсивная§!"
 # Traits
 trait_photoadaptive: "Фотоадаптация"
 trait_photoadaptive_desc: "Эта раса чутко реагирует на звездный свет: биологическое строение ее представителей едва заметно изменяется в зависимости от светимости звезд, мимо которых пролегает их путь."
 trait_solar_cells: "Солнечные батареи"
 trait_solar_cells_desc: "Эта раса разработала специализированные солнечные батареи, способные поглощать различные виды звездного излучения. Каждый звездный класс дает ее представителям уникальные преимущества."
 concept_trait_photoadaptive_stars: "Классы звезд"
 concept_trait_photoadaptive_stars_desc: "Некоторые расы получают модификатор к эффективности работы за должности рабочих и дронов-чернорабочих в зависимости от ['concept_star_luminosity', светимости] звезд. \n\n• Пульсары или нейтронные звезды: §G+15%§! \n• Звезды класса B, A или F: §G+10%§! \n• Звезды класса G или K: §G+5%§! \n• Звезды класса M: §R-5%§! \n• Коричневые карлики, протозвезды или черные дыры: §R-15%§!"
 trait_photoadaptive_effects: "$MOD_POP_BONUS_WORKFORCE_MULT$ от ['concept_trait_photoadaptive_stars', класса звезд]: $TABBED_NEW_LINE$$t$• $pop_cat_worker_plural$ и $pop_cat_simple_drone_plural$: от §R-15%§! до §G+15%§! $TABBED_NEW_LINE$$t$• §Y$pc_black_hole_plural$§! для должностей физиков: §G+15%§! $TABBED_NEW_LINE$$t$• §Y$pc_m_star_plural$§! для должностей инженеров: §G+15%§!"
 trait_recursive_learners: "Рекурсивное обучение"
 trait_recursive_learners_desc: "Корабль-ковчег — родной дом этой расы. Ее представители поколение за поколением совершенствуют полученные от предков знания, чтобы справляться с трудностями жизни на ковчеге."
 trait_structural_awareness: "Структурная осведомленность"
 trait_structural_awareness_desc: "Эти машины специально разработаны для существования на корабле-ковчеге. Они беспрерывно фиксируют состояние корабля и связанные с его поддержанием процедуры — те могут отличаться в зависимости от конструкции, поэтому машины постоянно оптимизируют свое поведение, подстраиваясь под каждый корабль."
 trait_recursive_learners_effects: "$MOD_POP_BONUS_WORKFORCE_MULT$: §G+1,25%§! за £district£ §Yрайон§! (до §G+25%§!) в зависимости от класса корабля-ковчега.$TABBED_NEW_LINE$• §Y$civilian_arkship_name_plural$:§! эффективность работы ['concept_planet_metallurgists', металлургов], ['concept_planet_artisans', ремесленников] и астродобытчиков$TABBED_NEW_LINE$• §Y$science_arkship_name_plural$:§! эффективность работы ['concept_planet_researchers', исследователей]$TABBED_NEW_LINE$• §Y$military_arkship_name_plural$:§! эффективность работы ['concept_planet_engineers', инженеров] и ['concept_planet_soldiers', солдат]"
 trait_interconnected: "Взаимная связь"
 trait_interconnected_desc: "С течением времени границы между кораблем-ковчегом и его обитателями постепенно стерлись. Системы корабля стали продолжением органов населения, а они, в свою очередь, превратились в функциональный элемент его конструкции."
 trait_interconnected_effects: "На кораблях-ковчегах: $TABBED_NEW_LINE$$t$• $mod_planet_pops_robotics_upkeep_mult$: от §G-15%§! до §R+5%§!$TABBED_NEW_LINE$$t$• $MOD_POP_AMENITIES_USAGE_MULT$: от §G-10%§! до §Y0%§!$TABBED_NEW_LINE$• Эффект пропорционален количеству £pop£ §Hпоселений§! с этим признаком, имеющихся в колонии."
 trait_reavers: "Разбойник"
 trait_reavers_desc: "Эволюцию этой расы направляло соперничество, а не сотрудничество. Любой контакт между ними — это состязание воли, в котором побеждает самый коварный и безжалостный."
 trait_reavers_effects: "£commander£ §Y$commander_plural$§! начинают с чертой ['leader_trait:leader_trait_plunderer'], если у них нет принципов §Y$ethic_xenophile$§! или §Y$ethic_pacifist$§!"
 leader_trait_plunderer: "Мародер"
 leader_trait_plunderer_desc: "К чему обломкам вражеских кораблей ржаветь попусту? Предприимчивый адмирал умеет получить выгоду даже из кучи хлама."
 leader_trait_plunderer_2: "$leader_trait_plunderer$ II"
 leader_trait_plunderer_2_desc: "$leader_trait_plunderer_desc$"
 leader_trait_plunderer_effects: "$FLEET_EFFECTS_TXT$:\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_consumer_goods$ или $r_trade$: §G+$@trait_plunderer_amt|0$§!$PER_5_NAVAL_CAP_TXT$"
 leader_trait_plunderer_2_effects: "$FLEET_EFFECTS_TXT$:\n$t$$EVERY_ENEMY_SHIP_DESTROYED_TXT$:\n$tt$$r_consumer_goods$ или $r_trade$: §G+$@trait_plunderer_2_amt|0$§!$PER_5_NAVAL_CAP_TXT$"
 trait_defence_drones: "Боевая синхронизация"
 trait_defence_drones_desc: "Каждый модуль — одновременно и инженер, и воин. Во время войны синхронизированные протоколы помогают поддерживать стабильность и оберегают важные системы от поломок и сбоев."
 trait_defence_drones_effects: "Во время войны или кризиса: Каждые $pop_group_unit$ £pop£ §Hпоселений§! с этим признаком добавляют §G+$@defence_drones_stability$§! к £stability£ стабильности колонии (до §G+15§!) $TABBED_NEW_LINE$• Эффект действует только в ['concept_artificial_colonies', искусственных мирах]"
 trait_terraphobic: "Террафобия"
 trait_terraphobic_desc: "Эта раса полностью адаптировалась к жизни в искусственной среде, и естественная обстановка планет доставляет ее представителям сильнейший дискомфорт. Гравитация, атмосфера, рельеф — все эти факторы постоянно испытывают на прочность их хрупкую биологию."
 trait_terraphobic_effects: "В мирах, не являющихся ['concept_artificial_colonies', искусственными]: \n$tt$• $MOD_POP_BONUS_WORKFORCE_MULT$: §R-15%§! \n$tt$• $MOD_POP_AMENITIES_USAGE_MULT$: §R+15%§!"
 opinion_head_of_zarqlan_nomad: "Наследники Зарклана"
 effect_random_starbase_in_system: "Случайная космическая база в системе"
 effect_every_starbase_in_system: "Каждая космическая база в системе"
 policy_nomad_border_policy: "Открытость границ для кочевников"
 nomad_border_policy_open: "Разрешено"
 nomad_border_policy_open_desc: "Кочевники могут свободно пересекать наши системы, как и подобает странникам."
 nomad_border_policy_closed: "Запрещено"
 nomad_border_policy_closed_desc: "Посягательства кочевников на нашу суверенную территорию приведут к дипломатическим последствиям."
 nomad_border_policy_open_name: "Разрешено"
 nomad_border_policy_closed_name: "Запрещено"
 policy_nomad_border_policy_desc: "Политика нашего государства в отношении кочевников на его территории"
 policy_nomad_deterrence: "Сдерживание кочевников"
 policy_nomad_deterrence_desc: "Поведение наших сил по отношению к выведенному из строя в бою, но неповреждённому кораблю-ковчегу."
 nomad_deterrence_do_no_harm: "Милость"
 nomad_deterrence_do_no_harm_desc: "Выведенный из строя корабль-ковчег и его экипаж остаются целы. Сострадание ничего не стоит, а его плоды могут оказаться полезны."
 nomad_deterrence_do_no_harm_name: "Милость"
 arkship_raid_do_no_harm_name: "Милость"
 nomad_deterrence_relocate_pops: "Набор населения"
 nomad_deterrence_relocate_pops_desc: "Мы извлекаем из обломков корабля-ковчега четверть его обитателей и переселяем их в столицу, где они будет жить и трудиться под нашей властью."
 nomad_deterrence_relocate_pops_name: "Набор населения"
 arkship_raid_relocate_pops_name: "Набор населения"
 nomad_deterrence_purge_pops: "Казнь населения"
 nomad_deterrence_purge_pops_desc: "Мы уничтожаем четверть населения корабля-ковчега в назидание тем, кто осмелится нарушить наши границы."
 nomad_deterrence_purge_pops_name: "Казнь населения"
 arkship_raid_purge_pops_name: "Казнь населения"
 nomad_deterrence_strip_districts: "Разбор на части"
 nomad_deterrence_strip_districts_desc: "Мы разбираем на части и отвозим на верфи четверть выведенных из строя районов корабля-ковчега, получая при этом сплавы."
 nomad_deterrence_strip_districts_name: "Разбор на части"
 arkship_raid_strip_districts_name: "Разбор на части"
 opinion_arkship_raid_purge_pops_known: "Политика: уничтожение экипажей кораблей-ковчегов"
 opinion_arkship_raid_relocate_pops_known: "Политика: порабощение экипажей кораблей-ковчегов"
 opinion_arkship_raid_strip_districts_known: "Политика: разграбление кораблей-ковчегов"
