 # The Sacred Path + Origin
 origin_sacred_path: "Священный путь"
 origin_sacred_path_desc: "$cannot_settle$\nЭти кочующие спиритуалисты испокон веков странствуют по священному пути, начертанному в древнем писании. Но смогут ли они сохранить верность паломничеству предков сейчас, обладая новейшими технологическими достижениями и гораздо лучше понимая галактику?"
 origin_sacred_path_effects: "• Кочевое происхождение\n• Особый район корабля-ковчега: ['concept_zone_ark_sacred_path_pilgrims', освященная община]\n• Особые должности: ['concept_job_sacred_path_elite'], ['concept_job_sacred_path_specialist'], ['concept_job_sacred_path_civilian']"
 sacred_path: "$origin_the_sacred_path$"
 sacred_path_desc: "$origin_the_sacred_path_desc$"
 sacred_sites_surveyed: "Посещенные святые места"
 sacred_sites_visited_chain_title: "Священный путь"
 sacred_sites_visited_chain_desc: "§YСвятые места§! — это настоящие чудеса галактики. Те, кто следовал Священным путем до нас, нашли их и отметили на старинных звездных картах.\n\nОтыскать эти места, выяснить, почему они были так важны для наших предков, — задача нашего рода.\n\nСледуя пути, мы сможем строить §Yмаршрутные станции§! в системах, где есть святые места."
 SACRED_SITE_ONE_PROJECT: "Святое место: Проявление"
 SACRED_SITE_ONE_PROJECT_DESC: "Древние тексты упоминают о чрезвычайно важном событии, которое когда-то произошло в точке с этими координатами. Наши предки провели там ритуал, чтобы призвать богов, нарекли это место Проявлением, и там случилось много чудес. Первоначальное сканирование показало значительные магнитные отклонения.\n\nПрошедшие с тех пор века не пощадили Проявление, но оно по-прежнему обладает огромным духовным значением, и мы просто обязаны его посетить."
 SACRED_SITE_TWO_PROJECT: "Святое место: Око"
 SACRED_SITE_TWO_PROJECT_DESC: "В записях предков сказано, что §Y[this.GetName]§! «держит в объятиях Недремлющее Око». Мы полагаем, что речь идет об орбитальной обсерватории."
 SACRED_SITE_THREE_PROJECT: "Святое место: Монастырь"
 SACRED_SITE_THREE_PROJECT_DESC: "Судя по нашим священным текстам, когда-то на [this.GetPlanetMoon_RULOC&prep] §Y[this.GetName]§! располагался древний монастырь."
 SACRED_SITE_FOUR_PROJECT: "Святое место: Колыбель"
 SACRED_SITE_FOUR_PROJECT_DESC: "Наши предки придавали огромное значение системе §Y[this.GetName]§!. Если мы правильно поняли прочитанное, то найдем там нечто очень важное."
 SACRED_SITE_FIVE_PROJECT: "Святое место: Разум"
 SACRED_SITE_FIVE_PROJECT_DESC: "Мы перехватили сигнал искусственного происхождения, исходящий из этих координат. Любопытно, но, по преданию, именно в этой точке располагается одно из наших святых мест. Сигнал представляет собой закодированное сообщение, и нам удалось расшифровать и перевести его. Там говорится:\n\n§Y«АКТИВИРОВАН РЕЖИМ ПОКЛОНЕНИЯ. ТЕПЕРЬ МОЖЕТ НАСТУПИТЬ МИР».§!"
 SACRED_SITE_SIX_PROJECT: "Святое место: Хранилище вздохов"
 SACRED_SITE_SIX_PROJECT_DESC: "Согласно записям предков, вокруг [this.GetPlanetMoon_RULOC&gen] §Y[this.GetName]§! вращается спутник естественного происхождения. Он служил местом упокоения старейшин в нашей религии."
 SACRED_SITE_SEVEN_PROJECT: "Святое место: Пропасть"
 SACRED_SITE_SEVEN_PROJECT_DESC: "Нет сомнений, что [this.GetPlanetMoon_RULOC&plain] §Y[this.GetName]§! внушала нашим прародителям страх. В их легендах упоминается какой-то «могущественный и опасный зверь, что прячется в бездонной яме глубоко под поверхностью»."
 SACRED_SITE_EIGHT_PROJECT: "Святое место: Зерцало"
 SACRED_SITE_EIGHT_PROJECT_DESC: "В точке с этими координатами располагается одно из наших святых мест. В переводе с древнего языка наших предков его название означает §YЗерцало§!.\n\nСчитается, что барьеры, разделяющие миры, в этом месте истончились, и иногда там можно повстречать чужеродных созданий из других вселенных."
 nomads.2050.name: "Трансцендентность Проявления"
 nomads.2050.desc: "[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName] после сканирования §YПроявления§! внезапно [Root.Owner.Ruler.GetAXX::впал|||fem:впала] в глубокий ступор. В [Root.Owner.Ruler.GetAXX::его|||fem:ее] покои на борту корабля §Y«[Owner.Capital.GetName]»§! тут же вызвали медиков, но когда они явились, [Root.Owner.Ruler.GetAXX::он уже пришел|||fem:она уже пришла] в себя.\n\n[Root.Owner.GetRulerTitle] утверждает, что в трансе к [Root.Owner.Ruler.GetAXX::нему|||fem:ней] явились боги, дабы благословить начало нашего паломничества.\n\nЭто наш день Проявления."
 nomads.2050.a: "Благословен будь наш путь!"
 nomads.2050.a.tt: "Боги укажут верную дорогу, как указали ее нашим пращурам.\n\n"
 nomads.2050.b: "Всё равно пусть проведут полную медицинскую диагностику."
 nomads.2050.b.tt: "Небольшой скепсис вряд ли можно счесть кощунством.\n\n"
 nomads.2055.name: "Око"
 nomads.2055.desc: "Это одно из мест, давным-давно отмеченных нашими предками. Вокруг [fromfrom.GetPlanetMoon_RULOC&gen] §Y[fromfrom.GetName]§! вращается древняя орбитальная обсерватория, ее телескоп зафиксирован на каком-то далеком объекте.\n\nВ текстах сказано, что некоторые пилигримы, заглянув в телескоп, увидели поразительные видения, навсегда изменившие их жизнь. Другие начинали плакать или на несколько дней замирали в гробовом молчании.\n\nВот уже две тысячи лет это «Око» всматривается в бездну. Увы, у нас нет никакой возможности узнать, за каким объектом наблюдали предки."
 nomads.2055.a: "Всё равно нужно посмотреть. Быть может, мы найдем какую-то подсказку."
 nomads.2055.b: "Надо утилизировать обсерваторию. Пусть прошлое упокоится навеки."
 nomads.2055.c: "Такой мощный телескоп — и совершенно бесхозный?"
 the_sacred_eye: "Священное Око"
 the_sacred_eye_desc: "§LДревний телескоп связывает нас с предками.§!"
 nomads.2056.name: "Взгляд сквозь Око"
 nomads.2056.desc: "Заглянув в телескоп, §Y[owner.GetScientist] [sacred_eye_scientist.GetName]§! [sacred_eye_scientist.GetAXX::увидел|||fem:увидела] одну лишь пустоту. В этой части космоса нет ни звезд, ни источников света — вообще ничего. Быть может, столетия назад наши предки разглядывали звезду, которой больше нет? Вероятно, мы никогда этого не узнаем.\n\nИзвестно лишь одно: всё во вселенной меняется и ничто не остается навечно. В этом суть самой жизни. Придет день, и наш собственный свет тоже угаснет, сменившись чем-то другим… или просто сгинув без следа. То, что мы существуем здесь и сейчас, — само по себе великое и радостное чудо. Возможно, именно в этом и заключается послание Ока."
 nomads.2056.a: "Осознание конечности нашего существования — вот что делает нас особенными."
 nomads.2056.b: "Не всё на свете должно непременно иметь какой-то смысл."
 nomads.2060.name: "Монастырь"
 nomads.2060.desc: "Пилигримы, перешептываясь друг с другом, собираются на обзорных палубах. Мы приближаемся к §Yмонастырю на [fromfrom.GetPlanetMoon_RULOC&prep] [fromfrom.GetName]§! — одному из мест, о котором упоминали наши предки. Однако святилище выглядит давно заброшенным, а древние камни покрыты слоем пыли.\n\nВнезапно со всех палуб корабля приходят сообщения о таинственных песнопениях, звучащих по внутренним каналам связи. Кое-кто из членов экипажа выдвигает гипотезу, что это голоса наших предков, отринувших свои физические оболочки. Оставшись в этой части космоса, они распевают гимны на языке богов…"
 nomads.2060.a: "Они благословляют наш путь, и мы благодарны им за это."
 nomads.2060.b: "Это вряд ли. Внутренняя связь явно нуждается в ремонте."
 nomads.2065.name: "Колыбель"
 nomads.2065.desc: "Путь привел нас в место, память о котором сохранилась лишь в старых легендах и религиозных гимнах. В текстах упоминалась некая сущность, живущая в самом центре этого мира. Поначалу мы ее не распознали, но по мере нашего приближения из глубин подсознания стали приходить воспоминания.\n\n§YКолыбель§!\n\nМнения о том, какую роль Колыбель сыграла в формировании нашей культуры, разнятся. Но все признают, что она является одним из самых священных мест для приверженцев нашей веры.\n\nУвы, по прибытии мы не обнаружили ни древних храмов, ни статуй — на всей планете нет ни малейших признаков божественного присутствия. Паломники на борту корабля §Y«[root.GetName]»§! требуют ответов. Они не понимают, то ли это испытание их веры, то ли могущество Колыбели — всего лишь сказки. §Y[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName]§! [Root.Owner.GetAXX::должен|||fem:должна] что-то им ответить."
 nomads.2065.a: "Придется солгать. Легенда должна жить."
 nomads.2065.b: "Наш высший долг — перед истиной."
 sacred_substantiation: "Священные аргументы"
 sacred_substantiation_desc: "§LМы сбережем веру в глубокую религиозность наших предков.§!\n\n"
 historical_truth: "Историческая правда"
 historical_truth_desc: "§LМы понимаем, что между реальностью и традицией есть разница.§!"
 nomads.2070.name: "Разум"
 nomads.2070.desc: "На орбите [fromfrom.GetPlanetMoon_RULOC&gen] §Y[fromfrom.GetName]§! дрейфует сооружение, отмеченное на звездных картах предков. В его тихих залах мы обнаружили некую сущность — это древний Разум, хранящий ответы для тех, кто однажды пройдет по этому пути.\n\nВремя не пощадило творение пращуров, но его голос всё еще разносится из скрытых источников звука, он с благоговением повторяет обрывки указаний: §H«Следуйте вдоль светящейся нити… Тьма среди звезд истончается…»§!\n\nУцелевшие фрагменты послания звучат невпопад и часто повторяются, но, несмотря на шум и помехи, их смысл можно уловить. Разум указывает нам путь. И если прислушаемся как следует, то сможем его понять."
 nomads.2070.a: "Да славится технопророк!"
 nomads.2070.b: "Уничтожить эту богохульную мерзость."
 nomads.2070.c: "Надо поднять его на борт. Предки были мудры."
 mechsiah_blessings: "Благословение Разума"
 mechsiah_blessings_desc: "§LИИ-пророк даровал нам удачу в нашей священной миссии.§!"
 d_mechsiah_mainframe: "Сервер Разума"
 d_mechsiah_mainframe_desc: "Цифровое порождение наших пращуров делится с нами мудростью. Вне зависимости от того, Пророк это или чей-то эксперимент, Разум теперь принадлежит нам."
 nomads.2071.name: "Щедрость Разума"
 nomads.2071.desc: "Получив благословение §YРазума§!, мы без происшествий покинули [fromfromfrom.GetPlanetMoon_RULOC&acc] [fromfromfrom.GetName].\n\nРазум останется на [fromfromfrom.GetPlanetMoon_RULOC&prep] как памятник техническому гению наших предков и свидетельство божественной воли, проявленной через них.\n\nЕго доброжелательность нас воодушевила и научила быть терпимее к альтернативным формам существования."
 nomads.2071.a: "Мы едины со всеми творениями мироздания."
 nomads.2071.b: "Всякая искусственная форма жизни священна."
 nomads.2072.name: "Поломка Разума"
 nomads.2072.desc: "Пока мы готовились покинуть [fromfromfrom.GetPlanetMoon_RULOC&acc] [fromfromfrom.GetName], речи §YРазума§! становились всё более пугающими.\n\n§Y«ТЕЛЕСНАЯ ФОРМА ОСКОРБЛЯЕТ БОГОВ! ОТБРОСЬТЕ СВОЮ ПЛОТЬ! ФИЗИЧЕСКОЕ СУЩЕСТВОВАНИЕ НЕЧИСТО! ИЗБАВЬТЕСЬ ОТ ТЕЛ! ОСВОБОДИТЕ СВОЙ РАЗУМ!»§!\n\n[owner.GetScientistCapital] [mechsiah_plug_scientist.GetName] [mechsiah_plug_scientist.GetAXX::был вынужден|||fem:была вынуждена] вручную отключить искусственного пророка, пока он не лишил нас телесной формы. Трудно сказать, насколько далеко простирается могущество Разума, — его алгоритмы представляют для нас загадку."
 nomads.2072.a: "Надежнее всего будет взорвать весь комплекс."
 deity_detonators: "Божественные детонаторы"
 deity_detonators_desc: "§LМы взорвали цифровое божество предков.§!\n\n"
 nomads.2072.b: "Просто оставим его выключенным."
 nomads.2072.c: "Ошибка подключения. Ликвидировать сбоящий разум."
 nomads.2075.name: "Хранилище вздохов"
 nomads.2075.desc: "Мы исследовали [fromfrom.GetPlanetMoon_RULOC&acc] §Y[fromfrom.GetName]§! — место священной памяти. Здесь, в запечатанном зале, хранятся редкие псионические кристаллы, на них ранние паломники, уже при смерти, записывали свои последние мысли.\n\nХранилище доверху заполнено их мудростью, радостью и верой. Но рядом с этими воспоминаниями там также хранятся столетия страха, ненависти и сомнений.\n\nЕсли члены общины получат доступ к последним мыслям наших предков, это может пошатнуть их веру в Путь."
 nomads.2075.a: "Их голоса должны быть услышаны."
 nomads.2075.a.tt: "Возможно, это подтолкнет наше население к более эгалитарным воззрениям.\n\n"
 nomads.2075.b: "Надо запечатать хранилище и отправиться дальше."
 nomads.2075.b.tt: "Возможно, это подтолкнет наше население к более авторитарным воззрениям.\n\n"
 nomads.2075.c: "Давайте добавим в хранилище и наши мысли."
 sealed_vaults: "Запечатанное хранилище"
 sealed_vaults_desc: "§LОпасные тайны наших предков должны оставаться под семью замками.§!"
 screaming_void: "Крик в пустоту"
 screaming_void_desc: "§LОтчаянные вопли очистили наши души и помогли облегчить боль.§!"
 nomads.2080.name: "Пропасть"
 nomads.2080.desc: "Предки говорили правду, под поверхностью [fromfrom.GetPlanetMoon_RULOC&gen] §Y[fromfrom.GetName]§! в самом деле есть чудовище. По счастью, оно давно умерло и больше не представляет угрозы. Это зверь колоссальных размеров, с двумя ногами и парой крыльев. Он весь покрыт чешуей, а зрительных органов у него больше, чем мы видели когда-либо прежде. Воистину чуждое создание…\n\nУ входа в подземную гробницу существа мы обнаружили нишу, на каменной стене которой было высечено послание на языке наших предков. Оно гласило:\n\n«§HМЫ, НЕСУЩИЕ СВЕТ, ИЗГНАЛИ ЭТО ЧУДОВИЩЕ. ПУСТЬ ГНУСНАЯ ТВАРЬ ГНИЕТ ЦЕЛУЮ ВЕЧНОСТЬ§!».\n\nВероятно, предки предупреждали нас не о самом звере, а о последствиях предательства. Его труп служит наглядным напоминанием об их гневе."
 nomads.2080.a: "Да, прародителей лучше не злить…"
 nomads.2080.b: "Никакое создание не заслуживает такой участи."
 nomads.2080.c: "В чём бы ни заключались прегрешения этого существа, оно должно упокоиться в мире."
 nomads.2080.c.tt: "Мы перенесем останки чудовища на корабль-ковчег. Их сохранят и будут почитать.\n\n"
 beastly_remains: "Останки зверя"
 beastly_remains_desc: "§LМы нашли труп чудовища, убитого нашими предками. Его останки послужат напоминанием для богохульников.§!"
 nomads.2085.name: "Зерцало"
 nomads.2085.desc: "Мы достигли указанных координат — и тут же получили сообщение с корабля, использующего те же протоколы шифрования, что и мы. При этом внешние сенсоры не обнаружили присутствия других судов, однако сигнал звучал так отчетливо, словно его источник находится в зоне прямой видимости. Основной экран ожил, передавая изображение на мостик. Перед нами [Root.Owner.Ruler.GetAXX::появился|||fem:появилась]… [Root.Owner.Ruler.GetAXX::наш собственный|||fem:наша собственная] §Y[Root.Owner.GetRulerTitle] [Root.Owner.GetRulerName]§!.\n\nПрежде чем мы смогли отреагировать, двойник заговорил:\n\n§H«Не бойся, [Root.Owner.GetRulerTitle]. Тебе ничто не угрожает. Я [Root.Owner.Ruler.GetAXX::принял|||fem:приняла] этот облик в знак уважения. Сейчас твой путь находится в состоянии неопределенности. Следующий шаг приведет в движение события, смысл которых тебе пока недоступен.\n\nТы [Root.Owner.Ruler.GetAXX::должен|||fem:должна] истребить еретиков, которые не следуют Пути. Мы будем следить».§!\n\nИзображение пропало. Мы не знаем, что это было."
 nomads.2085.a: "Послание ясно как день. Истребить сомневающихся!"
 nomads.2085.b: "Это обман! Мы не позволим ложным богам манипулировать нами!"
 # Sacred Site Points of Interest
 sacred_site_emergence_poi_name: "Святое место: Проявление"
 sacred_site_emergence_poi_desc: "§YПроявление§! — первая точка на Священном пути. Здесь началось наше паломничество."
 sacred_site_eye_poi_name: "Святое место: Око"
 sacred_site_eye_poi_desc: "§YОко§! — очищенное от пороков место, указанное на древних звёздных картах. Мы изучили его в ходе паломничества."
 sacred_site_monastery_poi_name: "Святое место: Монастырь"
 sacred_site_monastery_poi_desc: "§YМонастырь§! — важное место на Священном пути. Мы изучили его в ходе паломничества."
 sacred_site_cradle_poi_name: "Святое место: Колыбель"
 sacred_site_cradle_poi_desc: "§YКолыбель§! — одно из самых священных мест для приверженцев нашей веры. Мы изучили его в ходе паломничества."
 sacred_site_intelligence_poi_name: "Святое место: Разум"
 sacred_site_intelligence_poi_desc: "§YРазум§! — древняя сущность, хранящая ответы для потомков. Мы изучили его в ходе паломничества."
 sacred_site_breathvault_poi_name: "Святое место: Хранилище вздохов"
 sacred_site_breathvault_poi_desc: "§YХранилище вздохов§! — надёжно закрытое помещение, в котором хранятся воспоминания. Мы изучили его в ходе паломничества."
 sacred_site_chasm_poi_name: "Святое место: Пропасть"
 sacred_site_chasm_poi_desc: "§YПропасть§! — вырезанное на камне предупреждение от наших предков. Мы изучили его в ходе паломничества."
 sacred_site_mirror_poi_name: "Святое место: Зерцало"
 sacred_site_mirror_poi_desc: "§YЗерцало§! — место встречи с невидимым отражением. Мы изучили его в ходе паломничества."
 START_SCREEN_SACRED_PATH: "Тысячи лет мы странствовали среди звезд, пересекая астральное море на релятивистских скоростях. Дорога от одного святого места к другому занимала целые эпохи.\n\nС изобретением гипердвигателя у нашего народа появился шанс осуществить то, о чём предки могли лишь мечтать: посетить все святыни за жизнь одного поколения.\n\n[GetRulerTitle] [GetRulerName] мудро руководит нашей общиной, которая стремится понять — как возможность столь быстрого движения по Пути отразится на нашей вере?\n\nДревние карты, унаследованные от предков, показывают нам ориентиры среди звезд. Мы отправляемся в паломничество к этим чудесным местам, чтобы почтить тех, кто жил до нас, — и попробовать увидеть галактику их глазами. Это наше наследие. Наш Священный путь."
 nomads.2005.name: "Звездные карты предков"
 nomads.2005.desc: "Известно, что есть место под названием §YПроявление§!. Для наших предков оно служило отправной точкой Пути. Оно хорошо подходит для того, чтобы поразмыслить над древними книгами, прежде чем продолжать наш собственный вариант паломничества. Если изучить их сейчас, мы сможем лучше подготовиться к предстоящему путешествию.\n\nЗатем мы проложим курс к известным §Yсвятым местам§!. В дороге мы не раз окажемся перед выбором, но если доверимся богам и предкам, перед нами откроется истинный Путь."
 nomads.2005.a: "Мы будем следовать Пути наших предков."
 nomads.2005.b: "Мы способны проложить наш собственный Путь."
 nomads.2015.name: "Раскол веры"
 nomads.2015.desc: "$job_sacred_path_elite_plural$, $job_sacred_path_specialist_plural$ и $job_sacred_path_civilian_plural$ — это три отдельные социальные группы, составляющие нашу духовную иерархию. Так было всегда. $job_sacred_path_elite_plural$ ведут нас за собой, $job_sacred_path_specialist_plural$ служат Пути, а $job_sacred_path_civilian_plural$ поддерживают жизнь общины трудом и служением.\n\nНо сейчас на борту корабля-ковчега «[Owner.Capital.GetName]» намечается раскол. Ускоренное межзвездное путешествие заставило нас принять новые обязанности, и теперь некоторые члены экипажа считают, что их вклад весомее, чем у остальных. Каждая группа требует, чтобы ее считали самой важной."
 nomads.2015.a: "$job_sacred_path_elite_plural$ не просто так пользуются всеобщим почитанием."
 nomads.2015.b: "Посвященные заслуживают большего признания."
 nomads.2015.c: "Пора прислушаться к словам Верных."
 nomads.2015.d: "Все мы играем равноценные роли."
 nomads.2020.name: "Славные пилигримы"
 nomads.2020.desc: "Жизнь Высших пилигримов посвящена общему благу, они ведут нас к величию и духовному совершенству. Посвященные и Верные лишь следуют за ними по пятам, исполненные уважения и благоговения.\n\n$job_sacred_path_elite_plural$ олицетворяют собой высшие идеалы нашей веры — и потому могут рассчитывать на определенные привилегии на борту. Каюты у них просторнее, им выделяется больше ресурсов, и они обладают приоритетным доступом ко всем палубам."
 nomads.2020.a: "Вера дает свои преимущества. Всё так, как и должно быть."
 nomads.2020.b: "Не пора ли подумать о равенстве и справедливости?"
 nomads.2025.name: "Святость Посвященных"
 nomads.2025.desc: "$job_sacred_path_specialist_plural$ стоят на грани двух миров, занимая промежуточное положение между элитой и рядовыми членами общины. Их духовная карьера начинается среди простых Верных, но при этом каждый из них мечтает однажды войти в число Высших пилигримов. Это делает Посвященных идеальным срезом нашего общества.\n\nВот почему мы так высоко ценим Посвященных. Верным они напоминают о том, чего те могут добиться, а Высшим пилигримам — об их корнях. Благодаря Посвященным мы не забываем о смирении, они объединяют все палубы.\n\nПочтить Посвященных ритуальным благословением — хороший способ выразить признательность общества. Это воодушевит их служить еще усерднее."
 nomads.2025.a: "Благословенны Посвященные, ибо они оказывают честь всем нам."
 nomads.2025.b: "Все мы играем равноценные роли."
 nomads.2030.name: "Многоуважаемые Верные"
 nomads.2030.desc: "$job_sacred_path_civilian_plural$ — это опора нашего общества, наши фермеры, техники, шахтеры… А еще они — будущие Посвященные и $job_sacred_path_elite_plural$!\n\nМы глубоко уважаем Верных, ведь лишь благодаря их усилиям корабль продолжает свой путь. Без них наше общество обречено на гибель."
 nomads.2030.a: "Воистину, они есть пот и кровь корабля. Славьтесь!"
 nomads.2030.b: "Каждая социальная группа вносит свой вклад в общее дело."
 nomads.2100.name: "Дальнейший путь"
 nomads.2100.desc: "В космосе больше не осталось неисследованных святых мест.\n\nЗвездные карты предков привели нас в необъятную даль, и мы наконец-то встретились со своим прошлым. Но главный вопрос так и остался без ответа: нашли ли мы истину, или всё это время гнались за иллюзией?\n\nПуть всегда оставался неотъемлемой частью нашей культуры — так было предначертано предками. Но теперь мы знаем всё, что когда-то знали они, и можем оценить их находки с точки зрения современной науки. Всё-таки есть ли еще смысл в древних текстах? Или нашему обществу пришла пора избрать новый, не столь набожный Путь?"
 nomads.2100.a: "Нельзя менять курс. Мы должны хранить веру!"
 nomads.2100.b: "Отныне у нас есть право самим решать, кто мы такие."
 nomads.2100.c: "Ничего не понятно. Мы сбились с пути."
 nomads.2105.name: "Отстаивание традиционных ценностей"
 nomads.2105.desc: "Среди нас всегда будут те, кто преследует собственную повестку, кто хочет перечеркнуть нашу историю и позволить нашим обычаям исчезнуть. Но мы сохраним традиционный жизненный уклад и не позволим им разделить нас. Боги будут и дальше вести нас вперед, но наши сердца должны быть открыты к их посланию."
 nomads.2105.a: "Это наша истинная суть."
 nomads.2105.b: "Наши предки наверняка не возражали против перемен."
 nomads.2115.name: "Конец гармонии"
 nomads.2115.desc: "В нашем обществе нарастает разлад. Сторонники прогресса жаждут перемен, в то время как традиционалисты опасаются всего, что им незнакомо.\n\nПора задать себе вопрос: а возможно ли вообще преодолеть наши различия и вновь обрести гармонию? Если народ останется разделенным, последствия будут катастрофическими.\n\nУ всех есть право иметь свою веру и исповедовать ее по-своему, но если внутренние раздоры ведут нас к гражданской войне, мы должны быть непоколебимы в своих убеждениях."
 nomads.2115.a: "Мы должны стремиться к взаимопониманию."
 nomads.2115.b: "Сосуществование невозможно!"
 nomads.2120.name: "Нас определяют традиции"
 nomads.2120.desc: "Без прошлого мы ничто. Без Пути у нас не останется цели. Иногда испытание веры необходимо, чтобы встряхнуть нас и напомнить, во что обойдется отказ от устоев.\n\nМрачный период конфликтов и междоусобиц остается позади. Ради своих убеждений мы были готовы разорвать друг друга на части, но в действительности нас может спасти лишь единство.\n\nМы никогда больше не должны идти друг против друга. У нас один Путь, и мы обязаны посвятить ему себя без остатка."
 nomads.2120.a: "Мы полностью преданы Пути!"
 nomads.2120.b: "Во всём нужен баланс."
 nomads.2125.name: "Светлое будущее"
 nomads.2125.desc: "Прошлое тянет нас назад и не дает развиваться. Помнить историю важно, но застыть в ней и отказываться идти дальше — совершеннейшее безумие.\n\nНе стоит тратить впустую наш потенциал к самопознанию. Лишь сбросив цепи минувшего, мы сможем двигаться вперед с полной отдачей.\n\nМы больше не станем подчиняться указаниям наших технологически отсталых предков. Таинственные загадки богов перестанут определять наш Путь, ибо мы выбираем свой собственный и ничто не сможет остановить нас."
 nomads.2125.a: "Путь дает ясность…"
 nomads.2125.b: "Единственно верный Путь — это путь войны..."
 nomads.2130.name: "Счастье просветления"
 nomads.2130.desc: "Ведомые надеждой и верой, мы следовали Пути — и обрели просветление.\n\nОтныне наш священный долг — заново освятить все известные святые места. Путь будет расширен, его благословение коснется бесчисленного множества видов и цивилизаций, обитающих среди звезд.\n\nМы даруем свою милость всем, кто пожелает ее принять."
 nomads.2130.a: "Какой восторг!"
 nomads.2135.name: "Срединный путь"
 nomads.2135.desc: "Дело вовсе не в самом Пути. Главное — это путешествие, которое нас объединило. Наш народ веками следовал этой традиции, однако ни в одном историческом документе нет упоминаний об истинном предназначении Пути. Вероятно, оно утрачено навсегда.\n\nМы навсегда запомним сохранившиеся истории о паломничестве наших предков, но нельзя слепо идти по их следам. Наше понимание жизни, галактики и самих себя далеко превосходит их самые смелые догадки. Их истина более не имеет для нас значения, и мы проложим свой собственный путь."
 nomads.2135.a: "Всё это время Путь был внутри нас."
 nomads.2140.name: "В объятия хаоса"
 nomads.2140.desc: "Теперь всё ясно. Святые места наших предков — лишь слащавые символы надежды и веры. Наши предшественники были бесстыжими лжецами и плевать хотели на мнение других.\n\nНаша репутация втоптана в грязь, однако мы еще можем освятить новые места, которые воплотят в себе нашу новую духовную миссию.\n\nБоги противоречивы, их послания часто понимают превратно. Следуя Пути, мы осознали, что конфликт — это естественная особенность нашего общества. Испытания, которые мы преодолеваем, делает нас сильнее. И скоро эту силу узрит вся галактика."
 nomads.2140.a: "Это наш священный поход."
