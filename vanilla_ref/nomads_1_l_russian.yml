 cfl_trophy: "Чемпионская гордость"
 cfl_trophy_desc: "Триумфальное шествие с трофеем КЧО по нашим колониям и провозглашение нашего превосходства сплотили и вдохновили всех нас."
 cfl_trophy_tt: "Стоимость нашей следующей ['concept_tradition', традиции]: §G1§! ед. £unity£ §Iединства§!"
 r_tarnished_cfl_trophy: "Потускневший кубок «Кузни чемпионов онлайн»"
 r_tarnished_cfl_trophy_desc: "$r_cfl_trophy_desc$\n\nБольше имена здесь появляться не будут."
 tarnished_cfl_trophy: "$cfl_trophy$"
 tarnished_cfl_trophy_desc: "Триумфальное шествие с трофеем КЧО по нашим колониям и провозглашение нашего превосходства сплотили и вдохновили всех нас, если до этого еще кому-то есть дело."
 tarnished_cfl_trophy_tt: "Стоимость нашей следующей ['concept_tradition', традиции]: §G−90%§! £unity£ §Iединства§!"
