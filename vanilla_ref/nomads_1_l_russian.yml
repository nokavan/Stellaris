 situation_passenger_satisfaction_outcome_mutiny_before: "§RБунт§!\n• Экипаж §Yзахватит§! корабль-ковчег, что приведет к §Rокончанию круиза§!.\n• Чтобы избежать подобного исхода, выполняйте больше §Yконтрактов экипажа§!.\n$h_line$§LИх терпение лопнуло.§!"
