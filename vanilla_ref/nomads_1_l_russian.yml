 # Nomad Civics
 ##################
 civic_caravan_masters: "Караванная торговля"
 civic_caravan_masters_desc: "Торговля — это кровь, которая питает империи. А для успешной торговли необходима надежная сеть станций и караван-сараев."
 civic_caravan_masters_effects: "$t$• $GUARANTEED_RESEARCH_OPTION_STRING$ £engineering_research£ ['technology:tech_waystation_2']$TABBED_NEW_LINE$• Родная система: более богата, и есть завершенная §H$starbase_waystation_1$§!."
 civic_caravan_masters_corporate: "Динамическая логистика"
 civic_caravan_masters_corporate_desc: "Рост этой кочевой мегакорпорации обеспечивается обширной сетью караван-сараев, работающих под франшизой в глубоком космосе."
 civic_caravan_masters_effects_corporate: "$civic_caravan_masters_effects$ $TABBED_NEW_LINE$• £building£ §Y$building_commercial_forum$§!: этот $megacorp_civic_branch_office_building_effect$"
 councilor_waystation_bosun: "Боцман маршрутных станций"
 councilor_waystation_bosun_desc: "Боцман следит за снабжением даже самых отдаленных маршрутных станций, при необходимости организуя поставки через независимых торговцев."
 councilor_waystation_quota_auditor: "Аудитор квот маршрутных станций"
 councilor_waystation_quota_auditor_desc: "Управляющие маршрутных станций понимают, что с аудитором лучше не связываться. Чтобы выполнить свою квоту, они требуют от сотрудников максимальной производительности."
 civic_deep_sleep: "Глубокий сон"
 civic_deep_sleep_desc: "Эти кочевники — эксперты в области крионического сна. Экипажи их кораблей-ковчегов пробуждаются лишь тогда, когда их труд будет максимально продуктивным."
 councilor_deep_sleep: "Директор по крионике"
 councilor_deep_sleep_desc: "Быть директором по крионике — одинокое занятие. Ему приходится бодрствовать, когда остальная команда спит, и будить лишь тех, в ком возникла необходимость."
 civic_corporate_deep_sleep: "Замороженные активы"
 civic_corporate_deep_sleep_desc: "Эта кочевая мегакорпорация обладает экспертизой в области крионического сна. Ее команда и клиенты подлежат разморозке лишь тогда, когда прогнозируемая прибыль превышает расходы."
 councilor_corporate_deep_sleep: "Руководитель отдела гибернации"
 councilor_corporate_deep_sleep_desc: "Используя прогностические алгоритмы и ключевые показатели эффективности персонала, руководитель отдела гибернации оптимизирует график заморозки сотрудников."
 civic_tooltip_not_deep_sleep: "НЕТ гражданской модели ['concept_deep_sleep_civics']"
 concept_deep_sleep_civics: "$civic_deep_sleep$"
 concept_deep_sleep_civics_desc: "К гражданским моделям группы «$concept_deep_sleep_civics$» относятся: \n• ['civic:civic_deep_sleep']$NEW_LINE$• ['civic:civic_corporate_deep_sleep']"
 civic_hive_deep_sleep: "Посменная спячка"
 civic_hive_deep_sleep_desc: "Этот кочевой улей попеременно погружает части коллективного сознания в спячку, пробуждая лишь те органы и единицы корабля-ковчега, которые необходимы для выполнения текущих задач."
 civic_machine_deep_sleep: "Протоколы энергосбережения"
 civic_machine_deep_sleep_desc: "Этот кочевой машинный разум оптимизирует энергопотребление, отключая малоэффективные модули. Они активируются только тогда, когда в них возникает необходимость."
 job_ark_deep_sleep: "Спящий в криосне"
 job_ark_deep_sleep_plural: "Спящие в криосне"
 job_ark_deep_sleep_desc: "Поскольку ресурсы ограничены, бодрствует в пути только часть обитателей корабля."
 pop_cat_deep_sleep: "$job_ark_deep_sleep$"
 pop_cat_deep_sleep_plural: "$job_ark_deep_sleep_plural$"
 pop_cat_deep_sleep_desc: "Спящие массы, для которых не идет время и не движется мир — пока мы не сможем позволить себе пробудить их."
 planet_ark_deep_sleep: "$job_ark_deep_sleep_plural$"
 mod_job_ark_deep_sleep_add: "Должности спящих в криосне"
 civic_deep_sleep_effects: "$t$• $INITIAL_POPS$ §G+3000§!\n$t$• Первый и последующие корабли-ковчеги: ['concept_deep_sleep_cryo_pods', £blocker£$d_deep_sleep_cryo_pods$]: §R+3§!"
 civic_corporate_deep_sleep_effects: "$civic_deep_sleep_effects$\n$t$• £building£ §Y$building_food_conglomerate$§!: $megacorp_civic_branch_office_building_effect$"
 civic_deep_sleep_effects_additional: "• После расчистки криокапсул открывается решение колонии «['concept_prepare_deep_sleep']»"
 concept_deep_sleep_cryo_pods: "$d_deep_sleep_cryo_pods$"
 concept_deep_sleep_cryo_pods_desc: "• Добавляется §R+1000§! ['concept_job_deep_sleep', спящих в криосне]\n• £housing£ $MOD_PLANET_HOUSING_ADD$: §R-200§!\n• Время на расчистку: £time£ 360 §Iдней§!\n• Стоимость расчистки: §R-1000§! ед. £food£ §Iпищи§! §R-1000§! ед. £alloys£ §Iсплавов§!\n• При расчистке: криокапсулы становятся ['concept_deep_sleep_cryo_pods_renewed', обновленными]\n§L$d_deep_sleep_cryo_pods_desc$§!"
 concept_job_deep_sleep: "$job_ark_deep_sleep$"
 concept_job_deep_sleep_desc: "• §G-100%§! к содержанию поселений\n• Нельзя отдать приоритет\n§LПоскольку ресурсы ограничены, бодрствует в пути только часть обитателей корабля.§!"
 d_deep_sleep_cryo_pods: "Позабытые криокапсулы"
 d_deep_sleep_cryo_pods_desc: "Лишние криогенные хранилища, загромождающие корабль-ковчег. В некоторых из них до сих пор мог кто-то остаться."
 nomad_economy_progress: "$TRIGGER_FAIL$Требования: §Y$situation_nomad_economy$§! на этапе: §Y$situation_nomad_economy_stage_3_thriving$§!"
 d_deep_sleep_cryo_pods_renewed: "Обновленные криокапсулы"
 d_deep_sleep_cryo_pods_renewed_desc: "Эти криокапсулы, обновленные и освобожденные от своих чрезмерно засидевшихся внутри обитателей, теперь помогают лучшим умам нашего корабля еще дольше служить остальным."
 concept_deep_sleep_cryo_pods_renewed: "$d_deep_sleep_cryo_pods_renewed$"
 concept_deep_sleep_cryo_pods_renewed_desc: "$t$• Добавляется §R+100§! ['concept_job_deep_sleep', спящих в криосне]\n$t$• $mod_planet_pops_upkeep_mult$: §G-5%§!"
 planet_deep_sleep: "Глубокий сон"
 decision_deep_sleep: "Подготовиться к глубокому сну"
 decision_deep_sleep_desc: "Погрузив относительно незанятых обитателей корабля в глубокий сон, мы поспособствуем развитию бережливости и продуктивности у тех, кто еще бодрствует."
 decision_deep_sleep_tt: "Требуется 1000 граждан или обслуживающих дронов"
 decision_deep_sleep_effect_tt: "§R+233§! ['concept_job_deep_sleep', спящих в криосне] от ['concept_deep_sleep_cryo_pods_renewed', обновленных криокапсул]"
 concept_prepare_deep_sleep: "$decision_deep_sleep$"
 concept_prepare_deep_sleep_desc: "Стоимость: §R-100§! ед. £influence£ §Iвлияния§!\nЭффект (5 лет):\n$t$• $mod_planet_jobs_upkeep_mult$: §G-15%§!\n$t$• §R+233§! ['concept_job_deep_sleep', спящих в криосне] от ['concept_deep_sleep_cryo_pods_renewed', обновленных криокапсул]"
 civic_void_reavers: "Разбойники пустоты"
 civic_void_reavers_desc: "В этом обществе межзвездных флибустьеров приняты довольно смутные представления о собственности. Они признают за сильными и коварными право на присвоение недостаточно хорошо охраняемых богатств."
 civic_tooltip_void_reavers_effects: "$t$• Открывается тактика бомбардировки §Y«Грабеж»§!, с помощью которой мы сможем похищать производимые на планете ресурсы.$TABBED_NEW_LINE$• Дополнительные модули маршрутной станции: §Y$sm_defense_cat$§! и §Y$sm_piracy_cat$§!."
 bombardment_plundering: "Грабеж"
 bombardment_plundering_desc: "Целью грабежа является вражеская инфраструктура. Специальные корабли-рейдеры атакуют склады неприятеля и захватывают его ресурсы.\n• §EОчень слабый§! урон §Yармиям§!\n• §EУмеренный§! урон §Yпланете§!\n• Если §Yопустошение ниже 70%§!: каждый месяц есть шанс §Yпохитить§! §G40%§! производимых §Yпланетой§! ресурсов. Каждая присутствующая на планете армия уменьшает этот шанс."
 councilor_master_gunner: "Мастер-оружейник"
 councilor_master_gunner_desc: "Мастера-оружейники отвечают за оборону форпостов. Они следят за тем, чтобы арсеналы были полны взрывчатки, снарядов и прочих инструментов разрушения."
 mod_ship_military_alloys_cost_mult: "Затраты сплавов на военные корабли"
 sm_waystation_pirate_hideout: "Логово пиратов"
 sm_waystation_pirate_hideout_plural: "Логова пиратов"
 sm_waystation_pirate_hideout_desc: "Вольные братья пустоты стекаются сюда, чтобы пополнить запасы, продать добычу и пропить вырученные средства."
 waystation_pirate_hideout_tt: "\n§YЭффекты§!:\n£ship_h_slot£ Ячейки для оружия: §G+1§!.\nПредоставляются ресурсы в объёме, зависящем от производительности колоний в системе.\nКаждая колония в системе:$TABBED_NEW_LINE$Похищаемый ежемесячно объем производства: §G+1,5%§![GetPirateHideoutPiracyDesc]"
 waystation_pirate_hideout_piracy_cloaked_tt: "\nЕсли эта маршрутная станция не замаскирована, владелец колонии §Rзаподозрит пиратов§! в похищениях, и его мнение о нас ухудшится."
 waystation_pirate_hideout_piracy_tt: "\nВладелец колонии §Rзаподозрит пиратов§! в похищениях, и его мнение о нас ухудшится."
 waystation_pirate_hideout_reaver_stronghold_tt: "Дополнительные эффекты от §Yразбойничьих цитаделей§!:"
 sm_waystation_concealment_field: "Камуфляжное поле"
 sm_waystation_concealment_field_desc: "Усовершенствованная изоляция панелей снижает утечку сигналов и энергии, усиливая нашу защиту и повышая эффективность маскировки."
 sm_waystation_reaver_stronghold: "Разбойничья цитадель"
 sm_waystation_reaver_stronghold_desc: "Эта мощная цитадель служит постоянным штабом нашего пиратского флота. Здесь планируются набеги по всей галактике."
 waystation_reaver_stronghold_tt: "\n§YЭффекты§!:\n£ship_h_slot£ Ячейки для оружия: §G+1§!\nЕжемесячный объем производства, похищаемый §Yлоговами пиратов§!: §G+1,5%§!\nУдваивает шанс похитить ресурсы при использовании тактики бомбардировки §Y«$bombardment_plundering$»§!."
 civic_flight_schools: "Полетные школы"
 civic_flight_schools_desc: "Народ всегда видит в пилотах отважных героев, подающих пример другим, и со временем эта роль стала считаться символом престижа и высокого статуса. Как следствие, появились целые поколения выдающихся пилотов-асов."
 civic_flight_schools_effect_tooltip: "$t$• $ADDITIONAL_TECHNOLOGIES_STRING$ £engineering£ ['technology:tech_strike_craft_1', применение кораблей-​носителей]"
 civic_flight_schools_effect_nomadic_tooltip: "$t$• $ADDITIONAL_TECHNOLOGIES_STRING$ £engineering£ ['technology:tech_strike_craft_1', $tech_strike_craft_1$]$TABBED_NEW_LINE$• Доступные модули маршрутной станции: ['starbase_module:waystation_hangar_bay', $sm_waystation_hangar_bay$]"
 civic_corporate_flight_schools: "Академия звездных лайнеров"
 civic_corporate_flight_schools_desc: "Потенциал космических исследований показывает уверенный рост, и данная мегакорпорация приняла решение инвестировать средства в обучение элитного пилотского корпуса. Квалифицированный штат пилотов гарантирует расширение торговли и высокую маржинальность перелетов."
 civic_corporate_flight_schools_effect_tooltip: "$civic_flight_schools_effect_tooltip$$TABBED_NEW_LINE$• £building£ §Y$building_military_contractors$§!: $megacorp_civic_branch_office_building_effect$"
 civic_corporate_flight_schools_effect_nomadic_tooltip: "$civic_flight_schools_effect_nomadic_tooltip$$TABBED_NEW_LINE$• £building£ §Y$building_private_shipyards$§!: $megacorp_civic_branch_office_building_effect$"
 councilor_head_flight_operations: "Заведующий гиперкоридорами"
 councilor_head_flight_operations_desc: "Заведующий гиперкоридорами следит за тем, чтобы гиперпрыжки совершались быстро и эффективно."
 councilor_flight_director: "Директор по полетам"
 councilor_flight_director_desc: "Директор по полетам отвечает за координацию использования космолетов с целью повышения торгового потенциала."
 councilor_flight_director_custom_modifier_desc: "• £trade_value£ Объем торговли от ангарных отсеков ([GetStarbaseOrWayStation]): §G+0,25§!"
 civic_hired_guns: "Вооруженные наемники"
 civic_hired_guns_desc: "Это государство предлагает другим услуги военного характера — за определенную плату. Его высокие запросы оправданы: эти наемники превосходно решают проблемы клиентов с помощью оружия."
 civic_hired_guns_effect_tooltip: "• Объем торговли в награду за военные контракты: §G+50%§!\n• Скорострельность корабельных орудий во время выполнения военных контрактов: §G+15%§!\n• Содержание кораблей во время выполнения военных контрактов: §G-15%§!\n• Содержание кораблей на орбите §Rвражеских§! колоний обходится на §G10%§! дешевле."
 civic_corporate_hired_guns: "Специалисты по защите активов"
 civic_corporate_hired_guns_desc: "Эта мегакорпорация предлагает охранные услуги непревзойденного качества. За соответствующую плату она готова предложить свой опыт в наращивании эскалации — и обернуть конфликт в пользу клиента."
 civic_corporate_hired_guns_effect_tooltip: "$civic_hired_guns_effect_tooltip$\n• £building£ §Y$building_military_contractors$§!: $megacorp_civic_branch_office_building_effect$"
 hired_guns_modifier: "Контрактные обязательства"
 hired_guns_modifier_desc: "Для наших экипажей нет лучшего стимула, чем хорошая плата и возможность мародерствовать."
 hg_ship_upkeep_bombing: "$BLANK_STRING$"
 councilor_paymaster: "Казначей"
 councilor_paymaster_desc: "Для флотилий наемников нет вопроса больнее, чем вопрос жалования."
 councilor_asset_security_manager: "Менеджер по защите активов"
 councilor_asset_security_manager_desc: "Оптимизация выплат персоналу заработной платы — главное требование для сведения балансового счета. За имущество и ценности, экспроприированные во время службы, разумеется, полагается щедрая надбавка."
 strike_craft_modifier: "Место для пилотов"
 strike_craft_modifier_tt: "Мы можем воспользоваться этим, чтобы разместить больше пилотов."
