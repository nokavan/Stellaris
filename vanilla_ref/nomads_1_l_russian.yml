 # Gundersen Research Society (GRS)
 START_SCREEN_GRS: "«Гиацинту» противопоказано стоять на месте.\n\n«Гиацинт» — шестой и последний корабль-ковчег, построенный по программе «Одиссей». Когда мы входили в червоточину, каждый надеялся, что «Гиацинт» выйдет у новой колонии. Наши надежды не сбылись. Флот оказался разбросан по галактике, а сразу после выхода из червоточины отказала система энергоснабжения. Мы остались дрейфовать в космической пустоте — одинокие, брошенные.\n\nКапитан Гундерсен принял окончательное решение. Он постановил: «Гиацинт» станет для нас домом. Для нас — и всех остальных. Со временем к нам прибились члены экипажей других кораблей — исследователи, колонисты, скитальцы, которым больше некуда было податься. Мы брали на борт всех. Династия Гундерсенов заботилась о том, чтобы всему — и всем — находилось своё место.\n\n[Ruler.GetTitle] всегда Гундерсен. После долгих лет странствий, когда мы вернулись в систему, где нас когда-то выплюнула червоточина. У нас много вопросов, и нам нужны ответы."
 EMPIRE_DESIGN_humans3: "Исследовательское общество им. Гундерсена"
 EMPIRE_DESIGN_humans3_desc: "«Гиацинт», шестой и последний корабль-ковчег, построенный по программе ООН «Одиссей», всего через несколько секунд после выхода из роковой червоточины, разбросавшей человечество по просторам космоса, столкнулся с полным отказом системы энергоснабжения. Капитан Рональд Ф. Гундерсен, проявив невероятное мужество и смекалку, сумел спасти корабль и со временем стал родоначальником новой династии.\n\nВот уже целое столетие на «Гиацинте» процветает исследовательское общество имени Гундерсена. За прошедшие годы его члены изменили и перестроили корабль до неузнаваемости — настолько, что некоторые даже начали называть его на новый лад: «Тезей». Эти люди добродушны и любознательны; династия Гундерсенов — находчива и практична: всему, что только попадает на корабль, она находит применение. Сегодня круг странствий замкнулся: они вернулись в тот уголок галактики, где их впервые выплюнула червоточина."
