 contract_shoreleave_passenger_2_lore_issued: "§L«Говорят, тут на улице продают такие штуки, которые вьются на тарелке. Хочу посмотреть».§!"
 contract_shoreleave_passenger_2_lore_completed: "§L«Очень вкусная еда, хотя название — язык сломаешь. Теперь только о ней и думаю. Когда мы вернемся?»§!"
 contract_shoreleave_passenger_2_lore_failed: "§L«Гастротур отменили. С прошлого цикла не могу на него попасть…»§!"
 contract_shoreleave_passenger_2_chain_title: "$contract_shoreleave_passenger_2$"
 contract_shoreleave_passenger_2_chain_desc: "$contract_shoreleave_passenger_2_desc$"
 CONTRACT_SHORELEAVE_passenger_2_PROJECT: "$contract_shoreleave_passenger_2$"
 CONTRACT_SHORELEAVE_passenger_2_PROJECT_DESC: ""
 contract_shoreleave_passenger_3: "Культурная экскурсия"
 contract_shoreleave_passenger_3_desc: "В столице планеты расположен музей, известный на всю галактику. Пассажиры просят провести экскурсию по достопримечательностям и выставкам."
 contract_shoreleave_passenger_3_lore_issued: "§L«Третий раз перечитываю справочник и всё не пойму, какой у них календарь. Но архитектура — загляденье».§!"
 contract_shoreleave_passenger_3_lore_completed: "§L«Памятник погибшим на войне заставляет задуматься. В художественной галерее ничего не понятно. Было здорово».§!"
 contract_shoreleave_passenger_3_lore_failed: "§L«Экскурсий нет, так что приходится читать справочник. Теперь всё знаю наизусть. Так неинтересно».§!"
 contract_shoreleave_passenger_3_chain_title: "$contract_shoreleave_passenger_3$"
 contract_shoreleave_passenger_3_chain_desc: "$contract_shoreleave_passenger_3_desc$"
 CONTRACT_SHORELEAVE_passenger_3_PROJECT: "$contract_shoreleave_passenger_3$"
 CONTRACT_SHORELEAVE_passenger_3_PROJECT_DESC: ""
 contract_shoreleave_passenger_4: "Базарный день"
 contract_shoreleave_passenger_4_desc: "На огромном открытом рынке можно купить и продать любые товары, какие только есть в секторе. Пассажирам не терпится поторговаться."
 contract_shoreleave_passenger_4_lore_issued: "§L«У меня с собой три сумки и мало денег. Хочу шесть сумок и бесконечные деньги».§!"
 contract_shoreleave_passenger_4_lore_completed: "§L«Двадцать минут торговаться за ненужную безделушку — вот это по мне!»§!"
 contract_shoreleave_passenger_4_lore_failed: "§L«Рынок так и звал меня. Это непростительно!»§!"
 contract_shoreleave_passenger_4_chain_title: "$contract_shoreleave_passenger_4$"
 contract_shoreleave_passenger_4_chain_desc: "$contract_shoreleave_passenger_4_desc$"
 CONTRACT_SHORELEAVE_passenger_4_PROJECT: "$contract_shoreleave_passenger_4$"
 CONTRACT_SHORELEAVE_passenger_4_PROJECT_DESC: ""
 contract_shoreleave_passenger_5: "Встреча с фауной"
 contract_shoreleave_passenger_5_desc: "Планетарный заповедник предлагает экскурсии по дикой природе. Пассажиры ознакомятся с местной фауной со специальных наблюдательных дорожек."
 contract_shoreleave_passenger_5_lore_issued: "§L«У меня с собой три камеры. Всё, у чего больше четырех ног, буду снимать с разных ракурсов».§!"
 contract_shoreleave_passenger_5_lore_completed: "§L«Оно меня понюхало! Или просканировало. Или сделало предложение. Да неважно — было здорово».§!"
 contract_shoreleave_passenger_5_lore_failed: "§L«Экскурсии не будет. Ну и пожалуйста. Пойду опять пялиться на аквариум на девятой палубе».§!"
 contract_shoreleave_passenger_5_chain_title: "$contract_shoreleave_passenger_5$"
 contract_shoreleave_passenger_5_chain_desc: "$contract_shoreleave_passenger_5_desc$"
 CONTRACT_SHORELEAVE_passenger_5_PROJECT: "$contract_shoreleave_passenger_5$"
 CONTRACT_SHORELEAVE_passenger_5_PROJECT_DESC: ""
 contract_espionage_support_passenger_1: "Театр шпионажа"
 contract_espionage_support_passenger_1_desc: "Чтобы повеселить пассажиров, мы отправим муляж шпионского спутника в указанную систему."
 contract_espionage_support_passenger_1_lore_issued: "§L«Надеюсь, там еще будет сцена с погоней!»§!"
 contract_espionage_support_passenger_1_lore_completed: "§L«Компьютер говорит, мол, вы перехватили три зашифрованных передачи. Я молодец».§!"
 contract_espionage_support_passenger_1_lore_failed: "§L«Ну и, этот шпионский спутник должен был сделать что-то еще, или на этом всё?»§!"
 contract_espionage_support_passenger_1_chain_title: "$contract_espionage_support_passenger_1$"
 contract_espionage_support_passenger_1_chain_desc: "$contract_espionage_support_passenger_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_1_PROJECT: "$contract_espionage_support_passenger_1$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_1_PROJECT_DESC: ""
 contract_espionage_support_passenger_2: "Осведомитель"
 contract_espionage_support_passenger_2_desc: "[GetEspionageSupportPassenger2]"
 contract_espionage_support_passenger_issuer_2_desc: "[GetEspionageSupportPassengerIssuer2]"
 contract_espionage_support_passenger_2_regular_desc: "Мы устроим разведывательную операцию корабельного масштаба. Добровольцы со всех палуб притворятся перебежчиками и будут снабжать пассажиров сведениями на тайных инструктажах."
 contract_espionage_support_passenger_2_gestalt_desc: "Дроны с каждой палубы притворятся перебежчиками с планеты и будут, идеально скоординировавшись, проводить тайные инструктажи для различных групп пассажиров."
 contract_espionage_support_passenger_2_lore_issued: "§L«Инструктор передал мне под столом зашифрованную записку. Остальные просто обзавидовались».§!"
 contract_espionage_support_passenger_2_lore_completed: "§L«Мне сказали, что вместе мы накрыли целую тайную сеть. Ну и что, что это неправда: всё равно приятно».§!"
 contract_espionage_support_passenger_2_lore_failed: "§L«Осведомитель так и не явился. Пришлось три часа просидеть в будке, пялясь в газету».§!"
 contract_espionage_support_passenger_2_chain_title: "$contract_espionage_support_passenger_2$"
 contract_espionage_support_passenger_2_chain_desc: "$contract_espionage_support_passenger_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT: "$contract_espionage_support_passenger_2$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_2_PROJECT_DESC: ""
 contract_espionage_support_passenger_3: "Шпионский тайник"
 contract_espionage_support_passenger_3_desc: "Пассажиров отведут на экскурсию по городу, где оперативники заранее заложили тайники с ложными разведданными — их и предстоит найти пассажирам."
 contract_espionage_support_passenger_3_lore_issued: "§L«Нам всем придумали легенду и позывные. Я — «Заря». Как же здорово!»§!"
 contract_espionage_support_passenger_3_lore_completed: "§L«Мой тайник был за статуей какого-то инопланетянина. Группа обрадовалась, а местные ничего не поняли».§!"
 contract_espionage_support_passenger_3_lore_failed: "§L«Ни тайников, ни позывных, ни задания. Опять только одни сплошные коридоры».§!"
 contract_espionage_support_passenger_3_chain_title: "$contract_espionage_support_passenger_3$"
 contract_espionage_support_passenger_3_chain_desc: "$contract_espionage_support_passenger_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT: "$contract_espionage_support_passenger_3$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_3_PROJECT_DESC: ""
 contract_espionage_support_passenger_4: "Охота на «крота»"
 contract_espionage_support_passenger_4_desc: "На корабле объявлено о проникновении на борт «шпионов» — разумеется, ненастоящих. Выявлять их среди членов экипажа будут с помощью пассажиров со всех палуб."
 contract_espionage_support_passenger_4_lore_issued: "§L«Мне сказали, что на палубе есть шпион. У меня уже составлен список подозреваемых».§!"
 contract_espionage_support_passenger_4_lore_completed: "§L«Крот попался! Он, правда, еще и тысячам других попался. Но мне — в первую очередь!»§!"
 contract_espionage_support_passenger_4_lore_failed: "§L«Охоту на крота отменили и даже не посмотрели на мои улики. А у меня уже и карта была, и всё остальное…»§!"
 contract_espionage_support_passenger_4_chain_title: "$contract_espionage_support_passenger_4$"
 contract_espionage_support_passenger_4_chain_desc: "$contract_espionage_support_passenger_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT: "$contract_espionage_support_passenger_4$"
 CONTRACT_ESPIONAGE_SUPPORT_passenger_4_PROJECT_DESC: ""
 contract_espionage_support_passenger_5: "Перехват сигнала"
 contract_espionage_support_passenger_5_desc: "Обзорные палубы превратили в посты прослушивания. Пассажиры старательно расшифровывают составленные нами «передачи» от инопланетян, тайно передаваемые из-под палуб."
 contract_espionage_support_passenger_5_lore_issued: "§L«Мне дали наушники и сказали внимательно слушать: от этого зависит судьба галактики. Как тут не поверить?»§!"
 contract_espionage_support_passenger_5_lore_completed: "§L«Нам сказали, что все передачи написаны заранее. Не понимаю, почему все так занервничали — последнюю разве не надо было расшифровывать?»§!"
 contract_espionage_support_passenger_5_lore_failed: "§L«Пост прослушивания закрыли прямо перед моей сменой. Даже наушников не дали».§!"
 contract_espionage_support_passenger_5_chain_title: "$contract_espionage_support_passenger_5$"
