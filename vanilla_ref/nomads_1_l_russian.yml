 #################
 origin_forever_cruise: "Бесконечный круиз"
 origin_forever_cruise_desc: "$cannot_settle$\nБесконечный круиз бороздит просторы космоса в поисках ярких впечатлений и удивительных зрелищ. Его команда неустанно трудится, выполняя любые прихоти пассажиров, пока те наблюдают зарождение туманностей, не вставая с шезлонгов."
 origin_forever_cruise_effects: "• Кочевое происхождение\n• Начать с инцидентом ['concept_situation_passenger_satisfaction', «Удовлетворение пассажиров»]\n• Начать с расами §Hкоманды§! и §Hпассажиров§!\n• Особый £district£ район корабля-ковчега: ['district:district_ark_forever_cruise', район обслуживания]\n• Особая должность: ['concept_job_cruise_crew_overseer', менеджер по занятости]\n• Доступные £zone£ специализации районов корабля-ковчега:$TABBED_NEW_LINE$• ['concept_forever_cruise_district_specializations']\n• Доступные сооружения:$TABBED_NEW_LINE$• ['concept_forever_cruise_buildings']"
