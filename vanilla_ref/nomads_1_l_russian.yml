 arkship_stellar_ignition_desc: "§LЗаряженная темная материя вводится в газовые гиганты или уже существующие звезды, ускоряя термоядерные реакции. Звезды, пережившие этот процесс, становятся ярче и горячее, но ради этого приходится жертвовать пригодностью системы для жизни.§!"
