 allow_waystations: "§HТип станций:§! $tech_waystation_1$\n§HДоступен контракт:§! $contract_build_waystation$"
 tech_waystation_2: "Улучшенная логистика маршрутных линий"
 tech_waystation_2_desc: "Сегодня наши маршрутные станции — не просто межзвездные маяки: налаженная логистика позволяет нам хранить на станциях больше запасов и эффективнее передавать ресурсы по маршрутным линиям."
 TECH_UNLOCK_WAYSTATION_2_CONSTRUCTION_TITLE: "§HУлучшение для станций:§! $starbase_waystation_2$"
 TECH_UNLOCK_WAYSTATION_2_CONSTRUCTION_DESC: "Позволяет строить улучшенные маршрутные станции, которые вмещают больше запасов и отличаются более совершенной логистикой."
 tech_waystation_3: "Продвинутая логистика маршрутных линий"
 tech_waystation_3_desc: "Современные протоколы координации объединяют разрозненные маршрутные станции в единую надежную сеть. Ресурсы, сигналы и припасы перемещаются по маршрутным линиям с невероятной точностью."
 TECH_UNLOCK_WAYSTATION_3_CONSTRUCTION_TITLE: "§HУлучшение для станций:§! $starbase_waystation_3$"
 TECH_UNLOCK_WAYSTATION_3_CONSTRUCTION_DESC: "Позволяет строить полноценные маршрутные станции, которые укрепляют путевую сеть и обеспечивают предельно эффективную логистику."
