 # Nomad Exploration - Wanderlust
 ap_wanderlust: "Жажда странствий"
 ap_wanderlust_desc: "Галактика обширна и полна чудес. Каждый шаг — это незабываемый урок."
 ap_wanderlust_tooltip: "Посещайте примечательные системы на §Yкораблях-ковчегах§!, чтобы открывать различные §Yмодификаторы§!"
 nomad_exploration_chain_title: "Жажда странствий у кочевников"
 nomad_exploration_chain_desc: "Изучайте системы на кораблях-ковчегах, чтобы открывать модификаторы и получать £unity£ §Yединство§!:\n• Исходный модификатор: §G+1§! к пределу районов на корабле-ковчеге, §G-10%§! к содержанию лидеров\n• По завершении §H4§! категорий: §G+2§! к пределу районов на корабле-ковчеге, §G-20%§! к содержанию лидеров, §G-10%§! к стоимости традиций"
 ancient_wonders_modifier: "Посетитель древних чудес"
 ancient_wonders_modifier_desc: "Следы цивилизаций наших предтеч одновременно и печалят, и вдохновляют."
 antique_threat_modifier: "Исследователь древних угроз"
 antique_threat_modifier_desc: "Свирепые обитатели галактики столь же страшны, сколь и великолепны."
 galactic_landmark_modifier: "Галактический турист"
 galactic_landmark_modifier_desc: "Наш путь усеян памятными местами. Здесь можно найти приют и понимание, куда двигаться дальше. Они — та нить, из которой мы ткем полотно истории."
 marauder_modifier: "Контакты с мародерами"
 marauder_modifier_desc: "Дикие и непокорные системы под властью мародеров опасны, но в космосе все мы друг другу сородичи."
 natural_spectacle_modifier: "Наблюдатель за природой"
 natural_spectacle_modifier_desc: "Вселенная прекрасна — достаточно лишь захотеть это увидеть."
 precursor_modifier: "Исследователь предтеч"
 precursor_modifier_desc: "Обломки древних цивилизаций — фундамент для строительства светлого будущего."
 space_ecology_modifier: "Наблюдатель за космоэкологией"
 space_ecology_modifier_desc: "Космическая фауна существует в гармонии, пусть даже эта гармония жестока. Нам тоже найдется место в этом мироустройстве."
 enclave_modifier: "Контакты с анклавом"
 enclave_modifier_desc: "Обитатели анклава — не кочевники, но им также не чужда космическая жизнь. За соответствующую плату они готовы нам помочь."
 categories_completed_progress: "Завершенные категории"
 NOMAD_EXPLORATION_ANCIENT_WONDERS: "Древние чудеса"
 NOMAD_EXPLORATION_ANCIENT_WONDERS_DESC: "§EТребования:§!\nИзучено §Y[root.ancient_wonders_system_seen]/[root.ancient_wonders_system_count]§! систем.\nИсследуйте системы с §Yдревними чудесами§!.\n§YДревние чудеса§! — это достижения цивилизаций прошлого."
 NOMAD_EXPLORATION_ANTIQUE_THREAT: "Древние угрозы"
 NOMAD_EXPLORATION_ANTIQUE_THREAT_DESC: "§EТребования:§!\nИзучено §Y[root.antique_threat_system_seen]/[root.antique_threat_system_count]§! систем.\nИзучайте системы с §Yдревними угрозами§!.\n§YДревние угрозы§! — это страшные существа, рыщущие в космической пустоте."
 NOMAD_EXPLORATION_ENCLAVE: "Системы с анклавами"
 NOMAD_EXPLORATION_ENCLAVE_CATEGORY_DESC: "§EТребования:§!\nИзучено §Y[root.enclave_system_seen]/[root.enclave_system_count]§! систем.\nИзучайте системы с §Yанклавами§!.\n§YАнклавы§! могут оказаться полезными партнерами."
 NOMAD_EXPLORATION_GALACTIC_LANDMARK: "Галактические достопримечательности"
 NOMAD_EXPLORATION_GALACTIC_LANDMARK_DESC: "§EТребования:§!\nИзучено §Y[root.galactic_landmark_system_seen]/[root.galactic_landmark_system_count]§! систем.\nИзучайте системы с §Yгалактическими достопримечательностями§!.\n§YГалактические достопримечательности§! — это выдающиеся сооружения и особенности."
 NOMAD_EXPLORATION_MARAUDER: "Системы мародеров"
 NOMAD_EXPLORATION_MARAUDER_DESC: "§EТребования:§!\nИзучено §Y[root.marauder_system_seen]/[root.marauder_system_count]§! систем.\nИзучайте системы с §Yмародерами§!.\n§YМародеры§! — воинственные космические обитатели и пираты."
 NOMAD_EXPLORATION_NATURAL_SPECTACLE: "Природные достопримечательности"
 NOMAD_EXPLORATION_NATURAL_SPECTACLE_DESC: "§EТребования:§!\nИзучено §Y[root.natural_spectacle_system_seen]/[root.natural_spectacle_system_count]§! систем.\nИзучайте системы с §Yприродными достопримечательностями§!.\n§YПриродные достопримечательности§! — это стихийно возникшие чудеса вселенной."
 NOMAD_EXPLORATION_PRECURSOR: "Следы предтеч"
 NOMAD_EXPLORATION_PRECURSOR_CATEGORY_DESC: "§EТребования:§!\nИзучено §Y[root.precursor_system_seen]/[root.precursor_system_count]§! систем.\nИзучайте системы со §Yследами предтеч§!.\n§YСледы предтеч§! — это остатки давно погибших империй."
 NOMAD_EXPLORATION_SPACE_ECOLOGY: "Космическая экология"
 NOMAD_EXPLORATION_SPACE_ECOLOGY_DESC: "§EТребования:§!\nИзучено §Y[root.space_ecology_system_seen]/[root.space_ecology_system_count]§! систем.\nИзучайте системы с §Yкосмической экологией§!.\nСистемы с §Yкосмической экологией§! играют важнейшую роль в жизни космической фауны."
