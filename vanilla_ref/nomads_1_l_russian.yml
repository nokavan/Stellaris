 arkship_exodus_jump: "Прыжок исхода"
 arkship_exodus_jump_desc: "§LЕдиничный прыжок, с помощью которого корабль-ковчег может преодолеть невероятное расстояние. Образующаяся после прыжка ударная волна задевает всех без разбора — и систему, из которой был совершен прыжок, и систему, в которую прибыл корабль.§!"
 arkship_exodus_jump_system_effect: "$SYSTEM_EFFECTS_HEADER$$TABBED_NEW_LINE$— Все §Hфлотилии§!, §Hстанции§! и §Hкосмические базы§! получают $@arkship_exodus_jump_cost|0R$ ед. §Hурона§!.$TABBED_NEW_LINE$— Все §Hколонии§! получают §R33%§! §Hопустошения§!.$TABBED_NEW_LINE$— Это затрагивает обе системы: и §Hточку назначения§!, и систему, из которой §Hсовершается прыжок§!."
 arkship_exodus_jump_fleet_effect: "$FLEET_EFFECTS_HEADER$$TABBED_NEW_LINE$• Все подконтрольные флотилии будут запущены в случайную систему в пределах радиуса разброса.$TABBED_NEW_LINE$• Запущенные таким образом флотилии получат §G+33%§! к §Hскорострельности§! на £time£ §H120 дней§!."
 arkship_exodus_jump_ship_button: "$arkship_exodus_jump_fleet_effect$ $DOUBLE_NEW_LINE$$arkship_exodus_jump_system_effect$ $DOUBLE_NEW_LINE$$arkship_exodus_jump_desc$"
 arkship_exodus_jump_activity_key: "Идет расчет прыжка (цель: $NAME$, §Y$PROGRESS$%§!)"
 arkship_exodus_jump_progress_activity_key: "Производится прыжок (§Y$PROGRESS$%§!)"
