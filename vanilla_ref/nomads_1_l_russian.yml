 nomads.3075.name: "Контракты кочевников"
 nomads.3075.desc: "§Y[From.GetName]§! — представители §Hкочевой§! цивилизации, готовые принимать предлагаемые нами §Hконтракты§! в обмен на скромную оплату.\n\nТакое сотрудничество может оказаться выгодным для обеих сторон; нам весьма пригодятся их познания в области добычи ресурсов и исследования космоса."
 nomads.3075.tt: "§GОткройте карту галактики и щелкните правой кнопкой мыши по системе, чтобы §Hвыдать контракт.§!§!"
 # Onboard Contract: Physics Research
 contract_issued_lore_onboard_physics_research: "§L«Мы хотим продвинуться в области физических исследований. Свежий взгляд был бы очень полезен».§!"
 contract_completed_lore_onboard_physics_research: "§L«Ваши исследователи расширили наше понимание физической вселенной».§!"
 contract_failed_lore_onboard_physics_research: "§L«Мы ожидали прорыва в физике, но вы лишь завели нас в тупик».§!"
 contract_onboard_physics_research: "Удалённые физические исследования"
 contract_onboard_physics_research_issuer_desc: "Лаборатории кораблей-ковчегов у кочевников работают в уникальных условиях, и они могут помочь нам ускорить физические исследования."
 contract_onboard_physics_research_desc: "Провести £physics£ §Yфизические исследования§! на борту корабля-ковчега для заказчика."
 contract_onboard_physics_research_chain_title: "$contract_onboard_physics_research$"
 contract_onboard_physics_research_chain_desc: "$contract_onboard_physics_research_desc$"
 CONTRACT_ONBOARD_physics_RESEARCH_PROJECT: "$contract_onboard_physics_research$"
 CONTRACT_ONBOARD_physics_RESEARCH_PROJECT_DESC: ""
 # Onboard Contract: Society Research
 contract_issued_lore_onboard_society_research: "§L«Мы хотим углубить наши познания в области социологии и биологии. Внешние наблюдатели часто подмечают то, что мы сами упускаем из виду».§!"
 contract_completed_lore_onboard_society_research: "§L«Ваши социологические исследования расширили наше понимание».§!"
 contract_failed_lore_onboard_society_research: "§L«Мы обратились к вам ради прорыва в социологических исследованиях, а не ради получения каких-то обрывочных данных».§!"
