 TOAST_EXODUS_JUMP_COMPLETE_TITLE: "Прыжок исхода завершен"
 TOAST_EXODUS_JUMP_COMPLETE_DESC: "Корабль-ковчег §Y«$ARKSHIP$»§! прибыл в систему §Y$SYSTEM$§!."
 TOAST_EXODUS_JUMP_AFTERMATH_TITLE: "Катастрофа в системе"
 TOAST_EXODUS_JUMP_AFTERMATH_DESC: "В системе §Y$SYSTEM$§! случился разрыв пространственно-временного континуума, вызванный кораблем-ковчегом §Y«$ARKSHIP$»§!."
 opinion_arkship_exodus_jump: "$arkship_exodus_jump$"
 arkship_lithoid_consume_world: "Поглотить мир"
 arkship_lithoid_consume_world_desc: "§LКорабль-ковчег выпускает на волю рой, поглощающий пригодный для жизни мир и в течение нескольких месяцев разбирающий его на минералы и органику.§!"
 arkship_lithoid_consume_world_effect: "$PLANET_EFFECTS_HEADER$$TABBED_NEW_LINE$— Планета постепенно поглощается. Корабль получает §H$minerals_with_icon$§! и §H£food£ пищу§!.$TABBED_NEW_LINE$— После завершения цель уничтожается."
 arkship_lithoid_consume_world_ship_button: "$arkship_lithoid_consume_world_effect$\n\n$arkship_lithoid_consume_world_desc$"
 arkship_lithoid_consume_world_activity_key: "Подготовка к поглощению"
 arkship_lithoid_consume_world_progress_activity_key: "Идет поглощение мира (§Y$PROGRESS$%§!)"
 arkship_lithoid_consume_world_required_progress_key: "£time£ §WЗависит от размера планеты§!"
 arkship_lithoid_consume_world_habitable_fail_tt: "$TRIGGER_FAIL$Цель НЕ является §Hдоступной для колонизации планетой§!"
 arkship_lithoid_consume_world_uninhabited_fail_tt: "$TRIGGER_FAIL$Цель уже §Hколонизирована§!"
 arkship_lithoid_consume_world_being_devoured_fail_tt: "$TRIGGER_FAIL$Цель уже §Hпоглощается§!"
 opinion_arkship_lithoid_consume_world: "$arkship_lithoid_consume_world$"
 MESSAGE_ARKSHIP_LITHOID_CONSUME_WORLD_FOOD_TEXT: "Поглотив планету $PLANET|Y$, рой получает дополнительную пищу."
 TOAST_LITHOID_CONSUME_WORLD_COMPLETE_TITLE: "Мир поглощен"
 TOAST_LITHOID_CONSUME_WORLD_COMPLETE_DESC: "Корабль-ковчег §Y«$ARKSHIP$»§! поглотил планету §Y$PLANET$§!. Мы всё еще голодны."
 arkship_nanotech_consume_world: "Нанитовое поглощение"
 arkship_nanotech_consume_world_desc: "§LВыпустить нанитовый рой. Он расщепляет и поглощает обитаемый мир. При поглощении биомассы и минералов наниты восстанавливаются и размножаются.§!"
 arkship_nanotech_consume_world_effect: "$PLANET_EFFECTS_HEADER$$TABBED_NEW_LINE$— Наноботы постепенно поглощают планету, принося §H$nanites_with_icon$§!.$TABBED_NEW_LINE$— При завершении цель превращается в §Hнепригодный для жизни нанитовый мир§!."
 arkship_nanotech_consume_world_ship_button: "$arkship_nanotech_consume_world_effect$\n\n$arkship_nanotech_consume_world_desc$"
 arkship_nanotech_consume_world_activity_key: "Выпускается рой нанитов"
 arkship_nanotech_consume_world_progress_activity_key: "Идет поглощение мира (§Y$PROGRESS$%§!)"
 arkship_nanotech_consume_world_required_progress_key: "$arkship_lithoid_consume_world_required_progress_key$"
 arkship_nanotech_consume_world_being_devoured_fail_tt: "$TRIGGER_FAIL$Цель уже §Hпроходит нанитовое преображение§!"
 arkship_nanotech_consume_world_nanotech_world_fail_tt: "$TRIGGER_FAIL$Цель обозначена как §H$col_nanotech_world$§!"
 TOAST_NANOTECH_CONSUME_WORLD_COMPLETE_TITLE: "Мир ассимилирован"
 TOAST_NANOTECH_CONSUME_WORLD_COMPLETE_DESC: "Рой нанитов с корабля §Y«$ARKSHIP$»§! полностью ассимилировал планету §Y$PLANET$§! и превратил ее в непригодный для жизни нанитовый мир."
 MESSAGE_ARKSHIP_NANOTECH_CONSUME_WORLD_NANITES_TEXT: "Рои нанитов, дробящие планету $PLANET|Y$, размножаются и дают множество новых нанитов."
 MESSAGE_ARKSHIP_NANOTECH_CONSUME_WORLD_FINAL_TEXT: "Последние сооружения на планете $PLANET|Y$ разобраны. Рой полностью преобразовал всю материю."
 situation_arkship_lithoid_consume_planet: "Поглощение планеты [Target.GetName]"
 situation_arkship_lithoid_consume_planet_type: "Корабль-ковчег ведет поглощение"
 situation_arkship_lithoid_consume_planet_desc: "Рои литоидов, тысячами выпущенные с корабля-ковчега, будут поедать кору и мантию мира до тех пор, пока ничего не останется."
 situation_arkship_lithoid_consume_planet_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$"
 situation_arkship_nanotech_consume_planet: "Абсорбция планеты [Target.GetName]"
 situation_arkship_nanotech_consume_planet_type: "Корабль-ковчег ведет абсорбцию"
 situation_arkship_nanotech_consume_planet_desc: "Корабль-ковчег выпускает рои нанитов, разбирающие и занимающие этот мир. Порода, почва и атмосфера дробятся на части и собираются в новые наниты."
 situation_arkship_nanotech_consume_planet_monthly_change_tooltip: "Ход извлечения нанитов"
 situation_arkship_consuming_world_absent_desc: "§YКорабль-ковчег§! должен вернуться на орбиту мира §Y[Target.GetName]§! в течение §H180 дней§!, иначе поглощение прекратится."
 string_arkship_absent_grace: "Корабль-ковчег отсутствует"
 arkship_settle: "Поселиться"
 arkship_settle_desc: "Обитатели корабля-ковчега в последний раз сходят на землю. Звезды мы променяли на твердую почву под ногами; родной корабль — на постоянный дом. Отныне мы больше не кочевники. Эта страница в истории нашего народа закончилась; теперь начинается новая."
 arkship_settle_effect: "$arkship_settle_empire_effects$ $DOUBLE_NEW_LINE$ $arkship_settle_arkship_effects$ $DOUBLE_NEW_LINE$ $arkship_settle_planet_effects$"
 arkship_settle_arkship_effects: "$ARKSHIP_EFFECTS_HEADER$ $TABBED_NEW_LINE$• §Y£colony£ Колония§! переносится на выбранную планету. $TABBED_NEW_LINE$• §YКорабль-ковчег§! будет покинут и разобран."
 arkship_settle_planet_effects: "$PLANET_EFFECTS_HEADER$ $TABBED_NEW_LINE$• Добавляется модификатор §Y$arkship_parts$§! $TABBED_NEW_LINE$$t$• $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+60%§! $TABBED_NEW_LINE$$t$• $MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!"
 arkship_settle_empire_effects: "$EMPIRE_EFFECTS_HEADER$ $TABBED_NEW_LINE$• §PГосударство перестанет быть кочевым!§! $TABBED_NEW_LINE$• §YМаршрутные станции§! в никому не принадлежащх системах превратятся в §Yкосмические базы§!. $TABBED_NEW_LINE$• Оставшиеся §Yкорабли-ковчеги§! превратятся в §Yподданных§!."
 arkship_settle_ship_button: "$arkship_settle_effect$ $DOUBLE_NEW_LINE$$arkship_settle_desc$"
 arkship_settle_activity_key: "Подготовка к переселению (§Y$PROGRESS$%§!)"
 arkship_settle_progress_activity_key: "Идет переселение (§Y$PROGRESS$%§!)"
 arkship_settle_required_progress_key: "£time£ $@arkship_settle_required_progress|0$ §Wдн.§!"
 arkship_parts: "Останки корабля-ковчега"
 arkship_parts_desc: "Продвинутые технологии и компьютеры, снятые с корабля-ковчега, позволяют стабилизировать климат этого мира."
 nomads.4705.name: "Переселение завершено"
 nomads.4705.desc.regular: "Долгий путь корабля-ковчега §Y[event_target:settling_arkship.GetName]§! подошел к концу. Ради этого мига мы трудились несколько лет, разбирали инфраструктуру и переправляли ее вниз с помощью гравитационного колодца. Сегодня мы наконец готовы поставить точку. Мы, [event_target:player_country.GetSpeciesNamePlural], — свидетели исторического момента, о котором еще долго будут говорить потомки. А теперь — за дело: нас ждет §Y[event_target:settled_planet.GetName]§!!"
 nomads.4705.desc.machine: "Перенос всех единиц и инфраструктуры с корабля §Y«[event_target:settling_arkship.GetName]»§! на [event_target:settled_planet.GetPlanetMoon_RULOC&acc] противоречит прогнозам о будущем §Y[event_target:player_country.GetName&gen]§!. Для приспособления к оседлому существованию будут выработаны новые очереди приоритетов."
 nomads.4705.desc.hive: "Спустя несколько лет подготовки не только инфраструктуры корабля §Y[event_target:settling_arkship.GetName]§!, но и собственных тел — мы упрочнили структуру костей и оптимизировали строение легких — мы готовы осесть. Начинается новый этап жизненного цикла §Y[event_target:player_country.GetName&gen]§!; возможно, оседлая жизнь подойдет нам больше, чем космическая."
 nomads.4700.a: "[event_target:settled_planet.GetPlanetMoon::Этот|||fem:Эта|||neut:Это] [event_target:settled_planet.GetPlanetMoon_RULOC&nom] станет фундаментом, на котором мы воздвигнем новое государство."
 nomads.4700.settle.tt: "§Y[event_target:player_country.GetName]§! [event_target:player_country.GetName::прекращает|||neut:прекращает|||pl:прекращают] быть £nomad£ ['concept_nomadic_empire', кочевым государством] и [event_target:player_country.GetName::колонизирует|||neut:колонизирует|||pl:колонизируют] планету §Y[event_target:settled_planet.GetName]§! как £planet£ ['concept_settled_empire', оседлое государство].\n\n"
 nomads.4700.b: "$nomads.4700.a$"
 settlement_scuttle_arkships_effect_tt: "\nВсе оставшиеся §Yкорабли-ковчеги§! §Rразобраны§!, а их жители — переселены на [event_target:settled_planet.GetPlanetMoon_RULOC&acc] §Y[event_target:settled_planet.GetName]§!."
 nomads.4700.c: "Мы продолжим странствовать среди звезд."
 nomads.4700.settle_subject.tt: "Корабль §Y«[event_target:settling_arkship.GetName]»§! остаётся на [event_target:settled_planet.GetPlanetMoon_RULOC&prep] §Y[event_target:settled_planet.GetName]§! в качестве нового ['concept_subject', подданного] §Y[event_target:player_country.GetName&gen]§!.\n\n"
 nomads.4700.d: "Мы продолжим править звездами с [event_target:settled_planet.GetPlanetMoon::этого|||fem:этой] [event_target:settled_planet.GetPlanetMoon_RULOC&gen]."
 origin_nomadic_settled: "Приземлившиеся"
 origin_nomadic_settled_desc: "Это государство основали переселенцы, перебравшиеся с корабля-ковчега в новый мир."
 origin_tooltip_nomadic_settled_effects: "Нет эффектов"
 origin_nomadic_subject: "Странствующие в пустоте"
 origin_nomadic_subject_desc: "Кочевники, скитающиеся среди звезд и живущие под властью нового планетарного правительства, члены которого в прошлом были такими же кочевниками."
 origin_tooltip_nomadic_subject_effects: "Нет эффектов"
 make_subject_nomadic_tt: "\nБудет создан ['concept_subject', подданный]-кочевник. Он получит все оставшиеся §Yкорабли-ковчеги§!, §Yлогистические корабли§! и §Yмаршрутные станции§!."
 convert_logistics_to_construction_tt: "\nВсе ['concept_logistic_ships', логистические корабли] заменяются на ['concept_construction_ships', строительные корабли]."
 convert_waystations_into_outposts_tt: "\nВсе £waystation£ ['concept_waystations', маршрутные станции] в незанятых системах заменяются на ['concept_outposts', форпосты], и системы с ними передаются во владение."
 create_outposts_in_waystation_systems_for_subject_tt: "\nВо всех незанятых системах на расстоянии нескольких прыжков ($@arkship_subject_settle_outpost_range|Y0$) от системы §Y[event_target:settled_system.GetName]§!, где есть £waystation£ ['concept_waystation', маршрутная станция], строится ['concept_outpost', форпост], и эти системы переходят во владение нашего нового ['concept_subject', подданного]."
 create_outposts_in_waystation_systems_for_overlord_tt: "\nВо всех незанятых системах на расстоянии нескольких прыжков ($@arkship_subject_settle_outpost_range|Y0$) от системы §Y[event_target:settled_system.GetName]§!, где есть £waystation£ ['concept_waystation', маршрутная станция], строится ['concept_outpost', форпост], и эти системы переходят к нам."
 decision_nomad_embarkation: "Отправиться в путь"
 decision_nomad_embarkation_desc: "Звёзды зовут."
 nomad_embarkation_effect: "$nomad_embarkation_empire_effects$ $DOUBLE_NEW_LINE$ $nomad_embarkation_planet_effects$"
 nomad_embarkation_empire_effects: "$EMPIRE_EFFECTS_HEADER$ $TABBED_NEW_LINE$— Выбор одного из нескольких вариантов:\n$tt$—§P Государство перестанет быть кочевым, а оставшиеся колонии превратятся в подданных!§!\n$tt$—§PБудет создан подданный-кочевник — [Root.GetName]!§!$TABBED_NEW_LINE$— §YКосмические базы§! в принадлежащих нам системах превратятся в §Yмаршрутные станции§!."
 nomad_embarkation_planet_effects: "$PLANET_EFFECTS_HEADER$ $TABBED_NEW_LINE$— §PЭтот мир будет брошен!§!$TABBED_NEW_LINE$— Будет добавлен модификатор §Y«$stripped_planet$»§!$TABBED_NEW_LINE$$t$— $MOD_POP_ENVIRONMENT_TOLERANCE$: §R-60%§!$TABBED_NEW_LINE$$t$— $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-2§!"
 nomad_embarkation_effect_short: "['concept_arkship_embark', Отправиться в путь] и стать £nomad£ ['concept_nomadic_empire', кочевым государством]. Оставшиеся ['concept_colonies', колонии] станут ['concept_subject', подданными]."
 already_embarking: "§RУже идет отправка в путь§!"
 nomads.4710.name: "Отправка в путь завершена"
 nomads.4710.desc.regular: "До недавнего времени для многих из нас космос оставался недостижимой мечтой. Пока одни бороздили мировое пространство, другие могли прикоснуться к их жизни только опосредованно, через записи. Они рождались, жили и умирали, глядя в небо. Но теперь всё будет иначе.\n\nНа только что построенном §Hкорабле-ковчеге§! мы преодолеем тяготение и вырвемся на просторы космоса, где ждут неизведанные чудеса. §Y[From.GetName]§!, наша колыбель, навсегда останется в памяти народа. Даже в самых дальних уголках вселенной мы будем произносить про себя это слово."
 nomads.4710.desc.machine: "Программа строительства §Hкорабля-ковчега§! завершена. Зависимость единиц от [From.GetPlanetMoon_RULOC&gen] с учетом новых обстоятельств: нулевая. Процессы оптимизированы под мобильное существование в космосе. С мира §Y«[From.GetName]»§! будет удалена инфраструктура. Все необходимые системы перестроены на поддержку мобильного существования."
 nomads.4710.desc.hive: "Мы, [event_target:player_country.GetName], успели повидать многое, но°всё же наши единицы ограничены пределами обитаемых миров. В современную эпоху межзвездных перелетов нельзя быть прикованным к одной звезде. На борту нового §Hкорабля-ковчега§! мы будем свободны, а мир §Y[From.GetName]§! отдаст нам все необходимые для этого ресурсы."
 nomads.4710.desc.regular.doomsday: "$nomads.4710.desc.regular$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.machine.doomsday: "$nomads.4710.desc.machine$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.desc.hive.doomsday: "$nomads.4710.desc.hive$\n\n$nomads.4710.doomsday_appendix$"
 nomads.4710.doomsday_appendix: "Планета §Y[From.GetName]§! горит где-то позади, охваченная давно предсказанным катаклизмом, но наш народ наконец-то §Gспасён§! и летит в бескрайний космос на крыльях §Hкорабля-ковчега§!."
 nomads.4710.a.military: "Мы отправимся в путь на §Hбоевом корабле-ковчеге§!."
 nomads.4710.embark.tt: "§Y[event_target:player_country.GetName]§! [event_target:player_country.GetName::станет|||neut:станет|||pl:станут] §Hкочевым государством§!, отправившись в путь на борту §Hкорабля-ковчега§!\n"
 nomads.4710.a.science: "Мы будем изучать галактику на §Hнаучном корабле-ковчеге§!."
 nomads.4710.a.civilian: "Мы придем к процветанию на §Hгражданском корабле-ковчеге§!."
 nomads.4710.b: "Они станут нашим подданным."
 embark_create_subject: "\n§Y[from.GetName]§! [from.GetName::взойдет|||neut:взойдет|||pl:взойдут] на §Hкорабль-ковчег§! и [from.GetName::станет|||neut:станет|||pl:станут] новым подданным-кочевником §Y[event_target:player_country.GetName&gen]§!.\n"
 embark_leaves_behind_subject: "\nБудет создан оседлый подданный. Он получит все оставшиеся ['concept_colonies', колонии] и ['concept_starbases', космические базы]."
 create_waystations_in_systems_for_nomad_tt: "\n§HКосмические базы§! в принадлежащих системах без §Hмаршрутных станций§! превратятся в §Hмаршрутные станции§!."
 NAME_Embarked_Arkship: "Нью-[From.GetName]"
 stripped_planet: "Лишенный ресурсов мир"
 stripped_planet_desc: "Население этого мира извлекло из поверхности почти все ресурсы перед тем, как отбыть на корабле-ковчеге. Осталась только тишина."
 #######################
 # Arkship Modules
 #######################
 sm_arkship_grand_archive: "Великий архив"
 sm_arkship_grand_archive_desc: "Сооружение для хранения и демонстрации примечательных ['concept_specimen', экземпляров] — экспонатов и особей, собранных в галактике, в том числе §Yкосмической фауны§!."
 sm_arkship_engineering_bay: "Инженерный отсек"
 sm_arkship_engineering_bay_desc: "Поддержание в работоспособном состоянии такого огромного корабля — это постоянная война с энтропией. Одни части приходится ставить на место других, из систем — выжимать последние соки… Борьбе не видать конца."
 sm_arkship_beastport: "$sm_beastport$"
 sm_arkship_beastport_desc: "$sm_beastport_desc$"
 sm_arkship_docking_bay: "Стыковочный отсек"
 sm_arkship_docking_bay_desc: "В стыковочных отсеках всегда царит шум: многочисленные корабли — ниточки, связывающие корабль-ковчег с остальной галактикой, — непрерывно снуют туда и обратно."
 sm_arkship_habitation_module: "Обитаемый модуль"
 sm_arkship_habitation_module_desc: "В расширенные жилые отсеки корабля-ковчега помещается больше пассажиров. Нет ничего лучше родных коридоров, сколь бы узкими они ни были."
 sm_arkship_sensor_array: "Усовершенствованная матрица датчиков"
 sm_arkship_sensor_array_desc: "Встроенные в корпус блоки датчиков сканируют всё вокруг в пределах досягаемости. Мало что сможет ускользнуть от нашего внимания."
 sm_arkship_sensor_array_tt: "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:arkship_deep_scan']"
 sm_arkship_mining_array: "Планетарная инженерная лаборатория"
 sm_arkship_mining_array_desc: "Специальные буровые и добывающие установки способны расколоть кору планеты, чтобы добраться до ее содержимого."
 sm_arkship_mining_array_tt: "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:arkship_strip_mine']"
 STARBASE_EQUIPPED_COMPONENT_HEADER: "$COUNT$× $NAME$"
 ARKSHIP_COMPONENTS: "Компоненты корабля-ковчега:"
 ADDS_ARKSHIP_XL_SLOTS: "£ship_xl_slot£ Ячейки для оружия: §G+1§!"
 ADDS_ARKSHIP_H_SLOTS: "£ship_h_slot£ Ячейки для оружия: §G+2§!"
 ADDS_ARKSHIP_L_SLOTS: "£ship_l_slot£ Ячейки для оружия: §G+2§!"
 ADDS_ARKSHIP_M_SLOTS: "£ship_m_slot£ Ячейки для оружия: §G+4§!"
 ADDS_ARKSHIP_G_SLOTS: "£ship_g_slot£ Ячейки для оружия: §G+4§!"
 ADDS_ARKSHIP_S_SLOTS: "£ship_s_slot£ Ячейки для оружия: §G+8§!"
 ADDS_ARKSHIP_PD_SLOTS: "£ship_pd_slot£ Ячейки для оружия: §G+8§!"
 sm_arkship_hangar_bay: "Ангарные отсеки"
 sm_arkship_hangar_bay_desc: "В обширных ангарных отсеках размещены целые эскадрильи, готовые в любую минуту взлететь по тревоге. Корабль — не единственный наш рубеж обороны."
 sm_arkship_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$В этих ангарах размещаются §Yштурмовики§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_archaeo_hangar_bay: "Ангары древних дронов-бурильщиков"
 sm_arkship_archaeo_hangar_bay_desc: "Мертвым нет покоя. Древние штурмовики, построенные давно погибшими цивилизациями, вновь взлетают ввысь."
 sm_arkship_archaeo_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$В этих специализированных ангарах размещаются §Yдревние дроны-бурильщики§!.\n"
 sm_arkship_psionic_hangar_bay: "Ангары псионических бомбардировщиков"
 sm_arkship_psionic_hangar_bay_desc: "Защищенные ангары, где всё настроено на частоту резонанса псионического оружия. Постоянный шум ощущается даже физически."
 sm_arkship_psionic_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$В этих специализированных ангарах размещаются §Yпсионические бомбардировщики§!.\n"
 sm_arkship_amoeba_hangar_bay: "Ангары жгутиков амебы"
 sm_arkship_amoeba_hangar_bay_desc: "Герметизированный отсек, где обитают наши спутники — космические амебы. Они предпочитают жить поближе к реактору, где теплее."
 sm_arkship_amoeba_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$В этих специализированных ангарах размещаются §Yжгутики амебы§!.\n"
 sm_arkship_swarm_hangar_bay: "Ангары штурмовиков роя"
 sm_arkship_swarm_hangar_bay_desc: "В компактных пусковых установках размещены тысячи автономных ударных единиц, готовых по команде образовать рой."
 sm_arkship_swarm_hangar_bay_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_H_SLOTS$\n$t$В этих специализированных ангарах размещаются §Yштурмовики роя§!.\n"
 sm_arkship_laser_battery: "Лазерная батарея"
 sm_arkship_laser_battery_desc: "Весь наружный корпус равномерно покрыт батареями лазерных излучателей, поражающих цели с невероятной точностью."
 sm_arkship_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$В этих турелях размещаются §Yлазеры§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_archaeo_laser_battery: "Батарея древних обрушителей"
 sm_arkship_archaeo_laser_battery_desc: "Чужое оружие непонятной конструкции. Как именно оно функционирует — загадка, но одно ясно наверняка: эти орудия крайне смертоносны."
 sm_arkship_archaeo_laser_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$В этих специализированных турелях размещаются §Yдревние кавитационные обрушители§!.\n"
 sm_arkship_lance_battery: "Установка лучевого копья"
 sm_arkship_lance_battery_desc: "Лучевое копье, способное поражать цели разрушительными энерголучами на огромном расстоянии."
 sm_arkship_lance_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$В этой турели размещаются §Yлучевые копья§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_particle_launcher: "Батарея лучевых излучателей"
 sm_arkship_particle_launcher_desc: "Дальнобойные излучатели частиц — невероятно мощные, но с низкой скорострельностью. Способны уничтожать цели еще до того, как те подберутся на расстояние нанесения удара."
 sm_arkship_particle_launcher_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$В этих турелях размещаются §Yлучевые излучатели§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_psionic_torpedo: "Батарея пусковых установок на зро"
 sm_arkship_psionic_torpedo_desc: "Торпедные аппараты, заряженные псионическими торпедами. Их траекторию определяет не компьютер, а псионический резонанс."
 sm_arkship_psionic_torpedo_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$В этих специализированных турелях размещаются §Yпусковые установки на зро§!.\n"
 sm_arkship_arc_emitter_battery: "Установка дуговых излучателей"
 sm_arkship_arc_emitter_battery_desc: "Батарея дуговых излучателей, поражающих непосредственно системы врага в обход его брони."
 sm_arkship_arc_emitter_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$В этой турели размещаются §Yдуговые излучатели§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_psionic_lightning_battery: "Батарея псионических молний"
 sm_arkship_psionic_lightning_battery_desc: "Псионическая энергия, накапливаемая в проложенных вдоль корпуса проводниках, образовывает направленные разряды; перед ними бессильны традиционные средства защиты."
 sm_arkship_psionic_lightning_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$В этих специализированных турелях размещаются §Yпсионические молнии§!.\n"
 sm_arkship_mass_driver_battery: "Батарея ускорителей масс"
 sm_arkship_mass_driver_battery_desc: "Кинетические турели, стреляющие высокоскоростными снарядами. Надежные и опасные: новое — не всегда лучшее."
 sm_arkship_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$В этих турелях размещаются §Yускорители масс§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_archaeo_mass_driver_battery: "$ARCHAEO_KINETIC$"
 sm_arkship_archaeo_mass_driver_battery_desc: "Добытое на раскопках кинетическое оружие древнего производства. Допуски при изготовлении стволов оказались минимальны — современные инженеры могут только мечтать повторить это достижение."
 sm_arkship_archaeo_mass_driver_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$В этих специализированных турелях размещаются §Yдревние макробатареи§!.\n"
 sm_arkship_kinetic_artillery_battery: "$KINETIC_ARTILLERY_1$"
 sm_arkship_kinetic_artillery_battery_desc: "Дальнобойные кинетические орудия, предназначенные для поражения целей на больших расстояниях."
 sm_arkship_kinetic_artillery_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$В этих турелях размещаются §Yкинетические батареи§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_lm_accelerator: "$LM_ACCELERATOR_SET$"
 sm_arkship_lm_accelerator_desc: "Эти турели оснащены каналами для подведения живого металла и ремонта в бою, благодаря чему они могут долго сохранять максимальную скорострельность."
 sm_arkship_lm_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_SLOTS$\n$t$В этих специализированных турелях размещаются §Yпластичные ускорители снарядов§!.\n"
 sm_arkship_mass_accelerator: "Сверхмощные ускорители масс"
 sm_arkship_mass_accelerator_desc: "Самые тяжелые кинетические орудия, которые только можно установить на корпус. Каждый снаряд разгоняется до такой скорости, что без труда пробивает и щиты, и броню."
 sm_arkship_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$В этой турели размещаются §Yсверхмощные ускорители масс§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_archaeo_mass_accelerator: "$ARCHAEO_X$"
 sm_arkship_archaeo_mass_accelerator_desc: "Найденный нами древний ускоритель невероятных размеров. За прошедшие века он почти не пострадал."
 sm_arkship_archaeo_mass_accelerator_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_XL_SLOTS$\n$t$В этой специализированной турели размещается §Yдревняя сатураторная артиллерия§!.\n"
 sm_arkship_missile_battery: "Ракетная батарея"
 sm_arkship_missile_battery_desc: "Управляемые ракеты для поражения целей на расстоянии. Медленнее энергетического оружия, но выдержать попадание такой ракеты сложнее."
 sm_arkship_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$В этих турелях размещаются §Yракетные установки§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_archaeo_missile_battery: "$ARCHAEO_MISSILE$"
 sm_arkship_archaeo_missile_battery_desc: "Древние самонаводящиеся ракеты, поражающие цели с невероятной точностью. Обнаружены в хорошем состоянии во время раскопок."
 sm_arkship_archaeo_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_S_SLOTS$\n$t$В этих специализированных турелях размещается §Yдревняя система наноракетного огня§!.\n"
 sm_arkship_swamer_missile_battery: "$SWARMER_MISSILE_1$"
 sm_arkship_swamer_missile_battery_desc: "Пусковые установки, заряженные роевыми ракетами. Они перегружают системы ПВО весом залпа."
 sm_arkship_swamer_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_M_SLOTS$\n$t$В этих турелях размещаются §Yракетные рои§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_scourge_missile_battery: "$SCOURGE_MISSILE_1$"
 sm_arkship_scourge_missile_battery_desc: "Биологические боеголовки — одно из средств в арсенале тех, кто осмелился обернуть оружие Кары против нее самой."
 sm_arkship_scourge_missile_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_G_SLOTS$\n$t$В этих специализированных турелях размещаются §Yкарающие ракеты§!.\n"
 sm_arkship_flak_battery: "$FLAK_BATTERY_1$"
 sm_arkship_flak_battery_desc: "Батареи ПВО, предназначенные для уничтожения штурмовиков и ракет, чтобы те не успели поразить корабль."
 sm_arkship_flak_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$В этих турелях размещаются §Yзенитные батареи§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_pd_battery: "Батарея ПВО"
 sm_arkship_pd_battery_desc: "Плотная сеть орудий ближнего действия, покрывающая весь корпус. Система ПВО отслеживает и перехватывает угрозы еще до того, как те достигнут корабля."
 sm_arkship_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$В этих турелях размещаются §Yбатареи ПВО§!, которые автоматически совершенствуются по мере развития наших технологий.\n"
 sm_arkship_archaeo_pd_battery: "$ARCHAEO_POINTDEFENCE$"
 sm_arkship_archaeo_pd_battery_desc: "Древние батареи ПВО неизвестного происхождения. Эффективны так же, как и тогда, много столетий назад."
 sm_arkship_archaeo_pd_battery_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_PD_SLOTS$\n$t$В этих специализированных турелях размещаются §Yдревние оборонительные метатели сетей§!.\n"
 #########################
 # Arkship Spinal Mounts
 #########################
 ARKSHIP_SPINAL_MOUNT: "Осевая установка"
 ADDS_ARKSHIP_T_SLOTS: "Дополнительные £ship_t_slot£ ячейки для оружия: §G+1§!"
 sm_arkship_spinal_devastator_mount: "Установка «Опустошителя»"
 sm_arkship_spinal_devastator_mount_desc: "Это оружие требует колоссального количества энергии. Всего один выстрел лишает света миллионы жилищ на несколько часов. Приказ о выстреле никогда не отдается просто так."
 sm_arkship_spinal_devastator_mount_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_T_SLOTS$\n$t$В этой осевой установке размещается §Y$ARKSHIP_DEVASTATOR_WEAPON$§!."
 ARKSHIP_DEVASTATOR_WEAPON: "Орудие «Опустошитель»"
 sm_arkship_capital_shipyard: "Главная верфь"
 sm_arkship_capital_shipyard_desc: "Эти верфи, расположенные в самом сердце корабля-ковчега, способны строить корабли гигантских размеров, пока мы остаемся в движении."
 sm_arkship_capital_shipyard_tt: "Верфи: §Yможно строить линейные корабли§!"
 arkship_capital_shipyard_trigger: "$TRIGGER_FAIL$§RТребуется осевая установка §Y$sm_arkship_capital_shipyard$§!§!"
 sm_arkship_planetary_refinery: "Планетарный репроцессор"
 sm_arkship_planetary_refinery_desc: "Эти гигантские шестерни способны перемалывать некрупные небесные тела, обеспечивая нас огромными объемами сырья."
 sm_arkship_planetary_refinery_tt: "$sm_arkship_mining_array_tt$ $TABBED_NEW_LINE$['scripted_action:arkship_reprocess_planet']"
 tech_arkship_planetary_refinery: "$sm_arkship_planetary_refinery$"
 tech_arkship_planetary_refinery_desc: "$sm_arkship_planetary_refinery_desc$"
 sm_arkship_stellar_igniter: "Звездный двигатель"
 sm_arkship_stellar_igniter_desc: "Система впрыска звездной материи, способная вызывать процессы термоядерного синтеза в звездном масштабе. Безопасный режим работы отсутствует."
 sm_arkship_stellar_igniter_tt: "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:arkship_stellar_ignition']"
 tech_arkship_stellar_igniter: "$sm_arkship_stellar_igniter$"
 tech_arkship_stellar_igniter_desc: "$sm_arkship_stellar_igniter_desc$"
 sm_arkship_system_scanner: "Матрица подпространственной визуализации"
 sm_arkship_system_scanner_desc: "Пустота способна говорить. Тем, кто умеет слушать, она нашептывает тайны бесчисленного множества миров."
 sm_arkship_system_scanner_tt: "$sm_arkship_sensor_array_tt$ $TABBED_NEW_LINE$['scripted_action:arkship_subspace_image']"
 tech_arkship_system_scanner: "$sm_arkship_system_scanner$"
 tech_arkship_system_scanner_desc: "$sm_arkship_system_scanner_desc$"
 sm_arkship_exodus_jump: "Координатор прыжка исхода"
 sm_arkship_exodus_jump_desc: "Координатор прыжка пока еще находится на стадии прототипа, но однажды он позволит нам перемещаться между галактиками в мгновение ока."
 sm_arkship_exodus_jump_tt: "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:arkship_exodus_jump']"
 tech_arkship_exodus_jump: "$sm_arkship_exodus_jump$"
 tech_arkship_exodus_jump_desc: "$sm_arkship_exodus_jump_desc$"
 ###############################
 # Arkship Starbase "Buildings"
 ###############################
 ADDS_ARKSHIP_L_UTILITY_SLOTS: "£ship_l_slot£ Ячейки для систем: §G+3§!"
 ADDS_ARKSHIP_AUX_SLOTS: "£ship_a_slot£ Вспомогательные ячейки: §G+3§!"
 ADDS_ARKSHIP_AURA_SLOT: "£ship_c_slot£ Основные ячейки: §G+1§!"
 sm_arkship_armor: "Бронирование"
 sm_arkship_armor_desc: "Прочные бронелисты, прикрывающие самые уязвимые части корабля-ковчега. Из-за их массы вырастает нагрузка на бортовые системы, но корабль справляется."
 sm_arkship_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих ячейках для систем размещается §Yбронирование§!, которое автоматически совершенствуется по мере развития наших технологий."
 sm_arkship_lm_armor: "Регенерирующая броня"
 sm_arkship_lm_armor_desc: "В покрывающие корпус бронелисты вплетены волокна живого металла. Бреши в корпусе латаются так же быстро, как и появляются."
 sm_arkship_lm_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих специализированных ячейках для систем размещается §Yрегенерирующая большая нанокомпозитная броня§!, которая автоматически совершенствуется по мере развития наших технологий."
 sm_arkship_archaeo_armor: "$tech_archaeoarmor$"
 sm_arkship_archaeo_armor_desc: "Добытые на раскопках бронелисты из сплава неизвестного происхождения. Проектировщики этих кораблей серьезно позаботились об их живучести."
 sm_arkship_archaeo_armor_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих специализированных ячейках для систем размещается §Yбольшая древняя импульсная броня§!."
 sm_arkship_shield: "Массивы щитов"
 sm_arkship_shield_desc: "Батареи излучателей проецируют на корпус перекрывающие друг друга щиты, способные поглотить даже самый мощный огонь противника."
 sm_arkship_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих специализированных ячейках для систем размещаются §Yщиты§!, которые автоматически совершенствуются по мере развития наших технологий."
 sm_arkship_psi_shield: "$tech_psionic_shield$"
 sm_arkship_psi_shield_desc: "Псионические щиты проникают в слои реальности, недоступные для обычных отражателей. Снаряды, которые не могут не поразить корабль, оказываются бессильны."
 sm_arkship_psi_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих специализированных ячейках для систем размещается §Yбольшой псионический щит§!."
 sm_arkship_archaeo_shield: "$tech_archaeoshield$"
 sm_arkship_archaeo_shield_desc: "Добытые нами проекторы щитов неизвестной конструкции, во много раз более эффективные, чем любые современные устройства."
 sm_arkship_archaeo_shield_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих специализированных ячейках для систем размещается §Yбольшое древнее замедляющее поле§!."
 sm_arkship_crystal_plating: "$tech_crystal_armor_1$"
 sm_arkship_crystal_plating_desc: "Прочные композитные кристаллические панели, покрывающие наружный корпус. Надежно защищают от любого вражеского огня."
 sm_arkship_crystal_plating_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_L_UTILITY_SLOTS$\n$t$В этих специализированных ячейках для систем размещается §Yкристальная обшивка§!, которая автоматически совершенствуется по мере развития наших технологий."
 sm_arkship_afterburner: "$tech_afterburners_1$"
 sm_arkship_afterburner_desc: "Двигательные установки, предназначенные для экстренного разгона, например для сближения в бою или выхода из боя в случае, когда обычные двигатели бессильны."
 sm_arkship_afterburner_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$В этих специализированных вспомогательных ячейках размещаются §Yфорсажные камеры§!, которые автоматически совершенствуются по мере развития наших технологий."
 sm_arkship_armor_hardener: "$tech_armor_hardeners_1$"
 sm_arkship_armor_hardener_desc: "Динамическая защита, усиливающая элементы корпуса за миг до попадания в них вражеских снарядов."
 sm_arkship_armor_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$В этих специализированных вспомогательных ячейках размещается §Yзакаливатель брони§!, который автоматически совершенствуется по мере развития наших технологий."
 sm_arkship_shield_hardener: "$tech_shield_hardeners_1$"
 sm_arkship_shield_hardener_desc: "Частотные модуляторы, меняющие в бою гармонические колебания щитов и тем самым снижающие эффективность орудий для их пробития."
 sm_arkship_shield_hardener_tt: "$ARKSHIP_COMPONENTS$\n$t$$ADDS_ARKSHIP_AUX_SLOTS$\n$t$В этих специализированных вспомогательных ячейках размещается §Yусиление щитов§!, которое автоматически совершенствуется по мере развития наших технологий."
 tech_nomads_titans: "$tech_titans$"
 tech_nomads_titans_desc: "$tech_titans_desc$"
 TECH_UNLOCK_ARKSHIP_TITAN_AURAS_CONSTRUCTION_TITLE: "§H$UNLOCKS_COMPONENTS$§! Ауры кораблей-ковчегов"
 TECH_UNLOCK_ARKSHIP_TITAN_AURAS_CONSTRUCTION_DESC: "§HАуры кораблей-ковчегов§!\nИнновации в сфере технологий поддержки флота теперь позволяют оснащать корабли-ковчеги аурами того же типа, которые устанавливаются на титанах."
 sm_arkship_quantum_destabilizer: "$SHIP_AURA_QUANTUM_DESTABILIZER$"
 sm_arkship_quantum_destabilizer_desc: "Благодаря своей массе корабль-ковчег может проецировать поле, снижающее скорострельность орудий оказавшихся поблизости вражеских кораблей."
 sm_arkship_subspace_snare: "$SHIP_AURA_SUBSPACE_SNARE$"
 sm_arkship_subspace_snare_desc: "Подпространственное якорное поле не дает вражеским кораблям перейти на сверхсветовую скорость, чтобы сбежать."
 sm_arkship_shield_dampener: "$SHIP_AURA_SHIELD_DAMPENER$"
 sm_arkship_shield_dampener_desc: "Установленные на корпусе излучатели помех подавляют щиты оказавшихся поблизости вражеских кораблей, делая противника более уязвимым."
 tech_nomads_juggernaut: "$tech_juggernaut$"
 tech_nomads_juggernaut_desc: "$tech_juggernaut_desc$"
 TECH_UNLOCK_ARKSHIP_JUGGERNAUT_AURAS_CONSTRUCTION_TITLE: "§H$UNLOCKS_COMPONENTS$§! Ауры кораблей-ковчегов"
 TECH_UNLOCK_ARKSHIP_JUGGERNAUT_AURAS_CONSTRUCTION_DESC: "§HАуры кораблей-ковчегов§!\nИнновации в сфере технологий поддержки флота теперь позволяют оснащать корабли-ковчеги аурами того же типа, что устанавливаются на джаггернаутах."
 sm_arkship_aura_strike_craft: "$SHIP_AURA_STRIKE_CRAFT$"
 sm_arkship_aura_strike_craft_desc: "Корабль-ковчег координирует маневры находящихся поблизости союзных штурмовиков, увеличивая их эффективность в бою."
 sm_arkship_aura_hyperlane: "$SHIP_AURA_HYPERLANE$"
 sm_arkship_aura_hyperlane_desc: "Корабль-ковчег помогает другим кораблям во флотилии ориентироваться с помощью навигационных маяков. Расчеты, необходимые для работы гипердвигателей, становятся точнее."
 sm_arkship_aura_pd_penetration: "$SHIP_AURA_PD_PENETRATION$"
 sm_arkship_aura_pd_penetration_desc: "Установленные на корабле-ковчеге системы радиоэлектронной борьбы мешают работе вражеских батарей ПВО, давая нашим орудиям возможность поразить цели."
 sm_arkship_aura_bombardment: "$SHIP_AURA_BOMBARDMENT$"
 sm_arkship_aura_bombardment_desc: "Корабль-ковчег координирует флотскую систему управления огнем, тем самым увеличивая точность орбитальной бомбардировки."
 sm_arkship_aura_range: "$SHIP_AURA_RANGE$"
 sm_arkship_aura_range_desc: "Корабль-ковчег предоставляет флотилии данные целеуказания, из-за чего увеличивается дальность эффективной стрельбы каждого корабля."
 sm_arkship_energy_hub: "Сверхпроводящие каналы"
 sm_arkship_energy_hub_desc: "Корпус оплетен решеткой из сверхпроводящих кабелей, уменьшающих потери на сопротивление и увеличивающих подачу мощности на все системы."
 sm_arkship_food_hub: "Регулирование климатической оптимизации"
 sm_arkship_food_hub_desc: "Благодаря системе управления климатом каждый культивационный отсек и каждая гидропонная палуба работают на пределе возможностей."
 sm_arkship_hydroponics_bay: "Увеличенные культивационные палубы"
 sm_arkship_hydroponics_bay_desc: "Части корабля, оборудованные под крупномасштабную культивацию гидропонных культур."
 sm_arkship_harvest_processing_arrays: "Системы обработки добычи"
 sm_arkship_harvest_processing_arrays_desc: "Специальная инфраструктура и системы обработки, расширяющие возможности корабля-ковчега по сбору и очистке орбитальных залежей."
 sm_arkship_trade_hub: "Внешние логистические системы"
 sm_arkship_trade_hub_desc: "Рельсы для грузовых составов и системы магнитного сцепления на наружном корпусе упрощают передачу ресурсов между кораблем-ковчегом и другими судами."
 sm_arkship_bureaucracy_hub: "Центр административной координации"
 sm_arkship_bureaucracy_hub_desc: "Расположившиеся на нескольких палубах центры для обработки административных данных обеспечивают бесперебойную работу правительства."
 sm_arkship_synapse_hub: "Синаптические реле"
 sm_arkship_synapse_hub_desc: "Нейронные кластеры ускоряют процесс принятия решений в общем сознании на борту корабля-ковчега."
 sm_arkship_maintenance_hub: "Центр обслуживания"
 sm_arkship_maintenance_hub_desc: "В специальных ремонтных отсеках тщательно следят за состоянием деталей. Поврежденные компоненты ремонтируют или заменяют как можно скорее: в космосе от сбоя до катастрофы один шаг."
 sm_arkship_consumer_goods_hub: "Промышленная сборка"
 sm_arkship_consumer_goods_hub_desc: "Конвейеры, перенастроенные под производство потребительских товаров. Вместо необходимой продукции они выпускают продукцию, пользующуюся спросом."
 sm_arkship_alloys_hub: "Высокоэнергетические кузни"
 sm_arkship_alloys_hub_desc: "Комплексы по выплавке сплавов, работающие на пределе допустимых для корпуса возможностей."
 sm_arkship_psi_corps: "Пси-корпус"
 sm_arkship_psi_corps_desc: "Этот комплекс, расположенный в глубине корабля-ковчега подальше от населенных колец, предназначен для обучения псионически одаренных. Благодаря ему пси-корпус может внимательно следить за населением.\n\n§YПси-корпус — ваш друг. Доверьтесь пси-корпусу.§!\n\n£job_telepath£ $job_telepath_plural$ производят £unity£ §Yединство§!, снижают £crime£ §Yпреступность§! и увеличивают $mod_psionic_pop_bonus_workforce_mult$.\n"
 sm_arkship_psi_corps_hive_mind: "$sm_arkship_psi_corps$"
 sm_arkship_psi_corps_desc_hive_mind: "Этот комплекс, расположенный в глубине корабля-ковчега подальше от населенных колец, предназначен для обучения псионически одаренных единиц. Благодаря ему пси-корпус может внимательно следить за населением.\n\n§YПси-корпус — ваш защитник. Доверьтесь пси-корпусу.§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_arkship_psi_corps_machine_intelligence: "$sm_arkship_psi_corps$"
 sm_arkship_psi_corps_desc_machine_intelligence: "Этот комплекс, расположенный в глубине корабля-ковчега подальше от населенных колец, предназначен для обучения псионически одаренных модулей. Благодаря ему пси-корпус может внимательно следить за населением.\n\n§YПси-корпус — ваш защитник. Доверьтесь пси-корпусу.§!\n\n$job_telepath_drone_effect_desc$\n"
 sm_arkship_shield_generator: "Усилитель щитов"
 sm_arkship_shield_generator_desc: "Вторичные блоки излучателей, усиливающие основной комплект щитов и тем самым дополнительно укрепляющие корпус."
 sm_arkship_galactic_stock_exchange: "Биржа"
 sm_arkship_galactic_stock_exchange_desc: "Биржевой зал, работающий круглые сутки и обеспечивающий связь нашего рынка с рынками встреченных нами государств."
 sm_arkship_embassy_complex: "Посольский комплекс"
 sm_arkship_embassy_complex_desc: "Дипломатические номера и залы для приемов, открытые для послов со всей галактики. Дружелюбие может творить чудеса."
 sm_arkship_noble_estates: "Имения знати"
 sm_arkship_noble_estates_desc: "Жилые покои для аристократов, блестящие позолотой. Корабль распространяет влияние их богатых обитателей по всей галактике."
 sm_arkship_slave_processing_facility: "Центр подготовки рабов"
 sm_arkship_slave_processing_facility_desc: "Благодаря этим комплексам в каждой посещаемой нами системе распределение трудовых ресурсов происходит максимально эффективно."
 sm_arkship_resource_silo: "$sm_resource_silo$"
 sm_arkship_resource_silo_desc: "$sm_resource_silo_desc$"
 sm_arkship_listening_post: "$sm_listening_post$"
 sm_arkship_listening_post_desc: "$sm_listening_post_desc$"
 sm_arkship_fleet_academy: "$sm_fleet_academy$"
 sm_arkship_fleet_academy_machine_intelligence: "$sm_fleet_academy_machine_intelligence$"
 sm_arkship_fleet_academy_hive_mind: "$sm_arkship_fleet_academy_machine_intelligence$"
 sm_arkship_fleet_academy_desc: "$sm_fleet_academy_desc$"
 sm_arkship_deep_space_black_site: "$sm_deep_space_black_site$"
 sm_arkship_deep_space_black_site_desc: "$sm_deep_space_black_site_desc$"
 sm_waystation_gravitational_centrifuge: "$sm_gravitational_centrifuge$"
 sm_waystation_gravitational_centrifuge_desc: "$sm_gravitational_centrifuge_desc$"
 sm_arkship_irassian_naval_yards: "$sm_irassian_naval_yards$"
 sm_arkship_irassian_naval_yards_desc: "$sm_irassian_naval_yards_desc$"
 sm_arkship_yuht_detection_array: "$sm_yuht_detection_array$"
 sm_arkship_yuht_detection_array_desc: "$sm_yuht_detection_array_desc$"
 sm_arkship_archaeo_overcharger: "$sm_archaeo_overcharger$"
 sm_arkship_archaeo_overcharger_desc: "$sm_archaeo_overcharger_desc$"
 sm_arkship_warp_fluctuator: "$sm_warp_fluctuator$"
 sm_arkship_warp_fluctuator_desc: "$sm_warp_fluctuator_desc$"
 sm_arkship_detection_array: "$sm_detection_array$"
 sm_arkship_detection_array_desc: "$sm_detection_array_desc$"
 sm_arkship_dark_matter_detector: "$sm_dark_matter_detector$"
 sm_arkship_dark_matter_detector_desc: "$sm_dark_matter_detector_desc$"
 sm_arkship_offspring_outlook: "$sm_offspring_outlook$"
 sm_arkship_offspring_outlook_desc: "Модуль, позволяющий отпрыску наблюдать за сражениями в системе и управлять ими, одновременно заведуя инкубационными операциями на борту корабля-ковчега."
