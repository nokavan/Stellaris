 building_passenger_paradise_desc: "Полностью замкнутый жилой купол с самодостаточной экосистемой — частный рай для тех, у кого есть билет соответствующей категории."
 building_forever_cruise_passenger_unity: "Зал круиза"
 building_forever_cruise_passenger_unity_plural: "Залы круиза"
 building_forever_cruise_passenger_unity_desc: "Здесь пассажиры празднуют каждый следующий этап своего путешествия, что приводит их в восторг и опустошает все склады."
 building_forever_cruise_passenger_unity_situation_effect_desc: "Продвижение в сторону §Rприземления§! замедляется на §G5%§! за каждое сооружение (до §G50%§!), когда круизный ковчег движется или когда пассажирам скучно."
 building_forever_cruise_passenger_unity_situation_slowdown: "$building_forever_cruise_passenger_unity_plural$"
 building_forever_cruise_passenger_research: "Лаборатории саморазвития"
