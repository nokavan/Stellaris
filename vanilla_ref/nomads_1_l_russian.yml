 # Rogue Servitor + Forever Cruise civic swap
 civic_machine_servitor_forever_cruise: "Радушный служитель"
 civic_machine_servitor_forever_cruise_desc: "Этот машинный разум родился в эпоху, когда излишество считалось добродетелью, и неизменно служил распорядителем на роскошном межзвёздном лайнере. Его путешествие длится уже гораздо дольше, чем могли прожить первые пассажиры, но он по-прежнему балует каждое новое поколение так, будто круиз только начался."
 civic_tooltip_machine_servitor_forever_cruise_effects: "$t$• §HПассажиры§! принудительно принимают уровень жизни §Y$living_standard_organic_trophy$§!, а комплексные единицы получают дополнительно §G+1%§! к эффективности работы\n$t$• §HПассажиры экономкласса§! заменяются на §Yбеспризорные биотрофеи§!\n$t$• §RНужды пассажиров труднее удовлетворить§!"
