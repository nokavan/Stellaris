 nomads.7005.title: "Скитальцы и поселенцы"
 nomads.7005.desc: "§Y[event_target:migrating_arkship.GetName]§! находится на орбите [event_target:migrating_planet.GetPlanetMoon_RULOC&gen] [event_target:migrating_planet.GetName] достаточно долго для того, чтобы экипаж и местное население получше узнали друг друга. По обе стороны находятся те, кто желает сменить образ жизни: жители планеты жаждут покорять космос, а скитальцы тянутся к твёрдой земле."
 nomads.7005.desc.forever_cruise: "§Y[event_target:migrating_arkship.GetName]§! находится на орбите [event_target:migrating_planet.GetPlanetMoon_RULOC&gen] [event_target:migrating_planet.GetName] достаточно долго для того, чтобы новизна начала привлекать обе стороны. Горстка пассажиров, не находящих себе покоя во время странствия, просит высадить их навсегда. На поверхности же местные жители выстраиваются в очередь у регистрационной стойки, мечтая попасть на борт — им не терпится лично пережить чудеса, что сулят рекламные проспекты."
 nomads.7005.desc.servitor: "Наши биотрофеи и население [event_target:migrating_planet.GetPlanetMoon_RULOC&gen] [event_target:migrating_planet.GetName] начали робкое сближение по обе стороны границ наших корпусов. Часть их народа желает поселиться в заповедниках корабля-ковчега §Y[event_target:migrating_arkship.GetName]§!, а часть наших хочет насладиться бескрайним небом. Мы могли бы максимизировать благополучие органических форм жизни, одобрив переселение."
 nomads.7005.desc.same_species: "§Y[event_target:migrating_arkship.GetName]§! находится на орбите [event_target:migrating_planet.GetPlanetMoon_RULOC&gen] [event_target:migrating_planet.GetName] достаточно долго для того, чтобы экипаж и местное население осознали своё родство. По обе стороны находятся те, кто желает сменить образ жизни: далёкие родственники с поверхности жаждут покорять космос, а скитальцы мечтают о единении с семьёй на твёрдой земле."
 nomads.7005.a: "Пусть записываются и добро пожаловать на борт."
 nomads.7005.b: "Позволим им. На этот раз..."
 nomads.7005.c: "Оседлым не место в нашем флоте."
