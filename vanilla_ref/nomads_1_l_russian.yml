 MESSAGE_NOMAD_EXPLORATION_TITLE: "Кочевые исследования"
 NOMAD_EXPLORATION_WONDERS_DESC: "В системе $SYSTEM|Y$ находится примечательное §Yдревнее чудо§!.\nВпечатляющее зрелище.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_THREAT_DESC: "В системе $SYSTEM|Y$ находится опасная §Yдревняя угроза§!.\nНужно соблюдать осторожность.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_ENCLAVE_DESC: "В системе $SYSTEM|Y$ находится примечательный §Yанклав§!.\nВозможно, его обитатели выйдут с нами на контакт.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_LANDMARK_DESC: "В системе $SYSTEM|Y$ находится достойная внимания §Yгалактическая достопримечательность§!.\nЧудесное зрелище.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_MARAUDERS_DESC: "Система $SYSTEM|Y$ принадлежит гордым §Yмародерам§!.\nНужно действовать осторожно.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_SPECTACLE_DESC: "В системе $SYSTEM|Y$ находится §Yприродная достопримечательность§!.\nНесравнимая красота.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_PRECURSOR_DESC: "В системе $SYSTEM|Y$ обнаружены следы древних §Yпредтеч§!.\nОстатки мертвой цивилизации внушают трепет.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 NOMAD_EXPLORATION_ECOLOGY_DESC: "Система $SYSTEM|Y$ играет немалую роль в §Yкосмической экологии§!.\nМы многое сможем здесь познать.\n\nПолучено §Gнебольшое§! количество §Yединства§!."
 nomads.4715.name: "Незабываемое зрелище"
 nomads.4715.desc: "Одна из величайших наград кочевнику за его скитания — возможность повидать новые места. Сколько бы мы ни блуждали по просторам космоса, здесь всегда будет на что посмотреть, чем восхититься или чему ужаснуться. Наше любопытство неутолимо.\n\nКаждый завораживающий вид, открывающийся нашим кораблям, — это не просто услада для глаз: это еще и возможность узнать что-то новое, возможно, даже о самих себе."
 nomads.4715.a: "Галактика велика и полна чудес."
 nomads.4715.b: "Галактика велика и полна ужасов."
 leviathans.500.l: "Укажите нам какие-нибудь §Yинтересные системы§!."
 leviathans.500.l.tt: "Будет создана §Yточка§! с указанием на случайную систему, которую мы еще не посетили в рамках цепочки событий §Y«Кочевые исследования»§!"
 leviathans.500.l.opinion: "$leviathans.500.d.opinion$"
 leviathans.500.l.cooldown: "Мы уже недавно консультировались с Кураторами. Прежде чем прибегнуть к их услугам снова, нужно подождать."
 leviathans.500.l.desc: "Ну разумеется! Сейчас посмотрим на карту. Возможно, вас заинтересует вот эта система. Будьте добры, поделитесь с нами своими открытиями, когда посетите ее."
 curator_guidance_poi_name: "Наставление Кураторов"
 curator_guidance_poi_desc: "Кураторы указали нам на систему, которую стоит изучить."
