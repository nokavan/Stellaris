 council_agenda_agenda_arkship_engineering_civilian_name: "Конструктивное улучшение корабля-ковчега"
 council_agenda_agenda_arkship_engineering_civilian_desc: "Наш корабль-ковчег отлично приспособлен для добычи ресурсов, однако боеготовность и работоспособность лабораторий требуют внимания. Расширение возможностей корабля — стратегическая задача."
 agenda_arkship_engineering_civilian_modifier_tt: "Скорость изучения у корабля-ковчега: §G+$@arkship_agenda_mult|0%$§!\nМаневренность корабля-ковчега: §G+$@arkship_agenda_static|0$§!"
 council_agenda_agenda_arkship_engineering_science_name: "Конструктивное улучшение корабля-ковчега"
 council_agenda_agenda_arkship_engineering_science_desc: "Наш корабль-ковчег — впечатляющая космическая лаборатория, однако научные знания не спасут нас от верной гибели. Оперативные возможности и боеготовность также требуют внимания."
 agenda_arkship_engineering_science_modifier_tt: "Субсветовая скорость корабля-ковчега: §G+$@arkship_agenda_mult|0%$§!\nМаневренность корабля-ковчега: §G+$@arkship_agenda_static|0$§!"
 council_agenda_agenda_arkship_engineering_military_name: "Конструктивное улучшение корабля-ковчега"
 council_agenda_agenda_arkship_engineering_military_desc: "Наш корабль-ковчег отлично приспособлен для ведения боя, однако работоспособность лабораторий и логистические приспособления требуют внимания. Исправив эти недочеты, мы сделаем наш корабль поистине универсальным."
 agenda_arkship_engineering_military_modifier_tt: "Субсветовая скорость корабля-ковчега: §G+$@arkship_agenda_mult|0%$§!\nСкорость изучения у корабля-ковчега: §G+$@arkship_agenda_mult|0%$§!"
