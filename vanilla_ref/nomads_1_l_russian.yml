 # Stellar Cannon crisis responses
 nomads.8050.name: "Управление орудиями перехвачено"
 nomads.8050.desc: "Поиск целей: выполнен неверно.\n\nПрименены корректировки.\n\nПовторная оценка угрозы: угроза отсутствует."
 nomads.8050.a: "Мы лишились контроля."
 nomads.8055.name: "Подарок из-за завесы"
 nomads.8055.desc: "еще.\n\nвы вливаете свою силу в нас, словно дар. мы чувствуем ее. мы растем... продолжайте."
 nomads.8055.a: "Мы только сделали их сильнее."
 nomads.8060.name: "Разочарование"
 nomads.8060.desc: "Вы потратили столько сил, но так и не смогли мне навредить...\n\nКакая досада. Мне казалось, что вы способны на большее. Не растрачивайте усилия, пытаясь разрушить нерушимое."
 nomads.8060.a: "Она ждала от нас большего."
 nomads.8065.name: "Повторный урок"
 nomads.8065.desc: "И вот опять. Бессмысленные потуги, тот же результат.\n\nЯ верну вам всё, что вы растратили — не чтобы навредить, но чтобы вы ощутили весь его вес. Постарайтесь извлечь урок. Я не стану терпеть подобного расточительства в третий раз."
 nomads.8065.a: "Выводы делать только нам."
