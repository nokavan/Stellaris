 # Clues of the Chrysanthemum
 clues_chrysanthemum_title: "Подсказки о местонахождении «Хризантемы»"
 clues_chrysanthemum_desc: "Единство, мы наконец-то получили наводку на местонахождение «Хризантемы». Пора посмотреть, где расположился наш корабль-близнец."
 nomads.9000.name: "Голос из прошлого"
 nomads.9000.desc: "Установленные на «Гиацинте» приемники дальнего действия уловили передачу на аварийной частоте программы «Одиссей».\n\nНесмотря на древность сигнала (не менее сотни лет), понять сообщение не составило труда: пятый корабль-ковчег — «Хризантема» — пережил выход из червоточины. Колонисты с «Хризантемы» заселили планету, которую назвали Единство.\n\nВ радиопередаче повторяются одни и те же слова: «колония „Хризантема“ — всем кораблям программы „Одиссей“. Мы высадились на обитаемой планете. Нет ничего прекраснее… Мы приступаем к строительству. Возвращайтесь домой».\n\nОпределить источник сигнала пока невозможно, но радисты могут установить, где находятся передающие его буи-ретрансляторы. Возможно, один такой ретранслятор расположен в какой-либо из систем поблизости — следует изучить их."
 nomads.9000.a: "Приступить к триангуляции источника сигнала."
 nomads.9000.b: "Это всё уже древняя история. Запишем — и достаточно."
 chrysanthemum_poi_1: "Сигнальный ретранслятор"
 chrysanthemum_poi_1_desc: "Система, в которой может находиться буй-ретранслятор программы «Одиссей». Изучив её с помощью «Гиацинта», мы, возможно, сумеем лучше определить источник сигнала."
 nomads.9005.name: "Сигнал обнаружен"
 nomads.9005.desc: "Мы обнаружили ретранслятор программы «Одиссей» — потрёпанный, держащийся на последнем издыхании, но всё-таки передающий в мировое пространство своё послание.\n\nПомимо уже полученного нами сообщения, мы извлекли из внутреннего хранилища ещё две передачи, посланные уже позже. Между первой и второй прошло около десяти лет.\n\nНаселение колонии: двести шестьдесят тысяч человек. Засеяны культуры. Развивается инфраструктура.\n\nТретье сообщение датировано 9182 днём — после приземления прошло примерно двадцать пять лет. «Мы пока не улетаем. Изначальные расчёты оказались неверны: освоение Единства продвигается не так быстро, как мы предполагали. Есть погибшие. Всем кораблям программы „Одиссей“, которые меня слышат: прошу ответить. Мы здесь. Мы боремся».\n\nЕдинство находится в системе Денеб, всего несколько прыжков по гиперкоридорам."
 nomads.9005.a: "Взять курс на Денеб."
 chrysanthemum_poi_2: "Денеб"
 chrysanthemum_poi_2_desc: "Здесь выходцы с «Хризантемы» основали колонию. Ретранслятор программы «Одиссей» зафиксировал координаты. «Гиацинт» должен отправиться туда."
 nomads.9010.name: "Единство&!neut|||gen:Единства&!neut|||dat:Единству&!neut|||acc:Единство&!neut|||inst:Единством&!neut|||prep:Единстве&!neut|||faction:$1$ единства"
 nomads.9010.desc: "Система Денеб встретила нас молчанием.\n\nДатчики «Гиацинта» не обнаружили ничего: ни маяков, ни сигналов, ни кораблей, снующих между планетами. На некотором удалении от нас завис, словно подвешенный в воздухе, Олимп — гигантский и безразличный.\n\nОбманчивая луна заставила нас перепроверить сводки: с колонии сообщили о заросших травой континентах и обширных водоемах, но сканеры показывают совершенно другую картину. Эту серо-бурую почву невозможно спутать ни с чем: небесное тело выжжено радиацией. Вся жизнь здесь сгорела в огне ядерного взрыва.\n\nНа низкой орбите нас встретила «Хризантема». На дрейфующем корабле — ни единого признака жизни: в иллюминаторах не горят огни, радиостанции молчат. «Хризантема» пуста. Не уничтожена — пуста. Корабль, перевозивший четверть миллиона колонистов, мертв уже много десятилетий."
 nomads.9010.a: "Приступить к анализу почвы и остова."
 chrysanthemum_object: "КЧС «Хризантема»" # Commonwealth Navy Ship
 chrysanthemum_object_tooltip: "$chrysanthemum_object_desc$"
 chrysanthemum_object_desc: "Пятый корабль-ковчег программы «Одиссей», перевозивший колонистов — основателей Единства. Много лет подряд он дрейфует на орбите, брошенный экипажем."
 # Chrysanthemum Digsite
 site_chrysanthemum_colony: "Останки колонии Единство"
 site_chrysanthemum_colony_desc: "Колония, получившая название Единство, перестала выходить на связь примерно через двадцать пять лет после основания. Сохранились записи о произошедшем: архивариус Единства кропотливо выполнял свои обязанности до самого конца."
 nomads.9015.name: "Эскалация"
 nomads.9015.desc: "Хранилища данных не пострадали: архивариус спрятал их в подземном архиве под слоем превратившегося в стекло реголита.\n\n9251 день: замечена новая разновидность, умеющая зарываться в землю. Ограждения внешнего периметра не рассчитаны на подкопы. Обратились за помощью к инженерам с «Хризантемы». Ждем ответа.\n\n9389 день: внешнее кольцо эвакуировано. В подземные жилые блоки перемещено 214 000 колонистов. Некоторые секторы не выходят на контакт.\n\n9441 день: потеряна связь с секторами с 7 по 12. Потери среди ополченцев: 892 человека.\n\n9484 день: нарушено энергоснабжение четвертого подуровня. Получен приказ прекратить ведение журнала. Архивариус отказался.\n\n9514 день: нам не хватит времени."
 nomads.9015.a: "Сохранить записи из колонии."
 nomads.9020.name: "Голосование"
 nomads.9020.desc: "Зал заседаний совета был рассчитан на двести человек. В последнем заседании участвовало семнадцать. Архивариус всё так же тщательно записывал происходящее.\n\nЗаседание длилось шесть часов. Двенадцать голосов разделились поровну: половина проголосовала за орбитальную бомбардировку, половина — против. Один воздержался. Еще три советника попросту отсутствовали: тремя днями ранее их сектора погибли.\n\nБыли и несогласные — они считали, что колонию еще можно было эвакуировать. «Хризантема» могла бы выводить выживших группами, не дожидаясь, пока смерть доберется до нижних уровней.\n\nБольшинство оказалось против. Организм уже проник в нижние технические туннели. Пристыковавшиеся корабли неизбежно взяли бы его на борт, а значит, значительно вырос бы риск заражения. Колониальным властям предстояло сделать тяжелый выбор. Речь уже не шла о спасении, хотя бы частичном. На чашах весов оказались с одной стороны — судьба одной планеты, и с другой — судьба всех остальных.\n\nКомандир Боклер, начальник службы безопасности колонии, вынес окончательный вердикт: его голос, в соответствии с уставом колонии — уставом, написанным еще давно, когда будущее казалось светлым и беззаботным, — был решающим."
 nomads.9020.a: "Записать решение совета."
 nomads.9025.name: "Записи"
 nomads.9025.desc: "Первая запись с мостика датирована 9516 днем — двумя днями после голосования.\n\nОдиннадцать членов экипажа остались наблюдать за зачисткой поверхности и уровнями радиации. Численность населения пересмотрена в меньшую сторону: один раз, затем — еще раз. 9519 день: дано разрешение на бомбардировку. 9521 день: экипаж подтверждает зачистку сектора на 40%. 9558 день: жизнь на поверхности уничтожена. Следов выживших не наблюдается. Оценка единогласна.\n\nЕще четыре года команда провела за астрофизическими наблюдениями: ученые попросту убивали время.\n\nПоследняя запись датируется 11 204 днем. Вахтенный офицер, описывающая наступивший ясный день, подмечает, что вблизи Денеб выглядит иначе, чем на подлете. После этого запись обрывается.\n\nПоследняя запись — просто временная отметка. Мы не услышали ни раскаяния, ни размышлений о произошедшем, — только замечание о звездном свете."
 nomads.9025.a: "Закрыть архив."
 # First Contact
 action.1.desc_112: "ISA-06… «Гиацинт». Мы потеряли связь со всеми шестью кораблями. Даже не знаю, сколько лет мы думали, что случилось самое страшное. И вот вдруг — вы, живые… Впрочем, простите.\n\nОт имени всех народов планеты [From.GetHomeWorldName] и Генеральной Ассамблеи Организации Объединённых Наций я протягиваю вам руку дружбы. Какие бы испытания вам, участникам «Одиссея», ни довелось пережить, знайте: каждый из нас с радостью примет вас как родных.\n\nНам многое надо обсудить. Прошу вас, расскажите обо всём по порядку."
 action.1.desc_113: "«Гиацинт» приветствует вас! Я [From.GetRulerTitle] [From.GetRulerName] из исследовательского общества имени Гундерсена. Отрадно знать, что Земля ещё жива.\n\nЦелый век мы провели в поисках тех, кого червоточина разбросала по всей галактике. Работы ещё непочатый край; вселенная, как мы выяснили, крайне неохотно раскрывает свои тайны тем, кто не стремится их постичь. Это понимает каждый, кто трудится бок о бок с нами, и ради этого живёт каждый из нас.\n\nВозможно, [From.GetHomeWorldName] и поныне рождает учёных и исследователей, не боящихся устремиться в космическую пустоту на борту корабля-ковчега. «Гиацинт» готов принять любого, кому ещё не чужд дух первопроходчества. Если среди вас есть такие — мы охотно возьмём их к себе. Вопросов сейчас больше, чем ответов."
