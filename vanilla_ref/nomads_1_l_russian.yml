 situation_passenger_satisfaction_stage_overworked_desc: "§LЭкипажу всё сложнее справляться с запросами капризных пассажиров.§!"
 situation_passenger_satisfaction_stage_stressed_desc: "§LЧаша терпения экипажа переполнена. Его члены планируют заговор, чтобы покончить с бесконечными требованиями пассажиров.§!"
