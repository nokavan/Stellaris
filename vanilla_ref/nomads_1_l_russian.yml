 # Technologies
 ###############
 tech_planetary_engineering: "Планетарная инженерия"
 tech_planetary_engineering_desc: "Инновации в области сбора и переработки ресурсов позволят нашим кораблям-ковчегам заниматься добычей сырья в масштабах планет, а при необходимости менять целые биомы."
 TECH_UNLOCK_CLEAR_BLOCKER_CONTRACT_TITLE: "§H$UNLOCKS_CONTRACT_TYPE$§! $contract_clear_blockers$"
 TECH_UNLOCK_CLEAR_BLOCKER_CONTRACT_DESC: "Контракты на расчистку препятствий дают нам возможность помочь обитателям планеты и убрать самые часто встречающиеся препятствия, мешающие развитию колоний."
 TECH_UNLOCK_STELLAR_IGNITION_CONTRACT_TITLE: "§H$UNLOCKS_CONTRACT_TYPE$§! $contract_stellar_ignition$"
 TECH_UNLOCK_STELLAR_IGNITION_CONTRACT_DESC: "Контракты на зажигание звезд дают нам возможность превращать газовые гиганты в новые звезды, благодаря чему в системе появляется избыток энергии и исследовательских ресурсов."
 TECH_UNLOCK_DEEP_SCAN_CONTRACT_TITLE: "§H$UNLOCKS_CONTRACT_TYPE$§! $contract_deep_scan$"
 TECH_UNLOCK_DEEP_SCAN_CONTRACT_DESC: "Контракты на глубокое сканирование дают нам возможность обнаружить в системе что-нибудь новое."
 tech_nomads_arkship_defenses: "Оборона корабля-ковчега"
 tech_nomads_arkship_defenses_desc: "$tech_planetary_defenses_desc$"
 tech_nomads_shield_generator: "$sm_arkship_shield_generator$"
 tech_nomads_shield_generator_desc: "$sm_arkship_shield_generator_desc$"
