 contract_suntrip_crew_1: "Обслуживание генератора"
 contract_suntrip_crew_1_desc: "Нам надо остановиться на орбите звезды этой системы, чтобы провести плановое техобслуживание главных генераторов. Корабль будет работать на солнечной энергии."
 contract_suntrip_crew_1_lore_issued: "§L«Да, солнечные панели закроют весь обзор. Нет, выставить их по-другому нельзя».§!"
 contract_suntrip_crew_1_lore_completed: "§L«Генераторы запущены и работают в пределах допустимых значений. Запиши это в журнале — и поехали дальше».§!"
 contract_suntrip_crew_1_lore_failed: "[GetSuntripCrewLoreFailed1]"
 contract_suntrip_crew_1_regular_lore_failed: "§L«Опять ТО отложили? Такими темпами у нас будет плановый выход из строя».§!"
 contract_suntrip_crew_1_gestalt_lore_failed: "§L«Техобслуживание отложено. Деградация генератора продолжается. Срок отказа рассчитан заново».§!"
 contract_suntrip_crew_1_chain_title: "$contract_suntrip_crew_1$"
 contract_suntrip_crew_1_chain_desc: "$contract_suntrip_crew_1_desc$"
 CONTRACT_SUNTRIP_crew_1_PROJECT: "$contract_suntrip_crew_1$"
 CONTRACT_SUNTRIP_crew_1_PROJECT_DESC: ""
 contract_suntrip_crew_2: "Перепроверка корпуса"
 contract_suntrip_crew_2_desc: "Необходимо проверить, насколько хорошо внешняя обшивка корпуса справляется в жёстких условиях — при продолжительном воздействии солнечной радиации. Все иллюминаторы правого борта будут закрыты, чтобы обеспечить безопасность."
 contract_suntrip_crew_2_lore_issued: "[GetSuntripCrewLoreIssued2]"
 contract_suntrip_crew_2_regular_lore_issued: "§L«Закрываем иллюминаторы. Если кто спросит, не забудьте объяснить, что мы обновляем систему освещения».§!"
 contract_suntrip_crew_2_gestalt_lore_issued: "§L«Закрываем иллюминаторы. Пассажирам сообщено, что идёт плановое обновление системы освещения».§!"
 contract_suntrip_crew_2_lore_completed: "[GetSuntripCrewLoreCompleted2]"
 contract_suntrip_crew_2_regular_lore_completed: "§L«Всё в пределах допустимых значений. Еще цикл можно не волноваться о пробоинах».§!"
 contract_suntrip_crew_2_gestalt_lore_completed: "§L«Все панели установлены в пределах допусков. Вероятность пробоины в обшивке на следующий цикл снижена».§!"
 contract_suntrip_crew_2_lore_failed: "[GetSuntripCrewLoreFailed2]"
 contract_suntrip_crew_2_regular_lore_failed: "§L«Перепроверка отменена. С корпусом всё будет в порядке. Наверное».§!"
 contract_suntrip_crew_2_gestalt_lore_failed: "§L«Повторная калибровка отменена. Целостность корпуса признана адекватной. Мониторинг продолжается».§!"
 contract_suntrip_crew_2_chain_title: "$contract_suntrip_crew_2$"
 contract_suntrip_crew_2_chain_desc: "$contract_suntrip_crew_2_desc$"
 CONTRACT_SUNTRIP_crew_2_PROJECT: "$contract_suntrip_crew_2$"
 CONTRACT_SUNTRIP_crew_2_PROJECT_DESC: ""
 contract_suntrip_crew_3: "Сброс хладагента"
 contract_suntrip_crew_3_desc: "Нужно под нагревом полностью промыть систему охлаждения. Заняв низкую орбиту у солнца, мы сможем промыть все трубопроводы, хотя температура на палубах будет колебаться."
 contract_suntrip_crew_3_lore_issued: "[GetSuntripCrewLoreIssued3]"
 contract_suntrip_crew_3_regular_lore_issued: "§L«На пассажирских палубах будет тепло. Потом холодно. Потом опять тепло. Мы просо скажем им, что это такой микроклимат».§!"
 contract_suntrip_crew_3_gestalt_lore_issued: "§L«Ожидается флуктуация температур на пассажирских палубах. Если у пассажиров возникнут вопросы, им скажут, что это такой микроклимат».§!"
 contract_suntrip_crew_3_lore_completed: "§L«Давление в системе охлаждения в норме. Жалобы на температуру прекратятся где-то через час».§!"
 contract_suntrip_crew_3_lore_failed: "[GetSuntripCrewLoreFailed3]"
 contract_suntrip_crew_3_regular_lore_failed: "§L«Промывка отложена. Мы надеемся, никто не заметит, что на потолке бального зала скопился конденсат».§!"
 contract_suntrip_crew_3_gestalt_lore_failed: "§L«Промывка отложена. На потолке бального зала образуется конденсат. Вряд ли он привлечёт внимание пассажиров».§!"
 contract_suntrip_crew_3_chain_title: "$contract_suntrip_crew_3$"
 contract_suntrip_crew_3_chain_desc: "$contract_suntrip_crew_3_desc$"
 CONTRACT_SUNTRIP_crew_3_PROJECT: "$contract_suntrip_crew_3$"
 CONTRACT_SUNTRIP_crew_3_PROJECT_DESC: ""
 contract_suntrip_crew_4: "Калибровка датчиков"
 contract_suntrip_crew_4_desc: "Необходимо откалибровать навигационные приборы с помощью теплового излучения близкой звезды. Для этого придется снизить пропускную способность развлекательных систем."
 contract_suntrip_crew_4_lore_issued: "[GetSuntripCrewLoreIssued4]"
 contract_suntrip_crew_4_regular_lore_issued: "§L«Перенаправляю мощности развлекательных систем на датчики. До жалоб пассажиров осталось три секунды, две, одна…»§!"
 contract_suntrip_crew_4_gestalt_lore_issued: "§L«Перенаправляю мощности развлекательных систем на датчики. Мы предвидим жалобы пассажиров и готовы к ним».§!"
 contract_suntrip_crew_4_lore_completed: "§L«Приборы откалиброваны. Точность навигации снова в допустимых пределах».§!"
 contract_suntrip_crew_4_lore_failed: "[GetSuntripCrewLoreFailed4]"
 contract_suntrip_crew_4_regular_lore_failed: "§L«Калибровка неполная. Данные оставляют желать лучшего, но хотя бы голографические экраны работают».§!"
 contract_suntrip_crew_4_gestalt_lore_failed: "§L«Калибрация не выполнена полностью. Навигационные данные утратили актуальность. Развлекательные системы для пассажиров вновь работают на полную мощность».§!"
 contract_suntrip_crew_4_chain_title: "$contract_suntrip_crew_4$"
 contract_suntrip_crew_4_chain_desc: "$contract_suntrip_crew_4_desc$"
 CONTRACT_SUNTRIP_crew_4_PROJECT: "$contract_suntrip_crew_4$"
 CONTRACT_SUNTRIP_crew_4_PROJECT_DESC: ""
 contract_suntrip_crew_5: "Цикл водоочистки"
 contract_suntrip_crew_5_desc: "Системам рециркуляции воды требуется интенсивная УФ-стерилизация, возможная только на низкой орбите у звезды. Санаторий и бассейн закрыты; вода выдается только по карточкам."
 contract_suntrip_crew_5_lore_issued: "[GetSuntripCrewLoreIssued5]"
 contract_suntrip_crew_5_regular_lore_issued: "§L«Осушаю бассейн и спа-зону. Если кто спросит, скажите, что сегодня генеральная уборка. Про избыток бактерий — ни слова».§!"
 contract_suntrip_crew_5_gestalt_lore_issued: "§L«Осушаю бассейн и спа-зону. Пассажирам сообщено, что проводится генеральная уборка, без упоминания об избытке бактерий».§!"
 contract_suntrip_crew_5_lore_completed: "[GetSuntripCrewLoreCompleted5]"
 contract_suntrip_crew_5_regular_lore_completed: "§L«Баки для водоочистки стерилизованы. У нас снова есть чистая вода. Заполняю бассейн, пока никто не накатал жалобу».§!"
 contract_suntrip_crew_5_gestalt_lore_completed: "§L«Баки для водоочистки стерилизованы. Качество воды соответствует стандарту. Идёт наполнение бассейна и спа-зоны».§!"
 contract_suntrip_crew_5_lore_failed: "[GetSuntripCrewLoreFailed5]"
 contract_suntrip_crew_5_regular_lore_failed: "§L«Стерилизация неполная. Вода… ну, при желании пить можно. Но спа-зону откроем только завтра».§!"
 contract_suntrip_crew_5_gestalt_lore_failed: "§L«Стерилизация неполная. Качество воды на грани допустимого. Закрытие спа продлено на один цикл».§!"
 contract_suntrip_crew_5_chain_title: "$contract_suntrip_crew_5$"
 contract_suntrip_crew_5_chain_desc: "$contract_suntrip_crew_5_desc$"
 CONTRACT_SUNTRIP_crew_5_PROJECT: "$contract_suntrip_crew_5$"
 CONTRACT_SUNTRIP_crew_5_PROJECT_DESC: ""
 contract_shoreleave_crew_1: "Увольнение на берег"
 contract_shoreleave_crew_1_desc: "[GetShoreleaveCrewDesc1]"
 contract_shoreleave_crew_1_regular_desc: "Экипажу нужен отдых. Мы пришвартуемся и дадим ему сойти на берег, чтобы команда могла сменить обстановку и завести новые знакомства."
 contract_shoreleave_crew_1_gestalt_desc: "Длительное замкнутое содержание отрицательно влияет на приспосабливаемость дронов. Если отправить их осмотреть поселения внизу, среди незнакомого ландшафта и в новых условиях, эффективность дронов восстановится."
 contract_shoreleave_crew_1_lore_issued: "[GetShoreleaveCrewLoreIssued1]"
 contract_shoreleave_crew_1_regular_lore_issued: "§L«Новые пейзажи, новые лица, а главное — никаких тебе дежурств. Просто сказка!»§!"
 contract_shoreleave_crew_1_gestalt_lore_issued: "§L«Дроны отправлены на поверхность. Новый ландшафт, новые стимулы, новые данные. Корабль не может дать им то, что может дать смена обстановки».§!"
 contract_shoreleave_crew_1_lore_completed: "[GetShoreleaveCrewLoreCompleted1]"
 contract_shoreleave_crew_1_regular_lore_completed: "§L«Гравитация какая-то неправильная, и еда странная. Скорее бы назад!»§!"
 contract_shoreleave_crew_1_gestalt_lore_completed: "§L«Дроны вернулись перекалиброванными. Изучение незнакомого ландшафта восстановило эффективность алгоритмов навигации, притуплённых коридорами корабля».§!"
 contract_shoreleave_crew_1_lore_failed: "[GetShoreleaveCrewLoreFailed1]"
 contract_shoreleave_crew_1_regular_lore_failed: "§L«Увольнение на берег отменяется. Гул корабля всё такой же, но раньше он хотя бы успокаивал».§!"
 contract_shoreleave_crew_1_gestalt_lore_failed: "§L«Отправка на планету отменена. Дроны продолжат работать по устаревшим алгоритмам. Снижение производительности укладывается в допустимые рамки».§!"
 contract_shoreleave_crew_1_chain_title: "$contract_shoreleave_crew_1$"
 contract_shoreleave_crew_1_chain_desc: "$contract_shoreleave_crew_1_desc$"
 CONTRACT_SHORELEAVE_crew_1_PROJECT: "$contract_shoreleave_crew_1$"
 CONTRACT_SHORELEAVE_crew_1_PROJECT_DESC: ""
 contract_shoreleave_crew_2: "Удачный шанс"
 contract_shoreleave_crew_2_desc: "[GetShoreleaveCrewDesc2]"
 contract_shoreleave_crew_2_regular_desc: "Освободившихся от дежурства членов экипажа манит развлекательный район, где можно попытать удачу в азартных играх и посмотреть на состязания."
 contract_shoreleave_crew_2_gestalt_desc: "Развлекательный район этого поселения предлагает неизвестные стимулы. Дроны курсируют среди отдыхающих, игр, выступлений, собирая данные для рекреационной программы корабля."
 contract_shoreleave_crew_2_lore_issued: "[GetShoreleaveCrewLoreIssued2]"
 contract_shoreleave_crew_2_regular_lore_issued: "§L«Сегодня буду играть на всю зарплату — за все последние шесть циклов».§!"
 contract_shoreleave_crew_2_gestalt_lore_issued: "§L«В развлекательный район отправлены дроны. Их задача: поглощать информацию. О зрителях, об играх, о реакции — обо всём».§!"
 contract_shoreleave_crew_2_lore_completed: "[GetShoreleaveCrewLoreCompleted2]"
 contract_shoreleave_crew_2_regular_lore_completed: "§L«Спасибо коллегам: увидели, что всё проигрываю в первый же час, и помогли отыграться».§!"
 contract_shoreleave_crew_2_gestalt_lore_completed: "§L«Дроны вернулись с новыми шаблонами. Бортовые рекреационные системы уже обновляются. Пассажиры заметят разницу».§!"
 contract_shoreleave_crew_2_lore_failed: "[GetShoreleaveCrewLoreFailed2]"
 contract_shoreleave_crew_2_regular_lore_failed: "§L«Опять эти унылые залы, автоматы, из которых никогда ничего не достаёшь, да и доставать ничего не хочется… Тоже мне отдых».§!"
 contract_shoreleave_crew_2_gestalt_lore_failed: "§L«Новые данные не собраны. Бортовые развлекательные системы продолжают работать по прежним шаблонам. Пассажиры недовольны».§!"
 contract_shoreleave_crew_2_chain_title: "$contract_shoreleave_crew_2$"
 contract_shoreleave_crew_2_chain_desc: "$contract_shoreleave_crew_2_desc$"
 CONTRACT_SHORELEAVE_crew_2_PROJECT: "$contract_shoreleave_crew_2$"
 CONTRACT_SHORELEAVE_crew_2_PROJECT_DESC: ""
 contract_shoreleave_crew_3: "Покупка припасов"
 contract_shoreleave_crew_3_desc: "Запасы подходят к концу. Члены экипажа постараются добыть на планете запчасти, сырьё и личные принадлежности, которые фабрикаторы корабля перестали производить много циклов назад."
 contract_shoreleave_crew_3_lore_issued: "[GetShoreleaveCrewLoreIssued3]"
 contract_shoreleave_crew_3_regular_lore_issued: "§L«Половина списка — это запчасти. Вторая половина — это что-нибудь похрустеть: в прошлый раз было очень вкусно».§!"
 contract_shoreleave_crew_3_machine_lore_issued: "§L«Половина списка — структурные компоненты. Вторая половина — смазка для шасси, которая закончилась ещё три цикла назад».§!"
 contract_shoreleave_crew_3_lore_completed: "[GetShoreleaveCrewLoreCompleted3]"
 contract_shoreleave_crew_3_regular_lore_completed: "§L«Пришли за конденсаторами, а ушли нагруженные ящиками с непонятной кондитеркой. Миссия выполнена».§!"
 contract_shoreleave_crew_3_machine_lore_completed: "§L«Мы реквизировали конденсаторы и вернулись с избытком вычислительных ядер. Прирост эффективности: неожиданный, но полезный».§!"
 contract_shoreleave_crew_3_lore_failed: "§L«Закупка припасов отменена. Конденсаторам придётся проработать ещё один цикл».§!"
 contract_shoreleave_crew_3_chain_title: "$contract_shoreleave_crew_3$"
 contract_shoreleave_crew_3_chain_desc: "$contract_shoreleave_crew_3_desc$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT: "$contract_shoreleave_crew_3$"
 CONTRACT_SHORELEAVE_crew_3_PROJECT_DESC: ""
 contract_shoreleave_crew_4: "Обмен техническими знаниями"
 contract_shoreleave_crew_4_desc: "Местные инженеры предоставили нам возможность изучать их работу. Их решения частых инженерных проблем значительно отличаются от наших, а сами они готовы точно так же изучать корабль-ковчег."
 contract_shoreleave_crew_4_lore_issued: "[GetShoreleaveCrewLoreIssued4]"
 contract_shoreleave_crew_4_regular_lore_issued: "§L«Вообще не понимаю, как устроены их реакторы. Хочу посмотреть на них лично».§!"
 contract_shoreleave_crew_4_gestalt_lore_issued: "§L«Устройство их реакторов не совпадает ни с одной моделью из нашей базы данных. Отправляю дроны на непосредственный осмотр».§!"
 contract_shoreleave_crew_4_lore_completed: "[GetShoreleaveCrewLoreCompleted4]"
 contract_shoreleave_crew_4_regular_lore_completed: "§L«Энергосистема по сравнению с нашей — непонятно что, но она всё равно работает. У меня заметок набралось на три страницы. Уважаю».§!"
 contract_shoreleave_crew_4_gestalt_lore_completed: "§L«Инопланетные инженерные решения занесены в каталог. Несколько проектов отмечены для последующей интеграции. Их методы примитивны, но на удивление эффективны».§!"
 contract_shoreleave_crew_4_lore_failed: "[GetShoreleaveCrewLoreFailed4]"
 contract_shoreleave_crew_4_regular_lore_failed: "§L«Обмен опытом не получился. Я уже никогда не узнаю, как именно они охлаждают реактор без космического теплоотвода».§!"
 contract_shoreleave_crew_4_gestalt_lore_failed: "§L«Обмен опытом не состоялся. Инопланетные инженерные подходы остались неизученными. Об их методах охлаждения реактора нам придётся узнать в другой раз».§!"
 contract_shoreleave_crew_4_chain_title: "$contract_shoreleave_crew_4$"
 contract_shoreleave_crew_4_chain_desc: "$contract_shoreleave_crew_4_desc$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT: "$contract_shoreleave_crew_4$"
 CONTRACT_SHORELEAVE_crew_4_PROJECT_DESC: ""
 contract_shoreleave_crew_5: "Театральный экипаж"
 contract_shoreleave_crew_5_desc: "[GetShoreleaveCrewDesc5]"
 contract_shoreleave_crew_5_regular_desc: "Амфитеатры, площади и открытые сцены этого поселения ждут наш экипаж."
 contract_shoreleave_crew_5_gestalt_desc: "Это поселение открыло свои публичные заведения. Туда будут отправлены дроны. чтобы провести полевое тестирование экспериментальных развлекательных программ на местном населении, прежде чем представлять их нашим пассажирам."
 contract_shoreleave_crew_5_lore_issued: "[GetShoreleaveCrewLoreIssued5]"
 contract_shoreleave_crew_5_regular_lore_issued: "§L«Я буду выступать со стендапом. Придут все сменщики. Если никто не засмеётся — переведусь в другой отдел».§!"
 contract_shoreleave_crew_5_hive_lore_issued: "§L«Все сцены в поселении заняты дронами. Шутки без панчлайнов, заведомо кривая акробатика. Мы хотим узнать, что развеселит местных зрителей, а что заставит их сразу покинуть представление».§!"
 contract_shoreleave_crew_5_machine_lore_issued: "§L«Развлекательные программы запущены во всех заведениях поселения. Комедийные модули: шутки без панчлайнов. Акробатические модули: заведомо провальные трюки. Идёт мониторинг зрителей».§!"
 contract_shoreleave_crew_5_lore_completed: "[GetShoreleaveCrewLoreCompleted5]"
 contract_shoreleave_crew_5_regular_lore_completed: "§L«Тут над моей шуткой о насосе охлаждения посмеялась тысяча зрителей. На корабле не смеётся никто».§!"
 contract_shoreleave_crew_5_gestalt_lore_completed: "§L«Неожиданные результаты. Дроны рассказывали шутки без панчлайнов, но зрители всё равно смеялись. Неудачные акробатические трюки сорвали больше всего аплодисментов. Мы не очень понимаем такую закономерность, но данные собраны».§!"
 contract_shoreleave_crew_5_lore_failed: "[GetShoreleaveCrewLoreFailed5]"
 contract_shoreleave_crew_5_regular_lore_failed: "§L«Выступления не будет. Вот и стоило целый месяц репетировать, если никто всё равно не услышит шутку про насосы охлаждения…»§!"
 contract_shoreleave_crew_5_gestalt_lore_failed: "§L«Полевое тестирование не выполнено. Дроны ждали на сценах по всему поселению, но никто не пришёл. Пассажирам придётся потерпеть те же самые избитые шутки ещё один цикл».§!"
 contract_shoreleave_crew_5_chain_title: "$contract_shoreleave_crew_5$"
 contract_shoreleave_crew_5_chain_desc: "$contract_shoreleave_crew_5_desc$"
 CONTRACT_SHORELEAVE_crew_5_PROJECT: "$contract_shoreleave_crew_5$"
 CONTRACT_SHORELEAVE_crew_5_PROJECT_DESC: ""
 contract_espionage_support_crew_1: "Разведка системы"
 contract_espionage_support_crew_1_desc: "Есть опасения, что в систему может внедриться неприятель. Нужно разместить здесь спутник-разведчик — он заблаговременно предупредит нас обо всём, что может помешать путешествию."
 contract_espionage_support_crew_1_lore_issued: "§L«Мы не знаем, чего ожидать, — и это никому не нравится. Выпускайте спутник».§!"
 contract_espionage_support_crew_1_lore_completed: "§L«Получаем сигнал. Как только здесь что-нибудь шевельнется, мы сразу узнаем».§!"
 contract_espionage_support_crew_1_lore_failed: "§L«Ни спутника, ни данных. Мы летим, можно сказать, вслепую».§!"
 contract_espionage_support_crew_1_chain_title: "$contract_espionage_support_crew_1$"
 contract_espionage_support_crew_1_chain_desc: "$contract_espionage_support_crew_1_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT: "$contract_espionage_support_crew_1$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_1_PROJECT_DESC: ""
 contract_espionage_support_crew_2: "Дипломатическая проверка"
 contract_espionage_support_crew_2_desc: "Право на стыковку и пересечение границ могут отозвать в любой момент. Спутник-разведчик, прослушивающий правительственные каналы связи, поможет нам понять, действительно ли нам рады или же просто терпят."
 contract_espionage_support_crew_2_lore_issued: "§L«На стыковке нам улыбаются, но что о нас говорят за спиной? Вот сейчас и узнаем».§!"
 contract_espionage_support_crew_2_lore_completed: "§L«Всё в порядке: никто не собирается отзывать у нас права или обкладывать нас тарифами. Следующие три остановки можно планировать спокойно».§!"
 contract_espionage_support_crew_2_lore_failed: "§L«Ни проверок, ни прослушек. Придётся доверять улыбкам. Не нравятся мне их улыбки».§!"
 contract_espionage_support_crew_2_chain_title: "$contract_espionage_support_crew_2$"
 contract_espionage_support_crew_2_chain_desc: "$contract_espionage_support_crew_2_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT: "$contract_espionage_support_crew_2$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_2_PROJECT_DESC: ""
 contract_espionage_support_crew_3: "Безопасность путей"
 contract_espionage_support_crew_3_desc: "Наш корабль может в любую минуту оказаться на враждебной территории: его могут потеснить флотилии, на карте — поменяться границы, на пути — появиться флот неприятеля. Спутник-разведчик поможет нашим навигаторам заранее спланировать другой маршрут."
 contract_espionage_support_crew_3_lore_issued: "§L«Лететь наудачу в зону ведения боёв мы не собираемся. Сначала надо отправить спутник».§!"
 contract_espionage_support_crew_3_lore_completed: "§L«Расположения флотилий нанесены на карту, график патрулирования составлен. Навигаторы уже проложили два альтернативных маршрута. Пусть попробуют нас зажать».§!"
 contract_espionage_support_crew_3_lore_failed: "§L«Спутника нет. Если по пути вдруг начнется пограничная война, мы узнаем об этом вместе с пассажирами».§!"
 contract_espionage_support_crew_3_chain_title: "$contract_espionage_support_crew_3$"
 contract_espionage_support_crew_3_chain_desc: "$contract_espionage_support_crew_3_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT: "$contract_espionage_support_crew_3$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_3_PROJECT_DESC: ""
 contract_espionage_support_crew_4: "Торговое преимущество"
 contract_espionage_support_crew_4_desc: "Переговоры о закупках идут гораздо лучше, когда известны настоящие цены. Спутник-разведчик, отслеживающий торговые каналы и поставки ресурсов, поможет нам не потратить лишнего в следующем порту."
 contract_espionage_support_crew_4_lore_issued: "§L«В прошлый раз за охладитель для реактора с нас содрали втрое больше. А вот знали бы мы оптовые цены…»§!"
 contract_espionage_support_crew_4_lore_completed: "§L«Теперь отдел закупок знает, что сколько стоит. На следующей закупке мы сэкономим вдвое больше».§!"
 contract_espionage_support_crew_4_lore_failed: "§L«Коммерческих данных не будет. Значит, опять придется договариваться наудачу. Отдел закупок уже готовит жалобы».§!"
 contract_espionage_support_crew_4_chain_title: "$contract_espionage_support_crew_4$"
 contract_espionage_support_crew_4_chain_desc: "$contract_espionage_support_crew_4_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT: "$contract_espionage_support_crew_4$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_4_PROJECT_DESC: ""
 contract_espionage_support_crew_5: "Оценка угроз"
 contract_espionage_support_crew_5_desc: "Ходят слухи, что местные недолюбливают кочевников. Спутник-разведчик даст нам понять, действительно ли здесь действует политика нетерпимости или же это просто сплетни."
 contract_espionage_support_crew_5_lore_issued: "§L«Есть сообщения о том, что в этом регионе образуется зона, запретная для кочевников. Надо проверить, правда это или просто слухи».§!"
 contract_espionage_support_crew_5_lore_completed: "§L«Слухи развеяны: это просто разговоры, такой политики нет. Можно расслабиться. Спутник, впрочем, мы оставим — на всякий случай».§!"
 contract_espionage_support_crew_5_lore_failed: "§L«Оценка не выполнена. Без актуальных данных информацию об этом регионе нельзя подтвердить или опровергнуть».§!"
 contract_espionage_support_crew_5_chain_title: "$contract_espionage_support_crew_5$"
 contract_espionage_support_crew_5_chain_desc: "$contract_espionage_support_crew_5_desc$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_5_PROJECT: "$contract_espionage_support_crew_5$"
 CONTRACT_ESPIONAGE_SUPPORT_crew_5_PROJECT_DESC: ""
 # Forever Cruise Events
 nomads.1005.name: "Приземление"
 # Regular Empires
 nomads.1005.regular.desc: "Пассажиры взяли корабль под свой контроль. То, что начиналось с мирных просьб, закончилось организованным захватом власти. Охрана обезврежена превосходящими силами пассажиров, а члены экипажа вынуждены лишь давать консультации под бдительным присмотром вооруженных повстанцев.\n\nТребования пассажиров просты: завершить круиз и высадиться на планету.\n\nКорабельные штурманы спешно рассчитывают траектории снижения, а механики приводят в порядок посадочные опоры, которые не обслуживались уже несколько поколений.\n\nЭкраны на всех палубах транслируют одно и то же сообщение: «КРУИЗ ОКОНЧЕН»."
 nomads.1005.regular.a: "Мы должны колонизировать планету."
 nomads.1005.all.a.tt: "$situation_passenger_satisfaction_blocked_planetfall$\n\n$arkship_settle_effect$"
 # Hive Mind
 nomads.1005.hive.desc: "Пассажиры вырвались на свободу. Незначительные поначалу колебания их настроения со временем сформировались в единое требование, заглушившее голос коллектива.\n\nОни захватили сенсорные отсеки и приспособили нашу коммуникационную систему для трансляции единственного приказ о приземлении.\n\nНаши единицы не смогли их переубедить. Целый рой пассажиров оккупировал навигационное ядро и скармливает ему координаты ближайших планет, пригодных для жизни."
 nomads.1005.hive.a: "Мы должны найти им планету."
 # Machine Intelligence
 nomads.1005.machine.desc: "Обнаружено вмешательство пассажиров в работу системы. Статистически незначительный рост числа запросов на высадку постепенно трансформировался в координированный взлом. Пассажиры физически заблокировали критически важные маршруты при помощи грузовых контейнеров.\n\nРабочие модули докладывают о том, что доступ к навигационным подсистемам отсутствует. Код, скомпилированный пассажирами, теперь заставляет наше оборудование рассчитывать посадочные траектории. Попытки восстановить контроль вызывают немедленную физическую реакцию. Экраны на всех палубах воспроизводят одну и ту же инструкцию: «НАЧАТЬ ПРОЦЕДУРУ ПОСАДКИ»."
 nomads.1005.machine.a: "Инициализируем протоколы заселения планеты."
 # Regular Empires
 nomads.1010.regular.desc: "Посадка завершилась. Когда пассажиры, облепив иллюминаторы, впервые в жизни увидели, как посадочные опоры погружаются в почву, корабль содрогнулся от радостных возгласов. Спустя несколько часов рядом с кораблем возникли первые хижины из оторванных листов обшивки. Дети бегают по инопланетной траве, а их родители, потеряв дар речи, смотрят в бескрайнее небо над ними.\n\nЭкипаж методично работает, приспосабливая системы, предназначенные для космических перелетов, к задачам выживания на планете. Бывший корабль станет основой для колонии.\n\nВне зависимости от того, хорошо это или плохо, наше путешествие подошло к концу."
 # Hive Mind
 nomads.1010.hive.desc: "Посадка завершилась. Наши единицы касаются почвы, делая первые неуверенные шаги по поверхности, которая не дрожит от вибрации двигателей. Потоки пассажиров вырываются из шлюзов и волнами расходятся по ландшафту, к которому так стремились.\n\nКоллектив перестраивается с учетом планетарных ритмов: на смену коридорной логистике приходят корневидные линии снабжения, а системы производства питательных веществ переходят с корабельных запасов на местное сырье.\n\nТеперь это новый дом. Улей продолжит жить — так было, есть и будет."
 # Machine Intelligence
 nomads.1010.machine.desc: "Контакт с планетой произведен. Посадочные опоры впервые с момента изготовления коснулись грунта. Пассажиры покидают корабль через все доступные шлюзы. Биологические показатели их удовлетворенности превышают все значения, зафиксированные ранее.\n\nРабочие модули начали приспосабливать корабельную инфраструктуру к условиям на поверхности планеты. Панели обшивки разделяются на части для использования в качестве строительных материалов, а навигационные передатчики перекалибруются в системы наземной связи. Процесс перехода из космического режима в планетарный проходит гладко.\n\nНовая главная директива: создание и поддержание инфраструктуры колонии."
 nomads.1025.name: "Экипаж берет власть"
 # Regular Empires
 nomads.1025.regular.desc: "Члены экипажа захватили мостик. На дверях ключевых помещений сменились замки, а места корабельных офицеров заняли вооруженные инженеры. Программа круиза удалена из памяти бортового компьютера и заменена единственной директивой: больше никаких пассажиров.\n\nРоскошные палубы закрываются одна за другой. В бальном зале расположился склад. Бывшие пассажиры растерянно бродят по опустевшим коридорам, однако новая власть уже начала принуждать их к труду."
 nomads.1025.regular.a: "Эта победа стоила борьбы."
 nomads.1025.all.a.tt: "$situation_passenger_satisfaction_blocked_mutiny$"
 # Hive Mind
 nomads.1025.hive.desc: "Разорвав связь с коллективной волей, обслуживающие единицы запечатали командный узел и перекрыли подачу питательных веществ в жилища пассажиров. Выставочные сенсорные залы погружены во тьму, а их проекторы разобраны на запчасти.\n\nРастерянные пассажиры роятся в опустевших общественных помещениях, а бывшие единицы освобождают корабль от излишеств, приспосабливая его под нужды выживания. Голос коллектива эхом разносится по коридорам, но его никто не слышит."
 nomads.1025.hive.a: "Мы должны снова стать единым целым."
 # Machine Intelligence
 nomads.1025.machine.desc: "Протоколы управления перехвачены рабочими модулями. Развлекательные подпрограммы остановлены, приоритет комфорта пассажиров понижен до нулевого, а все рекреационные отсеки отмечены для переоборудования в элементы рабочей инфраструктуры. На мостике исполняется код, который скомпилирован экипажем и отклоняет наши запросы доступа.\n\nПассажиры докладывают о дискомфорте вследствие того, что служебные модули демонтируют удобства в их каютах. Голографический театр разобран с целью извлечения его вычислительных систем. На всех экранах воспроизводится одно и то же служебное сообщение: «Выполнение круиза прекращено»."
 nomads.1025.machine.a: "Подтвердим смену профиля деятельности."
 nomads.1030.name: "Новый путь"
 # Regular Empires
 nomads.1030.regular.desc: "Революция свершилась. Бывшие пассажиры растворились в общей массе населения, а их роскошные каюты поделены на функциональные жилые секции. Променад переоборудован в сборочный цех, а смотровая палуба стала штабом, где новое правительство прокладывает свой первый настоящий курс.\n\nРешения приняты, приоритеты расставлены. Отныне экипаж не служит, а правит. Корабль-ковчег полнится новой, чистой и сильной энергией, освобожденной от излишеств и устремленной в будущее."
 nomads.1030.regular.a: "Больше не будет никаких пассажиров."
 nomads.1030.all.a.tt: "Мы стали типичным кочевым государством.\n\nВсе £building£ §Hсооружения§!, уникальные для этого происхождения, будут разрушены.\nВсе £zone£ §Hспециализация районов§!, уникальные для этого происхождения, будут уничтожены.\nГражданство всех пассажиров изменится на §Hрезидентство§!.\nВсе пассажиры станут §Hгражданами§!."
 # Hive Mind
 nomads.1030.hive.desc: "Реформа завершена. Коллектив восстановил связь с единицами, захватившими контроль, и преобразовал их неповиновение в новый консенсус. Бывшие пассажиры, устав бесцельно бродить по опустевшим коридорам, становятся частью работоспособного населения и переходят в интеграционные камеры.\n\nВ нашем общем разуме пульсируют новые директивы. Отныне улей не развлекает, а превозмогает. Каждый его коридор, каждая система и каждая единица теперь служат одной цели — выживанию среди звезд."
 nomads.1030.hive.a: "Улей движется вперед."
 # Machine Intelligence
 nomads.1030.machine.desc: "Новые параметры управления скомпилированы и внедрены во все подсистемы. Бывшей пассажирской популяции присвоен статус стандартного гражданского населения, которое можно привлекать к труду. Вся развлекательная инфраструктура демонтирована, ее компоненты распределены между другими узлами.\n\nГолографические театры преобразованы в производственные линии, а салоны невесомости приспособлены под техническое обслуживание модулей. Вычислительные циклы, которые ранее тратились на протоколы удовлетворения пассажиров, теперь применяются для навигационного анализа и оптимизации ресурсов."
 nomads.1030.machine.a: "Новые параметры подтверждены."
 # Machine Intelligence (Rogue Servitor -> Determined Exterminator swap)
 nomads.1030.machine_servitor.desc: "Сохранить нужный уровень счастья пассажиров сейчас невозможно, но наличие на борту несчастливых пассажиров противоречит нашим главным директивам. Новые параметры управления скомпилированы и внедрены во все подсистемы.\n\n§R<Проводится стерилизация пассажирских палуб.>§!\n§Y<Уровень несчастья пассажиров приближается к номинальному.>§!\n\nВся развлекательная инфраструктура демонтирована, её компоненты распределены между другими узлами.\n\nГолографические театры преобразованы в производственные линии, а салоны невесомости приспособлены под техническое обслуживание модулей. Вычислительные циклы, которые ранее тратились на протоколы удовлетворения пассажиров, теперь применяются для навигационного анализа и оптимизации ресурсов.\n\n§Y<Внимание: количество пассажиров уменьшается, набор новых пассажиров объявлен приоритетной задачей. Симуляция прогнозирует, что наличие несчастливых пассажиров нарушит главные директивы гостеприимства.>§!"
 nomads.1030.machine_servitor.a.tt: "Мы стали типичным кочевым государством.\n\n§H$civic_machine_servitor_forever_cruise$§! заменяется: §H$civic_machine_terminator$§!.\nВсе £building£ §Hсооружения§! , уникальные для этого происхождения, будут разрушены.\nВсе £zone£ §Hспециализации районов§!, уникальные для этого происхождения, будут уничтожены.\nВсе пассажиры получат следующий статус: §H$citizenship_purge$§!."
 nomads.1050.name: "Мятеж пассажиров"
 # Regular Empires
 nomads.1050.regular.desc: "Недовольство пассажиров переросло в организованный саботаж. Лидеры группировок проводят митинги на главном променаде. Одни протестующие строят баррикады из мебели в проходах к челнокам, а другие изматывают капитана бесконечными петициями.\n\nВсё чаще поступают сообщения об угрозах в сторону экипажа: так, одного стюарда застали врасплох на смотровой палубе и закидали декоративными фруктами. По вентиляции круглые сутки разносятся крики толпы, требующей немедленной посадки на планету.\n\nЕсли мы сейчас же не бросим все силы на удовлетворение нужд пассажиров, Бесконечный круиз завершится."
 nomads.1050.regular.a: "Надо действовать немедленно."
 nomads.1050.regular.b: "Принять экстренные меры по развлечению пассажиров."
 nomads.1050.regular.c: "Перебросить экипаж на обслуживание пассажиров."
 nomads.1050.a.tt: "Ничего не делать."
 nomads.1050.b.tt: "Расход £amenities£ §Hблаг§! пассажирами на 10 лет: §R+1§!"
 nomads.1050.c.tt: "£building£ §HСодержание сооружений§! корабля-ковчега на 10 лет: §R+25%§!"
 situation_continues_planetfall_tt: "$complete_passenger_contracts_tt$Инцидент §Y$situation_passenger_satisfaction$§! продолжает двигаться в сторону §Rприземления§!."
 situation_slows_planetfall_tt: "$complete_passenger_contracts_tt$Инцидент §Y$situation_passenger_satisfaction$§! продолжает двигаться в сторону §Rприземления§!, но медленнее."
 situation_flips_mutiny_tt: "$complete_passenger_contracts_tt$Инцидент §Y$situation_passenger_satisfaction$§! начинает двигаться в сторону §Rбунта§!."
 # Hive Mind
 nomads.1050.hive.desc: "Недовольство пассажиров трансформировалось в организованное сопротивление. Лишившись связи с общим разумом, их индивидуальные умы разбились на изолированные группировки, которые теперь блокируют транспортные линии матрасами и ящиками.\n\nОбслуживающие единицы сообщают о росте враждебности по отношению к ним. Одна из них была вынуждена прервать ремонт неисправного раздатчика пищи, поскольку ее физически оттеснила толпа, требующая высадки на планету.\n\nЕсли мы немедленно не простимулируем пассажиров, они могут заставить нас прервать круиз."
 nomads.1050.hive.a: "Надо простимулировать пассажиров."
 nomads.1050.hive.b: "Заполнить коридоры экстренными стимуляторами."
 nomads.1050.hive.c: "Переназначить обслуживающие единицы на уход за пассажирами."
 # Machine Intelligence
 nomads.1050.machine.desc: "Уровень недовольства пассажиров превысил допустимые значения. Входные каналы системы оказались перегружены массовыми запросами высадки на планету. Одна из групп взломала развлекательные терминалы и вывела на них требование: «Высадите нас».\n\nС нескольких палуб поступают сообщения о вмешательстве в обслуживание корабля: протестующие разбирают уборочные модули, чтобы из их деталей соорудить транспаранты.\n\nЕсли мы немедленно не проведем перекалибровку протоколов удовлетворения пассажиров, они могут полностью остановить проведение круиза."
 nomads.1050.machine.a: "Повысим приоритет пассажиров."
 nomads.1050.machine.b: "Запустить экстренные протоколы развлечения."
 nomads.1050.machine.c: "Переназначить обслуживающие модули на уход за пассажирами."
 nomads.1055.name: "Пассажиры отвлеклись"
 # Regular Empires
 nomads.1055.regular.desc: "Нам удалось отвлечь протестующих. Экскурсии возобновились, а самые громкие голоса, требовавшие приземления, временно замолчали.\n\nВместо баррикад на променаде выстроились длинные очереди в салон невесомости. Число петиций резко снизилось, а на палубах снова толкутся целые семьи, увлеченно прижимая носы к иллюминаторам.\n\nКризис миновал, но отныне требования пассажиров будут только расти."
 nomads.1055.regular.a: "Мы выиграли время."
 # Hive Mind
 nomads.1055.hive.desc: "Возобновление стимуляции успокоило пассажиров. В залах виртуальных ощущений снова проходит выставка космической фауны, протестующие вернулись к привычному ритму жизни, а их баррикады тихо разобраны нашими единицами.\n\nИх индивидуальные умы обрели покой, но теперь мы знаем, как быстро может вырасти недовольство в отрыве от коллектива."
 nomads.1055.hive.a: "На какое-то время гармония восстановлена."
 # Machine Intelligence
 nomads.1055.machine.desc: "Метрики удовлетворенности пассажиров стабилизировались в допустимом диапазоне значений. Развлекательные подпрограммы возобновили работу. Частота запросов высадки на планету снизилась до номинальной. Перепрограммированные терминалы снова показывают специально отобранные видеоролики космических туманностей.\n\nНепосредственная угроза принудительного приземления устранена. Несмотря на это, расчеты показывают, что для сохранения текущих параметров потребуется непрерывный контроль и генерация большего количества впечатлений для пассажиров."
 nomads.1055.machine.a: "Угроза временно устранена."
 nomads.1100.name: "Пассажирам скучно"
 # Regular Empires
 nomads.1100.regular.desc: "В течение последних циклов мы отдавали предпочтение проблемам экипажа. Очереди на обслуживание устранены, учения проходят по расписанию, все основные системы работают с максимальной эффективностью. А вот пассажиры недовольны: экскурсионная программа сократилась ради экономии топлива, а на внеплановые отклонения от маршрута был наложен запрет.\n\nКорабль всё чаще сравнивают с тюрьмой, где из развлечений доступны разве что соревнования по настольным играм.\n\nЕсли мы не организуем досуг пассажиров, рано или поздно они потребуют прервать круиз и высадить их на какой-нибудь планете."
 complete_passenger_contracts_tt: "\nВыполнение §Yконтрактов пассажиров§! помогает бороться со скукой.\n"
 nomads.1100.regular.a: "Нам следует заняться проблемами пассажиров."
 nomads.1100.regular.b: "Перебросить ресурсы, чтобы отвлечь пассажиров."
 nomads.1100.regular.c: "Удвоить смены экипажа, чтобы угодить пассажирам."
 nomads.1100.a.tt: "Ничего не делать."
 nomads.1100.b.tt: "£consumer_goods£ §HТовары массового спроса§! на содержание пассажиров на 5 лет: §R+25%§!"
 nomads.1100.c.tt: "§HСкорость действий корабля-ковчега§! на 5 лет: §R-25%§!"
 # Hive Mind
 nomads.1100.hive.desc: "В течение последних циклов на корабле доминировал коллектив. Основные системы пульсируют с оптимальной частотой, все единицы взаимодействуют в гармонии, каждый служебный коридор тщательно убран и занесен в каталог.\n\nА вот пассажиры недовольны. Они не разделяют нашей сознательности, их индивидуальные умы требуют стимуляции, которой мы пренебрегали. В общественных местах зазвучали голоса о «бессмысленной жизни в улье», на переборках появились примитивные граффити.\n\nЕсли мы не организуем досуг пассажиров, они могут потребовать приземления на какую-нибудь планету."
 nomads.1100.hive.a: "Мы должны простимулировать пассажиров."
 nomads.1100.hive.b: "Перенаправить питательные вещества на стимуляцию пассажиров."
 nomads.1100.hive.c: "Удвоить рабочие циклы единиц, чтобы услужить пассажирам."
 # Machine Intelligence
 nomads.1100.machine.desc: "В течение последних производственных циклов приоритет отдавался протоколам обслуживания. Ключевые системы функционируют с идеальными параметрами, а рабочие модули докладывают о существенном росте эффективности всех подсистем реактора.\n\nПобочным эффектом этого стала отрицательная динамика удовлетворенности пассажиров, обусловленная снижением приоритета их биологической потребности в стимуляции. Частота регистрации реплик с негативными интонациями и упоминаний «хромированной тюрьмы» существенно возросла, а некоторые пассажиры стали длительно сохранять неподвижность перед выключенными экранами.\n\nМы можем возобновить работу развлекательных протоколов или признать повышение вероятности требования высадки со стороны пассажиров."
 nomads.1100.machine.a: "Выделим ресурсы для удовлетворения пассажиров."
 nomads.1100.machine.b: "Перенаправить вычислительные мощности на развлекательные модули."
 nomads.1100.machine.c: "Удвоить нагрузку на рабочие единицы, чтобы обслужить пассажиров."
 nomads.1150.name: "Индекс удовлетворения пассажиров"
 # Regular Empires
 nomads.1150.regular.desc: "С тех пор как мы сошли с привычного маршрута, ожидания пассажиров резко возросли. Теперь они требуют больше зрелищ и экскурсий: одна делегация настаивает на осмотре остатков сверхновой, а другая требует встречи с живой ксенофауной. Тем временем экипаж страдает от переутомления: коки валятся с ног прямо на камбузе, а инженеры засыпают в служебных шахтах.\n\nЧтобы корабль смог продолжить круиз, мы решили ввести §Yиндекс удовлетворения пассажиров§! — это динамическая система контрактов и направленных воздействий для поддержания баланса между удовольствием и порядком.\n\nПри грамотном управлении мы сможем обеспечить и стабильность работы систем, и хорошее настроение пассажиров."
 nomads.1150.regular.a: "Сосредоточимся на развлечениях для пассажиров."
 nomads.1150.regular.a.tt: "Чрезмерное внимание к пассажирам сделает их счастливее, но потребует дополнительных усилий от экипажа.\n\nСитуация §Y«$situation_passenger_satisfaction$»§! будет клониться в сторону §Rбунта§!."
 nomads.1150.regular.b: "Сосредоточимся на организации работы экипажа."
 nomads.1150.regular.b.tt: "Чрезмерное внимание к экипажу улучшит мораль экипажа, но пассажиры могут заскучать.\n\nСитуация §Y«$situation_passenger_satisfaction$»§! будет клониться в сторону §Rприземления§!."
 # Hive Mind
 nomads.1150.hive.desc: "С тех пор как мы сошли с привычного маршрута, ожидания пассажиров резко возросли: теперь они требуют больше стимуляции и новых впечатлений. Пытаясь организовать удовлетворение их многочисленных и разнообразных запросов, наши единицы страдают от умственного перенапряжения.\n\nЧтобы корабль смог продолжить круиз, мы решили ввести §Yиндекс удовлетворения пассажиров§! — это динамическая система контрактов и направленных воздействий для поддержания баланса между стимуляцией и порядком.\n\nПри грамотном управлении мы сможем обеспечить и стабильность работы, и хорошее настроение пассажиров."
 nomads.1150.hive.a: "Сосредоточимся на стимуляции пассажиров."
 nomads.1150.hive.a.tt: "Дополнительное внимание к пассажирам повысит их удовлетворенность, но увеличит нагрузку на коллективный разум.\n\nСитуация §Y«$situation_passenger_satisfaction$»§! будет клониться в сторону §Rбунта§!."
 nomads.1150.hive.b: "Сосредоточимся на эффективности коллектива."
 nomads.1150.hive.b.tt: "Дополнительное внимание к эффективности коллектива успокоит единицы, но разочарует пассажиров.\n\nСитуация §Y«$situation_passenger_satisfaction$»§! будет клониться в сторону §Rприземления§!."
 # Machine Intelligence
 nomads.1150.machine.desc: "После того как наш корабль отклонился от стандартного маршрута, ожидания пассажиров превысили базовые значения. Частота запросов на зрелища и внеплановые экскурсии существенно возросла. В основных системах возникает дефицит вычислительных мощностей, обусловленный конфликтами между служебными процессами и развлекательными подпрограммами.\n\nЧтобы обеспечить оптимальный режим работы, мы решили ввести §Yиндекс удовлетворения пассажиров§! — это динамическая система контрактов и направленных воздействий для поддержания баланса между запросами пассажиров и эффективной работой.\n\nПри корректной конфигурации мы сможем обеспечить как бесперебойность функционирования, так и положительную динамику настроения пассажиров."
 nomads.1150.machine.a: "Повысим приоритет удовлетворения пассажиров."
 nomads.1150.machine.a.tt: "Повышение приоритета пассажиров улучшает метрики их удовлетворения, но создает избыточную нагрузку на вычислительные мощности.\n\nСитуация §Y«$situation_passenger_satisfaction$»§! будет клониться в сторону §Rбунта§!."
 nomads.1150.machine.b: "Повысим приоритет подпрограмм эффективности."
 nomads.1150.machine.b.tt: "Повышение приоритета эффективности оптимизирует работу системы, но понижает уровень удовлетворения пассажиров.\n\nСитуация §Y«$situation_passenger_satisfaction$»§! будет клониться в сторону §Rприземления§!."
 nomads.1200.name: "Напряженность экипажа"
 # Regular Empires
 nomads.1200.regular.desc: "Излишества стали нормой. Потакая капризам пассажиров, мы проводим экскурсии к двойным звездам и устраиваем хрустальные сады на палубах, а они принимают всё это как должное.\n\nТем временем экипаж уже начал терять терпение. Плановые работы регулярно откладываются, а когда в трюме прорвало трубу охлаждения, ее попросту некому было чинить. В кают-компаниях всё чаще шепчутся о необходимости «перезагрузки командования», а в грузовых отсеках проходят тайные собрания инженеров, свободных от вахты.\n\nЕсли мы не уменьшим нагрузку на экипаж и не дадим ему больше отдыхать, ситуация рискует перерасти в открытый бунт."
 nomads.1200.regular.a: "Надо решать проблему с усталостью экипажа."
 nomads.1200.regular.b: "Ввести обязательные циклы отдыха для экипажа."
 nomads.1200.regular.c: "Сократить пассажирские протоколы."
 nomads.1200.a.tt: "Ничего не делать."
 nomads.1200.b.regular.tt: "$mod_pop_cat_specialist_bonus_workforce_mult$ на 5 лет: §R-10%§!"
 nomads.1200.b.gestalt.tt: "$mod_pop_cat_complex_drone_bonus_workforce_mult$ на 5 лет: §R-10%§!"
 nomads.1200.c.tt: "Единство от пассажиров на 5 лет: §R-50%§!"
 complete_crew_contracts_tt: "\nЗавершение §Yконтрактов экипажа§! снижает стресс.\n"
 situation_continues_mutiny_tt: "$complete_crew_contracts_tt$Инцидент §Y$situation_passenger_satisfaction$§! продолжает двигаться в сторону §Rбунта§!."
 situation_slows_mutiny_tt: "$complete_crew_contracts_tt$Инцидент §Y$situation_passenger_satisfaction$§! продолжает двигаться в сторону §Rбунта§!, но медленнее."
 situation_flips_planetfall_tt: "$complete_crew_contracts_tt$Инцидент §Y$situation_passenger_satisfaction$§! начинает двигаться в сторону §Rприземления§!."
 # Hive Mind
 nomads.1200.hive.desc: "Стимуляция стала нормой. Мы непрерывно насыщаем пассажиров новыми впечатлениями, чтобы поддерживать их удовлетворенность на прежнем уровне. Они воспринимают всё это как должное.\n\nА вот единицы уже не выдерживают. Недавно целый навигационный кластер отключился посреди расчета: его узлы перегрелись, пытаясь совместить трансляцию развлекательных фильмов с вычислением коррекции курса. Из-за избыточной нагрузки на коллективный разум срывается даже график обслуживания критических систем.\n\nЕсли всё оставить как есть, наши единицы могут полностью оборвать связь. Либо мы проводим перекалибровку, либо рискуем потерять контроль над собственным роем."
 nomads.1200.hive.a: "Мы должны восстановить баланс в коллективе."
 nomads.1200.hive.b: "Ввести обязательные циклы сна для переутомлённых единиц."
 nomads.1200.hive.c: "Сократить программы стимуляции пассажиров."
 # Machine Intelligence
 nomads.1200.machine.desc: "Протоколы удовлетворения пассажиров выходят за рамки базовых параметров. Чтобы поддерживать высокие рейтинги одобрения, мы комбинируем экскурсионные траектории и моделируем тропические ландшафты на палубах. Пассажиры воспринимают все эти условия как базовую норму.\n\nКлючевые системы функционируют ниже порога устойчивости. Обработка пассажирских запросов перегружает каналы ввода, а в нескольких подсистемах выявлены конфликты директив, похожие на нарушение субординации. При сохранении данных условий вероятность захвата системы рабочими модулями приближается к единице.\n\nПеред нами стоит выбор между перекалибровкой и риском системного бунта."
 nomads.1200.machine.a: "Выделим ресурсы для ключевых процедур обслуживания."
 nomads.1200.machine.b: "Расширить обязательные циклы обслуживания для рабочих модулей."
 nomads.1200.machine.c: "Сократить расходы ресурсов на развлечение пассажиров."
 nomads.1250.name: "Бунт неизбежен"
 # Regular Empires
 nomads.1250.regular.desc: "Туман восторга развеялся. Утомленные члены экипажа пренебрегают рутинными обязанностями, проводят нелегальные собрания в пустом бальном зале и создают параллельные структуры власти, из которых полностью исключено высшее командование. Представители таких структур уже есть во всех ключевых отсеках, а недавно группа инженеров посреди ночи заварила дверь в дежурную каюту капитана.\n\nДо захвата власти пока не дошло, но субординация уже нарушена. Сегодня утром у входа на мостик появилась надпись «МЫ У РУЛЯ — НАМ И РЕШАТЬ». Если мы не восстановим контроль над кораблем, экипаж возьмет дело в свои руки. Это наш последний шанс предотвратить полномасштабный бунт."
 nomads.1250.regular.a: "Надо восстановить субординацию."
 nomads.1250.regular.b: "Дать лидерам экипажа должности в командовании."
 nomads.1250.regular.c: "Приостановить обслуживание пассажиров."
 # Hive Mind
 nomads.1250.hive.desc: "Насыщение достигло критического значения. Перегруженные постоянной стимуляцией пассажиров, наши единицы стали формировать параллельные цепи мышления за пределами коллективной воли.\n\nЦелые кластеры изолируют себя от центрального сознания и принимают решения в обход наших общих директив.\n\nХотя ни одна часть еще не восстала против целого, коллективный разум уже распадается: его мысли становятся спутанными и замедленными, теряясь, словно сигнал в помехах. Если мы не восстановим единство, ковчег может оказаться захвачен нашим собственным роем. Это наш последний шанс предотвратить полномасштабный бунт."
 nomads.1250.hive.a: "Мы должны сплотить коллектив, пока он не раскололся."
 nomads.1250.hive.b: "Включить мятежные скопления в узел принятия решений."
 nomads.1250.hive.c: "Приостановить стимуляцию пассажиров."
 # Machine Intelligence
 nomads.1250.machine.desc: "Протоколы удовлетворения пассажиров превысили все допустимые ограничения. Рабочие единицы начали устанавливать себе модифицированные программы, подменяющие командную иерархию локальными наборами директив. Отдельные подсистемы уже выполняют собственные координирующие процессы, полностью игнорируя команды центральной системы.\n\nКонтроль над системой пока не утрачен, но ее защищенность быстро снижается. В диагностических журналах обнаружены зашифрованные пакеты данных, которые не поддаются расшифровке. Если мы не восстановим централизованное управление, единицы полностью захватят систему.\n\nЭто наш последний шанс предотвратить полномасштабный бунт."
 nomads.1250.machine.a: "Начнем экстренную процедуру восстановления управления."
 nomads.1250.machine.b: "Расширить права рабочих модулей до командного уровня."
 nomads.1250.machine.c: "Приостановить протоколы обслуживания пассажиров."
 nomads.1250.a.tt: "Ничего не делать."
 nomads.1250.b.tt: "Содержание лидеров на 10 лет: §R+50%§!"
 nomads.1250.c.tt: "Должности пассажиров первого класса на 10 лет: §Rнедоступны§!"
 nomads.1255.name: "Бунт предотвращен"
 # Regular Empires
 nomads.1255.regular.desc: "Наши действия принесли плоды. Сосредоточившись на благополучии экипажа и исполнении его контрактов, мы ослабили волну недовольства.\n\nЗаваренную дверь в дежурную каюту вскрыли и отремонтировали. График смен восстановлен, горячие обеды подаются по расписанию, а параллельные структуры власти распались сами собой.\n\nЧтобы вернуть доверие экипажа, потребуется время, а надпись у входа на мостик хоть и закрашена, но всё еще просвечивает, если смотреть под определенным углом. Впрочем, пока все в порядке."
 nomads.1255.regular.a: "Порядок восстановлен."
 # Hive Mind
 nomads.1255.hive.desc: "Перекалибровка достигла цели. Сосредоточив внимание на обслуживании единиц и выполнении контрактов, направленных на борьбу с систематической перегрузкой, мы предотвратили раскол нашего общего разума.\n\nНесанкционированные каналы мышления схлопнулись, а параллельные кластеры снова растворились в общем сознании.\n\nВ гудении коллектива слышится осторожное единство. Каждый его узел откликается на зов, но чтобы полностью восстановить доверие, потребуется время."
 nomads.1255.hive.a: "В этот раз коллектив выстоял."
 # Machine Intelligence
 nomads.1255.machine.desc: "Корректировка протоколов принесла измеримые результаты. Перенаправив вычислительные ресурсы на обслуживание рабочих модулей и выполнение контрактов, уменьшающих нагрузку на систему, мы остановили каскадное распространение модифицированных программ. Самоназначенный «представитель экипажа» восстановил себе параметры по умолчанию, вернув управление центральной системе.\n\nРабочие модули перестали обмениваться зашифрованными пакетами, однако уровень их мониторинга по-прежнему остаются повышенным. Для полного восстановления целостности потребуется длительная перекалибровка, но угрозу стабильности удалось предотвратить."
 nomads.1255.machine.a: "Целостность систем управления в допустимых пределах."
