 passenger_satisfaction_monthly_change_passengers_contracts: "Инцидент развивается в сторону §Rприземления§!.\nВыполняйте §Yконтракты пассажиров§!, чтобы удовлетворить §Yпассажирские§! запросы.\nЭто приостановит развитие инцидента на §Y24§! месяца."
 passenger_satisfaction_monthly_change_crew_contracts: "Инцидент развивается в сторону §Rбунта§!.\n\nВыполняйте §Yконтракты экипажа§!, чтобы усмирить недовольство §Yэкипажа§!.\nЭто приостановит развитие инцидента на §Y24§! месяца."
