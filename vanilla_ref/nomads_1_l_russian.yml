 concept_arkship_harvest_resources_planet_resources: "Ресурсы планеты"
 concept_arkship_harvest_resources_planet_resources_desc: "Сбор приносит дополнительные ресурсы, зависящие от £planet£ §Hкласса планеты§! и общего количества всех ['concept_arkship_harvestable_resources', пригодных к разработке месторождений].\n\nНеизученные цели или цели без залежей приносят минимальное количество ресурсов. $DOUBLE_NEW_LINE$$pc_ice_asteroid$:$TABBED_NEW_LINE$• $energy_with_icon$, $exotic_gases_with_icon$ $NEW_LINE$Газовый гигант, токсичный мир:$TABBED_NEW_LINE$• $exotic_gases_with_icon$ $NEW_LINE$$pc_broken$, расколотый мир:$TABBED_NEW_LINE$• $minerals_with_icon$, $alloys_with_icon$ $NEW_LINE$$pc_barren$:$TABBED_NEW_LINE$• $minerals_with_icon$ $NEW_LINE$$pc_asteroid$:$TABBED_NEW_LINE$• $minerals_with_icon$, $volatile_motes_with_icon$ $NEW_LINE$$pc_rare_crystal_asteroid$, замерзший мир:$TABBED_NEW_LINE$• $rare_crystals_with_icon$ $NEW_LINE$$pc_molten$:$TABBED_NEW_LINE$• $volatile_motes_with_icon$"
 concept_arkship_lithoid_consume_world: "Корабль-ковчег: поглотить мир"
 concept_arkship_lithoid_consume_world_desc: "Кораблям-ковчегам — пожирателям миров можно приказать выйти на орбиту планеты и выпустить поглощающий рой.$NEW_LINE$После этого начнется §Hинцидент§!, отображающий прогресс поглощения. Корабль-ковчег будет оставаться на орбите до его завершения.$NEW_LINE$Корабль-ковчег, покинувший орбиту, сможет вернуться на нее в течение §Y180 дней§!. Если корабль не вернется вовремя, поглощение будет отменено.$DOUBLE_NEW_LINE$При нахождении на орбите:$TABBED_NEW_LINE$• Периодически извлекаются £minerals£ §Yминералы§!, £food£ §Yпища§! и £pop£ §Yпоселения§!$NEW_LINE$При завершении:$TABBED_NEW_LINE$• Мир превращается в §Yрасколотый§!"
 concept_arkship_nanotech_consume_world: "Корабль-ковчег: ассимилировать мир"
 concept_arkship_nanotech_consume_world_desc: "Нанитовым кораблям-ковчегам можно приказать выйти на орбиту планеты и ассимилировать ее с помощью нанитов.$NEW_LINE$После этого начнется §Hинцидент§!, отображающий прогресс ассимиляции. Корабль-ковчег будет оставаться на орбите до его завершения.$NEW_LINE$Корабль-ковчег, покинувший орбиту, сможет вернуться на нее в течение §Y180§! дней. Если корабль не вернется вовремя, ассимиляция будет отменена.$DOUBLE_NEW_LINE$При нахождении на орбите:$TABBED_NEW_LINE$• Периодически извлекаются £nanites£ §Yнаниты§!.$NEW_LINE$• Мир превращается в непригодный для жизни нанитовый"
 civic_hive_devouring_swarm_lithoid_nomadic: "$civic_hive_devouring_swarm_lithoid$"
 civic_tooltip_devouring_swarm_lithoid_nomadic_effects: "Нельзя вступать в §Yдипломатические отношения§! с другими государствами!\nНедоступен §Yгалактический рынок§!\nНельзя §Yтерраформировать§! планеты\nЕсть повод к войне против других государств §Y«Голод»§!\nКорабли-ковчеги могут ['concept_arkship_lithoid_consume_world', поглощать миры], чтобы получать ресурсы и поселения\n§YПоселения чужаков§! всегда поедаются\nЗа поедание £pop£ §Hпоселений чужаков§! даются £society£ §Yсоциологические исследования§!"
