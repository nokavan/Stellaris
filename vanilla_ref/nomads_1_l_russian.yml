 NOMAD_CHECKLIST_HARVEST_RESOURCES: "Работы по добыче ресурсов"
 NOMAD_CHECKLIST_HARVEST_RESOURCES_DESC: "$REQUIREMENTS_HEADER$ $NEW_LINE$$TABBED_NEW_LINE$• Добыть £exotic_gases£ §Yэкзотические газы§! из §Yгазового гиганта§! или §Yтоксичного мира§!.$TABBED_NEW_LINE$• Добыть £rare_crystals£ §Yредкие кристаллы§! из §Yзамерзшего мира§!.$TABBED_NEW_LINE$• Добыть £volatile_motes£ §Yлетучую пыль§! из §Yрасплавленного мира§!."
