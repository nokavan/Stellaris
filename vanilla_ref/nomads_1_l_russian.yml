 contract_onboard_society_research_issuer_desc: "Разнообразное население кораблей-ковчегов могло бы предоставить ценные данные для исследований в области социологии."
 contract_onboard_society_research_desc: "Провести £society£ §Yсоциологические исследования§! на борту корабля-ковчега для заказчика."
