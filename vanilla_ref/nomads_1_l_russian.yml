 council_agenda_agenda_we_come_in_peace_nomads_name: "$council_agenda_agenda_we_come_in_peace_name$"
 council_agenda_agenda_open_arms_nomads_name: "$council_agenda_agenda_open_arms_name$"
 council_agenda_agenda_conquer_nature_nomads_name: "$council_agenda_agenda_conquer_nature_name$"
 council_agenda_agenda_rightful_claims_nomads_name: "$council_agenda_agenda_rightful_claims_name$"
 council_agenda_agenda_military_buildup_nomads_name: "$council_agenda_agenda_military_buildup_name$"
 council_agenda_agenda_we_come_in_peace_nomads_desc: "$council_agenda_agenda_we_come_in_peace_desc$"
 council_agenda_agenda_open_arms_nomads_desc: "Мы все жители одной галактики. Пусть каждый, кто принимает нас в своих границах, знает: мы не желаем зла."
 council_agenda_agenda_conquer_nature_nomads_desc: "$council_agenda_agenda_conquer_nature_desc$"
 council_agenda_agenda_rightful_claims_nomads_desc: "$council_agenda_agenda_rightful_claims_desc$"
 council_agenda_agenda_military_buildup_nomads_desc: "$council_agenda_agenda_military_buildup_desc$"
