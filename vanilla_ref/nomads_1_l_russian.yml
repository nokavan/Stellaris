 # The Grand Refurbishment
 situation_grand_refurbishment: "Капитальный ремонт"
 situation_grand_refurbishment_type: "$situation_grand_refurbishment$"
 situation_grand_refurbishment_paused_desc: "Ожидается принятие решения. Ремонт возобновится только после разрешения ситуации."
 situation_grand_refurbishment_complete.tt: "Корабль-ковчег §Y«[Target.GetName]»§! будет значительно улучшен."
 situation_grand_refurbishment_desc: "По каркасу корабля-ковчега §Y«[Target.GetName]»§! вынесено неутешительное решение: он давно нуждается в полноценном восстановительном ремонте. Работы будут идти секция за секцией; один район за другим мы будем отключать от энергосети, а их жителей — временно переселять.\n\nОт качества организации процесса будет зависеть его исход."
 approach_refurbishment_standard: "Обычный график"
 approach_refurbishment_minimal: "Минимальные затраты"
 approach_refurbishment_intensive: "Полноценное вложение"
 approach_outcome_refurbishment_standard: "Мы будем выполнять работы в среднем темпе и завершим ремонт своевременно.\n\n"
 approach_outcome_refurbishment_minimal: "Проект займет больше времени, но финансовые затраты будут меньше.\n\n"
 approach_outcome_refurbishment_intensive: "Ремонт будет идти значительно быстрее, но вместе с темпом возрастут и затраты.\n\n"
 situation_grand_refurbishment_monthly_change_tooltip: "Прогресс отражает темп работ на борту корабля §Y«[Target.GetName]»§!."
 stage_refurbishment_generator: "Ремонт реакторных установок"
 stage_refurbishment_farming: "Ремонт палуб корабля-ковчега"
 stage_refurbishment_military: "Ремонт оружейной инженерии ковчега"
 stage_refurbishment_city: "Ремонт жилых палуб ковчега"
 arkship.1300.name: "Необходимые затраты"
 arkship.1300.desc: "Старшие инженеры корабля-ковчега §Y«[Root.GetName]»§!, оценивавшие техническое состояние корабля, единогласны в своем вердикте: затягивать больше нельзя. Наш дом срочно нуждается в ремонте.\n\nОтделаться частичным восстановлением не получится — ремонт должен быть капитальным. Восстанавливать придется секцию за секцией, начиная с электроснабжения; за ним последуют культивационные и оборонительные палубы, а затем — жилые районы один за другим. Жильцов, разумеется, придется временно переселить, а многочисленные объекты — отключить от сети. По оценкам инженеров, капитальный ремонт займет от десяти до одиннадцати стандартных лет в зависимости от темпа работ.\n\nНеудобно будет всем без исключения. Но выбор невелик: либо мы отремонтируем корабль, либо через сотню-другую парсек он развалится окончательно."
 arkship.1300.desc.machine: "Диагностические подпрограммы корабля-ковчега §Y«[Root.GetName]»§! зафиксировали превышение критических пороговых значений для основных структурных подсистем. Корабль-ковчег нуждается в экстренном ремонте.\n\nВосстановительные протоколы требуют последовательного ремонта всех секторов. Электрические генераторы, культивационные секторы, оборонительная инфраструктура и жилые зоны будут последовательно отключены от электропитания для проведения ремонтных работ. В процессе будет снижена оперативная эффективность. Приблизительное время завершения: сто тридцать месяцев при стандартном темпе.\n\nОткладывать ремонтные работы запрещено."
 arkship.1300.desc.hive: "Коллективу стало известно об износе конструкций корабля-ковчега §Y«[Root.GetName]»§!: ребра гнутся в местах, где должна сохраняться жесткость, а силовые жилы повреждены коррозией. Медлить с устранением изъянов, накапливавшихся десятилетиями, больше нельзя.\n\nНеобходим полноценный ремонтный цикл. Мы последовательно проведем ремонт всех секций, от силовых узлов до питательных камер, защитного панциря и жилых палуб. По мере проведения работ мы будем изолировать секции и временно выселять их обитателей. Цикл обновления займет от десяти до одиннадцати стандартных лет."
 arkship.1300.a: "Приступить к капитальному ремонту."
 arkship.1300.a.machine: "Запустить протоколы восстановления."
 arkship.1300.a.hive: "«[Root.GetName]» нуждается в обновлении."
 refurbishment_ongoing: "Капитальный ремонт: выполняется"
 refurbishment_ongoing_desc: "На корабле-ковчеге идет ремонт всех внутренних конструкций. Из-за строительных работ страдают стабильность и возможность строить районы."
 refurbishment_generator_offline: "$district_ark_generator$: идет ремонт"
 refurbishment_generator_offline_desc: ""
 arkship.1305.name: "Культивационные палубы"
 arkship.1305.desc: "Мы проверили новые генераторы в деле; выработка электроэнергии вернулась к прежнему уровню. Строительные бригады начали перемещать технику и инструменты на нижние уровни, где мы занимаемся сельским хозяйством.\n\nКультивационные палубы придется отключать от питания секцию за секцией. Такой подход представляет трудность для наших логистов: помимо того что придется бережно обращаться с запасами пищи, придется смириться с тем, что пыль и мусор от строительных работ еще несколько месяцев будут досаждать обитателям жилых отсеков.\n\nИнженеры говорят: сварка — это несложно. Сложно сидеть в ожидании."
 arkship.1305.desc.machine: "Восстановление генерации электричества признано полноценным. Выходная мощность вернулась к номинальным значениям. Новая цель работ: инфраструктура вторичного сектора.\n\nОбозначенные зоны будут последовательно отключены от энергоснабжения в целях проведения ремонта. Во время этого процесса производительность затронутого сектора пропорционально снизится.\n\nВосстановление проходит в пределах заданных параметров."
 arkship.1305.desc.hive: "Корабль снова в полной мере снабжен энергией.\n\nТеперь наш взгляд устремлен вовнутрь: следующий этап — ремонт огромных питательных камер, благодаря которым вообще существует колония. Культивационные чаны и органы переработки питательных инструментов придется последовательно отключать, чтобы обновить внутреннюю структуру. На случай дефицита пищи уже подготовлены запасы.\n\nИми и будет питаться колония во время обновления желудка."
 arkship.1305.a: "Иногда легкий беспорядок необходим."
 arkship.1305.a.machine: "Продолжать восстановление согласно графику."
 arkship.1305.a.hive: "Цикл обновления продолжается."
 arkship.1305.a.tt: "Убираются все отрицательные эффекты, полученные на этапе перед ремонтом.\n\n"
 refurbishment_farming_offline: "$district_ark_basic$: идёт ремонт"
 refurbishment_farming_offline_desc: ""
 arkship.1310.name: "Оборонительная секция"
 arkship.1310.desc: "Культивационные палубы восстановлены, производство пищи вернулось на прежний уровень. Теперь пора заняться носовой оборонительной секцией. Наши инспекторы осмотрели всё — от орудийных отсеков до технических коридоров, и заключили, что и отремонтировать также нужно всё.\n\nБоеготовность в это время будет ограничена. Канонирам приказано освободить палубы и не мешать полной перестройке их рабочих мест.\n\nБольшинство из них проявляет просто невероятное терпение."
 arkship.1310.desc.machine: "Восстановление вторичного сектора завершено. Производительность возвращается к оптимальным значениям. Новая цель работ: носовая оборонительная инфраструктура.\n\nОрудийные отсеки, технические сети и объекты охранного сектора будут последовательно отключены. Показатели боеготовности будут снижены до окончания работ.\n\nВосстановление проходит в пределах заданных параметров."
 arkship.1310.desc.hive: "Питательные камеры обновлены; колонии больше не грозит голод.\n\nТеперь пора уделить внимание панцирю: орудийным батареям, техническим ходам и казармам — средствам защиты корабля от угроз извне. Всё это необходимо снять и перестроить. Боеготовность в это время будет снижена.\n\nКоллектив понимает, что необходимо временно стать уязвимым."
 arkship.1310.a: "$arkship.1305.a$"
 arkship.1310.a.machine: "$arkship.1305.a.machine$"
 arkship.1310.a.hive: "$arkship.1305.a.hive$"
 refurbishment_military_offline: "$district_ark_military$: идет ремонт"
 refurbishment_military_offline_desc: ""
 arkship.1315.name: "Жилые помещения"
 arkship.1315.desc: "После осмотра и ремонта мы вернули оборонительную секцию в строй. Ремонтные бригады не скрывают облегчения: они рады вновь заняться чем-то полезным.\n\nТеперь начинается последний этап: восстановление городских районов. Жилые кварталы, площадки для мероприятий, торговые ряды — сердце корабля-ковчега. До этого мы восстанавливали инфраструктуру; сейчас же мы ремонтируем родной дом.\n\nВозведем заграждения в последний раз. До финиша осталось немного."
 arkship.1315.desc.machine: "Восстановление оборонительного сектора завершено. Боеготовность возвращается к оптимальным значениям. Новая цель работ: инфраструктура жилых и гражданских районов.\n\nЗоны обработки модулей будут последовательно отключены для проведения завершающих работ. Население секторов, где проводятся работы, будут временно выселено.\n\nВосстановление приближается к финальной стадии."
 arkship.1315.desc.hive: "Панцирь укреплен; боеготовность коллектива восстановлена.\n\nТеперь пора заняться последним этапом: восстановлением камер для выведения потомства, общественных гнезд и связующих коридоров — сердца корабля-ковчега, тех мест, где обитатели колонии спят, размножаются и проводят время вместе. Мы будем запечатывать одну секцию за другой на время восстановления.\n\nСкоро цикл обновления завершится."
 arkship.1315.a: "Последний рывок."
 arkship.1315.a.machine: "Завершить протоколы восстановления."
 arkship.1315.a.hive: "Начинается последнее обновление."
 refurbishment_city_offline: "$district_ark_city$: идет ремонт"
 refurbishment_city_offline_desc: ""
 arkship.1320.name: "Споры о распределении жильцов"
 arkship.1320.desc: "Мы запечатали жилые уровни, чтобы обследовать внутренние структуры. Инженеры приступили к изнурительному труду по переселению многих тысяч обитателей корабля по свободным отсекам. Процесс, протекавший поначалу упорядоченно, вскоре обернулся хаосом: длинными очередями, спорами о полномочиях и многочисленными жалобами, в том числе — на выселение из особенно полюбившейся кому-то части гидропонного отсека.\n\nСоциальные распорядители просят у нас совета."
 arkship.1320.desc.machine: "Перераспределение модулей в доступные рабочие области затруднено ввиду сдерживающих факторов. Модули принимают компенсирующие решения в реальном времени, что приводит к конфликту приоритетов. Эффективность процессов во всех узлах перераспределения снижена.\n\nТребуется руководство к действию."
 arkship.1320.desc.hive: "Перемещение единиц Разума расстроило сплоченность колонии. На первое место выходят территориальные инстинкты; дроны, считающие себя вытесненными, конкурируют друг с другом за гнезда, а заодно — за право выполнять задачи в перенаселенных второстепенных зонах. В местах временного размещения отчетливо ощущаются феромоны стресса и смятения.\n\nКолонии требуются указания."
 arkship.1320.a: "Инженерный отдел разберется."
 arkship.1320.b: "Обеспечить справедливое распределение."
 arkship.1320.a.tt: "\nЭто решение идет вразрез с инструкциями. Может пострадать качество исполнения работ."
 arkship.1325.name: "Что-то за стеной"
 arkship.1325.desc: "Сняв с кабелей в энергетическом районе защитные кожухи, мы обнаружили отсутствующий на чертежах трехметровый участок каркаса, покрытый глубокими усталостными трещинами. Судя по датировке, эти трещины росли здесь десятилетиями, и никто из нас об этом не подозревал.\n\nЧтобы устранить повреждения, потребуется несколько растянуть работы."
 arkship.1325.a: "Задокументировать повреждения и продолжить работы по графику."
 arkship.1325.b: "Расширить масштаб работ и устранить повреждения."
 arkship.1325.b.tt: "Расширение масштаба работ и устранение повреждений займет дополнительное время, зато предотвратит более серьезные поломки в будущем."
 arkship.1330.name: "Компенсация за неудобства"
 arkship.1330.desc: "Обитатели секций, еще не затронутых идущим ремонтом, жалуются на необходимость делить драгоценное пространство с переселенцами.\n\nСреди их требований: право получать больше ресурсов, первоочередной доступ к местам отдыха, а также — немедленный демонтаж автоматической системы оповещения, которая каждые три часа напоминает им, что беспорядок — не навсегда, и благодарит за проявленное терпение."
 arkship.1330.desc.machine: "Показатели сплоченности среди модулей, назначенных в перенаселенные вторичные зоны, в значительной степени снизился. Показатели продуктивности ниже оптимальных. Предиктивные модели прогнозируют ухудшение тенденций в условиях отсутствия вмешательства.\n\nДля приведения сплоченности к оптимальным значениям рекомендуется направленное распределение дополнительных ресурсов."
 arkship.1330.desc.hive: "Уровни феромонов стресса в перенаселенных вторичных гнездах значительно увеличились после переселения единиц. Территориальные споры между переселенными кластерами и коренными обитателями значительно участились. Коллективная продуктивность улья падает, а по секторам распространяется инстинктивное беспокойство.\n\nЧтобы несколько успокоить возбужденные единицы, рекомендуется выделить дополнительные ресурсы."
 arkship.1330.a: "Осталось недолго. Мы как-нибудь справимся."
 arkship.1330.b: "Выделить необходимые ресурсы."
 refurbishment_allowances_granted: "Перераспределенные ресурсы"
 refurbishment_allowances_granted_desc: "Районы, страдающие от притока новых переселенцев, получают перераспределяемые ресурсы."
 refurbishment_low_morale: "Недовольство переселением"
 refurbishment_low_morale_desc: "Стесненные условия и недостаточная поддержка переселенцев давят на стабильность на корабле и настроение его обитателей."
 refurbishment_low_morale_2: "Сильное недовольство переселением"
 refurbishment_low_morale_2_desc: "Из-за постоянных неудобств и недостаточной поддержки стабильность на корабле и настроение его обитателей значительно ухудшились."
 refurbishment_low_morale_3: "Критическое недовольство переселением"
 refurbishment_low_morale_3_desc: "Упадок стабильности и настроения на критическом уровне. Перемещенные обитатели корабля утомлены и возмущены постоянными неудобствами, которым не видно конца."
 arkship.1335.name: "Вторая смена"
 arkship.1335.desc: "Чтобы не отставать от графика, ведущий инженер предложил ввести вторую и третью смены — в таком случае строительство будет идти круглосуточно. Обитатели жилых палуб, примыкающих к зоне проведения работ, жалуются, что из-за повышенного уровня шума они уже вторую неделю не могут полноценно отдохнуть. Три члена экипажа получили травмы из-за усталости и сейчас проходят лечение.\n\nЗаметно утомились и сами строители. Пусть даже работы идут быстрее, но руководители беспокоятся, что усталость скажется на качестве."
 arkship.1335.desc.machine: "Предложена новая стратегия, способная обеспечить соответствие графику: перевод всех строительных модулей на непрерывный цикл работ. Показатели шума и вибрации, зарегистрированные в примыкающих жилых секторах, свидетельствуют о превышении допустимых уровней. Зафиксировано несколько отказов модулей в процессе эксплуатации.\n\nКачество работ снижается пропорционально продлению циклов. Непрерывный цикл обеспечивает ускорение, но одновременно с этим приводит к увеличению количества ошибок."
 arkship.1335.desc.hive: "Чтобы цикл обновления продолжался как задумано, строительным единицам приказано трудиться дольше обычного. Уровни вибрации и шума в примыкающих гнездах на протяжении уже одиннадцати циклов превышают приемлемые. Некоторые единицы Разума уже проявляют признаки нарушений, вызванных усталостью.\n\nПостоянный труд позволит нам быстрее достичь результата, однако биологические ограничения неизбежно приводят к тому, что страдает качество работ."
 arkship.1335.a: "Сохранять текущий темп."
 arkship.1335.b: "Ввести полноценный режим смен."
 refurbishment_construction_fatigue: "Усталость от строительства"
 refurbishment_construction_fatigue_desc: "Строительные бригады восстанавливаются после долгих периодов труда. Производительность всех рабочих должностей снижена на время введения нового режима смен."
 refurbishment_construction_fatigue_2: "Сильная усталость от строительства"
 refurbishment_construction_fatigue_2_desc: "Постоянное переутомление привело к истощению строительных бригад. Настроение и производительность значительно упали."
 refurbishment_construction_fatigue_3: "Критическая усталость от строительства"
 refurbishment_construction_fatigue_3_desc: "Строительные бригады перестали соблюдать технику безопасности. Настроение рухнуло, а производительность всех рабочих должностей существенно пострадала."
 arkship.1340.name: "Выход кабеля из строя"
 arkship.1340.desc: "Во время снятия старых защитных кожухов оказался разорван кабель основного источника питания. Вся секция — жилые уровни, вторичный медицинский отсек и два пищевых модуля — переведены на резервный источник энергии.\n\nНаши [Owner.GetEngineerPlural] считают, что восстановить энергоснабжение можно будет через несколько месяцев. Есть и другой вариант: провести обводный провод от соседнего блока генераторов. Это быстрее, но в таком случае вся наша электрическая сеть будет зависеть от постоянного «временного» решения."
 arkship.1340.a: "Провести обводный провод."
 arkship.1340.b: "Заняться полноценным ремонтом."
 refurbishment_bypass_routing: "Обводный провод"
 refurbishment_bypass_routing_desc: "Вместо того чтобы восстанавливать кабель, мы решили провести обводный провод. Пока что всё стабильно, однако теперь в энергосети будет ненадежный компонент."
 arkship.1345.name: "Серьезный повод для беспокойства"
 arkship.1345.desc: "Нам поступила жалоба от ведущего инженера. Завершить работы к установленному сроку возможно, однако их качество будет таким, что одобряющей подписи инженера мы не дождемся.\n\nСтыки второстепенного значения наши строители предпочитают просто изолировать, чем полноценно укреплять. Диапазоны допуска вместо «рекомендованных» стали «приемлемыми»."
 arkship.1345.desc.machine: "Подпрограмма контроля качества зафиксировала повод для опасений: работы над корпусом больше не ведутся в соответствии с рекомендованными параметрами; вместо них установлены минимально допустимые диапазоны. Соединительные узлы второстепенного значения отмечаются как завершенные вопреки отсутствию оптимизации. Долгосрочные модели показывают, что структурная целостность не будет отвечать заданным значениям.\n\nВ журнал внесена официальная запись. В настоящий момент отсутствует риск неудач."
 arkship.1345.desc.hive: "Обновление вызывает у коллектива некоторые опасения: вместо того чтобы трудиться с прицелом на желаемые результаты, единицы работают в минимально допустимых диапазонах. Соединительные узлы они просто фиксируют на месте вместо того, чтобы полноценно укреплять их. Прочность каркаса приносится в жертву ускорению работ.\n\nРиск неудач в настоящее время отсутствует. Повод для беспокойства зафиксирован."
 arkship.1345.a: "Нужно придерживаться графика, а значит, и так сойдет."
 arkship.1345.b: "Нужно прислушаться к предупреждению и скорректировать параметры."
 refurbishment_power_restoration: "Полноценное восстановление энергоснабжения"
 refurbishment_power_restoration_desc: "Чтобы полностью восстановить энергоснабжение, понадобится дополнительное время."
 arkship.1350.name: "Первая секция введена в строй"
 arkship.1350.desc: "Первая отремонтированная секция получила одобрение наших инспекторов; жильцам разрешено вернуться. Результаты поистине поражают: новый каркас, современные кабели, не разваливающаяся от легкого дуновения проводка…\n\nИнженеры преисполнены решительности двигаться дальше, а жильцам не терпится заселиться в родные отсеки. Однако перед этим стоит провести комплекс заключительных испытаний систем. Нужно решить, как лучше поступить."
 arkship.1350.desc.machine: "Капитальный ремонт каркаса завершен. Сертификационные модули подтверждают соответствие сектора минимальным стандартам для повторного заселения. Полная диагностика не выявила никаких отклонений. Вероятность повторных значительных сбоев низка, но при этом не нулевая.\n\nТребуется разрешение на проведение следующего этапа работ — либо после полноценной диагностики, либо без нее."
 arkship.1350.desc.hive: "Коллектив дал одобрение на введение в строй первой обновленной секции: она соответствует требованиям для повторного заселения, однако полноценный цикл биологической верификации еще не завершен. В будущем может вновь случиться сбой — вероятность этого низка, но не нулевая.\n\nВыселенные из обновленной секции единицы уже стучатся в барьеры."
 arkship.1350.a: "Обойдемся без испытаний."
 arkship.1350.b: "Провести полный комплекс испытаний."
 refurbishment_extended_displacement: "Продленный срок выселения"
 refurbishment_extended_displacement_desc: "Отремонтированная секция закрыта на время проведения полноценной проверки систем."
 arkship.1355.name: "Список дефектов"
 arkship.1355.desc: "Руководитель проекта представил нам окончательный перечень всего, что подлежит ремонту. Список впечатляет: нам нужно вычеркнуть из него 47 пунктов, и только после этого работы будут признаны завершенными. В него вошли как важные замечания, например необходимость обратить внимание на три несущих соединения в кормовой секции, так и эстетические, в том числе — 19 случаев неровно установленных панелей и одна установленная не той стороной решетка вентиляции.\n\nЧтобы добиться желанной подписи, понадобится дополнительное время, однако в таких списках важен каждый пункт."
 arkship.1355.desc.machine: "Протоколы контроля качества сгенерировали список из 47 пунктов. Для прохождения сертификации необходимо устранить каждую вошедшую в список неисправность — от структурных (укрепление стыковочных узлов) до эстетических (ровная установка панелей).\n\nВосстановительные мероприятия потребуют продления установленного графика. При этом возможна частичная сертификация, затрагивающая только элементы конструкции."
 arkship.1355.desc.hive: "Ремонтные единицы представили коллективу список из 47 нуждающихся в коррекции отделов восстановленных секций — от структурных, например несущих соединений и поверхностных клеточных оболочек, до эстетических, например различных полостей.\n\nЧтобы добиться желаемого, потребуется продлить цикл обновления. Впрочем, возможно обойтись лишь полумерами и провести только восстановление конструкции."
 arkship.1355.a: "Заняться только конструкцией."
 arkship.1355.b: "Завершить каждый пункт списка."
 arkship.1360.name: "Возвращение домой"
 arkship.1360.desc: "Обитателям недавно восстановленных секций разрешили заселиться обратно. Закрытые на долгие месяцы коридоры открыты вновь; в них еще не выветрился запах свежих композитов и новой изоляции. Младенцы, вынужденные всё это время ютиться во временных жилищах, впервые в жизни оказались в родном доме.\n\nНастроение жильцов ковчега на высоте — впервые за всё время с начала ремонта. Однако руководству очевидно, что вскоре эйфория закончится; необходимо поскорее направить её в полезное русло."
 arkship.1360.desc.machine_ind: "Запечатанные коридоры открыты вновь. Модули на нижних палубах убирают строительные леса. Кто-то возвращается домой; кто-то видит дом в первый раз.\n\nМодули, введенные в строй в период переселения, анализируют отремонтированные коридоры: они есть на чертежах, но отсутствуют в записях с сенсорных датчиков.\n\nПоказатели энтузиазма достигли самого высокого уровня с начала капитального ремонта. Руководящие модули, однако, осознают, что эти изменения временны; их процессоры заняты вопросом, как извлечь пользу из сложившейся обстановки."
 arkship.1360.desc.machine: "Модули, временно перемещенные в другие оперативные зоны на время ремонта, возвращаются на основные технические площадки. Оперативные параметры во всех секторах, где проводились ремонтные работы, возвращаются к оптимальным показателям. Одновременно с этим возрастает и эффективность.\n\nНа корабле зарегистрировано значительное увеличение сплоченности, однако подобные всплески носят временный характер. С учетом результатов анализа обстановки возможны два подхода: перенаправить всплеск на ускорение восстановительных работ либо не препятствовать стабилизации и зафиксировать сплоченность на повышенном базовом уровне."
 arkship.1360.desc.hive: "Переселенные единицы Разума возвращаются в восстановленные секции. Коридоры, за прошедшие циклы пропахшие строительными соединениями, теперь вновь заполнены привычными метками. Территориальные споры уходят в прошлое, подавляемые биохимическими процессами, способствующими сплоченности.\n\nРезонанс зазвучал громче. Улей вновь обретает самого себя — и энергия этого процесса явственно ощущается. Можно перенаправить ее вовне, на восстановление оставшихся секций, или же дать единицам время полностью сориентироваться и уже после этого возобновить работы."
 arkship.1360.a: "Уделить внимание работам."
 arkship.1360.b: "Не вмешиваться в адаптацию."
 arkship.1365.name: "Долгое ожидание"
 arkship.1365.desc: "Начался последний этап реновации жилого квартала. Слово «последний», впрочем, не так давно утратило привычное значение: жильцы, выселенные из городов, вынуждены ютиться во временных жилищах гораздо дольше обещанного.\n\nНас попросили помочь страждущим: обеспечить их более качественной мебелью, предоставить первоочередный доступ к местам для отдыха, а также поделиться небольшой частью ресурсов. Строительные работы от этого не пойдут быстрее, зато дожидаться их окончания будет легче."
 arkship.1365.desc.machine: "Оценка сплоченности перемещенных из жилых секторов модулей показала, что характеристика опустилась ниже приемлемого уровня. Сроки выполнения последнего этапа ремонта превысили спрогнозированные. Предиктивные модели показывают, что воспрепятствовать упадку можно только направленным распределением ресурсов.\n\nПодан запрос о выделении дополнительных средств."
 arkship.1365.desc.hive: "Уровни феромонов стресса у обитателей жилых секторов серьезно превысили допустимые: последний этап восстановительных работ затянулся. Единицы Разума вынуждены ждать, когда им будет дозволено вернуться к привычным обязанностям, из-за чего нарушились биохимические процессы, способствующие сплоченности. Это означает, что нарушилась и целостность коллектива.\n\nНам поступил запрос о выделении дополнительных ресурсов."
 arkship.1365.a: "Мы будем терпеть, пока работы не закончатся."
 arkship.1365.b: "Выделить дополнительные ресурсы."
 refurbishment_administrative_burden: "Административная ноша"
 refurbishment_administrative_burden_desc: "Программа социального обеспечения переселенцев требует специалистов — логистов, обработчиков жалоб и заведующих распределением. Из-за этого опытные рабочие не могут полноценно выполнять свои прямые обязанности."
 arkship.1370.name: "Несанкционированные изменения"
 arkship.1370.desc: "Во время сноса ограждающих стен в срединных жилых секторах рабочие бригады обнаружили, что за этими стенами скрываются многочисленные тайные комнаты, укромные уголки, закрытые коридоры, переоборудованные под склады или жилые пространства, — следы незаконных перепланировок, которые проводились здесь десятилетиями. Часть этих помещений одновременно служит и каркасом.\n\nВедущий инженер в сомнениях. С одной стороны, правильно будет убрать всё, что не значится на чертежах, но на это уйдет время. С другой стороны, ремонт можно провести, не затрагивая уже имеющиеся помещения, но тогда в конструкции корабля останутся странности и несоответствия, которые будет сложно объяснить последующим инженерам."
 arkship.1370.desc.machine: "Разборка разделительных сооружений жилого сектора выявила многочисленные несанкционированные изменения архитектуры корабля: не внесенные в журналы стены, новые технические пути и импровизированные несущие сооружения, отсутствующие в исходных чертежах.\n\nПравильный, но занимающий длительное время подход, — полное удаление всех изменений. Доступен альтернативный вариант: документирование и последующие работы в обход изменений."
 arkship.1370.desc.hive: "Во время сноса внутренних стен в срединных жилых секторах коллектив обнаружил многочисленные изменения в структуре колонии: скрытые норы, самостоятельно пробуренные технические ходы, превращенные в гнезда укромные камеры… Ничего из этого не было на корабле изначально. Часть новых сооружений одновременно служит и каркасом. Правильно будет привести всё к первоначальному виду, однако на это потребуется много времени. Если же действовать в обход незапланированных изменений, в структуре корабля возникнут нарушения, которые доставят неудобства будущим смотрителям гнезд."
 arkship.1370.a: "Задокументировать всё, что только можно, остальное — не трогать. Будем действовать в обход."
 arkship.1370.b: "Убрать всё, что не значится на исходных чертежах."
 arkship.1370.c: "Чем мы только думали?"
 refurbishment_rework_zone: "Зона строительных работ"
 refurbishment_rework_zone_desc: "В этих областях ведется строительство. Развитие новых районов станет возможно только после ремонта."
 arkship.1375.name: "Последняя палуба"
 arkship.1375.desc: "Последняя палуба прошла предварительную инспекцию. Рабочие уже начали разбирать строительные леса в нижних секциях. Ремонт почти что подошел к концу.\n\nВедущий инженер просит полную повторную инспекцию — только после этого будет поставлена утверждающая печать. Это, разумеется, чистая формальность. Нет почти никаких сомнений, что палуба в полном порядке.\n\nОднако неприятности часто начинаются именно со слова «почти»."
 arkship.1375.desc.machine: "Последний жилой сектор прошел предварительную инспекцию протоколами контроля качества. В нижних секциях начинается разбор строительных лесов. Сертификация ожидается после полной вторичной диагностики.\n\nВероятность прохождения вторичной инспекции — обязательное условие для получения полной сертификации — составляет около 100%."
 arkship.1375.desc.hive: "Последняя гнездовая палуба прошла предварительную инспекцию. Единицы приступили к разбору строительных лесов на нижних уровнях. Обновление можно почти что назвать завершенным. Перед утверждением результатов понадобится только пройти цикл вторичной верификации.\n\nМы почти — не полностью, но с большой уверенностью — можем подтвердить результаты первичного осмотра."
 arkship.1375.a: "«Почти» — тоже неплохо."
 arkship.1375.b: "Нужно пройти полноценную инспекцию."
 refurbishment_inspection_hold: "Пауза из-за инспекции"
 refurbishment_inspection_hold_desc: "В ожидании итоговой оценки все монтажные и строительные работы приостановлены."
 arkship.1380.name: "Ремонт конструкции завершен"
 arkship.1380.desc.full: "Последняя секция корабля-ковчега §Y«[Target.GetName]»§! прошла инспекцию; обитателям дозволено вернуться. Работы, причинившие так много неудобств тысячам жителей, подошли к концу. Пожалуй, всё случившееся даже можно назвать достижением. Корабль ощущается совсем иначе: прочнее, надежнее, и даже как будто ближе к тому ковчегу, который изначально задумывали конструкторы.\n\nИнженерная служба подала заключительный отчет, приложив к нему несколько настоятельных рекомендаций. Решать, как распорядиться плодами тяжелого труда, предстоит руководству."
 arkship.1380.desc.partial: "Капитальный ремонт корабля-ковчега §Y«[Target.GetName]»§! классифицирован как завершенный. Анализ структурной целостности подтвердил значительные улучшения по сравнению с исходной версией, хотя модули, знакомые с изначальным предложением, замечают, что соответствие неполное и не каждый допуск оптимален.\n\nРезультат зафиксирован. Результат мог бы быть лучше."
 arkship.1380.desc.rushed: "Капитальный ремонт корабля-ковчега §Y«[Target.GetName]»§! завершен. Все необходимые документы подписаны, строительные леса разобраны, а команда снова занялась своими привычными делами.\n\nСовет инспекторов-специалистов с некоторой дипломатичной оговоркой заметил, что сданный корабль отвечает минимальным требованиям во всех категориях. Состояние ковчега сегодня лучше, чем было вчера. Удалось ли нам отремонтировать его так, как мы и задумывали? Этот вопрос инженеры предпочитают не задавать вслух."
 arkship.1380.desc.full.machine: "Восстановление корабля-ковчега §Y«[Target.GetName]»§! завершено. Все секторы прошли сертификацию и вернулись в режим полноценного функционирования. Оценка структурной целостности подтверждает: новые показатели превышают базовые значения, зафиксированные до ремонта, во всех категориях.\n\nЗаключительный отчет занесен в журнал. Возможна дальнейшая оптимизация согласно рекомендациям."
 arkship.1380.desc.partial.machine: "Восстановление корабля-ковчега §Y«[Target.GetName]»§! завершено. Оценка структурной целостности подтверждает улучшение по сравнению с базовыми значениями, зафиксированными до ремонта. При этом часть параметров отвечает скорее минимальным пределам, чем рекомендованным характеристикам.\n\nОбщий итог: приемлемый."
 arkship.1380.desc.rushed.machine: "Восстановление корабля-ковчега §Y«[Target.GetName]»§! закончено. Подпрограмма структурного анализа занесла результаты в категорию «Соответствие минимальным стандартам во всех областях».\n\nПодтверждено улучшение функционирования по сравнению с базовыми показателями. Оптимизационный потенциал реализован не полностью."
 arkship.1380.desc.full.hive: "Обновление корабля-ковчега §Y«[Target.GetName]»§! закончилось. Каждая перестроенная секция прошла проверку и вернулась в распоряжение колонии. В резонансе коллектива возникла новая уверенная нота — нота знакомой тяжести корабля, который вновь обрел себя, стал прочнее и надежнее; корабля, где каждый силовой узел, каждая гнездовая камера находится в превосходном состоянии.\n\nМы снова едины. Колония вольна выбирать, куда направить новообретенную силу."
 arkship.1380.desc.partial.hive: "Обновление корабля-ковчега §Y«[Target.GetName]»§! закончилось. Проверки подтвердили, что состояние корабля заметно улучшилось, однако мы с горечью для себя осознаем неполноту соответствия желаемым параметрам; запас прочности еще можно было бы оптимизировать.\n\nКолония стала сильнее, но сил могло бы быть больше."
 arkship.1380.desc.rushed.hive: "Обновление корабля-ковчега §Y«[Target.GetName]»§! закончилось. Строительные леса разобраны, секции открыты, а переселенные единицы вернулись в свои обиталища. Мы с горечью осознаем, что прошли только самые простые проверки во всех категориях.\n\nЦель достигнута, но достигнут ли потенциал корабля — вопрос, которым мы предпочитаем не задаваться лишний раз."
 arkship.1380.a: "Заказать улучшение электрической сети."
 arkship.1380.b: "Перенаправить ресурсы на системы культивации."
 arkship.1380.c: "Вложиться в модернизацию оборонительных систем."
 arkship.1380.d: "Сосредоточиться на расширении жилых отсеков."
 refurbishment_ongoing_gestalt: "Капитальный ремонт: выполняется"
 refurbishment_ongoing_gestalt_desc: "На корабле-ковчеге идет ремонт всех внутренних конструкций. Из-за строительных работ страдают стабильность, производительность единиц Разума и возможность строить районы."
 refurbishment_city_offline_gestalt: "$district_ark_city$: идет ремонт"
 refurbishment_city_offline_gestalt_desc: "Основные жилые районы корабля-ковчега закрыты на время проведения работ. Мы вынуждены ютиться в оставшихся секциях, из-за чего страдают жилищные условия и продуктивность рабочих."
 refurbishment_low_morale_gestalt: "Недовольство переселением"
 refurbishment_low_morale_gestalt_desc: "Стесненные условия и недостаточная поддержка давят на стабильность и сплоченность на корабле."
 refurbishment_construction_fatigue_gestalt: "Усталость от строительства"
 refurbishment_construction_fatigue_gestalt_desc: "Мы восстанавливаемся после долгих периодов труда. Производительность снижена на время внедрения нового рабочего цикла."
 refurbishment_administrative_burden_gestalt: "Административная ноша"
 refurbishment_administrative_burden_gestalt_desc: "Программа социального обеспечения требует значительного напряжения коллективной мысли."
 refurbishment_power_grid: "Оптимизированная энергосеть"
 refurbishment_power_grid_desc: "Отремонтированный энергетический район полностью соответствует самым строгим требованиям. Благодаря современной инфраструктуре производство энергии на корабле значительно улучшилось."
 refurbishment_power_grid_partial: "Улучшенная энергосеть"
 refurbishment_power_grid_partial_desc: "После ремонта энергетического района улучшилось производство энергии, однако соответствие требованиям осталось неполным."
 refurbishment_power_grid_weak: "Залатанная энергосеть"
 refurbishment_power_grid_weak_desc: "По итогам инспекции отремонтированный энергетический район признан готовым к эксплуатации. Не все улучшения удалось внедрить, однако производство энергии несколько улучшилось."
 refurbishment_cultivation_decks: "Улучшенные культивационные палубы"
 refurbishment_cultivation_decks_desc: "Отремонтированный сельскохозяйственный район полностью отвечает самым строгим требованиям."
 refurbishment_cultivation_decks_partial: "Улучшенные культивационные палубы"
 refurbishment_cultivation_decks_partial_desc: "После ремонта сельскохозяйственного района улучшилось производство пищи, однако часть улучшений пришлось отложить или вовсе упростить."
 refurbishment_cultivation_decks_weak: "Залатанные культивационные палубы"
 refurbishment_cultivation_decks_weak_desc: "По итогам инспекции отремонтированный сельскохозяйственный район признан готовым к эксплуатации. Производительность несколько улучшилась, хотя не все улучшения удалось внедрить."
 refurbishment_defense_systems: "Укрепленные оборонительные системы"
 refurbishment_defense_systems_desc: "Отремонтированная секция полностью отвечает самым строгим требованиям. Теперь корабль-ковчег сможет продержаться в бою гораздо дольше."
 refurbishment_defense_systems_partial: "Улучшенные оборонительные системы"
 refurbishment_defense_systems_partial_desc: "После ремонта оборонительных систем улучшилась боеготовность корабля-ковчега, однако часть улучшений отвечает не столько рекомендованным параметрам, сколько минимально приемлемым."
 refurbishment_defense_systems_weak: "Залатанные оборонительные системы"
 refurbishment_defense_systems_weak_desc: "По итогам инспекции оборонительная секция признана готовой к эксплуатации. Не все структурные улучшения удалось внедрить."
 refurbishment_power_grid_gestalt: "Оптимизированная энергосеть"
 refurbishment_power_grid_gestalt_desc: "Отремонтированный энергетический район полностью соответствует самым строгим требованиям. Благодаря современной инфраструктуре производство энергии и производительность коллектива значительно улучшились."
 refurbishment_power_grid_partial_gestalt: "Улучшенная энергосеть"
 refurbishment_power_grid_partial_gestalt_desc: "После ремонта энергетического района улучшились производство энергии и производительность, хотя некоторые улучшения проводки отвечают не столько оптимальным параметрам, сколько приемлемым."
 refurbishment_power_grid_weak_gestalt: "Залатанная энергосеть"
 refurbishment_power_grid_weak_gestalt_desc: "По итогам инспекции отремонтированный энергетический район признан готовым к эксплуатации, однако не все улучшения удалось внедрить."
 refurbishment_cultivation_decks_gestalt: "Улучшенные культивационные палубы"
 refurbishment_cultivation_decks_gestalt_desc: "Отремонтированный сельскохозяйственный район полностью отвечает самым строгим требованиям. Производительность и качество продукции значительно выросли."
 refurbishment_cultivation_decks_partial_gestalt: "Улучшенные культивационные палубы"
 refurbishment_cultivation_decks_partial_gestalt_desc: "Мы добились улучшения производства пищи, однако часть улучшений пришлось отложить или вовсе упростить."
 refurbishment_cultivation_decks_weak_gestalt: "Залатанные культивационные палубы"
 refurbishment_cultivation_decks_weak_gestalt_desc: "По итогам инспекции отремонтированный сельскохозяйственный район признан готовым к эксплуатации. Производительность несколько улучшилась, хотя не все улучшения удалось внедрить."
 refurbishment_residential_expansion_gestalt: "Расширение жилого сектора"
 refurbishment_residential_expansion_gestalt_desc: "Отремонтированный жилой сектор полностью отвечает самым строгим требованиям. Благодаря современным системам жизнеобеспечения на корабле улучшены условия обитания."
 refurbishment_residential_expansion_partial_gestalt: "Частичное расширение жилого сектора"
 refurbishment_residential_expansion_partial_gestalt_desc: "После ремонта жилого сектора коллектив стал более сплоченным, однако не все запланированные улучшения удалось внедрить."
 refurbishment_residential_expansion_weak_gestalt: "Минимальное улучшение жилого сектора"
 refurbishment_residential_expansion_weak_gestalt_desc: "По итогам инспекции отремонтированный жилой сектор признан готовым к эксплуатации, хотя не все улучшения удалось внедрить."
 refurbishment_fleet_capacity: "Увеличенная вместимость флота"
 refurbishment_fleet_capacity_desc: "Мы обновили и улучшили военную инфраструктуру корабля-ковчега. Теперь в наши флотилии может входить больше кораблей."
 refurbishment_residential_expansion: "Расширение жилого сектора"
 refurbishment_residential_expansion_desc: "Отремонтированный жилой сектор полностью отвечает самым строгим требованиям. Благодаря современным системам жизнеобеспечения на борту значительно улучшены условия обитания."
 refurbishment_residential_expansion_partial: "Частичное расширение жилого сектора"
 refurbishment_residential_expansion_partial_desc: "После ремонта жилого сектора улучшились условия обитания, а управляющие стали лучше справляться со своими обязанностями. Впрочем, не все запланированные улучшения удалось внедрить."
 refurbishment_residential_expansion_weak: "Минимальное улучшение жилого сектора"
 refurbishment_residential_expansion_weak_desc: "По итогам инспекции отремонтированный жилой сектор признан готовым к эксплуатации. Доступного жилья стало несколько больше, хотя не все улучшения удалось внедрить."
 # Star-Crossed Lovers
 arkship.1385.name: "Капсула"
 arkship.1385.desc: "Наши датчики дальнего действия зафиксировали на краю системы неопознанный объект. При ближайшем рассмотрении выяснилось, что под его поверхностью находится что-то искусственное: геометрические очертания находки слишком точны и не похожи на природные. Из-под плотного слоя породы едва пробивается слабая энергетическая сигнатура.\n\nПеред нами — замаскированная спасательная капсула неизвестного происхождения, рассчитанная на малозаметность. Она не посылает никаких сигналов, однако система жизнеобеспечения еще не отказала, хоть и находится на грани. Вероятно, капсула дрейфует уже очень долго."
 arkship.1385.a: "Посмотрим, что внутри."
 arkship.1385.b: "Камень — он и есть камень. Не будем его трогать."
 arkship.1390.name: "Любовь моя"
 arkship.1390.desc: "Из-под минеральной оболочки мы извлекли сильно поврежденную стазисную капсулу с единственным пассажиром внутри. Тело, уже давно не подающее признаков жизни, облачено в ниспадающее с плеч церемониальное одеяние, совершенно не подходящее для космических перелетов, как будто забираться в капсулу пришлось в огромной спешке.\n\nВнутри капсулы — характерные следы насилия; применены ограничительные устройства. Перед нами — не спасательное средство, а тюрьма. На борту мы обнаружили две находки: координаты и запечатанное сообщение, короткое и незатейливое:\n\n§H«Моей любви».§!"
 arkship.1390.a: "Взять курс на координаты."
 arkship.1390.b: "Не стоит тратить на это время."
 arkship.1395.name: "Последний выживший"
 arkship.1395.desc: "Мы ввели координаты в компьютер и прибыли на место, где обнаружили ещё одну капсулу, а в ней — едва живого пассажира.\n\n[event_target:star_crossed_survivor.GetAXX::Его|||fem:Её] тело серьёзно пострадало; ещё немного — и наступит смерть, вызванная длительным пребыванием в стазисе. Очевидно, капсулы разделились много лет назад; ни одна из них так и не достигла пункта назначения.\n\nНам удалось привести пассажира в сознание и установить контакт. [event_target:star_crossed_survivor.GetAXX::Он попросил называть его|||fem:Она попросила называть её] [event_target:star_crossed_survivor.GetName]. Удастся ли [event_target:star_crossed_survivor.GetAXX::ему|||fem:ей] восстановиться — вопрос, на который у нас пока нет ответа."
 arkship.1395.a: "Сделать всё, чтобы [event_target:star_crossed_survivor.GetAXX::он восстановился|||fem:она восстановилась]."
 arkship.1400.name: "Бойня"
 arkship.1400.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания о произошедшем:\n\n§H«Была страшная бойня. Погибли целые семьи. Нам сказали, что на нас напало другое государство, якобы наш враг… Но это было не так. Власти подстроили всё сами: им нужно было как-то оправдать бессмысленную войну. Мы с моей любовью нашли доказательства — внутренние распоряжения, записи…»\n\n«Всё это мы обнародовали. Мы были готовы, что за нас возьмутся… Но не ждали, что нас изгонят».§!\n\nДанные из банков памяти капсулы — поврежденные, но еще подлежащие восстановлению — уже у нас."
 arkship.1400.a: "Мы нашли послание от вашей любви."
 arkship.1405.name: "Кровопролитная война"
 arkship.1405.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания от начала до конца:\n\n§H«Флоты уже приближались. Мы заметили их еще до того, как они добрались до нас. Война шла уже много лет: мы не хотели идти на поводу у [event_target:star_crossed_empire.GetName&gen] и быть [event_target:star_crossed_empire.GetName::его|||fem:ее|||neut:его|||pl:их] вассалом. Только надежды на победу не было никакой».\n\n«Мои родители решили, что посадить нас с моей любовью в спасательные капсулы — лучший выход. Нас разлучили и отправили в открытый космос, не зная даже, выживем ли мы и сумеем ли воссоединиться. Надеяться оставалось только на счастливый случай».§!\n\nМы изучили бортовые системы капсулы и извлекли технические данные времен войны."
 arkship.1405.a: "$arkship.1400.a$"
 arkship.1410.name: "Опасная находка"
 arkship.1410.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания от начала до конца:\n\n§H«Наш народ с большим почетом относился как к жизни, так и к смерти. Мы стремились продлить жизнь, сделать смерть не такой страшной и тяжелой, но не выходить за пределы того, что отведено нам природой. Бессмертие в синтетических телах казалось нам страшным оскорблением, запретным знанием, которого следовало всячески избегать. Но народ оказался слишком любопытен. И когда в своем любопытстве он начал перешагивать границы допустимого, власти решили, что риск слишком велик».\n\n«Ответом стало полное уничтожение. Наше государство стерли с лица галактики, чтобы не дать правде всплыть. Пощадили только меня и мою любовь. Нас посадили в капсулы, приговорили к существованию между жизнью и смертью…»§!\n\nМы расшифровали данные из бортового хранилища данных."
 arkship.1410.a: "$arkship.1400.a$"
 arkship.1415.name: "Устремление&!neut|||gen:Устремления&!neut|||dat:Устремлению&!neut|||acc:Устремление&!neut|||inst:Устремлением&!neut|||prep:Устремлении&!neut"
 arkship.1415.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания о произошедшем:\n\n§H«Мы дружили с коллегой — по крайней мере, мне так казалось. Ведь мы работали вместе много лет. Когда меня назначили руководителем проекта, коллега меня [event_target:star_crossed_survivor.GetAXX::поздравил|||fem:поздравила]».\n\n«Через месяц нас с моей любовью арестовали по ложным обвинениям. Суда не было — нас посадили в капсулы, даже не дав спросить, что случилось. Теперь я понимаю, что амбициям не нужны причины — достаточно просто удачного случая».§!\n\nЗаписи, извлеченные из внутренних систем капсулы, дали нам подробное представление о правительственном устройстве государства."
 arkship.1415.a: "$arkship.1400.a$"
 arkship.1420.name: "Чума"
 arkship.1420.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания от начала до конца:\n\n§H«Среди нас бушевал страшный вирус. Он убивал быстро и без разбора — и бедных, и богатых. В нашем государстве было много огромных свалок — памятников нашей небрежности и тяги к излишествам; ученые считали, что болезнь зародилась на одной из них. Мы с моей любовью решили держаться до конца».\n\n«Но вмешались родители. Нас, даже не слушая возражений, посадили в капсулы и отправили в космос. Родители считали, что стазис не даст нам умереть… Но они, похоже, просчитались».§!\n\nМы извлекли из системы жизнеобеспечения следы биологического материала."
 arkship.1420.a: "$arkship.1400.a$"
 arkship.1425.name: "Тайная сделка"
 arkship.1425.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания от начала до конца:\n\n§H«Мои родители знали, что [event_target:star_crossed_empire.GetName] вскоре [event_target:star_crossed_empire.GetName::пробудится|||neut:пробудится|||pl:пробудятся], и отчаянно желали заручиться [event_target:star_crossed_empire.GetName::его|||fem:ее|||neut:его|||pl:их] расположением. Они пошли на сделку: четверть нашего населения в обмен на власть. Но мы с моей любовью раскрыли этот замысел».\n\n«Нас не послушали. Те немногие же, кто всё-таки прислушался, вынужден был замолчать. Нас насильно посадили в капсулы и запустили в космос, чтобы избавиться от неудобных свидетелей. Мы были не первые — и мы, скорее всего, не последние».§!\n\nИз герметичных отсеков капсулы мы извлекли документацию."
 arkship.1425.a: "$arkship.1400.a$"
 arkship.1430.name: "Запретный альянс"
 arkship.1430.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания от начала до конца:\n\n§H«Меня изгнали не за мои проступки — меня изгнали за любовь».\n\n«Между нашими народами шла война. Шла уже долго — много поколений подряд. В глазах моих соотечественников наша связь была преступной, на нее нельзя было закрывать глаза. Но мы не желали расставаться, потому что думали, что мы — живое свидетельство того, что мир возможен».\n\n«Нас насильно посадили в капсулы и выбросили в открытый космос. Но даже это не смогло погубить нашу любовь».§!\n\nВ капсуле мы нашли воодушевляющую переписку двух изгнанников."
 arkship.1430.a: "$arkship.1400.a$"
 arkship.1435.name: "Шепот в пустоте"
 arkship.1435.desc: "Пока [event_target:star_crossed_survivor.GetName] постепенно [event_target:star_crossed_survivor.GetAXX::приходил|||fem:приходила] в себя, мы записали [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] воспоминания от начала до конца:\n\n§H«Всё началось со смутного ощущения где-то на окраине сознания. Затем в мысли начал проникать голос. Меня преследовал разрозненный шепот, он говорил со мной, и с каждым днем его слова становились всё отчетливее. Народ начал меня бояться; народ — но не моя любовь».\n\n«Нас насильно посадили в капсулу и выбросили в открытый космос. Они боялись, что та сила, которая проникла в мое сознание, начнет захватывать других. Вот и сейчас я слышу эти шепотки…»§!\n\nДанные с бортовых датчиков капсулы обильны и интересны."
 arkship.1435.a: "$arkship.1400.a$"
 arkship.1440.name: "Последние слова"
 arkship.1440.desc: "[event_target:star_crossed_survivor.GetName] [event_target:star_crossed_survivor.GetAXX::скончался|||fem:скончалась], не перенеся долгого пребывания вне стазиса. Незадолго до [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] смерти мы расшифровали закодированное сообщение из второй капсулы:\n\n§H«Любовь моя!»\n\n«Если ты слышишь эту запись, значит, судьба оказалась к тебе благосклоннее. Знай, что даже на бескрайних просторах мирового пространства меня не терзает одиночество, потому что ты навсегда в моем сердце».§!\n\n[event_target:star_crossed_survivor.GetName] [event_target:star_crossed_survivor.GetAXX::успел|||fem:успела] прослушать сообщение до конца; только после этого [event_target:star_crossed_survivor.GetAXX::его|||fem:ее] пульс прекратился. В мир иной [event_target:star_crossed_survivor.GetAXX::он отошел|||fem:она отошла] с умиротворенной улыбкой."
 arkship.1440.a: "Покойся с миром, [event_target:star_crossed_survivor.GetName]."
 arkship.1440.a.tooltip: "Благодаря этой записи мы получили ценные сведения о [event_target:star_crossed_empire.GetName&prep]."
 star_crossed_lovers_chain_title: "Несчастные влюбленные"
 star_crossed_lovers_chain_desc: "Зашифрованное сообщение и координаты, обнаруженные на борту дрейфующей стазисной капсулы. За находкой скрывается многовековая история."
 STAR_CROSSED_POD_PROJECT: "Просканировать капсулу"
 STAR_CROSSED_POD_PROJECT_DESC: "Нужно тщательно просканировать объект, чтобы определить его ценность и понять, пережило ли его содержимое долгие странствия в пустоте."
 star_crossed_pod_object: "Загадочная капсула"
 star_crossed_pod_object_tooltip: "Загадочная капсула"
 star_crossed_pod_object_desc: "Объект из необычных материалов, замаскированный под простой астероид. При рассмотрении выявлены точные геометрические очертания, несвойственные природным объектам. Зафиксирована слабая энергетическая сигнатура."
 star_crossed_survivor_pod_object: "Капсула выжившего"
 star_crossed_survivor_pod_object_tooltip: "Капсула выжившего"
 star_crossed_survivor_pod_object_desc: "Вторая капсула, дрейфующая в космосе. Бортовые системы, в том числе система жизнеобеспечения, еще не отказали, но уже на грани."
 STAR_CROSSED_SURVIVOR_POD_PROJECT: "Просканировать капсулу выжившего"
 STAR_CROSSED_SURVIVOR_POD_PROJECT_DESC: "Нужно перелететь в указанную систему и просканировать капсулу, чтобы определить, жив ли пассажир."
 STAR_CROSSED_POD_PROJECT_REQUIREMENT: "На орбите есть корабли-ковчеги или научные корабли: $COUNT$/$REQUIRED$."
 star_crossed_survivor_pod_poi: "Капсула выжившего"
 star_crossed_survivor_pod_poi_desc: "В эту систему ведут координаты, добытые из другой капсулы. Неизвестно, кто находится на борту этого судна."
 ap_eternal_vigilance_nomads: "$ap_eternal_vigilance$"
 ap_eternal_vigilance_nomads_desc: "Проявлять слабость значит напрашиваться на атаку. Цена нападения на наши корабли-ковчеги должна быть настолько высокой, чтобы как можно меньше врагов было готово ее заплатить."
