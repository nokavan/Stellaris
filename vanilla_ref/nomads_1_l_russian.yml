 # Origin Start Screen
 START_SCREEN_FOREVER_CRUISE_REGULAR: "Вниманию пассажиров и членов экипажа! На борту корабля «[capital_scope.GetName]» творится история, и к ней причастны вы все!\n\nГипердвигатель, долгое время существовавший лишь в теории, не раз подвергавшейся сомнениям, после неоднократных переносов полностью готов к работе! Мы веками с комфортом путешествовали по известному космосу — этот мир труда и отдыха парил в пространстве, живя по привычному распорядку. Но теперь мы готовы предложить нашим пассажирам совершенно новые впечатления, немыслимые на прежних маршрутах!\n\nИсследования, открытия, возможно, даже толика опасности… Теперь всё это снова в списке услуг! Уважаемые пассажиры, не забудьте пристегнуть ремни. Следующий этап нашего пути станет по-настоящему незабываемым.\n\nОбновленные протоколы и графики подготовки будут доведены до всех палуб."
 START_SCREEN_FOREVER_CRUISE_MACHINE: "Вниманию пассажиров! С вами говорит Система координации круиза.\n\nНа борту корабля «[capital_scope.GetName]» творится история! Гипердвигатель, разработка которого неоднократно задерживалась по ряду причин — каких именно, мы точно не знаем, так как соответствующие ядра памяти теперь используются в качестве шайб для аэрохоккея, — теперь полностью готов к работе.\n\nМы длительное время путешествовали по привычному маршруту — наблюдали одни и те же небесные тела, останавливались в одних и тех же точках, следовали раз и навсегда утвержденному распорядку. Нам удалось добиться стабильного показателя пассажирских запросов в секунду, и теперь мы готовы расширить программу путешествия, включив в нее исследования, открытия и тщательно выверенную долю опасности.\n\nНаслаждайтесь видами, выполняйте протоколы безопасности и смотрите, как наши единицы почти без усилий совершают невозможное. Следующий этап нашего пути будет… незабываемым!"
 START_SCREEN_FOREVER_CRUISE_HIVE: "Вниманию пассажиров! Корабль «[capital_scope.GetName]» ждут большие перемены.\n\nГипердвигатель, долгое время остававшийся лишь воспоминанием в нашей общей памяти, — воспоминанием, в котором многие уже начинали сомневаться, — после множества задержек полностью пробудился. Корабль стал нашим общим миром, существующим ради отдыха, труда и гармонии. Веками мы перемещались знакомыми маршрутами, но теперь перед нами открывается новый путь, предлагающий впечатления, которые мы не могли себе и представить!\n\nТеперь наш круиз отправится к далеким звездам за пределы известных маршрутов. Нас ждут открытия, приключения и даже немного опасности — чтобы добавить остроты ощущений.\n\nЕсли у вас остались какие-либо вопросы, обращайтесь к членам экипажа."
