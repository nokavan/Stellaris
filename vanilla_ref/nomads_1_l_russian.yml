 situation_passenger_satisfaction_outcome_planetfall_before: "§RПриземление§!\n• Пассажиры требуют §Yприземлиться на планете§!, что приведет к §Rокончанию круиза§!.\n• Чтобы избежать подобного исхода, выполняйте больше §Yконтрактов пассажиров§!.\n$h_line$§LОни отказываются продолжать путь.§!"
