 sm_waystation_energy_module: "Комплекс солнечных батарей"
 sm_waystation_energy_module_plural: "Комплексы солнечных батарей"
 sm_waystation_energy_module_desc: "Эти сложные устройства запасают энергию, получаемую из излучения местных звезд. Даже когда нас нет, светила продолжают приносить пользу.\n"
